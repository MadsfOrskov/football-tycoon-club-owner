      acts+=act("",G.captSuggested,`suggestCaptain(${ix})`,
        `<b>© Foreslå som anfører</b> — ${G.captSuggested?"du har haft dit ord om armbindet i denne sæson":"gafferen bestemmer, men han lytter én gang pr. sæson"}`);
    }
    acts+=act("",!wo||thin,`openSellSheet(${ix})`,
      `<b>Find købere…</b> — ${!wo?"vinduet er lukket":thin?"truppen er for tynd, gafferen blokerer døren":"en hurtig rundringning, eller transferlisten"}`);
    acts+=`<button class="abtn ghost" onclick="modal=null;render()">Luk</button>`;
    return `<div class="overlay"><div class="sheet">
      <div class="kick">${p.pos} · lovet ${ROLES[p.role||"rot"].n.toLowerCase()}-fodbold${isCap?" · klubbens anfører":""}</div>
      <h2>${p.name}</h2>
      <p>${p.age} år · <b>${ovr(p)} ovr</b> · vurderet ~${kfmt(p.value)}${p.from?" · fra "+p.from:""}
        ${p.traits.length?"<br>"+p.traits.map(t=>TRAITS[t]).join(" · "):""}</p>
      <div class="rowline" style="border:none;padding:2px 0"><span class="kick" style="color:var(--comm)">Potentiale</span><span class="amt">${potBandText(p,true)||"—"}${potBand(p,true)&&!potBand(p,true).exact&&(p.scouted||0)<BAL.talent.bandByScout.length-1?' <small style="opacity:.6">· spejd for at indsnævre</small>':""}</span></div>
      ${p.inj||p.susp||p.listed?`<div class="why" style="border-left-color:rgba(224,90,74,.5);background:rgba(224,90,74,.08)">
        ${p.inj?`<b>Skadet</b> — ude i ${p.inj} kampdag${p.inj===1?"":"e"} til. `:""}${p.susp?"<b>Karantæne</b> — misser næste kampdag. ":""}${p.listed?"<b>På transferlisten</b> — bud lander i indbakken mens vinduet er åbent.":""}</div>`:""}
      <div class="card">
        ${bar("Angreb",p.att)}${bar("Forsvar",p.def)}${bar("Fysik",p.phy)}
        <div class="rowline"><span>Selvtillid</span><span class="amt num">${Math.round(p.conf)}</span></div>
        <div class="rowline"><span>Form</span><span class="amt">${p.form>1?"▲ stigende":p.form<-1?"▼ faldende":"– stabil"}</span></div>
        <div class="rowline"><span>Benene</span><span class="amt">${
          {fresh:"friske — klar til at gå igen",used:"brugte — han har mærket hver og en af dem",flat:"flade — gafferen mangler afløsere"}[freshBand(p)]}</span></div></div>
      <div class="card">
        <div class="rowline"><span>Løn</span><span class="amt num">${kfmt(p.wage)}/u</span></div>
        <div class="rowline"><span>Kontrakt</span><span class="amt num" style="${p.years<=1?"color:var(--comm)":""}">${p.years} år${p.years<=1?" · sidste":""}</span></div>
        <div class="rowline"><span>Denne sæson</span><span class="num">${p.sapps} kampe · ${p.sg} mål · ${p.smotm} motm</span></div>
        <div class="rowline"><span>For klubben</span><span class="num">${p.capps} kampe</span></div></div>
      ${acts}
    </div></div>`;
  }
  if(modal.type==="chat"){
    const p=byId(modal.pid);
    if(!p)return `<div class="overlay"><div class="sheet"><h2>Han er væk</h2><p>Den spiller har forladt klubben.</p><button class="glowbtn" onclick="modal=null;render()">OK</button></div></div>`;
    return `<div class="overlay"><div class="sheet">
      <div class="kick">Kontoret · døren lukket</div>
      <h2>${p.name}</h2>
      <p>${p.pos} · selvtillid ${Math.round(p.conf)} · form ${p.form>1?"stigende":p.form<-1?"faldende":"stabil"} · ${p.traits.map(t=>TRAITS[t]).join(", ")||"ingen særlige træk"}</p>
      <button class="abtn" onclick="doChat('praise')" style="text-align:left"><b>Ros ham</b> — selvtilliden op… medmindre han allerede ved han er god</button>
      <button class="abtn comm" onclick="doChat('hairdryer')" style="text-align:left"><b>Føntørreren</b> — tænder en ild eller knækker ham. Afhænger af manden</button>
      <button class="abtn" onclick="doChat('promise')" style="text-align:left"><b>Lov ham fodbold</b> — løft med det samme, men levér inden for 5 kampdage</button>
      <button class="abtn ghost" onclick="modal=null;render()">Lad det ligge</button>
    </div></div>`;
  }
  if(modal.type==="info"){
    return `<div class="overlay"><div class="sheet"><h2>${modal.title}</h2><p>${modal.body}</p>
      <button class="glowbtn" onclick="modal=null;render()">OK</button></div></div>`;
  }
  return "";
}

/* ---------- ticker runtime: two halves, HT choice, FT summary ---------- */
let tickTimer=null;
function openTicker(match,_){
  modal={type:"ticker",match,minute:0,gf:0,ga:0,skipped:false,usedSkip:false,half:1,ht:false,ft:false};
  // M2.5: hjemmefra ser du ikke kampen minut for minut — resultatet kommer til dig.
  if(G.layer==="owner"&&!match.big&&!match.isPlayoff){modal.skipped=true;modal.usedSkip=true;}
  render();
}
function tickerEventPool(){
  const M=modal.match;
  return modal.half===1?M.events:M.h2events;
}
function pushEv(e){
  const M=modal.match;
  if(e.goal==="me")modal.gf++;if(e.goal==="them")modal.ga++;
  const sc=document.getElementById("tsc");if(sc)sc.textContent=(M.home?modal.gf+"–"+modal.ga:modal.ga+"–"+modal.gf);
  const tev=document.getElementById("tev");
  if(tev)tev.insertAdjacentHTML("afterbegin",`<div class="e ${e.goal?'goal':''}"><span class="m num">${e.m}'</span><span class="${e.goal?'txt':''}">${e.txt}${e.sub?`<div style="font-size:11px;font-weight:500;color:var(--muted);text-transform:none;font-family:Inter;font-style:normal">${e.sub}</div>`:""}</span></div>`);
}
function runTicker(){
  const M=modal.match;
  // R1a: quick mode er fjernet — "Next week" hjemmefra ER hurtigvejen (M2.5),
  // og inde i klubben ser man kampen (skip-knappen bestaar).
  startTickLoop();
}
function startTickLoop(){
  const M=modal.match;
  const step=M.big?1000:750;
  let idx=0;
  clearInterval(tickTimer);
  tickTimer=setInterval(()=>{
    if(modal===null||modal.type!=="ticker"){clearInterval(tickTimer);return;}
    const pool=tickerEventPool();
    if(modal.skipped){
      while(idx<pool.length)pushEv(pool[idx++]);
      clearInterval(tickTimer);
      if(modal.half===1)showHT();else showFT();
      return;
    }
    modal.minute+=R(4,8);
    const capMin=modal.half===1?45:90;
    modal.minute=Math.min(modal.minute,capMin);
    const el=document.getElementById("tmin");if(el)el.textContent=modal.minute+"'";
    const bar=document.getElementById("tbar");if(bar)bar.style.width=Math.round(modal.minute/90*100)+"%";
    while(idx<pool.length&&pool[idx].m<=modal.minute)pushEv(pool[idx++]);
    // spent = nothing left that can still fire inside this half (belt and braces:
    // an event minute outside the half must never stall the clock)
    const spent=idx>=pool.length||pool[idx].m>capMin;
    if(modal.minute>=capMin&&spent){
      while(idx<pool.length)pushEv(pool[idx++]);
      clearInterval(tickTimer);
      if(modal.half===1)showHT();else showFT();
    }
  },step);
}
function showHT(){
  const M=modal.match;
  // M2.5: hjemmefra er der ingen omklædningsrums-beslutning — gafferen kører anden halvleg selv.
  if(G.layer==="owner"&&!M.big&&!M.isPlayoff){modal.ht=true;tickHT(null);modal.skipped=true;return;}
  modal.ht=true;modal.skipped=false;
  const el=document.getElementById("tmin");if(el)el.textContent="HT";
  const burning=modal.gf<=modal.ga;
  const box=document.getElementById("tht");
  if(box){
    box.style.display="block";
    // N1: hairdryeren ("riv dem et nyt et") er fjernet. Du kan roe dem ned — eller
    // bare lade gafferen om det og se anden halvleg. En formand må gerne se på.
    box.innerHTML=burning
      ?`<div class="kick" style="text-align:center;margin-bottom:8px">Pausen</div>
        <div style="display:flex;gap:8px">
        <button class="abtn" style="flex:1" onclick="tickHT('steady')">Ro på</button>
        <button class="abtn comm" style="flex:1" onclick="tickHT(null)">Se den spille ▸</button></div>`
      :`<button class="abtn" style="width:100%" onclick="tickHT(null)">Anden halvleg ▸</button>`;
  }
  const sk=document.getElementById("tskip");if(sk)sk.style.display="none";
}
function tickHT(c){
  const M=modal.match;
  const box=document.getElementById("tht");if(box)box.style.display="none";
  const sk=document.getElementById("tskip");if(sk)sk.style.display="";
  if(c)htChoice(c);else{M.htDone=true;}
  modal.half=2;modal.minute=45;modal.ht=false;
  startTickLoop();
}
function resumeTicker(){/* htChoice already rebuilt h2events; loop restarts in tickHT */}
function showFT(){
  const M=modal.match;
  // playoffs cannot end level: golden-goal drama
  if(M.noDraw&&modal.gf===modal.ga){
    const s=myStrength();const t=G.teams[M.oppIdx-1];
    const winMe=Math.random()<0.5+((s.att-t.att)/60);
    const p=pick(xiList().filter(x=>x.pos==="FW"||x.pos==="MF"));
    if(winMe){M.h2.gf++;pushEv({m:"ET",goal:"me",scorerId:p.id,txt:"EXTRA TIME — "+p.name.split(" ")[1].toUpperCase()+"!!",sub:"The golden moment. Grown adults are crying into their pies."});}
    else{M.h2.ga++;pushEv({m:"ET",goal:"them",txt:"Extra time — "+M.opp+" break your hearts.",sub:"Football is a cruel sport played in the rain."});}
  }
  modal.ft=true;
  const res=finalizeMatch(M);
  G.formHist=G.formHist||[];
  if(!M.isPlayoff){G.formHist.push(res.gf>res.ga?"w":res.gf===res.ga?"d":"l");if(G.formHist.length>10)G.formHist.shift();}
  modal.res=res;
  const el=document.getElementById("tmin");if(el)el.textContent="FT";
  const bar=document.getElementById("tbar");if(bar)bar.style.width="100%";
  const sk=document.getElementById("tskip");if(sk)sk.style.display="none";
  const sum=document.getElementById("tsummary");
  if(sum){
    sum.style.display="block";
    sum.innerHTML=`
      <div class="card" style="margin-top:10px"><div class="kick">Gafferens analyse</div>
        <div style="font-size:13px;line-height:1.5;margin-top:6px">${res.analysis}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:8px;font-style:italic">${res.quote}</div></div>
      <div class="card"><div class="rowline"><span>★ Kampens spiller</span><span class="amt">${res.motm?res.motm.name+" · "+res.motm.rating:"—"}</span></div>
        <div class="rowline"><span>Skud</span><span class="num">${res.shots[0]} – ${res.shots[1]}</span></div>
        <div class="rowline"><span>Dominans</span><span class="num">${res.dom}%</span></div>
        ${(res.keyStats||[]).map(k=>`<div class="rowline"><span>${k.k}${k.hint?` <small>· ${k.hint}</small>`:""}</span><span class="num">${k.v}</span></div>`).join("")}
        ${res.home?`<div class="rowline"><span>Gate</span><span class="amt num">${kfmt(res.gate||0)}</span></div>`:""}</div>`;
  }
  const dn=document.getElementById("tdone");if(dn)dn.style.display="block";
}
function skipTicker(){if(modal&&modal.type==="ticker"){modal.skipped=true;modal.usedSkip=true;}}
function closeTicker(){
  clearInterval(tickTimer);
  const M=modal.match;const wasFT=modal.ft;
  modal=null;
  if(!wasFT){render();return;}
  if(M.isPlayoff&&M.postKind){playoffPost(M,{gf:M.h1.gf+M.h2.gf,ga:M.h1.ga+M.h2.ga,opp:M.opp});return;}
  afterMatchday();
}

/* ---------- title screen (only when a career is waiting) ---------- */
let bootSave=null;
function renderTitle(){
  const d=bootSave;
  applyTheme(obData.hue,obData.mode);
  const divName=({3:"League Three",2:"League Two",1:"League One",0:"Premier Division"})[d.div]||"";
  app().innerHTML=`<div class="ob"><div class="box">
    <div style="text-align:center;margin-bottom:14px">${svgShield(initials(d.club||"AR"),true,52)}
    <div class="disp" style="font-size:30px;margin-top:8px">FOOTBALL TYCOON</div>
    <div class="kick" style="margin-top:4px">Club owner</div></div>
    <div class="letter"><div class="lh">DER ER EN KARRIERE I GANG</div>
      <b>${d.club||"Din klub"}</b> — ${divName}, sæson ${d.season||1}. Kedlen er stadig varm.</div>
    <button class="glowbtn" style="margin-top:16px" onclick="continueCareer()">Fortsæt ▸</button>
    <button class="abtn ghost" onclick="newCareer()">Start en ny karriere <small style="opacity:.7">— det sletter den ovenfor</small></button>
    <div class="kick" style="margin-top:18px">Gendan fra en karriere-kode</div>
    <textarea id="impcode" placeholder="Sæt en karriere-kode ind her…" style="width:100%;min-height:54px;margin-top:6px;background:rgba(0,0,0,.25);color:inherit;border:1px solid rgba(150,175,205,.25);border-radius:9px;padding:8px;font-size:11px"></textarea>
    <button class="abtn" style="margin-top:6px" onclick="doImportCareer()">Importér karriere ▸</button>
  </div></div>`;
}
function continueCareer(){
  if(loadGame()){bootSave=null;if(!resumeIfOver())resumePendingMatch();render();}
  else{bootSave=null;renderOnboarding();}
}
/* Pakke 20. Blev appen lukket midt i tickeren, ligger den afgjorte kamp i G.
   Den spilles ikke om -- den rulles videre fra begyndelsen med NOEJAGTIG samme
   maal, samme haendelser og samme runde i resten af divisionen. */
/* Pakke 20 og 22 haenger sammen her: er kontrollen tabt, skal den VAERE tabt
   ogsaa efter en genstart. Ellers kan spilleren lukke appen paa opgoerelsen og
   aabne den igen som formand -- samme genindlaesningssmuthul som resultatet
   havde, bare med hele klubben som indsats. */
function resumeIfOver(){
  if(!G||G.phase!=="over")return false;
  modal={type:"eraOver",who:G.overTo||null};
  return true;
}
function resumePendingMatch(){
  if(!G||!G.pendingMatch)return false;
  const m=G.pendingMatch;
  if(!m.h1||!m.h2||!Array.isArray(m.events)){G.pendingMatch=null;return false;}
  openTicker(m,null);
  return true;
}
function newCareer(){
  deleteSave();bootSave=null;obStep=0;renderOnboarding();
}

/* ---------- onboarding ---------- */
const SWATCHES=[{h:85,n:"Græsgrøn"},{h:0,n:"Blodrød"},{h:210,n:"Marineblå"},{h:28,n:"Tangerin"},{h:275,n:"Violet"},{h:180,n:"Petrol"},{h:330,n:"Fuchsia"},{h:48,n:"Guld"}];
function renderOnboarding(){
  applyTheme(obData.hue,obData.mode);
  let inner="";
  /* R6: introen starter med DIG — ejer-identiteten før klubben. Rækkefølgen er
     vendt: (1) dit navn/portræt/baggrund → (2) du arver klubben: navn →
     (3) farve → (4) look → (5) gaffer. Spillet handler om personen. */
  if(obStep===0){
    const B=BAL.owner.backgrounds,bg=B[obData.ownerBg]||B.selfmade;
    inner=`<div class="letter"><div class="lh">TRIN 1 AF 5 · DIG</div>Før klubben, før pengene, før aviserne — hvem er <b>du</b>?</div>
      <input id="obowner" type="text" value="${obData.ownerName}" maxlength="22" placeholder="Dit navn">
      <div class="kick" style="margin-top:12px">Portræt</div>
      <div class="swatches" style="font-size:26px">${OWNER_AVATARS.map(a=>`<div class="sw ${obData.ownerAvatar===a?'on':''}" style="display:flex;align-items:center;justify-content:center;background:hsl(${obData.hue},30%,20%)" onclick="obAvatar('${a}')">${a}</div>`).join("")}</div>
      <div class="kick" style="margin-top:12px">Hvor du kom fra</div>
      <div class="modes" style="margin-top:8px;flex-direction:column">
        ${Object.entries(B).map(([k,b])=>`<button class="${obData.ownerBg===k?'on':''}" onclick="obBg('${k}')" style="text-align:left">${b.n} <small style="opacity:.7">· ${b.blurb}</small></button>`).join("")}</div>
      <div class="obwhy"><b>${bg.n}.</b> ${bg.cash>0?"+"+kfmt(bg.cash)+" startkapital":bg.cash<0?kfmt(bg.cash)+" startkapital":"Lige vilkår"}${bg.rep?" · omdømme "+(bg.rep>0?"+":"")+bg.rep:""}${bg.fan?" · fans "+(bg.fan>0?"+":"")+bg.fan:""}${bg.repGain>1?" · bygger omdømme hurtigere":""}.</div>
      <button class="glowbtn" style="margin-top:14px" onclick="obNext()">Det er mig ▸</button>`;
  }
  if(obStep===1){
    inner=`<div class="letter"><div class="lh">TRIN 2 AF 5 · ARVEN</div>
      Et advokatbrev: din grandonkel har efterladt <b>dig</b> en klub i de lavere rækker, dens gæld og et tomt trofæskab. Giv den et navn.</div>
      <input id="obname" type="text" value="${obData.name}" maxlength="24" placeholder="Navngiv din klub">
      <button class="glowbtn" style="margin-top:14px" onclick="obNext()">Skriv under ▸</button>`;
  }
  if(obStep===2){
    const sw=SWATCHES.find(s=>s.h===obData.hue);
    inner=`<div class="letter"><div class="lh">TRIN 3 AF 5 · FARVE</div>Vælg <b>${obData.name}</b>s farve.</div>
      <div class="swatches">${SWATCHES.map(s=>`<div class="sw ${obData.hue===s.h?'on':''}" style="background:linear-gradient(135deg,hsl(${s.h},88%,60%),hsl(${s.h},75%,42%))" onclick="obHue(${s.h})" title="${s.n}"></div>`).join("")}</div>
      <button class="glowbtn" style="margin-top:16px" onclick="obNext()">Næste ▸</button>`;
  }
  if(obStep===3){
    inner=`<div class="letter"><div class="lh">TRIN 4 AF 5 · UDSEENDE</div>Mørk eller lys? Skift når som helst.</div>
      <div class="modes" style="margin-top:14px;flex-direction:column">
        <button class="${obData.mode==='dark'?'on':''}" onclick="obMode('dark')">◗&nbsp; Mørk</button>
        <button class="${obData.mode==='light'?'on':''}" onclick="obMode('light')">☀&nbsp; Lys</button></div>
      <button class="glowbtn" style="margin-top:16px" onclick="obNext()">Næste ▸</button>`;
  }
  if(obStep===4){
    const c=obData.coach||(obData.coach=pick(COACHES));
    inner=`<div class="letter"><div class="lh">TRIN 5 AF 5 · GAFFEREN</div>
      <b>${c.n}</b> · ${c.style} · TAC ${c.tac} · MAN ${c.man} · DEV ${c.dev}</div>
      <div class="truth"><span class="n">1</span><span>Truppen: ærlig men begrænset. Byg den.</span></div>
      <div class="truth"><span class="n">2</span><span>Ingen sponsor · 1,500 souls · £150,000 i kassen.</span></div>
      <div class="truth"><span class="n">3</span><span>En kamp gemmes i det øjeblik den spilles. Ingen omkampe.</span></div>
      <button class="glowbtn" style="margin-top:16px" onclick="obFinish()">Tag over ▸</button>`;
  }
  app().innerHTML=`<div class="ob"><div class="box">
    <div style="text-align:center;margin-bottom:14px">${obStep===0?`<div style="font-size:52px;line-height:1">${obData.ownerAvatar}</div>`:svgShield(initials(obData.name),true,52)}
    <div class="disp" style="font-size:30px;margin-top:8px">${obStep===0?"FOOTBALL TYCOON":obStep===1?(obData.ownerName||"Formanden"):obData.name}</div>
    <div class="kick" style="margin-top:4px">${obStep===0?"Din historie. Klubben er kapitlet.":obStep===1?"Kommende ejer":"Ejet af "+(obData.ownerName||"dig")}</div></div>
    ${inner}</div></div>`;
}
function obNext(){
  if(obStep===0){const el=document.getElementById("obowner");if(el)obData.ownerName=safeName(el.value)||"";}
  if(obStep===1){obData.name=safeName(document.getElementById("obname").value)||"Ashford Rovers";}
  obStep++;renderOnboarding();
}
function obHue(h){obData.hue=h;renderOnboarding();}
function obMode(m){obData.mode=m;renderOnboarding();}
function obAvatar(a){obData.ownerAvatar=a;renderOnboarding();}   // O1
function obBg(k){obData.ownerBg=k;renderOnboarding();}           // O1
function obFinish(){
  // R6: ejer-navnet læses på trin 1 (obNext) — introen starter med DIG
  newGame(obData.name,obData.hue,obData.mode);
  G.coach={...obData.coach};
  applyOwner(obData.ownerName,obData.ownerAvatar,obData.ownerBg);  // O1: stamp yourself on the club
  applyTheme(G.hue,G.mode);
  screen="home";
  openBudgetMeeting(); // the first board meeting is part of taking over
}

/* ---------- boot ---------- */
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&G&&!modal&&screen==="home"&&G.phase==="season"&&G.md<G.rounds)playMatchday();
});
bootSave=readSave();
render();
</script>
