/* ---------- the ground ----------
   Everything below is derived from ONE pitch trapezoid: the far touchline is
   narrower than the near one, and every stand, roof and crowd dot is placed by
   interpolating along it. Change the trapezoid and the whole ground follows. */
const STAD={fy:100,ny:205,fl:134,fr:256,nl:52,nr:338};
function stadHash(n){const x=Math.sin(n*127.1+0.7)*43758.5453;return x-Math.floor(x);}
/* A fully built ground is ~32 KB of markup and ~380 circles, rebuilt on every
   single tap because render() swaps the whole app. Cache it against everything
   that can change the drawing. */
let stadCache={key:null,svg:""};
function stadiumSvg(){
  const dark=G.mode==="dark",P=STAD;
  const protest=protestLevel();
  const cap=Math.max(1,G.capacity);
  const full=clamp(attendance()/cap,0,1);          // crowd density = how full we are
  const key=[G.mode,G.hue,G.capacity,G.club,G.badge,Math.round(full*100),
    JSON.stringify(G.stands),JSON.stringify(G.fac),
    G.standBuild?G.standBuild.key+":"+G.standBuild.remain:"-",
    G.fanMood>55?2:G.fanMood>30?1:0,
    "pr"+protestLevel()].join("|");     // the rung MUST be in the key, or the ground never changes
  if(stadCache.key===key)return stadCache.svg;
  const C=dark
   ?{grass1:"#1C5533",grass2:"#22643C",line:"rgba(238,255,232,.52)",stand:"#101A12",tier:"#16241A",
     roof:"#090F0A",edge:"#26351F",crowd:"#8E9C92",hut:"#141F16",mast:"#1B241C",lamp:"#F7FBDF",scr:"#070B08",ghost:"#3A4A3C"}
   :{grass1:"#3E9159",grass2:"#48A063",line:"rgba(255,255,255,.8)",stand:"#DAE1D2",tier:"#E6EBE0",
     roof:"#C0CBB8",edge:"#B7C4AD",crowd:"#6C7A71",hut:"#D2DACA",mast:"#A9B4A1",lamp:"#FDFFF0",scr:"#2B332C",ghost:"#AFBCA6"};

  /* --- geometry --- */
  const yAt=v=>P.fy+(P.ny-P.fy)*v;
  const inL=v=>P.fl+(P.nl-P.fl)*v, inR=v=>P.fr+(P.nr-P.fr)*v;
  const depth=v=>28+10*v;                          // nearer stands read deeper
  const sideMap=(side,lvl)=>{const inn=side<0?inL:inR,k=lvl>=2?1.28:1;
    return (u,v)=>[inn(v)+side*depth(v)*k*u,yAt(v)];};
  const mapP=(u,v)=>[inL(v)+(inR(v)-inL(v))*u,yAt(v)];
  const shedMap=lvl=>{const h=lvl>=2?46:33;return (u,v)=>[132+126*v,P.fy-h*u];};
  const awayMap=lvl=>{const h=lvl>=2?25:18;return (u,v)=>[(P.nl-11*u)+((P.nr+11*u)-(P.nl-11*u))*v,P.ny+h*u];};

  const pt=([x,y])=>x.toFixed(1)+","+y.toFixed(1);
  const quad=(m,u0,u1,v0,v1,a)=>`<polygon points="${[m(u0,v0),m(u0,v1),m(u1,v1),m(u1,v0)].map(pt).join(" ")}" ${a}/>`;
  const seg=(m,u,v0,v1,a)=>{const [x1,y1]=m(u,v0),[x2,y2]=m(u,v1);
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" ${a}/>`;};

  /* --- the crowd: a stable dot field, thinned by how full the ground is --- */
  const crowd=(m,u0,u1,cols,rows,r,base)=>{
    let s="";
    for(let c=0;c<cols;c++)for(let w=0;w<rows;w++){
      const i=base+c*37+w*11;
      if(stadHash(i*3.13)>full)continue;            // empty seat
      if(protest>=3&&stadHash(i*7.9)<0.30)continue;  // boycott: sections nobody has filled
      const v=clamp((c+0.5+(stadHash(i*1.7)-0.5)*0.8)/cols,0.01,0.99);
      const u=clamp(u0+(u1-u0)*((w+0.5+(stadHash(i*2.9)-0.5)*0.5)/rows),0,1);
      const [x,y]=m(u,v);
      // rung two: the scarves come down with the singing. Rung three: whole
      // blocks simply are not there.
      const acc=protest<2&&stadHash(i*5.7)<0.13;    // a scarf in the club colour
      s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${acc?"var(--acc)":C.crowd}" opacity="${acc?".95":".68"}"/>`;
    }
    return s;
  };

  /* --- a stand, in tiers, with a roof --- */
  const building=k=>G.standBuild&&G.standBuild.key===k;
  function stand(key,m,cols,rows,r,base){
    const lvl=G.stands[key];
    if(lvl<1){
      const c=building(key)?"var(--comm)":C.ghost;
      const [lx,ly]=m(0.55,0.5);
      return quad(m,0,1,0,1,`fill="none" stroke="${c}" stroke-width="1.6" stroke-dasharray="6 5" opacity="${building(key)?".95":".55"}"`)+
        `<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="middle" font-family="BarlowCN" font-size="8" letter-spacing="2" fill="${c}" opacity="${building(key)?"1":".8"}">${building(key)?"BUILDING":"BUILD"}</text>`;
    }
    let s=quad(m,0,1,0,1,`fill="${C.stand}" stroke="${C.edge}" stroke-width="1"`);
    s+=quad(m,0.62,1,0,1,`fill="${C.roof}"`);                        // roof, seen from in front
    s+=seg(m,0.62,0,1,`stroke="${C.edge}" stroke-width="1.4"`);      // the roof lip
    s+=crowd(m,0.06,0.58,cols,rows,r,base);                          // lower tier
    if(lvl>=2){
      s+=quad(m,0.28,0.34,0,1,`fill="${C.tier}" opacity=".55"`);     // the step between tiers
      s+=crowd(m,0.36,0.58,cols,Math.max(2,rows-1),r,base+911);      // upper tier
      s+=seg(m,1,0,1,`stroke="${C.edge}" stroke-width="1.8"`);
    }
    if(building(key)){                                               // upgrade in progress
      s+=quad(m,0,1,0,1,`fill="none" stroke="var(--comm)" stroke-width="1.8" stroke-dasharray="6 5"`);
    }
    return s;
  }

  /* --- floodlights --- */
  const pylon=(x,by,h,w)=>{
    const hh=w*0.38;
    return `<rect x="${(x-1.7).toFixed(1)}" y="${(by-h+hh).toFixed(1)}" width="3.4" height="${(h-hh).toFixed(1)}" fill="${C.mast}"/>
      <rect x="${(x-w/2).toFixed(1)}" y="${(by-h).toFixed(1)}" width="${w}" height="${hh.toFixed(1)}" rx="2" fill="${C.mast}"/>
      ${[0.2,0.5,0.8].map(t=>`<circle cx="${(x-w/2+w*t).toFixed(1)}" cy="${(by-h+hh/2).toFixed(1)}" r="${(w*0.105).toFixed(1)}" fill="${C.lamp}" opacity="${dark?"1":".75"}"/>`).join("")}`;
  };
  const cone=(x,by,h,spread)=>dark?`<polygon points="${x},${(by-h+5).toFixed(1)} ${(x-spread)},${P.ny} ${(x+spread)},${P.ny}" fill="url(#stCone)"/>`:"";

  /* --- kiosks & kit --- */
  const hut=(x,y,w,hh,label)=>`<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="3" fill="${C.hut}" stroke="${C.edge}"/>
    <rect x="${x-3}" y="${y-4.5}" width="${w+6}" height="5" rx="2" fill="var(--acc)" opacity=".8"/>
    <text x="${x+w/2}" y="${y+hh-6}" text-anchor="middle" font-family="BarlowCN" font-size="7.5" letter-spacing="1.1" fill="var(--acc)">${label}</text>`;
  const crane=(x,y)=>`<g stroke="var(--comm)" stroke-width="2.1" fill="none" stroke-linecap="round" opacity=".95">
    <line x1="${x}" y1="${y}" x2="${x}" y2="${y-56}"/><line x1="${x-9}" y1="${y-47}" x2="${x+35}" y2="${y-47}"/>
    <line x1="${x}" y1="${y-56}" x2="${x+31}" y2="${y-47}"/><line x1="${x}" y1="${y-56}" x2="${x-9}" y2="${y-47}"/>
    <line x1="${x+27}" y1="${y-47}" x2="${x+27}" y2="${y-33}"/></g>
    <rect x="${x+23}" y="${y-35}" width="8" height="5" rx="1.5" fill="var(--comm)"/>`;
  const CRANE_AT={shed:[300,98],main:[26,196],family:[364,196],away:[196,240]};

  /* --- pitch --- */
  let pitch="";
  for(let i=0;i<9;i++){
    const v0=i/9,v1=(i+1)/9;
    pitch+=`<polygon points="${[[inL(v0),yAt(v0)],[inR(v0),yAt(v0)],[inR(v1),yAt(v1)],[inL(v1),yAt(v1)]].map(pt).join(" ")}" fill="${i%2?C.grass2:C.grass1}"/>`;
  }
  const mk=`stroke="${C.line}" stroke-width="1.4" fill="none"`;
  const [cx,cy]=mapP(0.5,0.5);
  pitch+=quad(mapP,0,1,0,1,mk);
  pitch+=`<line x1="${inL(0.5).toFixed(1)}" y1="${yAt(0.5).toFixed(1)}" x2="${inR(0.5).toFixed(1)}" y2="${yAt(0.5).toFixed(1)}" ${mk}/>
    <ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${((inR(0.5)-inL(0.5))*0.185).toFixed(1)}" ry="${((inR(0.5)-inL(0.5))*0.078).toFixed(1)}" ${mk}/>
    <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="1.6" fill="${C.line}"/>`
    +quad(mapP,0.26,0.74,0,0.15,mk)+quad(mapP,0.22,0.78,0.85,1,mk)
    +quad(mapP,0.42,0.58,-0.022,0,`stroke="${C.line}" stroke-width="1.8" fill="none"`)
    +quad(mapP,0.435,0.565,1,1.022,`stroke="${C.line}" stroke-width="1.8" fill="none"`);

  const shedM=shedMap(G.stands.shed),awayM=awayMap(G.stands.away);
  const bnrCol=protest>=1?"#E07A6A":"var(--acc)";
  const bnr=G.stands.shed>=1?(([bx,by])=>`<text x="${bx.toFixed(1)}" y="${by.toFixed(1)}" text-anchor="middle" font-family="BarlowC" font-style="italic" font-weight="900" font-size="10" fill="${bnrCol}" letter-spacing="2.6">${fanBanner()}</text>`)(shedM(G.stands.shed>=2?0.82:0.78,0.5)):"";
  /* Rung one: hand-painted sheets go up along the side stands. They are drawn
     as bedsheets, because that is what they are. */
  const protestSheets=protest>=1?[[-1,"main"],[1,"family"]].map(([side,k])=>{
    if(G.stands[k]<1)return "";
    const m=sideMap(side,G.stands[k]);
    return [0.30,0.58].slice(0,protest>=2?2:1).map((v,ix)=>
      quad(m,0.10,0.30,v,v+0.14,`fill="#E07A6A" opacity=".${protest>=3?"85":"7"}" stroke="${C.edge}" stroke-width=".5"`)
    ).join("");
  }).join(""):"";

  const out=`<div class="stadwrap"><svg viewBox="0 0 390 250" style="display:block;background:${dark?`linear-gradient(180deg,hsl(${G.hue},24%,11%),hsl(${G.hue},26%,5%))`:"linear-gradient(180deg,#DCE6F1,#EFF2EA)"}">

    ${pitch}

    ${stand("family",sideMap(1,G.stands.family),17,3,1.5,4400)}
    ${stand("away",awayM,20,2,1.4,6600)}
    ${protestSheets}
    ${G.fac.vip&&G.stands.main>=1?[0.28,0.4,0.52,0.64].map(v=>quad(sideMap(-1,G.stands.main),0.66,0.86,v,v+0.085,`fill="var(--acc)" opacity=".5" stroke="${C.edge}" stroke-width=".6"`)).join(""):""}
    ${cone(86,P.fy,34,54)}${cone(304,P.fy,34,54)}${cone(24,P.ny,48,74)}${cone(366,P.ny,48,74)}
    ${pylon(24,P.ny,48,26)}${pylon(366,P.ny,48,26)}
    ${G.fac.pub?hut(88,74,30,22,"PIES"):""}${G.fac.shop?hut(272,74,30,22,"SHOP"):""}
    ${G.standBuild?crane(CRANE_AT[G.standBuild.key][0],CRANE_AT[G.standBuild.key][1]):""}
  </svg>
  <div class="plaque"><div class="pn">${G.club.split(" ")[0]} Ground</div>
  <div class="pc"><small>${Math.round(full*100)}% FULL · CAPACITY</small><b class="num">${G.capacity.toLocaleString("en-GB")}</b></div></div></div>`;
  stadCache={key,svg:out};
  return out;
}
function fanBanner(){
  // one ladder, one source of truth — the banner says what rung we are on
  const lvl=protestLevel();
  if(lvl>=3)return "STAY AWAY UNTIL THEY GO";
  if(lvl>=2)return "NOT A WORD. NOT A PENNY.";
  if(lvl>=1)return "SACK THE BOARD (THAT'S YOU)";
  return G.fanMood>55?"WE ARE "+G.club.split(" ")[0].toUpperCase():"IN IT TOGETHER. MOSTLY.";
}
function viewTable(){
  const rows=table();
  return `<div class="card"><div class="kick" style="margin-bottom:6px">${G.divNames[G.div]}</div>
    <table><tr><th>#</th><th>Club</th><th class="r">Pl</th><th class="r">GD</th><th class="r">Pts</th></tr>
    ${rows.map((r,ix)=>{
      const zone=ix<2?'style="background:var(--acc)"':ix<6?'style="background:var(--comm)"':'style="background:transparent"';
      return `<tr class="${r.i===0?'me':''}"><td class="num">${ix+1}</td><td><span class="zonebar" ${zone}></span>${r.n}</td><td class="r num">${r.pl}</td><td class="r num">${r.gd}</td><td class="r num"><b>${r.pts}</b></td></tr>`;
    }).join("")}</table>
    <div class="kick" style="margin-top:9px;font-size:9px"><span style="color:var(--acc)">▮</span> Direct promotion &nbsp; <span style="color:var(--comm)">▮</span> Playoffs (3–6)</div></div>
    ${G.history.length?`<div class="card"><div class="kick" style="margin-bottom:4px">Club history</div>${G.history.map(hh=>`<div class="rowline"><span>Season ${hh.season} <small>· ${hh.div}</small></span><span>${ord(hh.pos)}${hh.promoted?" · PROMOTED ↑":""}</span></div>`).join("")}</div>`:""}`;
}

function renderModal(){
  if(modal.type==="prematch"){
    const M=modal.match;
    return `<div class="overlay"><div class="sheet">
      ${M.label?`<div class="biglabel">${M.label}</div>`:`<div class="kick">Matchday ${G.md+1} · ${M.home?"Home":"Away"}</div>`}

      <p><b>${M.weather.n}</b> — ${M.weather.txt}.</p>
      ${(()=>{ // a thin squad plays short without ever saying so
        const xi=xiList(),out=G.squad.filter(p=>p.inj||p.susp);
        if(xi.length>=11){
          // He never asks you to pick the team. He asks you to give him bodies.
          const tired=xi.filter(p=>freshBand(p)==="flat").length;
          const cover=available().length-11;
          const moan=(squadFreshness()<BAL.fresh.gafferMoans||tired>=3)&&cover<=2
            ? `<div class="why" style="border-left-color:rgba(243,179,60,.6);background:rgba(243,179,60,.09)">

                  :"I can change "+cover+", and then I'm out of bodies."} Get me a squad and I'll get you a season.</div>`
            : "";
          return moan+(out.length?`<div class="why"><b>Unavailable:</b> ${out.map(p=>p.name.split(" ")[1]+(p.inj?" (injured)":" (suspended)")).join(", ")}. The gaffer has eleven, just about.</div>`:"");

        return `<div class="why" style="border-left-color:rgba(224,90,74,.6);background:rgba(224,90,74,.09)">
          <b>You cannot field a full eleven.</b> Only ${xi.length} fit players in the best shape available${out.length?" — "+out.map(p=>p.name.split(" ")[1]).join(", ")+" are out":""}. The team plays short today, and it will show.</div>`;

          "<b>The boycott is holding.</b> Whole blocks of empty seats where the noise used to be. Every one of them is money that did not come through the turnstile."][protestLevel()];

      })()}

    </div></div>`;
  }
  if(modal.type==="ticker"){
    const M=modal.match;
    return `<div class="overlay"><div class="sheet tickwrap" id="tick">
      ${M.label?`<div class="biglabel">${M.label}</div>`:""}

  }
  if(modal.type==="quickOffer"){
    return `<div class="overlay"><div class="sheet">
      <h2>In a hurry, chairman?</h2>
      <p>You've skipped three matches straight. Want <b>quick results</b> for routine games — instant score + highlights? Big matches (playoffs, deadline drama) always play in full. You can turn it off any time on the Home screen.</p>
      <button class="glowbtn" onclick="G.quickMode=true;modal=null;afterMatchday()">Yes — quick results</button>
      <button class="abtn ghost" onclick="modal=null;afterMatchday()">No — I like the drama</button>
    </div></div>`;
  }
  if(modal.type==="nego"){

      :n.stage==="fee"?`Fee negotiation · ${n.agent.n} · round ${Math.min(n.round+1,3)}/3`:`Contract talks · ${n.agent.n} · round ${Math.min(n.cround+1,3)}/3`;
    const regTake=n.stage==="fee"?(n.feeMin<n.p.value*1.02?"“Smells like a bargain, chairman.”":n.feeMin>n.p.value*1.12?"“They're at the high end. Just so you know.”":"“Fair price, give or take.”"):null;
    let body="";
    if(n.doneDeal){
      body=`<div class="card" style="margin-top:12px">

        <div class="rowline"><span>Contract</span><span class="amt num">${n.years} year${n.years>1?"s":""}</span></div>
        <div class="rowline"><span>Wages</span><span class="amt num">${kfmt(n.wageOffer)}/w</span></div>
        <div class="rowline"><span>Promised role</span><span class="amt">${ROLES[n.role].n}</span></div></div>
        <button class="glowbtn" onclick="negoFinish()">Sign him ✍</button>`;
    }else if(n.dead){
      body=`<button class="abtn ghost" onclick="negoFinish()">Walk away</button>`;
    }else if(n.stage==="fee"){
      body=`<div class="stepper">
          <button onclick="nego.fee=Math.max(1000,nego.fee-10000);render()" title="−${kfmt(10000)}">‹‹</button>
          <button onclick="nego.fee=Math.max(1000,nego.fee-1000);render()" title="−${kfmt(1000)}">‹</button>

          <button onclick="nego.fee+=1000;render()" title="+${kfmt(1000)}">›</button>
          <button onclick="nego.fee+=10000;render()" title="+${kfmt(10000)}">››</button></div>
        <div class="kick" style="text-align:center;margin-top:6px;font-size:9px">‹ › = £1,000 · ‹‹ ›› = £10,000</div>
        <button class="glowbtn" onclick="negoSubmit()">Offer ${kfmt(n.fee)}</button>
        ${!n.finalUsed?`<button class="abtn comm" onclick="negoSubmit(true)">⚡ FINAL OFFER · ${kfmt(n.fee)} — instant yes/no</button>`:""}
        <button class="abtn ghost" onclick="negoAbort()">Not today</button>`;

        <div class="modes" style="margin-top:8px">${[1,2,3,4].map(y=>`<button class="${n.years===y?'on':''}" onclick="nego.years=${y};render()">${y} yr${sub(wageDemandFor(y,n.role))}</button>`).join("")}</div>

        <div class="modes" style="margin-top:8px">${Object.entries(ROLES).map(([k,r])=>`<button class="${n.role===k?'on':''}" onclick="nego.role='${k}';render()">${r.n}${sub(wageDemandFor(n.years,k))}</button>`).join("")}</div>
        <div class="kick" style="margin-top:12px">Weekly wage</div>

          <span class="val num" style="font-size:24px">${kfmt(n.wageOffer)}/w</span>
          <button onclick="nego.wageOffer+=50;render()" title="+${kfmt(50)}">›</button>
          <button onclick="nego.wageOffer+=500;render()" title="+${kfmt(500)}">››</button></div>
        <div class="kick" style="text-align:center;margin-top:6px;font-size:9px">‹ › = £50 · ‹‹ ›› = £500</div>
        ${(()=>{
          if(!seen)return `<div class="why"><b>He hasn't named his number.</b> Contract length and the role you promise both move it — make an offer and his agent will tell you how far off you are.</div>`;
          const d=wageDemand();
          const short=d-n.wageOffer;
          return `<div class="why"><b>On ${n.years} year${n.years>1?"s":""} as ${ROLES[n.role].n.toLowerCase()}</b> he expects <b class="num">~${kfmt(d)}/w</b>.
            ${short<=Math.round(d*0.03)?`Your <b class="num">${kfmt(n.wageOffer)}</b> should do it.`
              :`Your <b class="num">${kfmt(n.wageOffer)}</b> is about <b class="num">${kfmt(short)}</b> short — or change the terms above.`}</div>`;
        })()}
        ${(()=>{
          // the price is agreed; how you PAY it is the second negotiation
          const fee=n.agreedFee||0;
          if(!fee||n.freeAgent)return "";
          const plan=n.payPlan||1,cl=n.clause||null,t=dealTerms(fee,plan,cl);
          const planBtn=(v,label)=>`<button class="${plan===v?'on':''}" onclick="nego.payPlan=${v};render()">${label}</button>`;

            <div class="why"><b>Today: ${kfmt(t.down)}.</b>
              ${t.plan>1?" Then "+kfmt(t.perSeason)+" at each of the next "+(t.plan-1)+" season ends — they want "+Math.round(t.sur*100)+"% for waiting.":""}
              ${t.clause==="promo"?" They take "+Math.round(BAL.deal.promoDiscount*100)+"% off now, and "+kfmt(t.promo)+" if you go up within "+BAL.deal.promoSeasons+" seasons.":""}
              ${t.clause==="goals"?" They take "+Math.round(BAL.deal.goalsDiscount*100)+"% off now, and "+kfmt(t.perGoal)+" for every league goal he scores over "+BAL.deal.goalsSeasons+" seasons.":""}
              ${t.plan>1||t.clause?" You are buying above your means and binding a chairman who isn't in the room yet — namely you.":" Nothing owed after tonight."}</div>`;

    return `<div class="overlay"><div class="sheet">

  if(modal.type==="bank"){
    return `<div class="overlay"><div class="sheet">
      <div class="kick" style="color:#E07A6A">The bank is calling</div>
      <h2>−${kfmt(Math.abs(G.balance)).slice(1)} in the red</h2>

      ${modal.canLoan?`<button class="abtn comm" onclick="resolveBank(false)">Emergency loan · +${kfmt(BAL.bank.loanCash)} now, ${kfmt(BAL.bank.loanPerMD)}/MD × ${BAL.bank.loanTerm}</button>`:`<p><b>The loan line is spent.</b> One loan at a time, chairman.</p>`}
    </div></div>`;
  }
  if(modal.type==="interstitial"){
    return `<div class="overlay"><div class="sheet">
      <div class="kick">Monetisation placeholder</div>
      <div class="adbox"><b>INTERSTITIAL AD</b>Fuldskærmsannonce ville vises her<br>(hver 4. kampdag — føles pacingen fair?)</div>
      <button class="glowbtn" onclick="modal=null;render()">Continue</button></div></div>`;

  if(modal.type==="rewarded"){

    return `<div class="overlay"><div class="sheet">
      <div class="biglabel">${modal.crown?"★ CHAMPIONS OF ENGLAND ★":"End of season "+(G.season-1)}</div>

          <div class="rowline"><span>${G.club} Ground</span><span class="amt num">${G.capacity.toLocaleString("en-GB")} seats</span></div>

        <p>The town has a team in the top flight and a chairman who built the stand they are standing in. Carry on as long as you like — the record book is still open.</p>`
      :`<p>${modal.txt} Prize money: <b>${kfmt(modal.prize)}</b>.</p>`}
      ${modal.promoted?`<p>Welcome to <b>${G.divNames[G.div]}</b>. The pitches have fewer molehills. The opponents, more teeth.</p>`:""}
      <div class="kick" style="margin-top:12px">Monetisation placeholder</div>
      <p style="font-size:12px"><b>TYCOON PRO · 49 kr.</b> — no ads · 3 save slots · full career history. <span style="opacity:.7">(Vises netop her, efter en stor sæsonafslutning.)</span></p>
      <button class="glowbtn" onclick="modal=null;openBudgetMeeting()">Start season ${G.season} — to the boardroom ▸</button></div></div>`;

  if(modal.type==="budget"){
    const m=modal;const st=m.step||0;

    const dots=BUDGET_STEPS.map((t,i)=>`<i class="${i===st?'on':i<st?'done':''}"></i>`).join("");

      const est=seasonTixEstimate(m.tixPrice);
      const given=est.sold*G.ticket;
      const cheaper=seasonTixEstimate(Math.max(20,m.tixPrice-10));
      const dearer=seasonTixEstimate(m.tixPrice+10);
      const pastPeak=est.sold>0&&dearer.cash<=est.cash&&cheaper.cash>est.cash;
      body=`<div class="kick" style="margin-top:10px">Season ticket price · one payment for the whole season</div>
        <div class="stepper">
          <button onclick="modal.tixPrice=Math.max(20,modal.tixPrice-10);render()" title="−${gbp(10)}">‹</button>
          <span class="val num" style="font-size:26px">£${m.tixPrice}</span>
          <button onclick="modal.tixPrice=Math.min(400,modal.tixPrice+10);render()" title="+${gbp(10)}">›</button></div>
        <div class="kick" style="text-align:center;font-size:9px;margin-top:4px">A season at the turnstile costs ${kfmt(G.ticket*homeGames())} · ${homeGames()} home games</div>
        <div class="card" style="margin-top:10px">
          <div class="rowline"><span>Holders sold <small>· estimate</small></span><span class="amt num">${est.sold.toLocaleString("en-GB")} <small style="color:var(--muted)">of ${Math.min(G.capacity,Math.round(townDemand())).toLocaleString("en-GB")} reachable</small></span></div>
          <div class="rowline"><span>Cash in the bank <b>now</b></span><span class="amt num">+${kfmt(est.cash)}</span></div>
          <div class="rowline"><span>Turnstile money given up <small>· per home game</small></span><span class="num" style="color:#E07A6A">−${kfmt(given)}</span></div></div>
        ${est.sold===0?`<div class="why" style="border-left-color:rgba(224,90,74,.5);background:rgba(224,90,74,.08)"><b>Nobody is buying at that price.</b> Not one soul in this town. You will take every penny at the turnstile instead — if they turn up at all.</div>`
          :pastPeak?`<div class="why" style="border-left-color:rgba(243,179,60,.6);background:rgba(243,179,60,.08)"><b>You are past the top of the curve.</b> Another tenner loses more holders than it gains in cash — you would take <b>${kfmt(dearer.cash)}</b> instead of ${kfmt(est.cash)}, and hand back the crowd as well.</div>`
          :""}
        <div class="why"><b>What this means:</b> a holder pays once, then walks in free all season. Cheap seats mean money today and a guaranteed crowd for the atmosphere — but every holder is a turnstile that has stopped paying, and price it too high and they simply stop buying.</div>`;
    }
    if(st===1){
      const j=m.jersey;
      const why={classic:"Safe. The fans nod, merch sells steadily, nobody writes a letter to the Gazette.",
                 modern:"A gamble worth taking: usually shifts more shirts than the classic, sometimes fewer.",
                 wild:"A proper coin-flip. Iconic and merch goes through the roof — or a war crime that nobody buys."}[j];
      body=`<div class="kick" style="margin-top:10px">This season's kit · sets merch income all season</div>
        <div class="modes" style="margin-top:8px;flex-direction:column">
          ${["classic","modern","wild"].map(x=>`<button class="${j===x?'on':''}" onclick="modal.jersey='${x}';render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div>
        <div class="why"><b>What this means:</b> ${why||"Pick one — the kit multiplies every shirt sold on a matchday, for better or worse, until next summer."}</div>`;
    }
    if(st===2){
      const opts=Object.entries(STANDS).filter(([k])=>G.stands[k]<2);
      const tgt=m.target&&STANDS[m.target]&&G.stands[m.target]<2?{key:m.target,lvl:G.stands[m.target]+1}:null;
      body=`<div class="kick" style="margin-top:10px">Stadium fund · which stand are we saving for?</div>
        <div class="modes" style="margin-top:8px;flex-wrap:wrap">
          ${opts.map(([k,s])=>{
            const lvl=G.stands[k]+1;
            return `<button class="${m.target===k?'on':''}" style="flex:1 1 45%" onclick="modal.target='${k}';render()">${s.n}<br><span style="font-size:10px;opacity:.7">lvl ${lvl} · ${kfmt(STANDCOST[lvl])}</span></button>`;
          }).join("")||'<div class="newsline">Every stand is at its final glory. Nothing left to save for.</div>'}</div>
        <div class="kick" style="margin-top:10px">Deposit from the bank <small style="text-transform:none">· you hold ${kfmt(G.balance)}</small></div>
        <div class="stepper">
          <button onclick="modal.fundAdd=Math.max(0,modal.fundAdd-10000);render()" title="−${kfmt(10000)}">‹</button>
          <span class="val num" style="font-size:26px">${kfmt(m.fundAdd)}</span>
          <button onclick="modal.fundAdd=Math.min(Math.max(0,G.balance),modal.fundAdd+10000);render()" title="+${kfmt(10000)}">›</button></div>
        ${tgt?`<div class="card" style="margin-top:10px"><div class="rowline"><span>${STANDS[tgt.key].n} lvl ${tgt.lvl}</span><span class="amt num">${kfmt(STANDCOST[tgt.lvl])}</span></div>
          <div class="rowline"><span>In the fund after tonight</span><span class="num">${kfmt(G.fund+m.fundAdd)}</span></div>
          <div class="bar"><i style="width:${clamp(Math.round(100*(G.fund+m.fundAdd)/STANDCOST[tgt.lvl]),2,100)}%"></i></div></div>`:""}
        <div class="why"><b>What this means:</b> money in the fund earns 1.5% a matchday, up to +15%, and building starts by itself when it's full. But it is money you cannot spend on players — and if the bank ever comes calling, the fund is the first thing they take.</div>`;
    }
    if(st===3){
      /* Pakke 19. Forventningsmoedet. Runde 1 er blind -- deres eget tal er
         skjult, praecis som modpartens loenkrav i en kontraktforhandling. */
      const rows=G.teams.length+1;
      const settled=m.objAgreed!==null;
      const bold=settled&&m.objTheirs!==null?m.objTheirs-m.objAgreed:0;
      body=`<div class="kick" style="margin-top:10px">Where do we finish? · ${G.divNames[G.div]}, ${rows} clubs</div>
        <div class="stepper">
          <button onclick="if(modal.objAgreed===null){modal.objProposed=Math.max(1,modal.objProposed-1);render()}" ${settled?"disabled style='opacity:.4'":""} title="more ambitious">‹</button>
          <span class="val num" style="font-size:26px">top ${settled?m.objAgreed:m.objProposed}</span>
          <button onclick="if(modal.objAgreed===null){modal.objProposed=Math.min(G.teams.length+1,modal.objProposed+1);render()}" ${settled?"disabled style='opacity:.4'":""} title="safer">›</button></div>
        ${m.objSaid?`<div class="card" style="margin-top:10px"><div class="newsline">${m.objSaid}</div></div>`:""}
        ${!settled&&m.objTheirs===null?`<button class="glowbtn" style="margin-top:10px" onclick="objectivePropose()">Put it to them ▸</button>
          <div class="why"><b>What this means:</b> they have a figure of their own, and they are not showing it yet. Promise more than they expect and the boardroom pays you for it — in trust, and in the bonus if you deliver. Promise less and it is easy money, right up until they decide you do not believe in the club either.</div>`:""}
        ${!settled&&m.objTheirs!==null?`<div style="display:flex;gap:8px;margin-top:10px">
            <button class="glowbtn" style="flex:1;margin-top:0" onclick="objectiveSettle(true)">Take their top ${m.objTheirs}</button>
            <button class="abtn ghost" style="flex:1" onclick="objectiveSettle(false)">Hold at top ${m.objProposed}</button></div>
          <div class="why"><b>What this means:</b> take theirs and the season is harder and worth more. Hold yours and it is the season you asked for — but their shares get dearer, because a chairman who expects little of the club is not one they hand it to cheaply.</div>`:""}
        ${settled?`<div class="card" style="margin-top:10px">
            <div class="rowline"><span>Agreed objective</span><span class="amt num">top ${m.objAgreed}</span></div>
            <div class="rowline"><span>They had written</span><span class="amt num">top ${m.objTheirs}</span></div>
            <div class="rowline"><span>Board's verdict at season's end</span><span class="num" style="color:${bold>0?"var(--acc)":bold<0?"#E07A6A":"inherit"}">${bold>0?"+"+(bold*BAL.owners.objectiveStake).toFixed(1)+" trust either way · bonus +"+pct(bold*BAL.owners.objectivePrize):bold<0?"their shares cost +"+pct(-bold*BAL.owners.objectiveTimid):"as usual"}</span></div></div>`:""}`;
    }
    if(st===4){
      const est=seasonTixEstimate(m.tixPrice);
      const after=G.balance+est.cash-m.fundAdd;
      const wages=G.squad.reduce((s,p)=>s+p.wage,0);
      body=`<div class="card" style="margin-top:10px">
          <div class="rowline"><span>Season tickets</span><span class="amt num">£${m.tixPrice} · ${est.sold.toLocaleString("en-GB")} holders</span></div>
          <div class="rowline"><span>Kit</span><span class="amt">${m.jersey?m.jersey[0].toUpperCase()+m.jersey.slice(1):"Classic (default)"}</span></div>
          <div class="rowline"><span>Fund deposit${m.target&&STANDS[m.target]?" · "+STANDS[m.target].n:""}</span><span class="amt num">${kfmt(m.fundAdd)}</span></div>
          <div class="rowline"><span><b>Working capital after tonight</b></span><span class="amt num" style="color:${after<0?"#E07A6A":"var(--acc)"}">${kfmt(after)}</span></div>
          <div class="rowline"><span>Wage bill <small>· of ${kfmt(G.wageCap)} cap</small></span><span class="num">${kfmt(wages)}/w</span></div>
          ${commitmentsOwed()?`<div class="rowline"><span>Signed away <small>· instalments &amp; clauses still to pay</small></span><span class="amt num" style="color:#E07A6A">−${kfmt(commitmentsOwed())}</span></div>`:""}</div>
        ${G.myShare<100?(m.capMsg?`<p style="margin-top:10px"><b>${m.capMsg}</b></p>`:`<button class="abtn comm" onclick="askCapRaise()" ${G.capRaiseUsed?"disabled style='opacity:.4'":""}>Ask the co-owners to raise the wage cap <small>(once per season)</small></button>`):""}
        <div class="why"><b>What this means:</b> this is your whole season's room for manoeuvre. Wages leave the bank <b>every matchday</b>, home or away — ${kfmt(wages*G.rounds)} across the ${G.rounds} of them. Objective: top ${G.objectivePos}.</div>`;
    }
    return `<div class="overlay"><div class="sheet">
      <div class="biglabel">The Budget Meeting</div>
      <div class="bsteps">${dots}</div>
      <h2>${BUDGET_STEPS[st]}</h2>
      <p style="font-size:12.5px">${st===0?`Trencher pours terrible coffee. Whitmore reads the frame aloud: wage cap <b>${kfmt(G.wageCap)}/w</b> · objective <b>top ${G.objectivePos}</b>. Then all eyes turn to you — one question at a time.`
        :st===1?`Whitmore slides three kit mock-ups across the table. Trencher already has an opinion. Trencher always has an opinion.`
        :st===2?`Marjorie leans in. "The ground, chairman. Nothing gets better here until the ground does."`
        :st===3?`Trencher puts his cup down. "Right. The bit that matters. Where are we finishing?"`
        :`Whitmore caps his pen. "Then that is the season, agreed and minuted."`}</p>
      ${body}
      <div style="display:flex;gap:8px;margin-top:6px">
        ${st>0?`<button class="abtn ghost" style="flex:0 0 34%" onclick="budgetBack()">‹ Back</button>`:""}
        ${st<LAST?`<button class="glowbtn" style="flex:1;margin-top:0" onclick="budgetNext()">Next ▸</button>`
          :`<button class="glowbtn" style="flex:1;margin-top:0" onclick="budgetConfirm()">Adjourn the meeting ▸</button>`}
      </div>
    </div></div>`;
  }
  if(modal.type==="midway"){
    return `<div class="overlay"><div class="sheet">
      <div class="biglabel">January · The Midway Meeting</div>
      <h2>Half-time, chairman</h2>
      <div class="dlg"><div class="iav">CO</div><div class="bubble">${modal.verdict}</div></div>
      <div class="kick" style="margin-top:12px">Top up the stadium fund?</div>
      <div class="stepper">
        <button onclick="modal.fundAdd=Math.max(0,modal.fundAdd-10000);render()" title="−${kfmt(10000)}">‹</button>
        <span class="val num" style="font-size:24px">${kfmt(modal.fundAdd)}</span>
        <button onclick="modal.fundAdd=Math.min(Math.max(0,G.balance),modal.fundAdd+10000);render()" title="+${kfmt(10000)}">›</button></div>
      ${G.myShare<100&&!G.capRaiseUsed?`<button class="abtn comm" onclick="askCapRaise()">Request wage-cap raise</button>`:""}
      ${modal.capMsg?`<p style="margin-top:10px"><b>${modal.capMsg}</b></p>`:""}
      <button class="glowbtn" onclick="midwayConfirm()">Back to work ▸</button>
    </div></div>`;
  }
  if(modal.type==="sellChoice"){
    const p=byId(modal.pid);
    if(!p)return `<div class="overlay"><div class="sheet"><h2>He's gone</h2><p>That player has left the club.</p><button class="glowbtn" onclick="modal=null;render()">OK</button></div></div>`;
    return `<div class="overlay"><div class="sheet">
      <div class="kick">Selling ${p.name.split(" ")[1]} — how?</div>
      <h2>${p.name}</h2>
      <p>${p.pos} · ${ovr(p)} ovr · age ${p.age} · valued ~${kfmt(p.value)} · contract ${p.years}yr${p.traits.includes("localhero")?" · <b style='color:var(--comm)'>LOCAL HERO — he may refuse to leave, and the fans may never forgive</b>":""}</p>
      <button class="abtn comm" onclick="quickRing(${modal.pid})" style="text-align:left"><b>Quick ring-around</b> — Reg finds bids NOW, but haste smells: ~10% lower offers</button>
      <button class="abtn" onclick="listPlayer(${modal.pid})" style="text-align:left"><b>Put him on the list</b> — offers arrive by inbox over coming matchdays. Better prices, no guarantees — and he'll know (confidence −4)</button>
      <button class="abtn ghost" onclick="modal=null;render()">Never mind</button>
    </div></div>`;
  }
  if(modal.type==="sell"){
    const p=byId(modal.pid);
    if(!p)return `<div class="overlay"><div class="sheet"><h2>He's gone</h2><p>That player has left the club.</p><button class="glowbtn" onclick="modal=null;render()">OK</button></div></div>`;
    return `<div class="overlay"><div class="sheet">
      <div class="kick">The market for ${p.name.split(" ")[1]}</div>
      <h2>${p.name}</h2>
      <p>${p.pos} · ${ovr(p)} ovr · age ${p.age} · valued ~${kfmt(p.value)}${p.traits.includes("localhero")?" · <b style='color:var(--comm)'>LOCAL HERO — the Shed End will not forgive easily</b>":""}</p>
      <div class="dlg"><div class="iav g">R</div><div class="bubble">${modal.line}</div></div>
      ${modal.buyers.filter(b=>!b.gone).map((b,bi)=>`<div class="card"><div class="rowline"><span>${b.club}</span><span class="amt num">${kfmt(b.bid)}</span></div>
        <div class="actions"><button class="abtn" onclick="sellAccept(${modal.buyers.indexOf(b)})">Accept</button>
        ${!b.pushed?`<button class="abtn comm" onclick="sellPush(${modal.buyers.indexOf(b)})">Push for more</button>`:""}</div></div>`).join("")}
      <button class="abtn ghost" onclick="modal=null;render()">Keep him</button>
    </div></div>`;
  }
  if(modal.type==="ownerNego"){
    const o=G.owners[modal.i];
    return `<div class="overlay"><div class="sheet">
      <div class="kick">Buyout talks · round ${Math.min(modal.round+1,3)}/3</div>
      <h2>${o.n}</h2>
      <p>${o.role} · holds <b>${o.share}%</b> · fair value ~${kfmt(modal.fair)} — but it's his life's work, and life's work carries a premium well above the ledger.</p>
      <div class="dlg"><div class="iav">CO</div><div class="bubble">${modal.line}</div></div>
      <div class="why">${modal.why}</div>
      <div class="why" style="border-left-color:rgba(224,90,74,.5);background:rgba(224,90,74,.07)">Three rounds. Walk away empty-handed — or insult him — and he won't take a meeting until <b>season ${G.season+BAL.owners.lockSeasons}</b>.</div>
      <div class="stepper">
        <button onclick="modal.offer=Math.max(5000,modal.offer-25000);render()" title="−${kfmt(25000)}">‹‹</button>
        <button onclick="modal.offer=Math.max(5000,modal.offer-5000);render()" title="−${kfmt(5000)}">‹</button>
        <span class="val num">${kfmt(modal.offer)}</span>
        <button onclick="modal.offer+=5000;render()" title="+${kfmt(5000)}">›</button>
        <button onclick="modal.offer+=25000;render()" title="+${kfmt(25000)}">››</button></div>
      <div class="kick" style="text-align:center;margin-top:6px;font-size:9px">‹ › = £5,000 · ‹‹ ›› = £25,000</div>
      <button class="glowbtn" onclick="ownerNegoSubmit()">Offer ${kfmt(modal.offer)}</button>
      <button class="abtn ghost" onclick="modal=null;render()">Another day</button>
    </div></div>`;
  }
  if(modal.type==="facConfirm"){
    const f=FACS[modal.key];const d=FAC_DETAIL[modal.key];

        <div class="rowline"><span>Build time</span><span class="num">${d.md} matchday${d.md>1?"s":""}</span></div></div>

      <button class="glowbtn" onclick="facConfirm()">Build it · ${kfmt(f.cost)}</button>
      <button class="abtn ghost" onclick="modal=null;render()">Think it over</button>
    </div></div>`;
  }
  if(modal.type==="sponsorOffer"){
    const d=G.sponsorDue;
    if(!d)return "";
    const card=(o,i)=>`<div class="card">
      <div class="rowline"><span><b>${o.n}</b> <small>· ${o.seasonsLeft} season${o.seasonsLeft===1?"":"s"}</small></span><span class="amt num">${kfmt(o.per)}/MD</span></div>

      <div class="rowline" style="border-bottom:none"><span>Worth over the whole deal</span><span class="amt num">~${kfmt(o.per*G.rounds*o.seasonsLeft)}</span></div>
      <button class="abtn${i?" comm":""}" onclick="sponsorPick(${i})">Shake on it · ${kfmt(o.per)}/MD</button></div>`;
    return `<div class="overlay"><div class="sheet">
      <div class="kick">Commercial department${d.renewal?" · the deal is up":""}</div>
      <h2>${d.renewal?"Two offers on the table":"Your first sponsor"}</h2>
      <p>${d.renewal
        ?"The old deal expires tonight. Two envelopes came in — one safe and long, one rich and conditional."
        :"The shirt is naked, chairman, and the commercial department has finally found two people willing to change that."}</p>
      ${card(d.offers[0],0)}${card(d.offers[1],1)}
      <button class="abtn ghost" onclick="sponsorLater()">Decide later — leave it in my inbox</button>
    </div></div>`;
  }
  if(modal.type==="player"){
    const ix=modal.pid,p=byId(ix);
    if(!p)return `<div class="overlay"><div class="sheet"><h2>He's gone</h2>
      <p>That player has left the club. The noticeboard is out of date again.</p>
      <button class="glowbtn" onclick="modal=null;render()">OK</button></div></div>`;
    const isCap=p.id===G.captain;
    const mentor=G.mentors.find(m=>m.vet===p.id||m.kid===p.id);
    const wo=windowOpen();
    const thin=G.squad.length<=13;
    const bar=(label,v)=>`<div class="rowline" style="border-bottom:none;padding-bottom:2px"><span>${label}</span><span class="amt num">${v}</span></div>
      <div class="bar" style="margin-top:0;margin-bottom:6px"><i style="width:${clamp(v,3,100)}%"></i></div>`;
    let acts="";
    if(p.age<28){
      acts+=`<div class="kick" style="margin-top:14px">Training focus <span style="font-size:9px;text-transform:none">· doubles down on one attribute every summer</span></div>
        <div class="modes" style="margin-top:8px">${["att","def","phy"].map(f=>
          `<button class="${p.focus===f?'on':''}" onclick="setFocus(${ix},'${f}')">${f.toUpperCase()}</button>`).join("")}</div>`;
    }
    const act=(cls,dis,click,html)=>`<button class="abtn ${cls}" style="text-align:left${dis?";opacity:.45":""}" ${dis?"disabled":""} onclick="${click}">${html}</button>`;
    acts+=`<div class="kick" style="margin-top:16px">The chairman's options</div>`;
    acts+=act("",G.talkCooldown>0,`openChat(${ix})`,
      `<b>💬 Bring him into the office</b> — ${G.talkCooldown>0?"the door's busy for "+G.talkCooldown+" more matchday"+(G.talkCooldown===1?"":"s"):"praise him, give him the hairdryer, or promise him football"}`);
    if(p.years<=1){
      acts+=act("comm",false,`startRenewal(${ix})`,
        `<b>✍ Open renewal talks</b> — final year: sign him or he walks for nothing next summer`);
    }
    if(p.age>=28){
      acts+=act("",false,`setMentor(${ix})`,
        `<b>Make him a mentor</b> — ${mentor&&mentor.vet===p.id?"currently guiding "+surnameOf(mentor.kid):"he takes a young "+p.pos+" under his wing"}`);
    }
    if(!isCap){
      acts+=act("",G.captSuggested,`suggestCaptain(${ix})`,
        `<b>© Suggest as captain</b> — ${G.captSuggested?"you've had your say on the armband this season":"the gaffer decides, but he'll hear you out once a season"}`);
    }
    acts+=act("",!wo||thin,`openSellSheet(${ix})`,
      `<b>Find buyers…</b> — ${!wo?"the window is shut":thin?"squad too thin, the gaffer blocks the door":"a quick ring-around, or the transfer list"}`);
    acts+=`<button class="abtn ghost" onclick="modal=null;render()">Close</button>`;
    return `<div class="overlay"><div class="sheet">
      <div class="kick">${p.pos} · promised ${ROLES[p.role||"rot"].n.toLowerCase()} football${isCap?" · club captain":""}</div>
      <h2>${p.name}</h2>
      <p>Age ${p.age} · <b>${ovr(p)} ovr</b> · valued ~${kfmt(p.value)}${p.from?" · from "+p.from:""}
        ${p.traits.length?"<br>"+p.traits.map(t=>TRAITS[t]).join(" · "):""}</p>
      ${p.inj||p.susp||p.listed?`<div class="why" style="border-left-color:rgba(224,90,74,.5);background:rgba(224,90,74,.08)">
        ${p.inj?`<b>Injured</b> — out for ${p.inj} more matchday${p.inj===1?"":"s"}. `:""}${p.susp?"<b>Suspended</b> — misses the next matchday. ":""}${p.listed?"<b>On the transfer list</b> — offers arrive by inbox while the window is open.":""}</div>`:""}
      <div class="card">
        ${bar("Attack",p.att)}${bar("Defence",p.def)}${bar("Physical",p.phy)}
        <div class="rowline"><span>Confidence</span><span class="amt num">${Math.round(p.conf)}</span></div>
        <div class="rowline"><span>Form</span><span class="amt">${p.form>1?"▲ rising":p.form<-1?"▼ falling":"– steady"}</span></div>
        <div class="rowline"><span>Legs</span><span class="amt">${
          {fresh:"fresh — ready to go again",used:"used — he's felt every one of them",flat:"flat — the gaffer needs cover"}[freshBand(p)]}</span></div></div>
      <div class="card">
        <div class="rowline"><span>Wage</span><span class="amt num">${kfmt(p.wage)}/w</span></div>
        <div class="rowline"><span>Contract</span><span class="amt num" style="${p.years<=1?"color:var(--comm)":""}">${p.years} year${p.years===1?"":"s"}${p.years<=1?" · final":""}</span></div>
        <div class="rowline"><span>This season</span><span class="num">${p.sapps} apps · ${p.sg} goals · ${p.smotm} motm</span></div>
        <div class="rowline"><span>For the club</span><span class="num">${p.capps} apps</span></div>
        ${mentor?`<div class="rowline"><span>${mentor.vet===p.id?"Mentoring":"Learning from"}</span><span class="amt">${nameOf(mentor.vet===p.id?mentor.kid:mentor.vet)}</span></div>`:""}</div>
      ${acts}
    </div></div>`;
  }
  if(modal.type==="chat"){
    const p=byId(modal.pid);
    if(!p)return `<div class="overlay"><div class="sheet"><h2>He's gone</h2><p>That player has left the club.</p><button class="glowbtn" onclick="modal=null;render()">OK</button></div></div>`;
    return `<div class="overlay"><div class="sheet">
      <div class="kick">The office · door closed</div>
      <h2>${p.name}</h2>
      <p>${p.pos} · conf ${Math.round(p.conf)} · form ${p.form>1?"rising":p.form<-1?"falling":"steady"} · ${p.traits.map(t=>TRAITS[t]).join(", ")||"no notable traits"}</p>
      <button class="abtn" onclick="doChat('praise')" style="text-align:left"><b>Praise him</b> — confidence up… unless he already knows he's good</button>
      <button class="abtn comm" onclick="doChat('hairdryer')" style="text-align:left"><b>The hairdryer</b> — lights a fire or breaks him. Depends on the man</button>
      <button class="abtn" onclick="doChat('promise')" style="text-align:left"><b>Promise him football</b> — instant lift, but deliver within 5 matchdays</button>
      <button class="abtn ghost" onclick="modal=null;render()">Leave it</button>
    </div></div>`;
  }
  if(modal.type==="info"){
    return `<div class="overlay"><div class="sheet"><h2>${modal.title}</h2><p>${modal.body}</p>
      <button class="glowbtn" onclick="modal=null;render()">OK</button></div></div>`;
  }
  return "";
}
function dlBuy(){
  if(G.balance<modal.bargain.value){modal.done.buy=true;addNews("TRANSFER","The deadline-day bargain slipped away — no funds.");render();return;}
  G.balance-=modal.bargain.value;G.squad.push(modal.bargain);modal.done.buy=true;
  addNews("TRANSFER",modal.bargain.name+" signs on deadline day. The fax machine is smoking.");render();
}
function dlSell(){
  if(G.squad.length<=13){modal.done.sell=true;addNews("TRANSFER","The gaffer physically blocked the fax machine. No sale — the squad is too thin.");render();return;}
  const dl=modal; // executeSale may overwrite modal on refusal
  const ok=executeSale(dl.best,pick(G.teams).name,dl.bid);
  dl.done.sell=true;modal=dl;
  if(!ok)addNews("TRANSFER","The deadline-day sale collapsed — the player refused to move. The fax machine cools.");
  render();
}

/* ---------- ticker runtime: two halves, HT choice, FT summary ---------- */
let tickTimer=null;
function openTicker(match,_){
  modal={type:"ticker",match,minute:0,gf:0,ga:0,skipped:false,usedSkip:false,half:1,ht:false,ft:false};
  render();
}
function tickerEventPool(){
  const M=modal.match;
  return modal.half===1?M.events:M.h2events;
}
function pushEv(e){
  const M=modal.match;
  if(e.goal==="me")modal.gf++;if(e.goal==="them")modal.ga++;
  const sc=document.getElementById("tsc");if(sc)sc.textContent=(M.home?modal.gf+"–"+modal.ga:modal.ga+"–"+modal.gf);
  const tev=document.getElementById("tev");
  if(tev)tev.insertAdjacentHTML("afterbegin",`<div class="e ${e.goal?'goal':''}"><span class="m num">${e.m}'</span><span class="${e.goal?'txt':''}">${e.txt}${e.sub?`<div style="font-size:11px;font-weight:500;color:var(--muted);text-transform:none;font-family:Inter;font-style:normal">${e.sub}</div>`:""}</span></div>`);
}
function runTicker(){
  const M=modal.match;
  if(G.quickMode&&!M.big){ // adaptive quick mode: instant for routine matches
    M.htDone=true;modal.half=2;
    [...M.events,...M.h2events].forEach(pushEv);
    showFT();return;
  }
  startTickLoop();
}
function startTickLoop(){
  const M=modal.match;
  const step=M.big?1000:750;
  let idx=0;
  clearInterval(tickTimer);
  tickTimer=setInterval(()=>{
    if(modal===null||modal.type!=="ticker"){clearInterval(tickTimer);return;}
    const pool=tickerEventPool();
    if(modal.skipped){
      while(idx<pool.length)pushEv(pool[idx++]);
      clearInterval(tickTimer);
      if(modal.half===1)showHT();else showFT();
      return;
    }
    modal.minute+=R(4,8);
    const capMin=modal.half===1?45:90;
    modal.minute=Math.min(modal.minute,capMin);
    const el=document.getElementById("tmin");if(el)el.textContent=modal.minute+"'";
    const bar=document.getElementById("tbar");if(bar)bar.style.width=Math.round(modal.minute/90*100)+"%";
    while(idx<pool.length&&pool[idx].m<=modal.minute)pushEv(pool[idx++]);
    // spent = nothing left that can still fire inside this half (belt and braces:
    // an event minute outside the half must never stall the clock)
    const spent=idx>=pool.length||pool[idx].m>capMin;
    if(modal.minute>=capMin&&spent){
      while(idx<pool.length)pushEv(pool[idx++]);
      clearInterval(tickTimer);
      if(modal.half===1)showHT();else showFT();
    }
  },step);
}
function showHT(){
  const M=modal.match;
  modal.ht=true;modal.skipped=false;
  const el=document.getElementById("tmin");if(el)el.textContent="HT";
  const burning=modal.gf<=modal.ga;
  const box=document.getElementById("tht");
  if(box){
    box.style.display="block";
    box.innerHTML=burning
      ?`<div class="kick" style="text-align:center;margin-bottom:8px">Half-time — the gaffer looks at you</div>
        <div style="display:flex;gap:8px">
        <button class="abtn" style="flex:1" onclick="tickHT('steady')">Steady on</button>
        <button class="abtn comm" style="flex:1" onclick="tickHT('fury')">Riv dem et nyt et</button></div>`
      :`<button class="abtn" style="width:100%" onclick="tickHT(null)">Second half ▸</button>`;
  }
  const sk=document.getElementById("tskip");if(sk)sk.style.display="none";
}
function tickHT(c){
  const M=modal.match;
  const box=document.getElementById("tht");if(box)box.style.display="none";
  const sk=document.getElementById("tskip");if(sk)sk.style.display="";
  if(c)htChoice(c);else{M.htDone=true;}
  modal.half=2;modal.minute=45;modal.ht=false;
  startTickLoop();
}
function resumeTicker(){/* htChoice already rebuilt h2events; loop restarts in tickHT */}
function showFT(){
  const M=modal.match;
  // playoffs cannot end level: golden-goal drama
  if(M.noDraw&&modal.gf===modal.ga){
    const s=myStrength();const t=G.teams[M.oppIdx-1];
    const winMe=Math.random()<0.5+((s.att-t.att)/60);
    const p=pick(xiList().filter(x=>x.pos==="FW"||x.pos==="MF"));
    if(winMe){M.h2.gf++;pushEv({m:"ET",goal:"me",scorerId:p.id,txt:"EXTRA TIME — "+p.name.split(" ")[1].toUpperCase()+"!!",sub:"The golden moment. Grown adults are crying into their pies."});}
    else{M.h2.ga++;pushEv({m:"ET",goal:"them",txt:"Extra time — "+M.opp+" break your hearts.",sub:"Football is a cruel sport played in the rain."});}
  }
  modal.ft=true;
  if(modal.usedSkip)G.skipStreak=(G.skipStreak||0)+1;else G.skipStreak=0;
  const res=finalizeMatch(M);
  G.formHist=G.formHist||[];
  if(!M.isPlayoff){G.formHist.push(res.gf>res.ga?"w":res.gf===res.ga?"d":"l");if(G.formHist.length>10)G.formHist.shift();}
  modal.res=res;
  const el=document.getElementById("tmin");if(el)el.textContent="FT";
  const bar=document.getElementById("tbar");if(bar)bar.style.width="100%";
  const sk=document.getElementById("tskip");if(sk)sk.style.display="none";
  const sum=document.getElementById("tsummary");
  if(sum){
    sum.style.display="block";
    sum.innerHTML=`
      <div class="card" style="margin-top:10px"><div class="kick">The gaffer's analysis</div>
        <div style="font-size:13px;line-height:1.5;margin-top:6px">${res.analysis}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:8px;font-style:italic">${res.quote}</div></div>
      <div class="card"><div class="rowline"><span>★ Man of the Match</span><span class="amt">${res.motm?res.motm.name+" · "+res.motm.rating:"—"}</span></div>
        <div class="rowline"><span>Shots</span><span class="num">${res.shots[0]} – ${res.shots[1]}</span></div>
        <div class="rowline"><span>Dominance</span><span class="num">${res.dom}%</span></div>
        ${(res.keyStats||[]).map(k=>`<div class="rowline"><span>${k.k}${k.hint?` <small>· ${k.hint}</small>`:""}</span><span class="num">${k.v}</span></div>`).join("")}
        ${res.home?`<div class="rowline"><span>Gate</span><span class="amt num">${kfmt(res.gate||0)}</span></div>`:""}</div>`;
  }
  const dn=document.getElementById("tdone");if(dn)dn.style.display="block";
}
function skipTicker(){if(modal&&modal.type==="ticker"){modal.skipped=true;modal.usedSkip=true;}}
function closeTicker(){
  clearInterval(tickTimer);
  const M=modal.match;const wasFT=modal.ft;
  modal=null;
  if(!wasFT){render();return;}
  if((G.skipStreak||0)>=3&&!G.quickOffered&&!G.quickMode){
    G.quickOffered=true;
    modal={type:"quickOffer"};render();return;
  }
  if(M.isPlayoff&&M.postKind){playoffPost(M,{gf:M.h1.gf+M.h2.gf,ga:M.h1.ga+M.h2.ga,opp:M.opp});return;}
  afterMatchday();
}

/* ---------- title screen (only when a career is waiting) ---------- */
let bootSave=null;
function renderTitle(){
  const d=bootSave;
  applyTheme(obData.hue,obData.mode);
  const divName=({3:"League Three",2:"League Two",1:"League One",0:"Premier Division"})[d.div]||"";
  app().innerHTML=`<div class="ob"><div class="box">
    <div style="text-align:center;margin-bottom:14px">${svgShield(initials(d.club||"AR"),true,52)}
    <div class="disp" style="font-size:30px;margin-top:8px">FOOTBALL TYCOON</div>
    <div class="kick" style="margin-top:4px">Club owner</div></div>
    <div class="letter"><div class="lh">THERE IS A CAREER IN PROGRESS</div>
      <b>${d.club||"Your club"}</b> — ${divName}, season ${d.season||1}. The kettle is still warm.</div>
    <button class="glowbtn" style="margin-top:16px" onclick="continueCareer()">Continue ▸</button>
    <button class="abtn ghost" onclick="newCareer()">Start a new career <small style="opacity:.7">— this deletes the one above</small></button>
  </div></div>`;
}
function continueCareer(){
  if(loadGame()){bootSave=null;resumePendingMatch();render();}
  else{bootSave=null;renderOnboarding();}
}
/* Pakke 20. Blev appen lukket midt i tickeren, ligger den afgjorte kamp i G.
   Den spilles ikke om -- den rulles videre fra begyndelsen med NOEJAGTIG samme
   maal, samme haendelser og samme runde i resten af divisionen. */
function resumePendingMatch(){
  if(!G||!G.pendingMatch)return false;
  const m=G.pendingMatch;
  if(!m.h1||!m.h2||!Array.isArray(m.events)){G.pendingMatch=null;return false;}
  openTicker(m,null);
  return true;
}
function newCareer(){
  deleteSave();bootSave=null;obStep=0;renderOnboarding();
}

/* ---------- onboarding ---------- */
const SWATCHES=[{h:85,n:"Grass green"},{h:0,n:"Blood red"},{h:210,n:"Navy"},{h:28,n:"Tangerine"},{h:275,n:"Violet"},{h:180,n:"Teal"},{h:330,n:"Fuchsia"},{h:48,n:"Gold"}];
function renderOnboarding(){
  applyTheme(obData.hue,obData.mode);
  let inner="";
  if(obStep===0){
    inner=`<div class="letter"><div class="lh">J. WHITMORE & SONS, SOLICITORS — EST. 1963</div>
      Dear Sir or Madam,<br><br>It is my duty to inform you that your late great-uncle Aldous has left you his entire estate: one (1) football club of the lower leagues, its debts, its groundskeeper — Reg conveys his regards — and a trophy cabinet described by the valuer as <b>"hauntingly empty."</b><br><br>The club requires a name and an owner. It appears, regrettably, to have found both.<br><br>Yours,<br>J. Whitmore</div>
      <input id="obname" type="text" value="${obData.name}" maxlength="24" placeholder="Name your club">
      <button class="glowbtn" style="margin-top:14px" onclick="obNext()">Sign the papers ▸</button>`;
  }
  if(obStep===1){
    const sw=SWATCHES.find(s=>s.h===obData.hue);
    inner=`<div class="letter"><div class="lh">CLUB COLOURS — STEP 2 OF 4</div>
      Every club bleeds a colour, chairman. Choose <b>${obData.name}</b>'s — and choose carefully, because the whole world takes it on.</div>
      <div class="swatches">${SWATCHES.map(s=>`<div class="sw ${obData.hue===s.h?'on':''}" style="background:linear-gradient(135deg,hsl(${s.h},88%,60%),hsl(${s.h},75%,42%))" onclick="obHue(${s.h})" title="${s.n}"></div>`).join("")}</div>
      <div class="obwhy"><b>${sw?sw.n:"Your colour"}.</b> Badge, shirt, seats, the banner in the Shed End — every screen in this club takes its accent from here. Cosmetic only: it changes nothing on the pitch.</div>
      <button class="glowbtn" style="margin-top:16px" onclick="obNext()">These are our colours ▸</button>`;
  }
  if(obStep===2){
    inner=`<div class="letter"><div class="lh">YOUR LIGHT — STEP 3 OF 4</div>
      Some of us live for evening kick-offs under the lamps. Some for Saturday, three o'clock, sun in your eyes. Which is yours?</div>
      <div class="modes" style="margin-top:14px;flex-direction:column">
        <button class="${obData.mode==='dark'?'on':''}" onclick="obMode('dark')">◗&nbsp; Floodlight — dark</button>
        <button class="${obData.mode==='light'?'on':''}" onclick="obMode('light')">☀&nbsp; Matchday — light</button></div>
      <div class="obwhy"><b>${obData.mode==='dark'?"Floodlight":"Matchday"}.</b> ${obData.mode==='dark'?"The club's own look — a dark ground with your colour glowing off it. Easier on the eyes on a late bus home.":"Bright and paper-white, like a printed programme. Easier to read in daylight on the terrace."} You can flip it any time with the button up in the corner.</div>
      <button class="glowbtn" style="margin-top:16px" onclick="obNext()">That's our light ▸</button>`;
  }
  if(obStep===3){
    const c=obData.coach||(obData.coach=pick(COACHES));
    inner=`<div class="letter"><div class="lh">THE GAFFER'S OFFICE — STEP 4 OF 4</div>
      <b>${c.n}</b> — your inherited head coach (${c.style} · TAC ${c.tac} · MAN ${c.man} · DEV ${c.dev}) — looks up from a cold tea:<br><br><i>"${c.line} Three things you should know, chairman:"</i></div>
      <div class="truth"><span class="n">1</span><span>The squad is <b>honest but limited</b>. Two of them are good. I won't say which two in front of the others.</span></div>
      <div class="truth"><span class="n">2</span><span>We have <b>no sponsor</b>, and the ground holds <b>1,500 souls</b> on a good day. Everything must be built. By you.</span></div>
      <div class="truth"><span class="n">3</span><span>The bank balance is <b>£150,000</b> — the inheritance, minus Whitmore's fee. Spend it like it's the last money on earth. It might be.</span></div>
      <div class="why" style="margin-top:12px"><b>One promise from us.</b> A match is saved the moment it is played. Close the app halfway through if you like — the result will be waiting for you, exactly as it was. This club is not one you can reload your way out of, and that is what makes it yours.</div>
      <button class="glowbtn" style="margin-top:16px" onclick="obFinish()">Take over the club ▸</button>`;
  }
  app().innerHTML=`<div class="ob"><div class="box">
    <div style="text-align:center;margin-bottom:14px">${svgShield(initials(obData.name),true,52)}
    <div class="disp" style="font-size:30px;margin-top:8px">${obStep===0?"FOOTBALL TYCOON":obData.name}</div>
    <div class="kick" style="margin-top:4px">${obStep===0?"A football story, from the bottom":"Owner-elect: you"}</div></div>
    ${inner}</div></div>`;
}
function obNext(){
  if(obStep===0){obData.name=safeName(document.getElementById("obname").value)||"Ashford Rovers";}
  obStep++;renderOnboarding();
}
function obHue(h){obData.hue=h;renderOnboarding();}
function obMode(m){obData.mode=m;renderOnboarding();}
function obFinish(){
  newGame(obData.name,obData.hue,obData.mode);
  G.coach={...obData.coach};
  applyTheme(G.hue,G.mode);
  screen="home";
  openBudgetMeeting(); // the first board meeting is part of taking over
}

/* ---------- boot ---------- */
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&G&&!modal&&screen==="home"&&G.phase==="season"&&G.md<G.rounds)playMatchday();
});
bootSave=readSave();
render();
</script>
