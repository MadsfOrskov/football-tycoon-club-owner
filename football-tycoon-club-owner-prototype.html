  /* Trust is time plus delivery. It is why a share costs ~1,9× fair in season 1
     and drifts toward ~1,25× for a chairman they have watched keep his word. */
  /* Pakke 19: dristigheden er indsatsen. Lovede du mere end de forventede, er
     baade belonningen og regningen stoerre -- det er dét, der goer
     forventningsmoedet til et valg og ikke et opslag. Presser du den ned, er
     der intet at vinde, og du slipper heller ikke billigere for at misse den:
     du lovede jo det lette. */
  {const O=BAL.owners,bold=Math.max(0,G.objectiveBold||0);
   const hit=pos<=G.objectivePos;
   bumpTrust(O.trustPerSeason+(hit?O.trustObjective+bold*O.objectiveStake:O.trustMissed-bold*O.objectiveStake)
     +(G.fundRaided?0:O.trustFundKept));}
  const promoted=o.promoted&&G.div>0;
  const relegated=!!o.relegated&&G.div<BAL.relegation.floorDiv&&!promoted;
  settleCommitments(promoted);   // before the summer wipes p.sg — goal bonuses need it
  if(promoted){
    G.div--;G.wageCap=Math.round(G.wageCap*BAL.wages.capOnPromotion/100)*100;
    reseedLeague();
    if(G.sponsor)G.sponsor.per=Math.round(G.sponsor.per*BAL.sponsor.onPromotion); // may be shirtless — that used to crash the run
    // the squad renegotiates too: a higher division costs more than the cap alone
    const before=G.squad.reduce((s,p)=>s+p.wage,0);
    for(const p of G.squad)p.wage=Math.round(p.wage*BAL.wages.promotionRise/10)*10;
    const after=G.squad.reduce((s,p)=>s+p.wage,0);
    msg("Ledger (bookkeeper)","L","Promotion has a price tag","Every agent rang on Monday morning. The same squad now costs "+kfmt(after)+"/w instead of "+kfmt(before)+"/w — that is what "+G.divNames[G.div]+" football pays. The cap moved to "+kfmt(G.wageCap)+".",null);
  }
  /* Pakke 16. Every consequence of going up, mirrored — and none of them
     exactly. The cap falls harder than the payroll does, so a relegated club
     walks into the new season carrying a wage bill it cannot pay: that gap IS
     the crisis, and trading out of it is the season's work. */
  else if(relegated){
    const wasDiv=G.divNames[G.div];
    G.div++;G.wageCap=Math.round(G.wageCap*BAL.wages.capOnRelegation/100)*100;
    reseedLeague();
    if(G.sponsor)G.sponsor.per=Math.round(G.sponsor.per*BAL.sponsor.onRelegation);
    bumpTrust(BAL.owners.trustRelegation);
    const before=G.squad.reduce((s,p)=>s+p.wage,0);
    for(const p of G.squad)p.wage=Math.round(p.wage*BAL.wages.relegationDrop/10)*10;
    const after=G.squad.reduce((s,p)=>s+p.wage,0);
    msg("Ledger (bookkeeper)","L","Relegation has a price tag too","Some contracts had a clause, most did not. The squad still costs "+kfmt(after)+"/w against "+kfmt(before)+"/w in "+wasDiv+" — on "+G.divNames[G.div]+" money, and against a cap of "+kfmt(G.wageCap)+". Sell, renegotiate, or drown, chairman.",null);
    addNews("CLUB","Relegated to "+G.divNames[G.div]+". The banner outside the Shed End has been taken down for repairs it does not need.");
  }
  /* Pakke 16/19: maalsaetningen hoerer til divisionen og forhandles paa ny hvert
     aar. EET sted saetter den -- her, lige efter divisionen kan have flyttet
     sig. Den stod ogsaa inde i baade oprykningens og nedrykningens gren, og to
     steder der haandhaever samme regel betyder at man kan slette det ene uden
     at noget fejler: sabotage-sweepet fandt netop det. Springer man
     budgetmoedet over, staar divisionens egen ramme -- ikke sidste aars aftale.
     Ligger foer sponsorRenewal(), som laeser objectivePos. */
  G.objectivePos=DIV_OBJECTIVE[G.div];G.objectiveBold=0;
  // the contract clock ticks — and Bosman waits for the careless
  const leavers=[];
  for(const p of G.squad){p.years=Math.max(0,(p.years||1)-1);}
  for(const p of [...G.squad]){
    if(p.years<=0&&G.squad.length>13){
      G.squad=G.squad.filter(x=>x!==p);
      const club=pick(G.teams).name;
      G.soldTo.push({name:p.name,club,pos:p.pos,ovr:ovr(p),bitter:true}); // leaving free always stings a little
      leavers.push(p.name.split(" ")[1]+" → "+club);
      detachPlayer(p);
    }
  }
  if(leavers.length)msg("Ledger (bookkeeper)","L","GONE FOR NOTHING","Contracts expired, no renewals signed: "+leavers.join(" · ")+". Value walked out the door with its boots under its arm.",null);
  // aging & development — matches played fuel young growth; focus doubles down
  applyMentors();
  for(const p of G.squad){
    p.age++;
    let dev;
    if(p.age<24){
      const playF=Math.min(1,p.sapps/12); // benched kids stall
      dev=Math.round((R(1,3)+(G.fac.training?1:0)+(G.coach.dev>=60?1:0))*(0.35+0.65*playF));
    }else dev=(p.age<30?R(-1,1):-R(1,3));
    p.att=clamp(p.att+dev,25,95);p.def=clamp(p.def+dev,25,95);
    p.phy=clamp(p.phy+(p.age>=30?-R(1,3):dev),25,95);
    if(p.focus&&p.age<28){p[p.focus]=clamp(p[p.focus]+(p.age<24?2:1),25,95);}
    p.value=Math.max(1000,Math.round((ovr(p)*ovr(p)*14*(p.age<24?1.3:p.age>30?0.6:1))/1000)*1000);
    p.form=0;p.sg=0;p.sapps=0;p.smotm=0;p.inj=0;p.susp=0;p.promiseMD=null;p.load=0; // a summer is a summer
    p.conf=clamp(p.conf*0.6+20,10,95); // confidence regresses toward the mean over summer
  }
  applyRetirements();
  /* Pakke 16. The dressing room reads the table too. Applied AFTER the summer's
     confidence regression (conf*0.6+20), not before — put it in the relegation
     branch above and the regression washes it straight back out, which is the
     kind of effect that measures as "built" and plays as nothing.
     The dreamer is the man who wants the move; the trait exists, is documented
     in the GDD as exactly this, and was used in two places. Now it is used
     where it means something. */
  if(relegated){
    for(const p of G.squad)p.conf=clamp(p.conf-BAL.relegation.confHit,10,95);
    const wantAway=G.squad.filter(p=>p.traits.includes("dreamer"));
    if(wantAway.length&&G.squad.length>13){
      const p=pick(wantAway);p.reqDone=true;
      msg(pick(AGENTS).n,"A","TRANSFER REQUEST: "+p.name.split(" ")[1],
        "\"My client signed for a "+G.divNames[G.div-1]+" club, chairman. He is very sorry about the relegation and very serious about leaving.\"",
        {kind:"transferReq",pid:p.id});
    }
  }
  G.captSuggested=false;G.talkCooldown=0;
  G.mentors=G.mentors.filter(m=>byId(m.vet)&&byId(m.kid));
  if(!G.captain||!byId(G.captain))pickCaptain();
  // sponsor expiry
  if(G.sponsor){G.sponsor.seasonsLeft--;if(G.sponsor.seasonsLeft<=0){G.sponsor=null;sponsorRenewal();}}
  G.season++;G.md=0;G.phase="season";
  G.me={pts:0,gd:0,pl:0};for(const t of G.teams){t.pts=0;t.gd=0;t.pl=0;}
  G.fixtures=makeFixtures();refreshMarket();
  G.scoutUsed=false;G.sponsorBoost=false;G.coachAsked=false;G.deadlineDone={};G.playoff=null;
  G.bids=[];G.callbacks=[];G.midwayDone=false;G.stuntDone=false;G.sponsorChecked=false;G.sponsorRiskMD=null;G.capRaiseUsed=false;G.fundRaided=false;G.lastXI=[];
  G.seasonTix.sold=0;G.jerseyFactor=1;
  G.revenge=null;   // last year's grudge died with last year's fixture list
  // the curve the boardroom reads: one point per season, kept for the career
  G.valHistory=(G.valHistory||[]).concat([{s:G.season-1,v:clubValuation()}]).slice(-30);
  modal={type:"seasonDone",txt,promoted,pos,prize,crown};
  saveGame();
  render();
}
function sponsorRenewal(){
  const first=pick(SPONSORS);
  const rest=SPONSORS.filter(s=>s.n!==first.n);          // never two identical cards
  const offers=[sponsorCopy(first),sponsorCopy(pick(rest.length?rest:SPONSORS))];
  offers[0].per=Math.round(offers[0].per*(1+(3-G.div)*BAL.sponsor.perDivision));offers[0].seasonsLeft=2;offers[0].demand=null;
  offers[1].per=Math.round(offers[1].per*(1+(3-G.div)*BAL.sponsor.perDivision)*1.35);offers[1].seasonsLeft=1;offers[1].demand="top "+Math.max(4,G.objectivePos-2)+" finish or "+pct(BAL.sponsor.penalty)+" penalty";
  // shown after the budget meeting, not buried in the inbox
  G.sponsorDue={offers,renewal:true};
}
function sponsorInbox(d){
  const [a,b]=d.offers;
  const line=o=>o.n+" · "+kfmt(o.per)+"/w · "+o.seasonsLeft+" season"+(o.seasonsLeft===1?"":"s")+(o.demand?" · demand: "+o.demand:", no strings");
  msg("Commercial dept.","£",d.renewal?"Sponsorship expires — two offers":"Your first sponsorship — two offers",
    (d.renewal?"You asked to think about it. ":"The club has NO main sponsor, and the shirt looks naked. ")+
    "A: "+line(a)+". B: "+line(b)+".",{kind:"sponsorChoice",offers:[a,b]});
}
function sponsorPick(i){
  const d=G.sponsorDue;if(!d)return;
  const o=d.offers[i],cont=modal?modal.after:null;
  G.sponsor=sponsorCopy(o);G.sponsorDue=null;
  addNews("CLUB","New sponsorship: "+o.n+" at "+kfmt(o.per)+"/w."+(o.demand?" Demand: "+o.demand+".":""));
  msg("Commercial dept.","£","Signed: "+o.n,"\""+(o.demand?"They want "+o.demand+" — read it twice, chairman.":"No strings, no small print, no surprises. Rare, that.")+"\" "+kfmt(o.per)+" lands every matchday.",null);
  modal=null;
  if(cont==="matchday")afterMatchday();else render();
}
function sponsorLater(){
  const d=G.sponsorDue;if(!d)return;
  const cont=modal?modal.after:null;
  sponsorInbox(d);G.sponsorDue=null;
  modal=null;
  if(cont==="matchday")afterMatchday();else render();
}

/* ---------- captain, office chats, mentors, retirement ---------- */
function pickCaptain(){
  const cands=[...G.squad].sort((a,b)=>((b.traits.includes("leader")?30:0)+b.age+ovr(b)/4)-((a.traits.includes("leader")?30:0)+a.age+ovr(a)/4));
  G.captain=cands[0]?cands[0].id:null;
  if(G.captain)addNews("CLUB",G.coach.n.split(" ")[0]+" hands the armband to "+nameOf(G.captain)+". \"My call. Always my call,\" he adds, looking at you.");
}
function suggestCaptain(id){
  if(G.captSuggested){modal={type:"info",title:"Once per season",body:"You've had your say on the armband this season. The gaffer's door is closed on the subject."};render();return;}
  const p=byId(id);if(!p)return;
  G.captSuggested=true;
  const accepts=p.traits.includes("leader")||ovr(p)>=Math.max(...G.squad.map(ovr))-2||Math.random()<0.3;
  if(accepts){
    const old=G.captain;G.captain=p.id;
    const oldP=byId(old);if(oldP)oldP.conf=clamp(oldP.conf-8,10,95);
    msg(G.coach.n.split(" ")[0]+" (gaffer)","GM","\"Fine. Your man gets the armband.\"","\""+p.name.split(" ")[1]+" it is. If this goes wrong, we both know whose idea it was.\""+(oldP?" "+oldP.name.split(" ")[1]+" took it about as well as expected.":""),null);
  }else{
    msg(G.coach.n.split(" ")[0]+" (gaffer)","GM","\"No.\"","\"I hear you on "+p.name.split(" ")[1]+". The answer is no. "+(G.captain?surnameOf(G.captain)+" keeps the armband — he's earned the dressing room, not the highlight reel.":"I'll pick my own captain.")+"\"",null);
  }
  render();
}
function openChat(id){
  if(!byId(id))return;
  if(G.talkCooldown>0){modal={type:"info",title:"The office is busy",body:"One conversation per few matchdays — these things need weight. Next chat available in "+G.talkCooldown+" MD."};render();return;}
  modal={type:"chat",pid:id};render();
}
function doChat(kind){
  const p=byId(modal.pid);if(!p){modal=null;render();return;}
  G.talkCooldown=4;
  let out="";
  if(kind==="praise"){
    if(p.conf>75){out="He nodded politely. He KNOWS he's playing well — the praise bounced off. (No effect.)";}
    else{p.conf=clamp(p.conf+6,10,95);out=p.name.split(" ")[1]+" left the office a foot taller. (Confidence +6)";}
  }
  if(kind==="hairdryer"){
    if(p.traits.includes("leader")||p.traits.includes("grafter")){p.conf=clamp(p.conf+8,10,95);out="He took it on the chin and ASKED FOR MORE. That's why he is what he is. (Confidence +8)";}
    else if(p.traits.includes("whinger")||p.traits.includes("glass")){p.conf=clamp(p.conf-8,10,95);out="His lip trembled. The hairdryer was too much for him. (Confidence −8)";}
    else if(Math.random()<0.5){p.conf=clamp(p.conf+6,10,95);out="It lit a fire. He trained like a man possessed. (Confidence +6)";}
    else{p.conf=clamp(p.conf-6,10,95);out="It backfired. He sulked through training. (Confidence −6)";}
  }
  if(kind==="promise"){
    p.conf=clamp(p.conf+5,10,95);p.promiseMD=G.md;p.appsAtPromise=p.sapps;
    out="\"You'll get your football.\" He believes you. Deliver within "+BAL.clock.promiseMD+" matchdays — or his agent calls. (Confidence +5)";
  }
  modal={type:"info",title:"The office door closes",body:out};render();
}
function setMentor(id){
  const vet=byId(id);if(!vet)return;
  const kids=G.squad.filter(p=>p.age<22&&p.pos===vet.pos&&p.id!==vet.id);
  if(!kids.length){modal={type:"info",title:"No apprentice",body:"No under-22 "+vet.pos+" in the squad for "+vet.name.split(" ")[1]+" to take under his wing."};render();return;}
  if(G.mentors.length>=2&&!G.mentors.find(m=>m.vet===vet.id)){modal={type:"info",title:"Two pairs max",body:"The gaffer allows two mentor pairs. More and it becomes a crèche."};render();return;}
  const kid=kids.sort((a,b)=>ovr(b)-ovr(a))[0];
  G.mentors=G.mentors.filter(m=>m.vet!==vet.id);
  G.mentors.push({vet:vet.id,kid:kid.id});
  addNews("CLUB",vet.name.split(" ")[1]+" takes "+kid.name.split(" ")[1]+" under his wing. They stay out an hour after training. The kid carries the cones. It's tradition.");
  render();
}
function applyMentors(){
  for(const m of G.mentors){
    const vet=byId(m.vet),kid=byId(m.kid);
    if(!vet||!kid)continue;
    kid.att=clamp(kid.att+1,25,95);kid.def=clamp(kid.def+1,25,95);
    if(vet.traits.length&&Math.random()<0.25&&!kid.traits.includes(vet.traits[0])){
      kid.traits.push(vet.traits[0]);
      addNews("CLUB",kid.name.split(" ")[1]+" has started to remind people of "+vet.name.split(" ")[1]+". "+(["leader","grafter","biggame"].includes(vet.traits[0])?"The good parts, thankfully.":"Not necessarily the good parts."));
    }
  }
}
function applyRetirements(){
  const retiring=G.squad.filter(p=>p.age>=35||(p.age>=34&&Math.random()<0.4));
  for(const p of retiring){
    if(G.squad.length<=13)break;
    G.squad=G.squad.filter(x=>x!==p);
    const legend=p.capps>=50||p.smotm>=6;
    if(legend){
      G.coach.dev=Math.min(90,G.coach.dev+4);
      msg(p.name,"L","A legend hangs up his boots","\""+p.capps+" games for this club. I'm not leaving — the gaffer's given me the youth team. I'll teach them everything. Even the bad habits.\" (Coach DEV +4)",null);
      addNews("CLUB",p.name+" retires and joins the staff. The Shed End sings his name one last time. Then every Saturday after that.");
    }else{
      addNews("CLUB",p.name+" retires at "+p.age+". A quiet testimonial, a decent watch, and a season ticket for life.");
    }
    detachPlayer(p);
  }
}
/* ---------- budget & midway meetings, owners ---------- */
/* one formula, two callers: the live estimate in the budget wizard and the
   actual sale in budgetConfirm() must never drift apart */
function homeGames(){return Math.floor(G.rounds/2);}
function seasonTixFair(){return Math.max(20,Math.round(G.ticket*homeGames()*BAL.seasonTix.discount/5)*5);}
/* The old curve bottomed out at a floor of 0.2, so above ~£180 the number of
   holders STOPPED falling while cash = sold × price kept climbing for ever —
   free money, and the "turnstile money given up" line never shrank either.
   Demand now falls all the way to zero, so cash has a real peak and then
   collapses, and both figures move together. */
function seasonTixEstimate(price){
  const S=BAL.seasonTix,fair=seasonTixFair();
  const priceF=clamp(S.demandAt0-S.slope*(price/fair),0,S.demandCap);
  const reach=Math.min(G.capacity,townDemand());
  const sold=Math.max(0,Math.round(reach*S.share*priceF*(0.5+G.fanMood/150)));
  return {sold,cash:sold*price,fair};
}
/* Pakke 19. "The objective" ligger foer opsummeringen og ikke sidst, fordi
   opsummeringen skal kunne vise hvad man gik med til. Arbejdsordren sagde
   "femte trin"; den er femte i antal og fjerde i raekken, og det er den eneste
   afvigelse. */
const BUDGET_STEPS=["Season tickets","The kit","Stadium fund","The objective","The frame"];
/* Hvad medejerne SELV forventer. Skjult i foerste runde -- samme pokerprincip
   som kontraktforhandlingen, hvor modpartens krav ikke er synligt foer man har
   budt. Helt uden terning: aabner man moedet igen, staar det samme tal der, saa
   man ikke kan rulle om paa en mild bestyrelse. */
function ownerDemandPos(){
  const O=BAL.owners,rows=G.teams.length+1;
  let d=DIV_OBJECTIVE[G.div];
  /* Personligheden. Slagteren er ambitioes paa klubbens vegne, sagfoereren er
     forsigtig, tertemagasinet er ligeglad -- vaegtet med deres ejerandel, saa
     den stoerste aktionaer taler hoejest. */
  const tot=G.owners.reduce((s,o)=>s+o.share,0);
  if(tot>0){
    const push=G.owners.reduce((s,o)=>s+({butcher:-1,solicitor:1,"pie magnate":0}[o.role]||0)*o.share,0)/tot;
    d+=push;
  }
  // og humoeret: en glad by og en formand de stoler paa haever barren
  if(G.fanMood>=BAL.text.happyAt)d-=O.objectiveMoodStep;
  if(trustLevel()>=O.objectiveTrustAt)d-=O.objectiveTrustStep;
  if(protestLevel()>=2)d+=O.objectiveMoodStep;
  return clamp(Math.round(d),2,rows-1);
}
function openBudgetMeeting(){
  modal={type:"budget",step:0,tixPrice:G.seasonTix.price,fundAdd:0,jersey:null,capAsked:false,capMsg:null,
    target:G.fundTarget?G.fundTarget.key:null,
    /* Forhandlingen starter fra DIVISIONENS ramme, ikke fra sidste saesons
       aftale. Ellers ratcher den: en dristig aftale saenker G.objectivePos,
       naeste moede starter derfra, og efter fem saesoner forhandler man om
       top 2 uden nogensinde at have besluttet det. Maalt paa foerste udgave:
       "forsigtig" forekom i NUL af 1.200 saesoner, fordi udgangspunktet altid
       allerede laa under medejernes eget tal. */
    objProposed:DIV_OBJECTIVE[G.div],objTheirs:null,objAgreed:null,objSaid:null};
  render();
}
/* Runde 1: du byder blindt. Er dit bud mindst lige saa ambitioest som deres
   (altsaa et LAVERE tal), gaar de med uden at afsloere noget. Er det mildere,
   laegger de deres eget tal paa bordet -- og saa er det dit valg om du tager
   det eller bliver staaende. */
function objectivePropose(){
  const m=modal;if(!m||m.objAgreed!==null)return;
  const theirs=ownerDemandPos();
  m.objTheirs=theirs;
  if(m.objProposed<=theirs){
    m.objAgreed=m.objProposed;
    m.objSaid=m.objProposed<theirs
      ? "\"Top "+m.objProposed+".\" Whitmore looks up from his pad. \"That is bolder than we had written down. Minuted, chairman -- and remembered.\""
      : "\"Top "+m.objProposed+". Agreed.\" Trencher nods once. He had the same figure underlined.";
  }else{
    m.objSaid="Whitmore turns his pad around. \"We had written top "+theirs+". You are asking us to expect less of you than we already do.\"";
  }
  render();
}
function objectiveSettle(takeTheirs){
  const m=modal;if(!m||m.objTheirs===null||m.objAgreed!==null)return;
  m.objAgreed=takeTheirs?m.objTheirs:m.objProposed;
  m.objSaid=takeTheirs
    ? "\"Top "+m.objTheirs+" it is.\" Trencher caps the pen for him. \"Now go and do it.\""
    : "\"Top "+m.objProposed+", then.\" Nobody says anything else. Whitmore writes it down slowly.";
  render();
}
function budgetNext(){modal.step=Math.min(BUDGET_STEPS.length-1,(modal.step||0)+1);render();}
function budgetBack(){modal.step=Math.max(0,(modal.step||0)-1);render();}
function budgetConfirm(){
  const m=modal;
  /* Pakke 19: maalsaetningen. Roerte spilleren aldrig trinnet, staar den som
     divisionen satte den, og dristigheden er nul -- ingen aftale, ingen indsats. */
  if(m.objAgreed!==null&&m.objTheirs!==null){
    G.objectivePos=m.objAgreed;
    G.objectiveBold=m.objTheirs-m.objAgreed;
    const b=G.objectiveBold;
    addNews("CLUB","Season objective agreed: top "+G.objectivePos+"."+(b>0?" The boardroom wanted less. You did not.":b<0?" The boardroom wanted more.":""));
  }else G.objectiveBold=0;
  // season tickets sell
  G.seasonTix.price=m.tixPrice;
  const est=seasonTixEstimate(m.tixPrice);
  G.seasonTix.sold=est.sold;
  const tixCash=est.cash;
  G.balance+=tixCash;
  // fund + project
  G.fund+=m.fundAdd;G.balance-=m.fundAdd;
  if(m.target&&G.stands[m.target]<2){
    const lvl=G.stands[m.target]+1;
    G.fundTarget={key:m.target,lvl,cost:STANDCOST[lvl]};
    addNews("FANS","Rumour in the town: surveyors seen at "+STANDS[m.target].n+". The Shed End is cautiously excited. Everything they do is cautious.");
  }
  // jersey verdict
  const j=m.jersey||"classic";
  const verdicts={classic:[1.0,"The classic. The fans nod solemnly. Correct."],modern:[Math.random()<0.6?1.2:0.9,"The modern look divides the pub, then sells."],wild:[Math.random()<0.4?1.35:0.8,"The wild one. Either iconic or a war crime. Time will tell."]};
  G.jerseyFactor=verdicts[j][0];G.jerseyName=j;
  addNews("CLUB","New "+j+" kit revealed. "+verdicts[j][1]);
  msg("Ledger (bookkeeper)","L","Season tickets: "+G.seasonTix.sold.toLocaleString("en-GB")+" sold","+"+kfmt(tixCash)+" in the bank before a ball is kicked. "+(G.seasonTix.sold>G.capacity*0.3?"The town believes.":"Room to grow, chairman."),null);
  // the shirt deal is the last item on the agenda — never buried in the inbox
  if(G.sponsorDue){modal={type:"sponsorOffer",after:"budget"};render();return;}
  modal=null;render();
}
function askCapRaise(){
  const m=modal;

/* Buying the boardroom out is meant to be a long game, not a shopping trip:
   they want to see a direction first, they price a life's work well above fair
   value, only one of them leaves in any season, and a failed talk shuts the
   door for two. */
/* The season-3 wall is gone (pakke 4). What stopped an early buyout was never
   a rule they'd have stated out loud — it was that they had no reason to sell
   to a stranger. That is now a price, not a locked door. */
function ownerGate(o){
  if(G.ownerBoughtSeason===G.season)return {title:"One a season",
    body:"You already bought somebody out this season. \"The boardroom needs time to get used to the empty chair,\" says Whitmore. \"And frankly, so do our accountants.\""};
  if(o.lockedUntil&&G.season<o.lockedUntil)return {title:"\"We're still not talking.\"",
    body:o.n.split(" ")[0]+" hasn't forgotten how the last conversation ended. The door stays shut until season "+o.lockedUntil+"."};
  return null;
}
/* pris = værdi × andel% × grundpræmie(personlighed) × tillid × retning.
   No wall, a curve — and one that tells a story instead of saying no. */
function ownerPremium(o){
  const O=BAL.owners;
  const t=trustLevel()/100;
  const base=O.premiumHigh-(O.premiumHigh-O.premiumLow)*t;
  const role={butcher:O.roleButcher,solicitor:O.roleSolicitor,"pie magnate":O.rolePie}[o.role]||1;
  const dir=1+valDirection()*BAL.val.dirWeight;    // rising club = they see the upside
  const mood=G.fanMood>70?1-O.moodDiscount:1;
  /* Pakke 19. Pressede du maalsaetningen ned, noterede de det. De saelger ikke
     billigt til en formand der selv har skrevet ned at klubben ikke skal noget. */
  const timid=1+Math.max(0,-(G.objectiveBold||0))*O.objectiveTimid;
  // bounded at BOTH ends: a fast-rising club with a wary board could otherwise
  // ask 2,7x, which stops being a negotiation and becomes a wall again
  return clamp(base*role*dir*mood*timid,O.premiumFloor,O.premiumCap);
}
function ownerWhy(o,prem,dir){
  const t=trustLevel();
  const trustTxt=t<30?"They have barely met you."
    :t<60?"They are starting to believe you mean it."
    :t<85?"You have earned the benefit of the doubt in that boardroom."
    :"After all this, they'd take your word on a handshake.";
  const dirTxt=dir>0.04?"The club is worth more than it was — they can see the upside as clearly as you can, and it is in the price."
    :dir<-0.04?"The value is going the wrong way, and they know it. That is the one thing working in your favour."
    :"The value has held steady since last summer.";
  return trustTxt+" "+dirTxt+" Their asking premium: <b>"+prem.toFixed(2)+"×</b> fair value.";
}
function buyOutOwner(i){
  const o=G.owners[i];
  const gate=ownerGate(o);
  if(gate){modal={type:"info",title:gate.title,body:gate.body};render();return;}
  const fair=Math.round(clubValuation()*o.share/100/1000)*1000;
  const O=BAL.owners,prem=ownerPremium(o);
  const min=Math.max(1000,Math.round(fair*prem/1000)*1000);
  const dir=valDirection();
  modal={type:"ownerNego",i,round:0,fair,min,prem:Math.round(prem*100)/100,dir:Math.round(dir*100),
    offer:Math.max(1000,Math.round(fair*prem*O.openMult/1000)*1000),
    ask:Math.round(fair*prem*O.askMult/1000)*1000,
    line:{"butcher":"\"Twenty-four percent of this club is forty years of Saturdays, chairman. It has a price. It isn't small.\"",
          "solicitor":"\"Everything is for sale, dear boy. The question, as ever, is the consideration.\"",
          "pie magnate":"\"My share? You couldn't afford my pie recipe. But make me an offer.\""}[o.role]||"\"Make me an offer.\"",
    why:ownerWhy(o,prem,dir)};
  render();
}
function ownerNegoSubmit(){
  const m=modal;const o=G.owners[m.i];
  m.round++;
  if(m.offer>=m.min){
    if(G.balance<m.offer){modal={type:"info",title:"Agreed — and unaffordable",body:"You shook hands on "+kfmt(m.offer)+" and the bank said no. "+o.n.split(" ")[0]+" will dine out on this."};render();return;}
    G.balance-=m.offer;G.myShare+=o.share;
    G.ownerBoughtSeason=G.season;          // one empty chair per season
    const name=o.n,role=o.role,share=o.share;
    G.owners.splice(m.i,1);
    addNews("CLUB","You bought out "+name+" for "+kfmt(m.offer)+". Your stake: "+G.myShare+"%.");
    if(G.myShare>=100){
      msg("The club","AR","THE CLUB IS YOURS. ALL OF IT.","100%. No wage cap. No co-owner letters. No one to blame. Just you, the ground, and the town. Congratulations, chairman — and good luck.",null);
      addNews("CLUB","Sole ownership. The wage cap is history. So are the excuses.");
    }else{
      msg(name,"CO","A dignified exit","\""+share+"% well sold. I'll be in the "+(role==="butcher"?"shop":"stand")+" on Saturdays regardless. Look after her.\"",null);
    }
    modal=null;render();return;
  }
  // only a genuinely insulting number kills it outright — a collapse costs two seasons
  if(m.round>=3||m.offer<m.min*BAL.owners.insultBelow){
    o.lockedUntil=G.season+BAL.owners.lockSeasons;
    modal={type:"info",title:"\"We're done here.\"",body:o.n.split(" ")[0]+" closes the folder. \"Not this season, chairman. Nor the next one.\" The door clicks politely, and stays shut until season "+o.lockedUntil+"."};render();return;
  }
  m.ask=Math.round(((m.min*1.08+m.offer)/2)/1000)*1000;
  m.line="\"Closer. But my number starts with "+kfmt(m.ask).slice(0,3)+"…\" (wants ~"+kfmt(m.ask)+")";
  render();
}
/* ---------- economy: bank ultimatum ---------- */
function openBankUltimatum(){
  // the bank raids the fund FIRST — no bonus, no ceremony
  if(G.fund>0){
    const amt=G.fund;
    G.balance+=amt;G.fund=0;G.fundBonus=0;G.fundTarget=null;
    msg("The bank","BK","The fund is gone","\"We found "+kfmt(amt)+" in something called a 'stadium fund'. It is now called 'debt repayment'. The earned bonus? Consider it a lesson.\"",null);
    addNews("CLUB","The bank drained the stadium fund. The new stand will have to wait. Everything will have to wait.");
    if(G.balance>=-60000){ // crisis (barely) averted by the savings
      if(G.md>=G.rounds){startPostSeason();return;}
      render();return;
    }
  }
  const canSell=G.squad.length>13;
  const canLoan=!G.loan;
  if(!canSell&&!canLoan){administration();return;}
  const best=[...G.squad].sort((a,b)=>b.value-a.value)[0];
  modal={type:"bank",best,canSell,canLoan};
  render();
}
function administration(){
  G.admins=(G.admins||0)+1;                 // a scar the valuation never forgets
  bumpTrust(BAL.owners.trustAdmin);
  G.me.pts=Math.max(0,G.me.pts-BAL.bank.adminPoints);
  for(const p of G.squad)p.wage=Math.round(p.wage*BAL.wages.adminCut/10)*10;
  G.fanMood=clamp(G.fanMood-10,5,100);
  G.balance+=BAL.bank.adminRelief; // creditors restructure
  msg("The administrators","AD","THE CLUB IS IN ADMINISTRATION",BAL.bank.adminPoints+" points deducted. All wages cut "+pct(1-BAL.wages.adminCut)+". The creditors have restructured the debt — one more collapse like this and the co-owners WILL force a sale. The kettle has been repossessed.",null);
  addNews("CLUB","Administration. −"+BAL.bank.adminPoints+" points. The town is furious, the pies are smaller, and it is all uphill from here.");
  if(G.md>=G.rounds){startPostSeason();return;}
  render();
}
function resolveBank(sell){
  const best=modal.best;
  const resume=G.md>=G.rounds; // season ended while bank was due
  if(sell){
    G.balance+=Math.round(best.value*0.85);
    G.squad=G.squad.filter(p=>p!==best);
    detachPlayer(best);
    if(!G.captain)pickCaptain();
    if(best.traits.includes("localhero")){G.fanMood=clamp(G.fanMood-14,5,100);bumpTrust(BAL.owners.trustFavourite);addNews("FANS","Selling a local hero to pay the bank. The Shed End is composing new songs. They are not kind songs.");}
    addNews("CLUB",best.name+" sold under duress for "+kfmt(Math.round(best.value*0.85))+". The bank manager sends a fruit basket.");
  }else{
    G.balance+=BAL.bank.loanCash;G.loan={perMD:BAL.bank.loanPerMD,left:BAL.bank.loanTerm};
    addNews("CLUB","Emergency loan taken: +"+kfmt(BAL.bank.loanCash)+" now, "+kfmt(BAL.bank.loanPerMD)+" per matchday for "+BAL.bank.loanTerm+" matchdays. The interest is 'sporting'.");
  }
  modal=null;
  if(resume){startPostSeason();return;}
  render();
}

/* ---------- deadline day ---------- */

/* ---------- inbox & messages ---------- */
/* The three replies to a formal bid are the only messages that hold a market
   player hostage (p.pendingBid hides the Quick/Offer buttons). Every route out
   of such a message — answered, expired, deleted, pushed off the end of the
   inbox — MUST release him again, or he is unbuyable for the rest of the game. */
const BID_KINDS=["bidAccepted","bidCounter","bidWar"];
function clearPendingBid(pid){const ix=marketById(pid);if(ix>=0)G.market[ix].pendingBid=false;}
function releaseMsg(m){
  if(m&&m.action&&!m.done&&BID_KINDS.includes(m.action.kind))clearPendingBid(m.action.pid);
}
function msg(from,av,title,body,action){
  if(action&&BID_KINDS.includes(action.kind))action.expires=G.md+BAL.bids.replyMD;
  G.inbox.unshift({id:G.msgId++,from,av,title,body,action,unread:true,done:false});
  if(G.inbox.length>18)releaseMsg(G.inbox.pop());
}
/* A bid you never answered is a bid the selling club stops waiting for. This
   both un-sticks the player and gives the bidding war the hurry it needs. */
function expireMessages(){
  for(const m of G.inbox){
    if(m.done||!m.action||!m.action.expires||G.md<m.action.expires)continue;
    releaseMsg(m);m.done=true;m.unread=false;
    m.body=m.action.kind==="bidWar"
      ? "You slept on it. He signed for them this morning — the photos are already up."
      : "No answer came, so they went with someone else. \"We did try,\" says the secretary, filing the fax.";
  }
}
/* Belt and braces: any market player still flagged after the dust settles,
   with neither a bid in flight nor a live message about him, is set free. */
function sweepPendingBids(){
  for(const p of G.market){
    if(!p.pendingBid)continue;
    if(G.bids.some(b=>b.pid===p.id))continue;
    if(G.inbox.some(m=>!m.done&&m.action&&BID_KINDS.includes(m.action.kind)&&m.action.pid===p.id))continue;
    p.pendingBid=false;
  }
}
function addNews(tag,txt){G.news.unshift({tag,txt});if(G.news.length>10)G.news.pop();}
function unreadCount(){return G.inbox.filter(m=>m.unread&&!m.done).length;}

/* ---------- negotiation: fee stage → contract stage ---------- */
let nego=null;
const ROLES={key:{n:"Key player",f:0.90},rot:{n:"Rotation",f:1.00},pro:{n:"Prospect",f:1.18}};
const YEARF={1:1.12,2:1.03,3:1.00,4:0.95};
function startBuyNego(ix,freeAgent,opts){
  opts=opts||{};
  const p=freeAgent?G.freeAgents[ix]:G.market[ix];
  const agent=pick(AGENTS);
  nego={p,agent,ix,freeAgent,round:0,cround:0,years:2,role:"rot",finalUsed:false,
        wageOffer:Math.round(p.wage*0.9/100)*100};
  if(freeAgent){
    nego.stage="contract";
    nego.line=pick(agent.open)+" No fee on this one — straight to personal terms.";
  }else{
    nego.stage="fee";
    const disc=opts.discount||1;
    const rush=opts.quick?1.07:1; // quick talks cost a premium
    nego.feeAsk=Math.round(p.value*1.15*disc/1000)*1000;
    nego.feeMin=Math.round(p.value*(0.98+Math.random()*0.12)*disc*rush/1000)*1000;
    nego.fee=Math.round(p.value*0.9/1000)*1000;
    nego.line=(opts.discount?"\"Alright, alright. He's still available — and the price has come DOWN. Don't tell him I said that.\"":pick(agent.open))+(opts.quick?" \"And chairman — quick deals cost quick money.\"":"");
  }
  modal={type:"nego"};render();
}
function startContractTalks(p,fee){
  nego={p,agent:pick(AGENTS),ix:-1,freeAgent:false,fromInbox:true,round:0,cround:0,years:2,role:"rot",finalUsed:false,
        wageOffer:Math.round(p.wage*0.9/100)*100,stage:"contract",agreedFee:fee,
        line:"\"The clubs have agreed "+kfmt(fee)+".\" Now the personal terms: years, wages — and what role you're promising him."};
  modal={type:"nego"};render();
}
/* ---------- formal bids (inbox track) ---------- */
function openFormalBid(ix){
  const p=G.market[ix];
  modal={type:"formalBid",p,amount:Math.round(p.value*0.95/1000)*1000};
  render();
}
function sendFormalBid(){
  const p=modal.p;
  p.pendingBid=true;
  G.bids.push({pid:p.id,amount:modal.amount,due:G.md+1});   // id, not a reference: survives a save
  msg("Club secretary","CS","Bid lodged: "+p.name.split(" ")[1],"A formal offer of "+kfmt(modal.amount)+" for "+p.name+" has been faxed. Answer expected after the next matchday. Other clubs can smell an auction, chairman.",null);
  modal=null;render();
}
function resolveBids(){
  expireMessages();
  const due=G.bids.filter(b=>b.due<=G.md);
  G.bids=G.bids.filter(b=>b.due>G.md);
  for(const b of due){
    const p=G.market[marketById(b.pid)];
    if(!p){continue;}
    const fmin=Math.round(p.value*(0.98+Math.random()*0.12)/1000)*1000;
    if(b.amount>=fmin){
      if(Math.random()<0.35){
        const club=pick(G.teams).name;const rbid=Math.round(b.amount*1.15/1000)*1000;
        msg(pick(AGENTS).n,"A","BIDDING WAR: "+p.name.split(" ")[1],club+" have matched you and bid "+kfmt(rbid)+". Beat it at "+kfmt(Math.round(rbid*1.05/1000)*1000)+" — or walk away and watch him go.",{kind:"bidWar",pid:p.id,raise:Math.round(rbid*1.05/1000)*1000,club});
      }else{
        msg("Club secretary","CS","Bid ACCEPTED: "+p.name.split(" ")[1],"They've accepted "+kfmt(b.amount)+". All that remains: personal terms with the player.",{kind:"bidAccepted",pid:p.id,fee:b.amount});
      }
    }else if(b.amount>=fmin*0.85){
      const ask=Math.round(fmin*1.06/1000)*1000;
      msg("Club secretary","CS","Counter-offer: "+p.name.split(" ")[1],"They rejected "+kfmt(b.amount)+" but will do "+kfmt(ask)+". Take it, or let it die.",{kind:"bidCounter",pid:p.id,ask});
    }else{
      p.pendingBid=false;
      msg("Club secretary","CS","Bid rejected: "+p.name.split(" ")[1],"\"Not even close,\" they said. There was laughter in the background.",null);
    }
  }
  // collapsed-deal callbacks
  const cbDue=G.callbacks.filter(c=>c.due<=G.md);
  G.callbacks=G.callbacks.filter(c=>c.due>G.md);
  for(const c of cbDue){
    if(Math.random()<0.6&&windowOpen()){
      c.p.pendingBid=false;
      if(!G.market.includes(c.p))G.market.unshift(c.p);
      msg(c.agentName,"A","He's back on the table: "+c.p.name.split(" ")[1],"\"Chairman. That deal that died? It can un-die. The club needs the money now — the price has dropped.\"",{kind:"callback",pid:c.p.id});
    }
  }
  sweepPendingBids();
}
/* Prices a hypothetical set of terms — lets the sheet show what each contract
   length and each promised role would cost, without a second formula to drift. */
function wageDemandFor(years,role){
  const n=nego;
  let power=1.05;
  if(!n.renewal&&playerAmbitious(n.p))power*=1.12; // stepping DOWN a level costs extra
  if(n.renewal){
    power=n.p.years<=1?1.25:1.08;                       // short contract = his leverage
    if(n.p.sg>=10||n.p.smotm>=4)power*=1.2;             // big season = bigger number
    if(n.p.age>=31)power*=0.85;                          // he knows the legs are going
  }
  return Math.round(n.p.wage*ROLES[role].f*YEARF[years]*power/100)*100;
}
function wageDemand(){return wageDemandFor(nego.years,nego.role);}
/* The poker rule (GDD): round one is blind. His number only becomes visible
   once he has countered — or immediately on a renewal, where he already knows
   exactly what he is worth to you. */
function demandVisible(){return !!nego.renewal||nego.cround>=1;}
function startRenewal(id){
  const p=byId(id);if(!p)return;
  if(G.md<p.renewLockMD){modal={type:"info",title:"\"Not yet.\"",body:"Talks with "+p.name.split(" ")[1]+" collapsed recently. Both sides agreed to revisit later — in "+(p.renewLockMD-G.md)+" matchdays."};render();return;}
  nego={p,agent:pick(AGENTS),ix:-1,freeAgent:true,renewal:true,round:0,cround:0,years:2,role:p.role||"rot",finalUsed:false,
        wageOffer:Math.round(p.wage/100)*100,stage:"contract",
        line:pick(AGENTS[0].open).split(".")[0]+". \"Renewal talks, is it? "+(p.years<=1?"He can walk for FREE next summer, chairman. We both know what that does to the number.":p.age>=31?"He's no spring chicken and he knows it. Be fair, he'll sign.":"He's happy here. Happy still has a price.")+"\""};
  modal={type:"nego"};render();
}
function roleRefused(){
  const n=nego;
  if(n.role==="pro"&&n.p.age>=26)return "\""+n.p.name.split(" ")[1]+" is "+n.p.age+". Calling him a PROSPECT is an insult. Try again.\"";
  if(n.role==="key"&&ovr(n.p)<48)return "\"Even HE knows he's not a key player. He blushed. Pick something honest.\"";
  return null;
}
function playerAmbitious(p){ // clearly above the club's level — and not a dreamer chasing the move
  if(p.traits.includes("dreamer"))return false;
  const top3=[...G.squad].sort((a,b)=>ovr(b)-ovr(a)).slice(0,3);
  const bar=top3.length?top3.reduce((s,x)=>s+ovr(x),0)/top3.length:50;
  return ovr(p)>=bar+4;
}
function negoSubmit(finalOffer){
  const n=nego;
  if(finalOffer)n.finalUsed=true;
  if(n.stage==="fee"){
    n.round++;
    const threshold=finalOffer?n.feeMin*0.94:n.feeMin;
    if(n.fee>=threshold){
      n.stage="contract";n.agreedFee=n.fee;
      n.line="\"The clubs have shaken hands at "+kfmt(n.fee)+".\" Now the personal terms: years, wages — and what role you're promising him.";
    }else if(finalOffer||n.round>=3||n.fee<n.feeMin*0.82){
      n.line=finalOffer?"\"Final offer? Then the answer is final too: no.\" *click*":pick(n.agent.walk);
      n.dead=true;
      negoCollapse();
    }else{
      n.feeAsk=Math.round(((n.feeMin*1.06+n.fee)/2)/1000)*1000;
      n.line=pick(n.agent.counter)+" (The club wants ~"+kfmt(n.feeAsk)+")";
    }
  }else{
    const refusal=roleRefused();
    if(refusal){n.line=refusal;render();return;}
    // the player can say no to YOU: above-level players demand to be THE man
    if(!n.renewal&&playerAmbitious(n.p)&&n.role!=="key"){
      n.line="\"Let's be honest, chairman: he'd be your best player. He knows it, you know it. It's KEY PLAYER and top wages — or he stays where the football is better.\"";
      render();return;
    }
    // wage cap check (co-owners) — does not consume a round.
    // On a RENEWAL he is already on the payroll: count the raise, not the whole wage twice.
    const wagesNow=G.squad.reduce((s,p)=>s+p.wage,0)-(n.renewal?n.p.wage:0);
    if(G.myShare<100&&wagesNow+n.wageOffer>G.wageCap){
      n.line="The co-owners clear their throats before the agent can speak: \"That contract busts the wage cap — "+kfmt(G.wageCap)+"/w for the whole squad. Sell, or aim lower.\"";
      render();return;
    }
    n.cround++;
    const demand=wageDemand();
    const threshold=finalOffer?Math.round(demand*0.91/100)*100:Math.round(demand*0.97/100)*100;
    if(n.wageOffer>=threshold){
      n.line=pick(n.agent.accept);n.doneDeal=true;
    }else if(finalOffer||n.cround>=3||n.wageOffer<demand*0.75){
      n.line=finalOffer?"\"Take it or leave it? He leaves it. Good day.\"":(n.renewal?"\"We'll talk again another time, chairman. The door stays open. Barely.\"":pick(n.agent.walk));
      n.dead=true;
      if(!n.renewal)negoCollapse();
    }else{
      n.line=pick(n.agent.counter)+" (On those terms he wants ~"+kfmt(demand)+"/w)";
    }
  }
  render();
}
/* ---------- deal structures (pakke 3) ----------
   G.commitments holds ONLY ids and primitives — no player references — so the
   state stays a tree across a save. `amt` means a different thing per kind, and
   deliberately so: one field, three settlements.
     fee   → this much per season, for seasonsLeft more seasons
     promo → this much, once, if you go up within seasonsLeft
     goals → this much per league goal he scores, settled each season end     */
function dealTerms(fee,plan,clause){
  const D=BAL.deal;
  const sur=plan>1?D.instFrom+(plan-2)*D.instStep:0;   // you pay for the liquidity
  const disc=clause==="promo"?D.promoDiscount:clause==="goals"?D.goalsDiscount:0;
  const total=Math.round(fee*(1+sur)*(1-disc));
  const perSeason=Math.round(total/plan/500)*500;
  return {
    sur,total,plan,clause,
    down:total-perSeason*(plan-1),                     // what leaves the bank today
    perSeason,
    promo:clause==="promo"?Math.round(fee*D.promoBonus/500)*500:0,
    perGoal:clause==="goals"?Math.max(500,Math.round(fee*D.goalsPer/500)*500):0
  };
}
function commitmentsOwed(){
  if(!Array.isArray(G.commitments))return 0;
  return G.commitments.reduce((s,c)=>s+(c.kind==="fee"?c.amt*c.seasonsLeft:c.kind==="promo"?c.amt:0),0);
}
/* commitmentsPerSeason() stod her og blev aldrig kaldt fra nogen steder --
   pakke 8's foerste fund med sin egen nye audit. Slettet frem for at blive ved
   med at blive rapporteret: commitmentsOwed() daekker det brugsmoenster der
   faktisk findes, og en ubrugt funktion der laeser `amt` uden at se paa `kind`
   er en faelde for den naeste der kalder den (amt betyder tre ting). */
function recordDeal(p,club,t){
  G.commitments=G.commitments||[];
  if(t.plan>1)G.commitments.push({pid:p.id,name:p.name,club,kind:"fee",amt:t.perSeason,seasonsLeft:t.plan-1});
  if(t.clause==="promo")G.commitments.push({pid:p.id,name:p.name,club,kind:"promo",amt:t.promo,seasonsLeft:BAL.deal.promoSeasons});
  if(t.clause==="goals")G.commitments.push({pid:p.id,name:p.name,club,kind:"goals",amt:t.perGoal,seasonsLeft:BAL.deal.goalsSeasons});
}
/* Settled at the season boundary — BEFORE the summer wipes p.sg, so a goal
   bonus is paid on the goals that were actually scored this season. */
function settleCommitments(promoted){
  if(!Array.isArray(G.commitments)||!G.commitments.length)return;
  let paid=0;const lines=[];
  for(const c of G.commitments){
    if(c.kind==="fee"){paid+=c.amt;c.seasonsLeft--;lines.push(c.club+" · instalment for "+c.name.split(" ")[1]+" "+kfmt(c.amt)+(c.seasonsLeft?" ("+c.seasonsLeft+" to go)":" (final)"));}
    else if(c.kind==="promo"){
      if(promoted){paid+=c.amt;c.seasonsLeft=0;lines.push(c.club+" · promotion clause on "+c.name.split(" ")[1]+" "+kfmt(c.amt)+" — you went up, they get paid");}
      else c.seasonsLeft--;
    }else if(c.kind==="goals"){
      const p=byId(c.pid),g=p?p.sg:0;
      if(g>0){paid+=c.amt*g;lines.push(c.club+" · "+g+" goal"+(g===1?"":"s")+" from "+c.name.split(" ")[1]+" at "+kfmt(c.amt)+" each = "+kfmt(c.amt*g));}
      c.seasonsLeft--;
    }
  }
  G.commitments=G.commitments.filter(c=>c.seasonsLeft>0);
  if(paid>0){
    G.balance-=paid;
    msg("Ledger (bookkeeper)","L","The bills you signed for last year","You owe "+kfmt(paid)+" tonight, and it has already gone: "+lines.join(" · ")+". Structures are borrowing from a version of yourself who is not in the room.",null);
  }
}

/* "Not today" is a real exit, not a non-event. Closing the sheet on a deal that
   began as a formal bid has to hand the player back to the market — otherwise
   he keeps the BID PENDING flag with no message left to answer. */
function negoAbort(){
  if(nego&&nego.p)nego.p.pendingBid=false;
  nego=null;modal=null;render();
}
function negoCollapse(){
  const n=nego;
  // inbox deals just die — but the bid flag has to die with them
  if(n.fromInbox){if(n.p)n.p.pendingBid=false;return;}
  if(n.freeAgent){G.freeAgents.splice(n.ix,1);return;}
  const p=G.market[n.ix];
  G.market.splice(n.ix,1);
  if(p&&n.stage==="fee"){ // afterlife: agent may call back cheaper
    G.callbacks.push({p,due:G.md+R(2,4),agentName:n.agent.n});
  }
}
function negoFinish(){
  const n=nego;
  if(n.doneDeal&&n.renewal){
    const p=n.p;
    p.wage=n.wageOffer;p.years=n.years;p.role=n.role;p.conf=clamp(p.conf+5,10,95);
    addNews("CLUB",p.name+" signs a new "+n.years+"-year deal at "+kfmt(n.wageOffer)+"/w. The pen barely touched the paper before the Shed End knew.");
    nego=null;modal=null;render();return;
  }
  if(n.dead&&n.renewal){
    n.p.renewLockMD=G.md+6;
    nego=null;modal=null;render();return;
  }
  if(n.doneDeal){
    const p=n.p;const fee=n.freeAgent?0:n.agreedFee;
    const t=fee?dealTerms(fee,n.payPlan||1,n.clause||null):null;
    const due=t?t.down:0;                 // structures move the bill, not the price
    if(G.balance<due){p.pendingBid=false;modal={type:"info",title:"Not enough funds",body:"The deal is agreed and you can't pay. Barry will dine out on this story for years."};nego=null;render();return;}
    G.balance-=due;
    if(t)recordDeal(p,p.from||"the selling club",t);
    p.wage=n.wageOffer;p.years=n.years;p.role=n.role;p.pendingBid=false;
    G.squad.push(p);
    if(n.freeAgent)G.freeAgents.splice(n.ix,1);
    else{const mi=G.market.indexOf(p);if(mi>=0)G.market.splice(mi,1);}
    const how=!t?"on a free":t.plan>1?kfmt(t.total)+" over "+t.plan+" seasons ("+kfmt(t.down)+" down)":"for "+kfmt(t.total);
    const clause=t&&t.clause==="promo"?" · "+kfmt(t.promo)+" more if you go up":t&&t.clause==="goals"?" · "+kfmt(t.perGoal)+" a goal":"";
    addNews("TRANSFER",p.name+" signs "+how+clause+" · "+n.years+"yr · "+kfmt(n.wageOffer)+"/w · promised "+ROLES[n.role].n.toLowerCase()+" football.");
  }
  nego=null;modal=null;render();
}

/* ---------- inbox actions ---------- */
function handleAction(m,choice){
  const a=m.action;
  if(a.kind==="sellOffer"){
    const p=byId(a.pid);
    if(!p){m.done=true;render();return;}
    if(choice==="accept"){
      if(G.squad.length<=13){m.done=true;m.body="The gaffer blocks the sale: \"I can't field eleven men and a cat. We asked the cat.\"";render();return;}
      m.done=true;
      if(!executeSale(p,a.club,a.bid)){m.body="He refused the move. The deal is dead — and the fans love him for it.";}
    }else if(choice==="demand"){
      if(Math.random()<0.5){a.bid=Math.round(a.bid*1.2/1000)*1000;m.body="They came back: "+kfmt(a.bid)+". Final offer, they say. They sound like they mean it.";}
      else{m.done=true;m.body="They walked away. Their agent muttered something about 'amateurs'.";addNews("TRANSFER",a.club+" withdraw their bid for "+p.name+".");}
      a.demanded=true;
    }else{m.done=true;m.body="Bid rejected. "+p.name.split(" ")[1]+" stays. The gaffer nods approvingly.";}
  }
  if(a.kind==="bidAccepted"){
    const p=G.market[marketById(a.pid)];
    if(!p){m.done=true;m.body="Too late — he's no longer available.";render();return;}
    // an accepted bid you cannot fund must still be answerable, or the player
    // stays flagged BID PENDING and the market row never comes back
    if(choice==="die"){p.pendingBid=false;m.done=true;m.body="You let the agreement lapse. The fee was there; the money wasn't.";render();return;}
    m.done=true;startContractTalks(p,a.fee);return;
  }
  if(a.kind==="bidCounter"){
    const p=G.market[marketById(a.pid)];
    if(!p){m.done=true;m.body="Too late — he's no longer available.";render();return;}
    if(choice==="accept"){m.done=true;startContractTalks(p,a.ask);return;}
    p.pendingBid=false;m.done=true;m.body="You let it die. The secretary files the fax under 'almost'.";
  }
  if(a.kind==="bidWar"){
    const p=G.market[marketById(a.pid)];
    if(!p){m.done=true;m.body="Too late — he's no longer available.";render();return;}
    if(choice==="raise"){m.done=true;startContractTalks(p,a.raise);return;}
    const mi=G.market.indexOf(p);if(mi>=0)G.market.splice(mi,1);
    m.done=true;m.body="You walked away. "+a.club+" got their man. The Shed End pretends not to care.";
    addNews("TRANSFER",p.name+" joins "+a.club+" after a bidding war you left. Probably wise. Probably.");
  }
  if(a.kind==="callback"){
    const ix=marketById(a.pid);
    if(ix<0){m.done=true;m.body="Gone again. He moves fast for a man his age.";render();return;}
    m.done=true;startBuyNego(ix,false,{discount:0.85});return;
  }
  if(a.kind==="transferReq"){
    const p=byId(a.pid);
    if(!p){m.done=true;render();return;}
    if(choice==="list"){p.listed=true;m.done=true;m.body="He's on the list. He trained beautifully today — funny, that.";}
    else{p.conf=clamp(p.conf-5,10,95);m.done=true;m.body="Request refused. He'll stay. His body will, anyway — the rest is negotiable.";}
  }
  if(a.kind==="stunt"){
    /* The outcome text used to be about mattresses, in a branch reached by any
       sponsor with a stunt. The message carries the sponsor's NAME and the
       wording is looked up in SPONSORS (a constant, never in G), so the second
       showman in the pool does not get the first one's props. */
    const sp=sponsorDef(a.who),st=sp&&sp.stunt,fee=BAL.sponsor.stuntFee;
    if(choice==="yes"){
      G.balance+=fee;m.done=true;
      if(Math.random()<0.35){G.fanMood=clamp(G.fanMood-4,5,100);
        m.body=(st?st.bad:"It happened. The clip is everywhere.")+" "+kfmt(fee)+" richer, slightly less dignified.";}
      else{G.fanMood=clamp(G.fanMood+2,5,100);
        m.body=(st?st.good:"Against all odds, the crowd loved it.")+" "+kfmt(fee)+", and nobody is embarrassed.";}
    }else{m.done=true;m.body=st&&st.no?st.no:"You declined. It was noted, and quietly respected.";}
  }
  if(a.kind==="sponsorChoice"){
    const o=choice==="A"?a.offers[0]:a.offers[1];
    G.sponsor=sponsorCopy(o);m.done=true;
    addNews("CLUB","New sponsorship: "+o.n+" at "+kfmt(o.per)+"/w."+(o.demand?" Demand: "+o.demand+".":""));
  }
  render();
}

/* ---------- scout & boosts (rewarded placeholders) ---------- */
function startScout(){modal={type:"rewarded",reward:"scout"};render();}
function sponsorBoost(){modal={type:"rewarded",reward:"sponsor"};render();}
function buildBoost(){modal={type:"rewarded",reward:"build"};render();}
function grantReward(kind){
  if(kind==="scout"){G.scoutUsed=true;G.scoutPending=BAL.clock.scoutMD;addNews("SCOUT","Reg has packed his flask and left on a mission. Report expected in "+BAL.clock.scoutMD+" matchdays.");}
  if(kind==="sponsor"){G.sponsorBoost=true;G.balance+=BAL.sponsor.boost;addNews("CLUB","Sponsor top-up: +"+kfmt(BAL.sponsor.boost)+". Their logo is now also on the corner flags.");}
  if(kind==="build"&&G.standBuild){G.standBuild.remain=Math.max(0,G.standBuild.remain-1);if(G.standBuild.remain===0)finishStand();addNews("CLUB","The builders found an extra crew. The stand grows visibly.");}
  modal=null;render();
}
function deliverScout(){
  const gem=genPlayer(pick(["DF","MF","FW"]),R(60,68),G_DIV_WAGE(G.div));
  gem.gem=true;gem.value=Math.round(gem.value*0.55/1000)*1000;
  G.market.unshift(gem);
  msg("Reg (scout)","R","Scout report: "+gem.name,"\"Best "+gem.pos+" I've seen since the war. Which war is unclear. He's on the market list, and he's CHEAP.\"",null);
}
function startStandBuild(key){ // direct cash build — the impatient way, no fund bonus
  if(G.standBuild){modal={type:"info",title:"One project at a time",body:"The builders refuse to split the crew. Union rules, apparently."};render();return;}
  const lvl=G.stands[key]+1;
  if(lvl>2){modal={type:"info",title:"Fully built",body:STANDS[key].n+" is already at its final glory."};render();return;}
  const cost=STANDCOST[lvl];
  if(G.balance<cost){modal={type:"info",title:"Not enough funds",body:"The builders want "+kfmt(cost)+" up front in cash. They've been burned by football clubs before. (Tip: fund it patiently via the budget meeting — patience earns up to "+pct(BAL.fund.bonusCap)+".)"};render();return;}
  G.balance-=cost;
  G.standBuild={key,remain:5,lvl};
  // betaler man kontant, er fondens plan for SAMME tribune overhalet
  if(G.fundTarget&&G.fundTarget.key===key)staleFundTarget();
  addNews("CLUB","Construction begins on "+STANDS[key].n+". The seagulls have been served notice.");
  render();
}
function withdrawFund(){
  if(G.fund<=0)return;
  const amt=G.fund;
  G.balance+=amt;G.fund=0;G.fundBonus=0;G.fundTarget=null;G.fundRaided=true;
  bumpTrust(BAL.owners.trustRaid);   // the fund was the one thing they asked you not to touch
  msg("The co-owners","CO","\"About the fund…\"","\"You raided the stadium fund. "+kfmt(amt)+" back in the kitty, every penny of earned bonus gone — and our confidence in the word 'plan' somewhat dented.\"",null);
  addNews("CLUB","The stadium fund was emptied. The surveyors have been sent home. Again.");
  render();
}
/* Et gyldigt fondsmaal peger paa NAESTE niveau for en tribune der ikke er
   maksimeret, og det niveau skal have en pris. Alle tre steder der laeser
   G.fundTarget bruger den samme regel, saa de ikke kan komme fra hinanden. */
function fundTargetValid(){
  const t=G.fundTarget;
  if(!t||!STANDS[t.key])return false;
  return G.stands[t.key]<2&&t.lvl===G.stands[t.key]+1&&Number.isFinite(STANDCOST[t.lvl]);
}
function staleFundTarget(){
  const t=G.fundTarget;G.fundTarget=null;
  if(t&&STANDS[t.key])msg("Site foreman","SF","The project has moved on",
    "The "+STANDS[t.key].n+" plan in the fund is out of date — that work is already done. The money stays in the fund; pick a new project at the next budget meeting.",null);
}
function finishStand(){
  const b=G.standBuild;
  G.stands[b.key]=b.lvl;recalcCapacity();
  msg("Site foreman","SF",STANDS[b.key].n.toUpperCase()+" IS OPEN","Capacity is now "+G.capacity.toLocaleString("en-GB")+". Cut the ribbon, chairman — and mind the wet paint.",null);
  G.fanMood=clamp(G.fanMood+BAL.mood.standOpens,5,100);
  /* Pakke 15b. The Main Stand's second role. Deliberately small: against
     trustAdmin −30 it is a nod, not a shortcut. Trust is still earned by
     conduct — this is the one board-facing thing you can BUILD. */
  if(b.key==="main"){
    bumpTrust(BAL.owners.trustMainStand);
    addNews("CLUB","The new Main Stand has a boardroom in it. The co-owners have opinions about the carpet, and rather warmer ones about you.");
  }
  G.standBuild=null;
}
const FAC_DETAIL={
 shop:{fx:[perHead(BAL.matchday.shop),"Merchandise income +"+pct(BAL.matchday.shopMerchBoost)],warn:null,md:2},
 pub:{fx:[perHead(BAL.matchday.pub),"Fan mood +"+BAL.mood.pubDrift+" every matchday, and +"+BAL.mood.pubOpens+" the day it opens"],warn:null,md:2},
 /* Was "(derby, cup, playoffs)". There is no cup and no derby; after pakke 5 the
    big afternoons are run-ins, top-of-the-table clashes, six-pointers, the
    return leg against whoever thrashed you — and playoffs. Naming competitions
    that do not exist is the same lie as a clause the code never reads. */
 screen:{fx:["+"+pct(BAL.matchday.bigScreenGate)+" gate in BIG matches — run-ins, six-pointers, top clashes, playoffs"],
   warn:"Does nothing on a wet Tuesday against mid-table. Roughly 3-5 games a season.",md:2},
 /* Was "Injury risk per match: 7% → 5%". Those are the BASE rates: real risk is
    the base times a tiredness multiplier, so a knackered squad is well above
    either figure — and the clinic ALSO blunts that multiplier, which the old
    text never mentioned at all. Both stated now. */
 clinic:{fx:["Base injury risk per match: "+pct(BAL.fresh.injBase)+" → "+pct(BAL.fresh.injClinic),
   "Tiredness multiplies that risk — the clinic cuts the multiplier to "+pct(BAL.fresh.clinicScale),
   "Injury length: −"+BAL.fresh.clinicInjDays+" matchday"],warn:"Tired legs are still the biggest risk. The clinic softens it; depth removes it.",md:2},
 /* Was "+1 extra per season", flat. The bonus sits inside the bracket that is
    scaled by games played, so a boy who never plays gets a third of it — and the
    training ground's second, unadvertised effect is on RECOVERY. */
 training:{fx:["Players under 24: +1 development a season, scaled by games played",
   "Freshness decays slower: "+BAL.fresh.decay.toFixed(2)+" → "+(BAL.fresh.decay+BAL.fresh.trainingRecovery).toFixed(2)+" a matchday"],
   warn:"Pays off over YEARS, not weeks. A boy who never plays gets a third of it.",md:3},
 basics:{fx:["Fan mood +"+BAL.mood.basicsOpens+" on opening",perHead(BAL.matchday.basics),
   "Town demand +"+pct(BAL.demand.basics)+" — a few more through the gate every week"],warn:null,md:1},
 vip:{fx:[kfmt(BAL.matchday.vipFlat)+" flat, every home game",
   "Requires the "+STANDS[FAC_REQ.vip.stand].n+" — the boxes hang off it"],
   warn:"The Shed End will call it the prawn sandwich brigade. Fan mood "+BAL.mood.vipOpens+" on opening.",md:2}
};
/* Pakke 15a. The VIP boxes paid their flat fee whether or not a Main Stand
   existed, but stadiumSvg() has always drawn them only when G.stands.main>=1 —
   the code and the picture disagreed, and the picture was right. The boxes hang
   off the main stand; there is nowhere else to put them. Making the requirement
   real also gives the Main Stand the first of its two roles: it unlocks the most
   lucrative facility in the game. */
function facBlockedBy(key){
  const need=FAC_REQ[key];
  if(!need||!G)return null;
  if(G.stands[need.stand]>=need.lvl)return null;
  return STANDS[need.stand].n;
}
function buildFac(key){
  const f=FACS[key];
  const blocker=facBlockedBy(key);
  if(blocker){modal={type:"info",title:"Nowhere to put them",
    body:f.n+" hang off the "+blocker+". Build that first — the boxes have to look out over something."};render();return;}
  if(G.fac[key]){modal={type:"info",title:"Already built",body:f.n+" is up and running."};render();return;}
  if(G.facBuild){modal={type:"info",title:"One small job at a time",body:"The local firm is on "+FACS[G.facBuild.key].n+". They don't split crews either."};render();return;}
  modal={type:"facConfirm",key};render();
}
function facConfirm(){
  const key=modal.key;const f=FACS[key];
  const blocker=facBlockedBy(key);
  if(blocker){modal={type:"info",title:"Nowhere to put them",body:f.n+" need the "+blocker+" first."};render();return;}
  if(G.balance<f.cost){modal={type:"info",title:"Not enough funds",body:f.n+" costs "+kfmt(f.cost)+"."};render();return;}
  G.balance-=f.cost;
  G.facBuild={key,remain:FAC_DETAIL[key].md};
  addNews("CLUB","Work begins on "+f.n+". Ready in "+FAC_DETAIL[key].md+" matchday"+(FAC_DETAIL[key].md>1?"s":"")+".");
  modal=null;render();
}
function finishFac(){
  const key=G.facBuild.key;
  G.fac[key]=1;G.facBuild=null;
  if(key==="vip")G.fanMood=clamp(G.fanMood+BAL.mood.vipOpens,5,100);
  if(key==="basics")G.fanMood=clamp(G.fanMood+BAL.mood.basicsOpens,5,100);
  if(key==="pub")G.fanMood=clamp(G.fanMood+BAL.mood.pubOpens,5,100);
  msg("Site foreman","SF",FACS[key].n.toUpperCase()+" IS OPEN",(key==="vip"?"The boxes gleam. The Shed End mutters about prawn sandwiches. The till doesn't care.":key==="basics"?"New loos. Genuine scenes of celebration in the queue.":"Doors open, town approves, money flows."),null);
}
/* ---------- bookkeeper & sponsor life ---------- */
function bookkeeperReport(){
  const net=G.periodNet;
  const img=net>=0?"I have enclosed a small drawing of a sunrise.":"I have enclosed a drawing of a sinking ship.";
  msg("Ledger (bookkeeper)","L","Monthly report: "+(net>=0?"+":"")+kfmt(net).replace("£",net>=0?"£":"−£").replace("−£−","−£"),
    "Net over the last "+BAL.clock.reportMD+" matchdays: "+(net>=0?"+":"")+kfmt(Math.abs(net))+". Biggest cost: wages ("+kfmt(G.squad.reduce((s,p)=>s+p.wage,0))+"/w). "+img,null);
  G.periodNet=0;G.periodMD=0;
}
function sponsorTarget(s){return parseInt((String(s.demand||"").match(/top (\d+)/)||[])[1]||8);}
/* The clause used to be pure theatre: the text promised 20%, the code never
   took a penny. Now it settles at season's end — which also gives you half a
   season after the MD 9 warning to climb out of it. */
function sponsorSettleDemand(pos){
  if(!G.sponsor||!G.sponsor.demand)return;
  const target=sponsorTarget(G.sponsor);
  if(pos<=target){
    msg(G.sponsor.n,G.sponsor.av,"Clause met — paid in full","\"Top "+target+", as written. A pleasure doing business, chairman. The invoice stands.\"",null);
    return;
  }
  const fine=Math.round(G.sponsor.per*G.rounds*BAL.sponsor.penalty);
  G.balance-=fine;
  msg(G.sponsor.n,G.sponsor.av,"The clause bites: −"+kfmt(fine),"\"The deal said top "+target+". You finished "+ord(pos)+". We are invoicing "+(BAL.sponsor.penalty*100)+"% of the season back — "+kfmt(fine)+". Read the small print next time, chairman.\"",null);
  addNews("CLUB",G.sponsor.n+" claw back "+kfmt(fine)+" after the top-"+target+" clause went unmet. An expensive way to learn to read.");
}
function sponsorLifeEvents(){
  if(!G.sponsor)return;
  // mid-season demand check
  if(G.md===9&&G.sponsor.demand&&!G.sponsorChecked){
    G.sponsorChecked=true;
    const pos=myPos(),target=sponsorTarget(G.sponsor);
    msg(G.sponsor.n,G.sponsor.av,"\"We're watching the table\"",pos<=target
      ?"\"Top "+target+", as agreed. Carry on, chairman — the boys at the brewery are pleased.\""
      :"\"The deal says top "+target+". You are "+ord(pos)+". We are not angry. We are disappointed. You have half a season to fix it before the clause bites.\"",null);
  }
  /* The collapse and the stunt used to be NAME CHECKS on two of the four
     sponsors. With ten in the pool that meant six of them were decoration, so
     both behaviours are fields on the sponsor now (`risk`, `stunt`) and any
     sponsor written with them behaves. Same code path, more characters. */
  /* Pakke 21a, QA's F8. R(8,20) blev trukket PAA NY hver kampdag. Laest som
     skrevet ligner det "en tilfaeldig kampdag mellem 8 og 20"; hvad det gjorde
     var et lotteri hver kampdag med 1/13 chance for at ramme, saa den effektive
     saesonsandsynlighed var ca. 0,64 x risk og ikke risk. Det virkede -- lige
     indtil nogen aendrede vinduet eller G.rounds, og vi har roert baade saeson-
     og divisionsstrukturen i nat. Dagen trakkes nu EN gang pr. saeson og ligger
     i G, saa den kan laeses, gemmes og efterproeves. */
  if(G.sponsorRiskMD===null||G.sponsorRiskMD===undefined)
    G.sponsorRiskMD=R(BAL.sponsor.riskFrom,BAL.sponsor.riskTo);
  if(G.sponsor.risk&&G.md===G.sponsorRiskMD&&Math.random()<G.sponsor.risk){
    msg(G.sponsor.n+" (liquidators)",G.sponsor.av,"SPONSOR COLLAPSE",G.sponsor.n+" has ceased to exist. So has your sponsorship income. The small print, chairman. The small print.",null);
    addNews("CLUB",G.sponsor.n+" implodes spectacularly. The shirt is naked again.");
    G.sponsor=null;G.sponsorOffered=false;
    return;
  }
  {const def=sponsorDef(G.sponsor.n);
   if(def&&def.stunt&&G.md===BAL.sponsor.stuntMD&&!G.stuntDone){
     G.stuntDone=true;
     msg(G.sponsor.n,G.sponsor.av,def.stunt.title,def.stunt.txt+" "+kfmt(BAL.sponsor.stuntFee)+".",{kind:"stunt",who:G.sponsor.n});
   }}
}

/* ---------- table ---------- */
function table(){
  const rows=[{i:0,n:G.club,...G.me}].concat(G.teams.map((t,ix)=>({i:ix+1,n:t.name,pts:t.pts,gd:t.gd,pl:t.pl})));
  rows.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||a.n.localeCompare(b.n));
  return rows;
}
function myPos(){return table().findIndex(r=>r.i===0)+1;}

const app=()=>document.getElementById("app");

function svgShield(txt,accent,size){

  return `<svg width="${size}" height="${size*1.13}" viewBox="0 0 46 52" style="filter:drop-shadow(0 5px 10px rgba(0,0,0,.4))">
   <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${accent?'var(--acc)':'#3A4450'}"/><stop offset="1" stop-color="${accent?'var(--acc2)':'#232B33'}"/></linearGradient></defs>
   <path d="M23 1 44 8v18c0 13-9 21-21 25C11 47 2 39 2 26V8z" fill="url(#${id})"/>
   <path d="M23 5 40 10.5V26c0 10.5-7.3 17.5-17 21C13.3 43.5 6 36.5 6 26V10.5z" fill="${accent?'var(--bg1)':'#10151B'}"/>
   <text x="23" y="33" text-anchor="middle" font-family="BarlowC" font-style="italic" font-weight="900" font-size="16" fill="${accent?'var(--acc)':'#8FA3BC'}">${txt}</text></svg>`;

function render(){
  if(!G){if(bootSave)renderTitle();else renderOnboarding();return;}
  let html=header()+'<div class="content">';
  if(screen==="home")html+=viewHome();
  if(screen==="inbox")html+=viewInbox();
  if(screen==="squad")html+=viewSquad();
  if(screen==="market")html+=viewMarket();
  if(screen==="club")html+=viewClub();
  if(screen==="table")html+=viewTable();
  html+='<div class="protonote">PROTOTYPE · AD-mærkede elementer er placeholders · karrieren gemmes automatisk på denne enhed</div></div>'+navbar();
  if(modal)html+=renderModal();
  // the whole app is one innerHTML swap, which throws the page back to the top.
  // Keep the reading position unless we deliberately changed screen.
  const y=document.documentElement.scrollTop||0;
  app().innerHTML=html;
  document.documentElement.scrollTop=keepScroll?y:0;
  keepScroll=true;
  if(modal&&modal.type==="ticker")runTicker();
}

function formDots(){

/* Every kind handleAction() understands MUST be drawable here. Half of them
   weren't, which made the whole formal-bid track a dead end you could not even
   back out of. The harness now fails if a live message renders no button. */
/* data-act er knappens IDENTITET og skal staa paa BEGGE varianter. Den spaerrede
   udgave har intet onclick, saa en audit der noegler paa onclick-maalet falder
   tilbage paa etiketten -- og etiketten indeholder beloebet ("Accept £56k"), saa
   hvert beloeb blev talt som sin egen knap der aldrig var set aktiv. Ved 200
   seeds gav det 13 falske "altid deaktiverede" knapper, alle sammen den samme
   indbakkeknap. */
function ibtn(id,choice,label,cls,blockedWhy){
  return blockedWhy
    ? `<button class="abtn ${cls}" data-act="actMsg:${choice}" disabled style="opacity:.4" title="${blockedWhy}">${label}</button>`
    : `<button class="abtn ${cls}" data-act="actMsg:${choice}" onclick="actMsg(${id},'${choice}')">${label}</button>`;
}
function shortWhy(amount){return G.balance<amount?"Only "+kfmt(Math.max(0,G.balance))+" in the account":null;}
function inboxActions(m){
  const a=m.action,id=m.id;
  switch(a.kind){
    case "sellOffer":return ibtn(id,"accept","Accept "+kfmt(a.bid),"")+
      (a.demanded?"":ibtn(id,"demand","Demand more","comm"))+ibtn(id,"reject","Reject","ghost");
    case "sponsorChoice":return ibtn(id,"A","Take A (safe)","")+ibtn(id,"B","Take B (bold)","comm");
    case "bidAccepted":return ibtn(id,"ok","Open talks · "+kfmt(a.fee),"",shortWhy(a.fee))+
      ibtn(id,"die","Let it lapse","ghost");
    case "bidCounter":return ibtn(id,"accept","Accept "+kfmt(a.ask),"",shortWhy(a.ask))+
      ibtn(id,"die","Let it die","ghost");
    case "bidWar":return ibtn(id,"raise","Match "+kfmt(a.raise),"",shortWhy(a.raise))+
      ibtn(id,"walk","Walk away","ghost");
    case "callback":return ibtn(id,"ok","Hear him out","");
    case "transferReq":return ibtn(id,"list","List him","comm")+ibtn(id,"no","Refuse","ghost");
    case "stunt":return ibtn(id,"yes","Do it · +"+kfmt(BAL.sponsor.stuntFee),"")+ibtn(id,"no","No thanks","ghost");
  }
  return "";
}
function viewInbox(){
  if(!G.inbox.length)return '<div class="card"><div class="newsline">Empty. Even Barry is quiet. Enjoy it while it lasts.</div></div>';
  return '<div class="card">'+G.inbox.map(m=>{
    let act="";
    if(m.action&&!m.done){
      const btns=inboxActions(m);
      if(btns){
        const left=m.action.expires?m.action.expires-G.md:null;
        const clock=left===null?"":`<div class="kick" style="margin-top:2px">${left<=0?"They want an answer today.":left===1?"Answer by the next matchday.":"Answer within "+left+" matchdays."}</div>`;
        act=`<div class="actions">${btns}</div>${clock}`;
      }
    }
    return `<div class="irow"><div class="iav ${m.av==='R'||m.av==='GM'||m.av==='SF'?'g':''}">${m.av}</div>
      <div class="t">${m.title}<small>${m.from} — ${m.body}</small>${act}</div>${m.unread?'<div class="unread"></div>':''}
      <button class="sellb" style="padding:3px 9px;flex-shrink:0" onclick="delMsg(${m.id})" title="Delete">✕</button></div>`;
  }).join("")+'</div>';
}
function actMsg(id,choice){const m=G.inbox.find(x=>x.id===id);if(m)handleAction(m,choice);}
function delMsg(id){

const SQUAD_GROUPS=[["GK","Goalkeepers"],["DF","Defence"],["MF","Midfield"],["FW","Attack"]];
function viewSquad(){
  const wages=G.squad.reduce((s,p)=>s+p.wage,0);
  const wo=windowOpen();
  let h=`<div class="card"><div class="kick" style="margin-bottom:4px">Squad · ${G.squad.length} players · wages <b>${kfmt(wages)}/w</b> af ${kfmt(G.wageCap)} cap</div>
    <div class="bar${wages>G.wageCap*0.9?" amber":""}"><i style="width:${clamp(Math.round(100*wages/G.wageCap),2,100)}%"></i></div>`;
  for(const [pos,label] of SQUAD_GROUPS){
    const list=G.squad.map((p,ix)=>({p,ix})).filter(x=>x.p.pos===pos).sort((a,b)=>ovr(b.p)-ovr(a.p));
    if(!list.length)continue;
    const avg=Math.round(list.reduce((s,x)=>s+ovr(x.p),0)/list.length);

    h+=`<div class="sqhead"><span class="kick">${label}</span><span class="ln"></span>
      <span class="kick">${list.length}${out?" · "+out+" out":""} · avg <b>${avg}</b></span></div>`;

  }
  h+=`<div class="kick" style="margin-top:12px;font-size:9.5px;text-transform:none;letter-spacing:.2px">
    Tap a player for contract, chat, focus, mentoring and sale.${wo?"":" The window is shut — selling reopens when it does."}</div></div>`;
  return h;
}
function squadRow(p,last){
  const mentor=G.mentors.find(m=>m.vet===p.id||m.kid===p.id);
  const chips=[];
  if(p.id===G.captain)chips.push('<span class="mini a">©</span>');
  if(p.inj)chips.push(`<span class="mini r">Inj ${p.inj}md</span>`);
  if(p.susp)chips.push('<span class="mini r">Susp</span>');
  // a chairman hears "he looks flat", not "load 4.87" — states, never numbers
  if(!p.inj&&!p.susp){
    const b=freshBand(p);
    if(b==="used")chips.push('<span class="mini m">Used</span>');
    else if(b==="flat")chips.push('<span class="mini r">Flat</span>');
    else chips.push('<span class="mini a">Fresh</span>');
  }
  if(p.listed)chips.push('<span class="mini c">Listed</span>');
  if(p.gem)chips.push('<span class="mini c">Gem</span>');
  if(mentor)chips.push(`<span class="mini a">${mentor.vet===p.id?"Mentor":"Apprentice"}</span>`);
  if(p.focus)chips.push(`<span class="mini a">${p.focus} ↑</span>`);
  chips.push(`<span class="mini ${p.years<=1?"c":"m"}">${p.years}yr</span>`);
  return `<div class="srow${last?" last":""}" role="button" tabindex="0" aria-label="${p.name}, ${p.pos}, ${ovr(p)} overall" onclick="openPlayer(${p.id})">

      <span class="meta"><span class="tri">A<b>${p.att}</b> D<b>${p.def}</b> P<b>${p.phy}</b></span>${chips.join("")}</span></span>
    <span class="ov">${ovr(p)}</span><span class="chev">›</span></div>`;
}

function quickRing(id){
  const p=byId(id);if(!p)return;
  const appeal=clamp((ovr(p)-42)/20+(p.age<27?0.3:p.age>31?-0.4:0)+(p.traits.includes("dreamer")?0.3:0),0,1.4);
  const n=Math.random()<appeal?(Math.random()<appeal*0.5?R(2,3):1):0;
  const buyers=[];const used=new Set();
  for(let i=0;i<n;i++){
    let club;do{club=pick(G.teams).name}while(used.has(club));used.add(club);
    buyers.push({club,bid:Math.round(p.value*0.9*(0.75+Math.random()*0.4)/1000)*1000,pushed:false,gone:false}); // haste smells: ~10% lower
  }
  modal={type:"sell",pid:id,buyers,line:n===0?"Reg rings around. Silence. \""+(p.age>31?"The age puts them off":"No takers right now")+", chairman. Patience — or goals.\"":"Reg rings around. "+(n===1?"One club":n+" clubs")+" call back before tea. They can smell the hurry — bids are on the low side."};
  render();
}

function playerRefusesSale(p){
  return (p.traits.includes("localhero")||p.conf>85)&&Math.random()<0.4;

function executeSale(p,club,bid){
  if(playerRefusesSale(p)){
    G.fanMood=clamp(G.fanMood+3,5,100);
    addNews("FANS",p.name.split(" ")[1]+" REFUSED the move to "+club+". \"I'm going nowhere,\" he told the Gazette. The Shed End has already made the banner.");
    modal={type:"info",title:"\"I'm going nowhere.\"",body:p.name+" turned the move down flat. The fans adore him a little more. The deal is dead."};
    p.listed=false;render();return false;
  }
  const promiseBroken=p.promiseMD!==null;
  G.balance+=bid;
  G.squad=G.squad.filter(x=>x!==p);
  G.soldTo.push({name:p.name,club,pos:p.pos,ovr:ovr(p),bitter:promiseBroken});
  if(G.soldTo.length>40)G.soldTo.shift();   // old ghosts stop haunting eventually
  const t=G.teams.find(x=>x.name===club);if(t)t.att=clamp(t.att+1,40,78);
  if(p.traits.includes("localhero")){G.fanMood=clamp(G.fanMood-12,5,100);bumpTrust(BAL.owners.trustFavourite);addNews("FANS","You sold a local hero. The banners are being repainted. Angrily.");}
  if(promiseBroken){
    G.fanMood=clamp(G.fanMood-3,5,100);
    for(const q of G.squad)q.conf=clamp(q.conf-3,10,95);
    msg(pick(AGENTS).n,"A","\"You PROMISED him football.\"","\"You promised "+p.name.split(" ")[1]+" playing time, then sold him. The dressing room noticed. Maureen noticed. Everyone noticed, chairman.\"",null);
    addNews("CLUB","Maureen's column: 'A promise at "+G.club.split(" ")[0]+" is apparently a currency that devalues fast.'");
  }
  if(p.id===G.captain){G.captain=null;pickCaptain();addNews("CLUB","The armband needs a new arm. "+(G.captain?nameOf(G.captain)+" gets it.":""));}
  G.mentors=G.mentors.filter(m=>m.vet!==p.id&&m.kid!==p.id);
  addNews("TRANSFER",p.name+" sold to "+club+" for "+kfmt(bid)+". You'll meet again — the fixture list guarantees it.");
  return true;
}
