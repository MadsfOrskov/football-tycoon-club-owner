        :pick(n.agent.walk);
      n.dead=true;
      if(!n.renewal)negoCollapse();
    }else{
      /* C3: replikken flytter sig med hans humoer og peger paa en vej videre.
         Tallet staar i arket, ikke i replikken -- en agent siger "det er taet",
         ikke "han vil have 4.350".
         C4: for en fri agent staar tallet INGEN steder. Saa er replikken den
         eneste information der findes, og den skal baere retningen. */
      n.line=(n.freeAgent&&!n.renewal)?freeAgentDirection(n,demand):contractReply(n,demand);
    }
  }
  render();
}
/* ---------- deal structures (pakke 3) ----------
   G.commitments holds ONLY ids and primitives — no player references — so the
   state stays a tree across a save. `amt` means a different thing per kind, and
   deliberately so: one field, three settlements.
     fee   → this much per season, for seasonsLeft more seasons
     promo → this much, once, if you go up within seasonsLeft
     goals → this much per league goal he scores, settled each season end     */
function dealTerms(fee,plan,clause){
  const D=BAL.deal;
  const sur=plan>1?D.instFrom+(plan-2)*D.instStep:0;   // you pay for the liquidity
  const disc=clause==="promo"?D.promoDiscount:clause==="goals"?D.goalsDiscount:0;
  const total=Math.round(fee*(1+sur)*(1-disc));
  const perSeason=Math.round(total/plan/500)*500;
  return {
    sur,total,plan,clause,
    down:total-perSeason*(plan-1),                     // what leaves the bank today
    perSeason,
    promo:clause==="promo"?Math.round(fee*D.promoBonus/500)*500:0,
    perGoal:clause==="goals"?Math.max(500,Math.round(fee*D.goalsPer/500)*500):0
  };
}
function commitmentsOwed(){
  if(!Array.isArray(G.commitments))return 0;
  return G.commitments.reduce((s,c)=>s+(c.kind==="fee"?c.amt*c.seasonsLeft:c.kind==="promo"?c.amt:0),0);
}
/* commitmentsPerSeason() stod her og blev aldrig kaldt fra nogen steder --
   pakke 8's foerste fund med sin egen nye audit. Slettet frem for at blive ved
   med at blive rapporteret: commitmentsOwed() daekker det brugsmoenster der
   faktisk findes, og en ubrugt funktion der laeser `amt` uden at se paa `kind`
   er en faelde for den naeste der kalder den (amt betyder tre ting). */
function recordDeal(p,club,t){
  G.commitments=G.commitments||[];
  if(t.plan>1)G.commitments.push({pid:p.id,name:p.name,club,kind:"fee",amt:t.perSeason,seasonsLeft:t.plan-1});
  if(t.clause==="promo")G.commitments.push({pid:p.id,name:p.name,club,kind:"promo",amt:t.promo,seasonsLeft:BAL.deal.promoSeasons});
  if(t.clause==="goals")G.commitments.push({pid:p.id,name:p.name,club,kind:"goals",amt:t.perGoal,seasonsLeft:BAL.deal.goalsSeasons});
}
/* Settled at the season boundary — BEFORE the summer wipes p.sg, so a goal
   bonus is paid on the goals that were actually scored this season. */
function settleCommitments(promoted){
  if(!Array.isArray(G.commitments)||!G.commitments.length)return;
  let paid=0;const lines=[];
  for(const c of G.commitments){
    if(c.kind==="fee"){paid+=c.amt;c.seasonsLeft--;lines.push(c.club+" · instalment for "+c.name.split(" ")[1]+" "+kfmt(c.amt)+(c.seasonsLeft?" ("+c.seasonsLeft+" to go)":" (final)"));}
    else if(c.kind==="promo"){
      if(promoted){paid+=c.amt;c.seasonsLeft=0;lines.push(c.club+" · promotion clause on "+c.name.split(" ")[1]+" "+kfmt(c.amt)+" — you went up, they get paid");}
      else c.seasonsLeft--;
    }else if(c.kind==="goals"){
      const p=byId(c.pid),g=p?p.sg:0;
      if(g>0){paid+=c.amt*g;lines.push(c.club+" · "+g+" goal"+(g===1?"":"s")+" from "+c.name.split(" ")[1]+" at "+kfmt(c.amt)+" each = "+kfmt(c.amt*g));}
      c.seasonsLeft--;
    }
  }
  G.commitments=G.commitments.filter(c=>c.seasonsLeft>0);
  if(paid>0){
    G.balance-=paid;
    msg("Ledger (bookkeeper)","L","The bills you signed for last year","You owe "+kfmt(paid)+" tonight, and it has already gone: "+lines.join(" · ")+". Structures are borrowing from a version of yourself who is not in the room.",null);
  }
}

/* "Not today" is a real exit, not a non-event. Closing the sheet on a deal that
   began as a formal bid has to hand the player back to the market — otherwise
   he keeps the BID PENDING flag with no message left to answer. */
function negoAbort(){
  if(nego&&nego.p)nego.p.pendingBid=false;
  nego=null;modal=null;render();
}
function negoCollapse(){
  const n=nego;
  // inbox deals just die — but the bid flag has to die with them
  if(n.fromInbox){if(n.p)n.p.pendingBid=false;return;}
  /* C4: en fri agent FORSVINDER IKKE. Mads: "Han forsvinder ikke; afslaget er
     det, der gør naeste bud muligt." Foer blev han slettet af G.freeAgents ved
     et sammenbrud, og saa var den information man netop havde koebt vaerdiloes.
     Nu bliver han staaende, og det man laerte af afslaget kan bruges. */
  if(n.freeAgent&&!n.renewal){n.p.faTalks=(n.p.faTalks||0)+1;return;}
  if(n.freeAgent){return;}
  const p=G.market[n.ix];
  G.market.splice(n.ix,1);
  if(p&&n.stage==="fee"){ // afterlife: agent may call back cheaper
    G.callbacks.push({p,due:G.md+R(2,4),agentName:n.agent.n});
  }
}
function negoFinish(){
  const n=nego;
  if(n.doneDeal&&n.renewal){
    const p=n.p;
    p.wage=n.wageOffer;p.years=n.years;p.role=n.role;p.conf=clamp(p.conf+5,10,95);
    bumpAgentRel(n.agentKey);   // pakke T3: a fair renewal warms the relationship
    addNews("CLUB",p.name+" signs a new "+n.years+"-year deal at "+kfmt(n.wageOffer)+"/w. The pen barely touched the paper before the Shed End knew.");
    nego=null;modal=null;render();return;
  }
  if(n.dead&&n.renewal){
    n.p.renewLockMD=G.md+6;
    nego=null;modal=null;render();return;
  }
  if(n.doneDeal){
    const p=n.p;const fee=n.freeAgent?0:n.agreedFee;
    const t=fee?dealTerms(fee,n.payPlan||1,n.clause||null):null;
    const due=t?t.down:0;                 // structures move the bill, not the price
    if(G.balance<due){p.pendingBid=false;modal={type:"info",title:"Ikke penge nok",body:"Handlen er aftalt, og du kan ikke betale. Barry kommer til at fortælle den historie i årevis."};nego=null;render();return;}
    G.balance-=due;
    if(t)recordDeal(p,p.from||"the selling club",t);
    p.wage=n.wageOffer;p.years=n.years;p.role=n.role;p.pendingBid=false;
    p.since=G.season;           // C3: han begynder sin tid i klubben nu
    bumpAgentRel(n.agentKey);   // pakke T3: a completed, fair deal earns his goodwill next time
    G.squad.push(p);
    if(n.freeAgent)G.freeAgents.splice(n.ix,1);
    else{const mi=G.market.indexOf(p);if(mi>=0)G.market.splice(mi,1);}
    const how=!t?"on a free":t.plan>1?kfmt(t.total)+" over "+t.plan+" seasons ("+kfmt(t.down)+" down)":"for "+kfmt(t.total);
    const clause=t&&t.clause==="promo"?" · "+kfmt(t.promo)+" more if you go up":t&&t.clause==="goals"?" · "+kfmt(t.perGoal)+" a goal":"";
    addNews("TRANSFER",p.name+" signs "+how+clause+" · "+n.years+"yr · "+kfmt(n.wageOffer)+"/w · promised "+ROLES[n.role].n.toLowerCase()+" football.");
  }
  nego=null;modal=null;render();
}

/* ---------- inbox actions ---------- */
function handleAction(m,choice){
  const a=m.action;
  if(a.kind==="sellOffer"){
    const p=byId(a.pid);
    if(!p){m.done=true;render();return;}
    if(choice==="accept"){
      if(G.squad.length<=13){m.done=true;m.body="The gaffer blocks the sale: \"I can't field eleven men and a cat. We asked the cat.\"";render();return;}
      m.done=true;
      if(!executeSale(p,a.club,a.bid)){m.body="He refused the move. The deal is dead — and the fans love him for it.";}
    }else if(choice==="demand"){
      if(Math.random()<0.5){a.bid=Math.round(a.bid*1.2/1000)*1000;m.body="They came back: "+kfmt(a.bid)+". Final offer, they say. They sound like they mean it.";}
      else{m.done=true;m.body="They walked away. Their agent muttered something about 'amateurs'.";addNews("TRANSFER",a.club+" withdraw their bid for "+p.name+".");}
      a.demanded=true;
    }else{m.done=true;m.body="Bid rejected. "+p.name.split(" ")[1]+" stays. The gaffer nods approvingly.";}
  }
  if(a.kind==="bidAccepted"){
    const p=G.market[marketById(a.pid)];
    if(!p){m.done=true;m.body="Too late — he's no longer available.";render();return;}
    // an accepted bid you cannot fund must still be answerable, or the player
    // stays flagged BID PENDING and the market row never comes back
    if(choice==="die"){p.pendingBid=false;m.done=true;m.body="You let the agreement lapse. The fee was there; the money wasn't.";render();return;}
    m.done=true;startContractTalks(p,a.fee);return;
  }
  if(a.kind==="bidCounter"){
    const p=G.market[marketById(a.pid)];
    if(!p){m.done=true;m.body="Too late — he's no longer available.";render();return;}
    if(choice==="accept"){m.done=true;startContractTalks(p,a.ask);return;}
    p.pendingBid=false;m.done=true;m.body="You let it die. The secretary files the fax under 'almost'.";
  }
  if(a.kind==="bidWar"){
    const p=G.market[marketById(a.pid)];
    if(!p){m.done=true;m.body="Too late — he's no longer available.";render();return;}
    if(choice==="raise"){m.done=true;startContractTalks(p,a.raise);return;}
    const mi=G.market.indexOf(p);if(mi>=0)G.market.splice(mi,1);
    m.done=true;m.body="You walked away. "+a.club+" got their man. The Shed End pretends not to care.";
    addNews("TRANSFER",p.name+" joins "+a.club+" after a bidding war you left. Probably wise. Probably.");
  }
  if(a.kind==="callback"){
    const ix=marketById(a.pid);
    if(ix<0){m.done=true;m.body="Gone again. He moves fast for a man his age.";render();return;}
    m.done=true;startBuyNego(ix,false,{discount:0.85});return;
  }
  if(a.kind==="transferReq"){
    const p=byId(a.pid);
    if(!p){m.done=true;render();return;}
    if(choice==="list"){p.listed=true;m.done=true;m.body="He's on the list. He trained beautifully today — funny, that.";}
    else{p.conf=clamp(p.conf-5,10,95);m.done=true;m.body="Request refused. He'll stay. His body will, anyway — the rest is negotiable.";}
  }
  if(a.kind==="sponsorChoice"){
    const o=a.offers[{A:0,B:1,C:2}[choice]||0];
    if(o){sponsorSign(o,a.slot||"main");m.done=true;}
  }
  render();
}

/* ---------- scout & boosts (rewarded placeholders) ---------- */
function startScout(){modal={type:"rewarded",reward:"scout"};render();}
function sponsorBoost(){modal={type:"rewarded",reward:"sponsor"};render();}
function buildBoost(){modal={type:"rewarded",reward:"build"};render();}
function grantReward(kind){
  if(kind==="scout"){G.scoutUsed=true;G.scoutPending=BAL.clock.scoutMD;addNews("SCOUT","Reg has packed his flask and left on a mission. Report expected in "+BAL.clock.scoutMD+" matchdays.");}
  if(kind==="sponsor"){G.sponsorBoost=true;G.balance+=BAL.sponsor.boost;addNews("CLUB","Sponsor top-up: +"+kfmt(BAL.sponsor.boost)+". Their logo is now also on the corner flags.");}
  if(kind==="build"&&G.standBuild){G.standBuild.remain=Math.max(0,G.standBuild.remain-1);if(G.standBuild.remain===0)finishStand();addNews("CLUB","The builders found an extra crew. The stand grows visibly.");}
  if(kind==="market")marketReroll();   // N3: en frisk liste navne, ad/IAP
  modal=null;render();
}
function deliverScout(){
  /* Pakke T2: the read. Reg no longer conjures a cheap gem out of nowhere — he
     NARROWS the uncertainty on one concrete young prospect you can already see.
     That is the whole point of scouting in the GDD: it does not create talent,
     it reveals how much of it a boy already has. Doseret 1/vindue via scoutUsed. */
  const pool=[...G.market,...G.squad].filter(p=>p.age<BAL.talent.youngUnder&&potBand(p)&&(p.scouted||0)<BAL.talent.bandByScout.length-1);
  if(!pool.length){
    msg("Reg (scout)","R","Nothing to report","\"No young prospect worth the petrol this window, chairman — the ones out there are what they are. I'll keep my eyes open.\"",null);
    return;
  }
  // prefer the fuzziest reads (lowest scouted), so the report always tightens something meaningful
  pool.sort((a,b)=>(a.scouted||0)-(b.scouted||0));
  const p=pool[Math.floor(Math.random()*Math.min(pool.length,3))];
  const wide=potBand(p);
  p.scouted=Math.min(BAL.talent.bandByScout.length-1,(p.scouted||0)+BAL.talent.readNarrow);
  const now=potBand(p),onList=G.market.includes(p);
  msg("Reg (scout)","R","Scout report: "+p.name,"\""+p.name+" ("+p.pos+", "+p.age+"), "+(onList?"the one on the market list":"our own boy")+". Watched him again. I had him at "+wide.lo+"–"+wide.hi+"; now I'd say "+(now.exact?("a firm "+now.hi):(now.lo+"–"+now.hi))+". "+(now.exact?"That's as certain as I get.":"Send me again and I'll tighten it further.")+"\"",null);
}
function startStandBuild(key){ // direct cash build — the impatient way, no fund bonus
  if(G.standBuild){modal={type:"info",title:"Ét byggeri ad gangen",body:"Håndværkerne nægter at dele sjakket. Fagforeningsregler, åbenbart."};render();return;}
  const lvl=G.stands[key]+1;
  if(lvl>2){modal={type:"info",title:"Færdigbygget",body:STANDS[key].n+" står allerede i sin fulde pragt."};render();return;}
  const cost=STANDCOST[lvl];
  if(G.balance<cost){modal={type:"info",title:"Ikke penge nok",body:"Håndværkerne vil have "+kfmt(cost)+" kontant på forskud. De er blevet brændt af fodboldklubber før. (Tip: banken låner mod den gate tribunen selv vil tjene.)"};render();return;}
  G.balance-=cost;
  G.standBuild={key,remain:5,lvl};
  addNews("CLUB","Construction begins on "+STANDS[key].n+". The seagulls have been served notice.");
  render();
}
/* R1b: stadionfonden (opsparing + bonus + raid) er fjernet — to finansierings-
   systemer var ét for meget. Banken (pakke 23) er vejen til at bygge før
   pengene er der, og den har allerede rente, loft og konsekvens. */
function finishStand(){
  const b=G.standBuild;
  G.stands[b.key]=b.lvl;recalcCapacity();
  msg("Site foreman","SF",STANDS[b.key].n.toUpperCase()+" IS OPEN","Capacity is now "+G.capacity.toLocaleString("en-GB")+". Cut the ribbon, chairman — and mind the wet paint.",null);
  G.fanMood=clamp(G.fanMood+BAL.mood.standOpens,5,100);
  /* Pakke 15b. The Main Stand's second role. Deliberately small: against
     trustAdmin −30 it is a nod, not a shortcut. Trust is still earned by
     conduct — this is the one board-facing thing you can BUILD. */
  if(b.key==="main"){
    bumpTrust(BAL.owners.trustMainStand);
    addNews("CLUB","The new Main Stand has a boardroom in it. The co-owners have opinions about the carpet, and rather warmer ones about you.");
  }
  G.standBuild=null;
}

 shop:{fx:[perHead(BAL.matchday.shop),"Merchandise-indtægt +"+pct(BAL.matchday.shopMerchBoost)],warn:null,md:2},
 pub:{fx:[perHead(BAL.matchday.pub),"Fanhumør +"+BAL.mood.pubDrift+" hver kampdag, og +"+BAL.mood.pubOpens+" den dag den åbner"],warn:null,md:2},
 /* Was "(derby, cup, playoffs)". There is no cup and no derby; after pakke 5 the

 screen:{fx:["+"+pct(BAL.matchday.bigScreenGate)+" gate i STORE kampe — guldkampe, seksere, topopgør, playoffs"],
   warn:"Gør ingenting en våd tirsdag mod midterfeltet. Cirka 3-5 kampe pr. sæson.",md:2},

 /* Was "+1 extra per season", flat. The bonus sits inside the bracket that is

 training:{fx:["Spillere under 24: +1 udvikling pr. sæson, skaleret efter spillede kampe",

 /* D3: tre poster bygget af TOTALERNE gange husets andel. Summen af de tre er

 parking:{fx:["Efterspørgsel i byen +"+pct(BAL.demand.basics*BAL.basics.split.parking.demand)+" — folk kan komme frem og hjem igen",

/* Pakke 15a. The VIP boxes paid their flat fee whether or not a Main Stand
   existed, but stadiumSvg() has always drawn them only when G.stands.main>=1 —
   the code and the picture disagreed, and the picture was right. The boxes hang
   off the main stand; there is nowhere else to put them. Making the requirement
   real also gives the Main Stand the first of its two roles: it unlocks the most
   lucrative facility in the game. */
function facBlockedBy(key){
  const need=FAC_REQ[key];
  if(!need||!G)return null;
  if(G.stands[need.stand]>=need.lvl)return null;
  return STANDS[need.stand].n;
}
function buildFac(key){
  const f=FACS[key];
  const blocker=facBlockedBy(key);
  if(blocker){modal={type:"info",title:"Ingen steder at sætte dem",
    body:f.n+" hænger på "+blocker+". Byg den først — boksene skal have noget at kigge ud over."};render();return;}
  if(facClosed(key)){modal={type:"info",title:"Den er lukket ned",body:f.n+" står slukket. Genåbn den, før du bygger videre på den."};render();return;}
  if(facOwned(key)>=BAL.fac.maxLvl){modal={type:"info",title:"Niveau "+BAL.fac.maxLvl+" er toppen",body:f.n+" kan ikke blive større. Byen har også en grænse."};render();return;}
  if(G.facBuild){modal={type:"info",title:"Ét lille byggeri ad gangen",body:"Det lokale firma er i gang med "+FACS[G.facBuild.key].n+". De deler heller ikke sjak."};render();return;}
  modal={type:"facConfirm",key,to:facOwned(key)+1};render();
}
function facConfirm(){
  const key=modal.key;const f=FACS[key];const to=modal.to||facOwned(key)+1;
  const blocker=facBlockedBy(key);
  if(blocker){modal={type:"info",title:"Ingen steder at sætte dem",body:f.n+" kræver "+blocker+" først."};render();return;}
  if(to>BAL.fac.maxLvl||to!==facOwned(key)+1){modal=null;render();return;}
  const cost=facStepCost(key,to);
  if(G.balance<cost){modal={type:"info",title:"Ikke penge nok",body:f.n+" niveau "+to+" koster "+kfmt(cost)+"."};render();return;}
  G.balance-=cost;
  G.facBuild={key,remain:FAC_DETAIL[key].md,to,reopen:false};
  addNews("CLUB","Work begins on "+f.n+" (level "+to+"). Ready in "+FAC_DETAIL[key].md+" matchday"+(FAC_DETAIL[key].md>1?"s":"")+".");
  modal=null;render();
}
/* B2, noedbremsen. Mads: "Det er en fed feature, at man kan 'lukke ned' for
   noget i en periode, hvis klubben skulle rykke ned og man dermed har faerre
   penge." Nedlukningen virker STRAKS -- ellers er den ingen noedbremse.
   Genaabningen tager kampdage som et byggeri, og bruger den ene byggeplads.
   Saa kan man overleve en nedrykning, men ikke taende og slukke efter behov. */
function closeFac(key){
  if(facOwned(key)<1||facClosed(key)){render();return;}
  if(!G.facOff)G.facOff={};
  G.facOff[key]=1;
  if(G.facBuild&&G.facBuild.key===key)G.facBuild=null;   // et byggeri paa noget slukket er penge ud af vinduet
  addNews("CLUB",FACS[key].n+" is mothballed. The lights are off and the standing order is cancelled.");
  msg("Site foreman","SF",FACS[key].n.toUpperCase()+" ER LUKKET NED",
    "Vi har slukket og laast. Driften på "+kfmt(Math.round(facSunk(key)*BAL.fac.upkeepOfBuild))+" pr. kampdag stopper i dag. Genåbning tager "+facReopenMD(key)+" kampdag"+(facReopenMD(key)>1?"e":"")+" — så tænk over det, inden du beder om nøglerne igen.",null);
  saveGame();render();
}
function reopenFac(key){
  if(!facClosed(key)){render();return;}
  if(G.facBuild){modal={type:"info",title:"Ét lille byggeri ad gangen",body:"Det lokale firma er i gang med "+FACS[G.facBuild.key].n+". Genåbning skal også have et sjak."};render();return;}
  G.facBuild={key,remain:facReopenMD(key),to:facOwned(key),reopen:true};
  addNews("CLUB",FACS[key].n+" is being reopened. Somebody has to find the keys first.");
  saveGame();render();
}
function finishFac(){
  const b=G.facBuild;const key=b.key;
  G.facBuild=null;
  if(b.reopen){
    if(G.facOff)delete G.facOff[key];
    msg("Site foreman","SF",FACS[key].n.toUpperCase()+" ER ÅBEN IGEN",
      "Lyset er tændt, og der lugter kun lidt af sidste sæson. Driften løber igen fra i dag.",null);
    saveGame();return;
  }
  const to=Math.max(1,Math.min(BAL.fac.maxLvl,b.to||1));
  const first=facOwned(key)<1;
  G.fac[key]=to;
  /* Aabningshumoeret gives ved FOERSTE niveau. En udbygning er ikke en
     genindvielse -- ellers kunne man koebe humoer tre gange for samme hus. */
  if(first){
    if(key==="vip")G.fanMood=clamp(G.fanMood+BAL.mood.vipOpens,5,100);
    if(key==="pub")G.fanMood=clamp(G.fanMood+BAL.mood.pubOpens,5,100);
    /* D3: de +4 humoer er FORDELT paa de tre huse. Aabner man alle tre, har man
       faaet praecis de +4 -- ikke tre gange fire. */
    if(BAL.basics.split[key])G.fanMood=clamp(G.fanMood+BAL.mood.basicsOpens*BAL.basics.split[key].mood,5,100);
  }
  const FIRSTWORD={vip:"The boxes gleam. The Shed End mutters about prawn sandwiches. The till doesn't care.",
    toilets:"Nye toiletter. Ægte jubelscener i køen.",
    parking:"Der er streger på gruset, og Barry har fået sin egen plads. Byen kan komme frem.",
    lights:"Lyset er tændt. Man kan spille en tirsdag aften nu — og så virker kiosken hele vejen."};
  msg("Site foreman","SF",FACS[key].n.toUpperCase()+(first?" IS OPEN":" · NIVEAU "+to),
    first?(FIRSTWORD[key]||"Doors open, town approves, money flows.")
         :"Udbygget til niveau "+to+" af "+BAL.fac.maxLvl+". Driften stiger til "+kfmt(Math.round(facSunk(key)*BAL.fac.upkeepOfBuild))+" pr. kampdag — den kommer, uanset om der er nogen på stadion.",null);
}
/* ---------- bookkeeper & sponsor life ---------- */
function bookkeeperReport(){
  const net=G.periodNet;
  const img=net>=0?"I have enclosed a small drawing of a sunrise.":"I have enclosed a drawing of a sinking ship.";
  msg("Ledger (bookkeeper)","L","Monthly report: "+(net>=0?"+":"")+kfmt(net).replace("£",net>=0?"£":"−£").replace("−£−","−£"),
    "Net over the last "+BAL.clock.reportMD+" matchdays: "+(net>=0?"+":"")+kfmt(Math.abs(net))+". Biggest cost: wages ("+kfmt(G.squad.reduce((s,p)=>s+p.wage,0))+"/w). "+img,null);
  G.periodNet=0;G.periodMD=0;
}
function sponsorTarget(s){return parseInt((String(s.demand||"").match(/top (\d+)/)||[])[1]||8);}
/* The clause used to be pure theatre: the text promised 20%, the code never
   took a penny. Now it settles at season's end — which also gives you half a
   season after the MD 9 warning to climb out of it. */
function sponsorSettleDemand(pos){
  const S=mainSponsor();
  if(!S||!S.demand)return;
  const target=sponsorTarget(S);
  if(pos<=target){
    msg(S.n,S.av,"Clause met — paid in full","\"Top "+target+", as written. A pleasure doing business, chairman. The invoice stands.\"",null);
    return;
  }
  const fine=Math.round(S.per*G.rounds*BAL.sponsor.penalty);
  G.balance-=fine;
  msg(S.n,S.av,"The clause bites: −"+kfmt(fine),"\"The deal said top "+target+". You finished "+ord(pos)+". We are invoicing "+(BAL.sponsor.penalty*100)+"% of the season back — "+kfmt(fine)+". Read the small print next time, chairman.\"",null);
  addNews("CLUB",S.n+" claw back "+kfmt(fine)+" after the top-"+target+" clause went unmet. An expensive way to learn to read.");
}
/* B3: bonusserne. Det her er hele pointen med den praestationsbaserede model --
   du kan SPILLE dig til gevinsten, saa sponsoren bliver en indsats paa din egen
   ambition frem for et lotteri. Afregnes paa alle fire slots, for de kan alle
   fire baere en bonus. */
function sponsorSettleBonus(outcome){
  for(const x of signedSponsors()){
    const d=x.d,hit=[],miss=[];
    for(const t of (d.triggers||[])){
      const T=SPONSOR_TRIGGERS[t];if(!T)continue;
      (T.hit(outcome)?hit:miss).push(t);
    }
    if(!hit.length&&!miss.length)continue;
    const paid=hit.reduce((s,t)=>s+sponsorBonusAmount(d,t),0);
    if(paid>0){
      G.balance+=paid;
      msg(d.n,d.av,"BONUS UDLØST: +"+kfmt(paid),
        "\""+hit.map(t=>SPONSOR_TRIGGERS[t].txt).join(". ")+". Det stod i aftalen, og du leverede. "+kfmt(paid)+" er overført.\""+
        (miss.length?" Ikke udløst: "+miss.map(t=>SPONSOR_TRIGGERS[t].kort).join(", ")+".":""),null);
      addNews("CLUB",d.n+" pay out "+kfmt(paid)+" in performance bonuses. The gamble paid.");
    }else{
      msg(d.n,d.av,"Ingen bonus i år",
        "\"Aftalen hang på "+miss.map(t=>SPONSOR_TRIGGERS[t].kort).join(", ")+". Det blev det ikke til. Grundbetalingen står, som den skal — men vi havde begge håbet på mere.\"",null);
    }
  }
}
function sponsorLifeEvents(){
  const S=mainSponsor();
  if(!S)return;
  // mid-season demand check
  if(G.md===9&&S.demand&&!G.sponsorChecked){
    G.sponsorChecked=true;
    const pos=myPos(),target=sponsorTarget(S);
    msg(S.n,S.av,"\"We're watching the table\"",pos<=target
      ?"\"Top "+target+", as agreed. Carry on, chairman — the boys at the brewery are pleased.\""
      :"\"The deal says top "+target+". You are "+ord(pos)+". We are not angry. We are disappointed. You have half a season to fix it before the clause bites.\"",null);
  }
  /* The collapse used to be a NAME CHECK on one of the four sponsors. With
     ten in the pool that meant most were decoration, so the behaviour is a
     field on the sponsor now (`risk`) and any sponsor written with it behaves. */
  /* Pakke 21a, QA's F8. R(8,20) blev trukket PAA NY hver kampdag. Laest som
     skrevet ligner det "en tilfaeldig kampdag mellem 8 og 20"; hvad det gjorde
     var et lotteri hver kampdag med 1/13 chance for at ramme, saa den effektive
     saesonsandsynlighed var ca. 0,64 x risk og ikke risk. Det virkede -- lige
     indtil nogen aendrede vinduet eller G.rounds, og vi har roert baade saeson-
     og divisionsstrukturen i nat. Dagen trakkes nu EN gang pr. saeson og ligger
     i G, saa den kan laeses, gemmes og efterproeves. */
  if(G.sponsorRiskMD===null||G.sponsorRiskMD===undefined)
    G.sponsorRiskMD=R(BAL.sponsor.riskFrom,BAL.sponsor.riskTo);
  if(S.risk&&G.md===G.sponsorRiskMD&&Math.random()<S.risk){
    msg(S.n+" (liquidators)",S.av,"SPONSOR COLLAPSE",S.n+" has ceased to exist. So has your sponsorship income. The small print, chairman. The small print.",null);
    addNews("CLUB",S.n+" implodes spectacularly. The shirt is naked again.");
    G.sponsors.main=null;G.sponsorOffered=false;
    return;
  }
}

/* ---------- table ---------- */
function table(){
  const rows=[{i:0,n:G.club,...G.me}].concat(G.teams.map((t,ix)=>({i:ix+1,n:t.name,pts:t.pts,gd:t.gd,pl:t.pl})));
  rows.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||a.n.localeCompare(b.n));
  return rows;
}
function myPos(){return table().findIndex(r=>r.i===0)+1;}
/* Pakke T1: is this club a promotion rival right now? — at/above the playoff cut
   and no worse-placed than you, i.e. a club you are actually racing. */
function isPromotionRival(name){
  if(G.div<=0)return false;
  const rows=table();
  const rank=rows.findIndex(r=>r.n===name),mine=rows.findIndex(r=>r.i===0);
  return rank>=0&&rank<BAL.big.cuts[1]&&rank<=mine;
}
function windowOpen(){return (G.md>=0&&G.md<6)||(G.md>=12&&G.md<15);}
/* N2: free agents har intet gebyr og kan derfor registreres en kort NÅDE efter
   vinduet lukker — men ikke hele sæsonen. Uden for vindue+nåde er de utilgængelige. */
function freeAgentSignable(){const g=BAL.market.freeAgentGrace||0;return (G.md>=0&&G.md<6+g)||(G.md>=12&&G.md<15+g);}
function windowLabel(){
  if(G.md<6)return {open:true,txt:"SOMMERVINDUET ÅBENT · "+(6-G.md)+" KAMPDAGE IGEN"};
  if(G.md>=12&&G.md<15)return {open:true,txt:"JANUARVINDUET ÅBENT · "+(15-G.md)+" KAMPDAGE IGEN"};
  const next=G.md<12?"JANUAR (KAMPDAG 13)":"NÆSTE SOMMER";
  return {open:false,txt:"VINDUET LUKKET · ÅBNER "+next+" · KUN FREE AGENTS"};
}

/* ================= RENDERING ================= */
const app=()=>document.getElementById("app");
let keepScroll=true;
function svgShield(txt,accent,size){
  const id="shield"+(accent?"A":"N"); // deterministic: identical gradients can share one id
  return `<svg width="${size}" height="${size*1.13}" viewBox="0 0 46 52" style="filter:drop-shadow(0 5px 10px rgba(0,0,0,.4))">
   <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${accent?'var(--acc)':'#3A4450'}"/><stop offset="1" stop-color="${accent?'var(--acc2)':'#232B33'}"/></linearGradient></defs>
   <path d="M23 1 44 8v18c0 13-9 21-21 25C11 47 2 39 2 26V8z" fill="url(#${id})"/>
   <path d="M23 5 40 10.5V26c0 10.5-7.3 17.5-17 21C13.3 43.5 6 36.5 6 26V10.5z" fill="${accent?'var(--bg1)':'#10151B'}"/>
   <text x="23" y="33" text-anchor="middle" font-family="BarlowC" font-style="italic" font-weight="900" font-size="16" fill="${accent?'var(--acc)':'#8FA3BC'}">${txt}</text></svg>`;
}
function render(){
  if(!G){if(bootSave)renderTitle();else renderOnboarding();return;}
  if(G.layer===undefined)G.layer="owner";   // save-migration: gamle karrierer vågner hjemme
  // M2.5: lagene håndhæves af NAVIGATIONEN (hvilke knapper der findes), ikke af
  // en hård omdirigering her — så kan alt stadig renderes og måles udefra.
  const inClub=G.layer==="club";
  let html=(inClub?ownerBar():"")+header()+wealthBar()+'<div class="content">';
  if(screen==="home")html+=viewOwner();
  if(screen==="empire")html+=viewEmpire();
  if(screen==="books")html+=viewBooks();
  if(screen==="inbox")html+=viewInbox();
  if(screen==="offer")html+=viewOffer();
  if(screen==="deadline")html+=viewDeadline();
  if(screen==="squad")html+=viewSquad();
  if(screen==="market")html+=viewMarket();
  if(screen==="club")html+=viewClub();
  if(screen==="table")html+=viewTable();
  html+='<div class="protonote">PROTOTYPE · AD-mærkede elementer er placeholders · karrieren gemmes automatisk på denne enhed</div></div>'+navbar();
  if(modal)html+=renderModal();
  // the whole app is one innerHTML swap, which throws the page back to the top.
  // Keep the reading position unless we deliberately changed screen.
  const y=document.documentElement.scrollTop||0;
  app().innerHTML=html;
  document.documentElement.scrollTop=keepScroll?y:0;
  keepScroll=true;
  if(modal&&modal.type==="ticker")runTicker();
}
/* M2.5: den tynde guld-linje — altid vejen hjem, aldrig i vejen */
function ownerBar(){
  const o=G.owner||{name:"You"};
  return `<div class="ownerbar" onclick="exitClub()"><span>‹ ${(o.name||"Dig").split(" ")[0].toUpperCase()}</span><span class="num">uge ${Math.min(G.md+1,G.rounds)} · S${G.season}</span></div>`;
}
/* B1. Mads' definition, ordret: "Min formue er jo vaerdien af alle de andele
   jeg ejer af klubberne relativt til deres vaerdi ... Kontanterne er ogsaa en del
   af ens samlede formue." netWorth() regnede allerede praecis det; det der
   manglede, var at de to tal stod et sted man kunne se dem hele tiden.
   Bivirkning, der er en fordel: fortyndingen bliver synlig. Bliver du udvandet,
   falder formuen, selvom klubben vokser. */
function wealthParts(){
  const own=Math.round(clubValuation()*G.myShare/100);
  return {cash:G.personalWealth||0,own,stakes:stakesWorth(),total:netWorth()};
}
function wealthBar(){
  const w=wealthParts();
  const h=G.netWorthHistory||[];
  const prev=h.length?h[h.length-1].v:null;
  const d=prev?w.total-prev:0;
  const trend=prev
    ? `<span class="trend" style="color:${d>=0?"var(--acc)":"#E07A6A"}"> ${d>=0?"▲":"▼"} ${kfmt(Math.abs(d))} siden S${h[h.length-1].s}</span>`
    : "";
  return `<div class="wealthbar" onclick="explainWealth()" title="Hvad tallene betyder">
    <div><small>Dine kontanter</small><b class="num">${kfmt(w.cash)}</b></div>
    <div><small>Din formue${trend}</small><b class="num">${kfmt(w.total)}</b></div></div>`;
}
function explainWealth(){
  const w=wealthParts();
  const line=(l,v)=>`<div class="rowline"><span>${l}</span><span class="amt num">${kfmt(v)}</span></div>`;
  modal={type:"info",title:"Kontanter og formue",
    body:`<div class="card">${line("Dine kontanter",w.cash)}${line(G.myShare+"% af "+safeName(G.club)+" ("+kfmt(clubValuation())+")",w.own)}${(G.stakes||[]).length?line("Andele i andre klubber",w.stakes):""}<div class="rowline" style="border-top:1px solid rgba(255,255,255,.12)"><span><b>Formue i alt</b></span><span class="amt num"><b>${kfmt(w.total)}</b></span></div></div>`
      +`<p><b>Kontanterne</b> er det tal du kan handle med — det er dem der gør det muligt at købe andele i andre klubber. <b>Formuen</b> kan du ikke bruge; den er pejlemærket, der skal stige.</p>`
      +`<p>Bliver du udvandet — sælger du andele i din egen klub — falder formuen, selvom klubben vokser. Det er meningen: du ejer mindre af noget større.</p>`};
  render();
}

function toggleMode(){G.mode=G.mode==="dark"?"light":"dark";applyTheme(G.hue,G.mode);render();}
function navbar(){
  if(G.layer!=="club"){
    const bell=deskDoorbell().length;
    const t=[["home","Kontor"],["empire","Imperium"],["books","Økonomi"]];
    return '<nav class="gold">'+t.map(([k,l])=>`<button class="${screen===k?'on':''}" onclick="go('${k}')">${l}${k==='home'&&bell?`<span class="badge num">${bell}</span>`:''}</button>`).join("")+'</nav>';
  }
  const u=unreadCount();
  const t=[["club","Klub"],["squad","Trup"],["market","Marked"],["table","Tabel"],["inbox","Indbakke"]];
  /* C1/C2: tilbudssiden og deadline day er egne skaerme uden egen fane -- man
     kommer dertil fra indbakken og fra kampdagen. Indbakkefanen markeres som
     aktiv, saa navbaren ikke ser tom ud, og vejen tilbage er en knap paa siden. */
  const navOn=screen==="offer"?"inbox":screen==="deadline"?"market":screen;

}
function go(s){screen=s;if(s==="inbox")G.inbox.forEach(m=>m.unread=false);keepScroll=false;saveGame();render();}
/* ---------- M2.5: de to lag — du GÅR IND i klubben og hjem igen ----------
   Ejer-laget (guld) er dit: Kontor · Imperium · Økonomi. Klublaget (klubbens
   farve) er klubbens: Klub · Trup · Marked · Tabel · Indbakke — og findes kun
   når du er gået ind. Tilstedeværelsen er implicit: du ER hvor du gik ind. */
function enterClub(toScreen){G.layer="club";screen=toScreen||"club";keepScroll=false;saveGame();render();}
function exitClub(){G.layer="owner";screen="home";keepScroll=false;saveGame();render();}
/* Dørklokken: hastende klubpost giver en linje på dit bord. Bordet er en
   dørklokke, ikke en svarknap — trykket hopper dig IND i klubben. Invariantens
   løfte: intet tidskritisk item kan udløbe uden at have haft en linje her. */
function deskDoorbell(){
  return (G.inbox||[]).filter(m=>m.action&&!m.done)
    .map(m=>({id:m.id,title:m.title,urgent:!!(m.action.expires!==undefined&&m.action.expires-G.md<=1)}));
}
/* "Næste uge" — tiden bor hos DIG. Hjemmefra afvikles din klubs kamp under
   gafferen alene (ordren er "din afgørelse", tickeren spoles); store
   begivenheder (deadline day, banken, sæsonskiftet) banker stadig på. I
   playoff-tiden er hver kamp for stor til at skippe — så føres du derind. */
function nextWeek(){
  if(G.phase!=="season"||G.md>=G.rounds){enterClub();return;}
  playMatchday();
}

/* Every kind handleAction() understands MUST be drawable here. Half of them
   weren't, which made the whole formal-bid track a dead end you could not even
   back out of. The harness now fails if a live message renders no button. */
/* data-act er knappens IDENTITET og skal staa paa BEGGE varianter. Den spaerrede
   udgave har intet onclick, saa en audit der noegler paa onclick-maalet falder
   tilbage paa etiketten -- og etiketten indeholder beloebet ("Accept £56k"), saa
   hvert beloeb blev talt som sin egen knap der aldrig var set aktiv. Ved 200
   seeds gav det 13 falske "altid deaktiverede" knapper, alle sammen den samme
   indbakkeknap. */
function ibtn(id,choice,label,cls,blockedWhy){
  return blockedWhy
    ? `<button class="abtn ${cls}" data-act="actMsg:${choice}" disabled style="opacity:.4" title="${blockedWhy}">${label}</button>`
    : `<button class="abtn ${cls}" data-act="actMsg:${choice}" onclick="actMsg(${id},'${choice}')">${label}</button>`;
}
function shortWhy(amount){return G.balance<amount?"Kun "+kfmt(Math.max(0,G.balance))+" i kassen":null;}
function inboxActions(m){
  const a=m.action,id=m.id;
  switch(a.kind){
    /* C1: indbakken faar EN knap. Beslutningen -- spilleren, klubben, de andre
       interesserede, forhandlingen -- hoerer paa en side, ikke i en raekke. */
    case "sellOffer":return `<button class="abtn" data-act="actMsg:see" onclick="openOffer(${id})">Se tilbud · ${kfmt(a.bid)}</button>`;
    /* B3: tre tilbud -> tre knapper. Var to, og et tredje tilbud uden knap
       ville vaere praecis pakke 0's blindgyde igen. */
    case "sponsorChoice":return (a.offers||[]).map((o,i)=>
      ibtn(id,"ABC"[i],(o.shapeLabel||"ABC"[i])+" · "+kfmt(o.per),i===0?"":i===1?"comm":"ghost")).join("");
    case "bidAccepted":return ibtn(id,"ok","Åbn forhandling · "+kfmt(a.fee),"",shortWhy(a.fee))+
      ibtn(id,"die","Lad det løbe ud","ghost");
    case "bidCounter":return ibtn(id,"accept","Tag imod "+kfmt(a.ask),"",shortWhy(a.ask))+
      ibtn(id,"die","Lad det dø","ghost");
    case "bidWar":return ibtn(id,"raise","Match "+kfmt(a.raise),"",shortWhy(a.raise))+
      ibtn(id,"walk","Træk dig","ghost");
    case "callback":return ibtn(id,"ok","Hør ham","");
    case "transferReq":return ibtn(id,"list","Sæt ham til salg","comm")+ibtn(id,"no","Afvis","ghost");
  }
  return "";
}
/* ---------- C1: tilbudssiden ----------
   Mads: "Siden skal vise: spilleren (form, alder, kontrakt, hvad han betyder
   for truppen) · den bydende klub (division, placering, hvad de har raad til) ·

    <button class="abtn ghost" onclick="closeOffer()">‹ Tilbage til indbakken</button></div>`;
  const I=BAL.interest;
  const t=G.teams[a.clubIdx];
  const rows=table();
  const theirPos=t?rows.findIndex(r=>r.i===a.clubIdx+1)+1:0;
  const purse=clubPurse(t);
  const rivals=offerRivals(a);
  const left=a.expires?a.expires-G.md:null;
  const vs=a.bid-p.value;
  const line=(l,v,cls)=>`<div class="rowline"><span>${l}</span><span class="amt num"${cls?` style="color:${cls}"`:""}>${v}</span></div>`;

  /* Hvad han betyder for truppen -- den information beslutningen kraever, og som
     en indbakkeraekke aldrig kunne baere. */
  const samePos=G.squad.filter(x=>x.pos===p.pos).sort((x,y)=>ovr(y)-ovr(x));
  const rankPos=samePos.findIndex(x=>x.id===p.id)+1;
  const isCaptain=G.captain===p.id;
  const top3=[...G.squad].sort((x,y)=>ovr(y)-ovr(x)).slice(0,3).some(x=>x.id===p.id);
  const cover=samePos.length-1;
  const means=[];
  if(isCaptain)means.push("Han er anfører.");
  if(rankPos===1)means.push("Bedste "+p.pos+" i truppen"+(cover?" — der er "+cover+" bag ham":" og den ENESTE"));

  const declared=declaredKeep(p);

  return `<div class="card">
    <div class="kick" style="margin-bottom:4px">Tilbud på din spiller${left!==null?" · "+(left<=0?"de vil have svar i dag":left===1?"svar inden næste kampdag":"svar inden for "+left+" kampdage"):""}</div>
    <div class="rowline" style="border-bottom:none"><span style="font-size:19px"><b>${safeName(p.name)}</b> <small>· ${p.pos} · ${p.age} år · OVR ${ovr(p)}</small></span>

    ${a.bid!==a.opening?line("Åbningsbud",kfmt(a.opening)):""}
  </div>

  <div class="card"><div class="kick" style="margin-bottom:4px">Manden</div>
    <div class="statchips"><span class="sc">ATT <b>${p.att}</b></span><span class="sc">DEF <b>${p.def}</b></span><span class="sc">PHY <b>${p.phy}</b></span>
      <span class="sc">FORM <b>${p.form>0?"+":""}${p.form}</b></span><span class="sc">SELVTILLID <b>${p.conf}</b></span></div>
    ${line("Kontrakt",(p.years||1)+" år"+((p.years||1)<=1?" — sidste":""))}
    ${line("Løn",kfmt(p.wage)+"/u")}
    <div class="kick" style="font-size:9px;margin-top:8px;text-transform:none;letter-spacing:.2px">${means.join(" ")}</div>

  <div class="card"><div class="kick" style="margin-bottom:4px">Den bydende klub</div>
    <div class="rowline"><span><b>${t?safeName(t.name):safeName(a.club)}</b> <small>· ${G.divNames[G.div]}${theirPos?" · "+ord(theirPos)+" i tabellen":""}</small></span></div>
    ${line("Hvad de kan bære","~"+kfmt(purse))}
    ${line("De har budt",kfmt(a.bid)+" ("+Math.round(100*a.bid/Math.max(1,purse))+"% af det)")}
    <div class="kick" style="font-size:9px;margin-top:6px;text-transform:none;letter-spacing:.2px">${a.bid<purse*0.6?"Der er mere i dem, hvis nogen presser dem.":a.bid>purse*0.9?"Det er tæt på alt hvad de har. Der er ikke meget mere at hente.":"Et rimeligt bud efter deres forhold."}</div>
  </div>

  <div class="card"><div class="kick" style="margin-bottom:4px">De andre interesserede</div>
    ${rivals.length?rivals.sort((x,y)=>y.lvl-x.lvl).map(r=>
      `<div class="rowline"><span>${safeName(r.name)} <small>· ${r.pos?ord(r.pos)+" i tabellen":""}</small></span>
        <span class="sc" style="color:${r.lvl>=2?"var(--acc)":r.lvl===1?"var(--comm)":"var(--muted)"}">${r.label}</span></div>`).join("")
      :`<div class="newsline">Ingen andre har ringet. ${a.club} er alene om ham — og det ved de.</div>`}
    <div class="rowline" style="border-bottom:none;padding-top:8px"><span style="font-size:11.5px">Ring rundt og pres på for et bud <small>· ${callsLeft} af ${I.callMax} tilbage</small></span>
      ${callsLeft?`<button class="abtn comm" style="padding:6px 10px;font-size:10.5px" onclick="offerCallRound(${m.id})">Ring rundt</button>`
        :`<span class="num" style="color:var(--muted);font-size:11px">ikke mere at ringe efter</span>`}</div>
    <div class="kick" style="font-size:9px;margin-top:6px;text-transform:none;letter-spacing:.2px">
      Det koster to gange. <b>Han finder ud af det</b> — selvtillid ned, og er han publikumsyndling, falder stemningen${declared?`. <b style="color:#E07A6A">Og du har selv sagt offentligt, at han ikke var til salg: det koster ${I.declaredMult}× så meget</b>`:""}.
      <b>Og markedet reagerer i begge retninger:</b> er han eftertragtet og du ikke presset, driver konkurrencen buddene op — lugter de, at du <i>skal</i> sælge, falder de.
      Lige nu: eftertragtethed ${Math.round(des*100)}%, dit behov for at sælge ${Math.round(need*100)}%.

  ${(a.log||[]).length?`<div class="card"><div class="kick" style="margin-bottom:4px">Hvad der er sket</div>

    <button class="abtn ghost" onclick="offerDecide('reject')">Afvis · sig offentligt at han ikke er til salg</button>
    <button class="abtn ghost" onclick="closeOffer()">‹ Beslut senere</button>
  </div>`;
}
/* ---------- C2: deadline day som egen side ----------
   GDD: "saesonens teaterforestilling ... 3-5 muligheder der KUN findes her."
   Valgt form: bordet fyldes op mens uret gaar, og det gamle forsvinder ikke.
   Fuld information pr. post: spilleren, klubben, HVAD DER SKER HVIS DU SIGER
   NEJ, og hvor lang tid der er igen. Det sidste var det Mads ikke kunne
   gennemskue -- "hold paa ham" var en knap uden en modsaetning. */
function viewDeadline(){
  const d=G.dl;
  if(!d)return `<div class="card"><div class="newsline">Vinduet er lukket. Deadline day findes kun på deadline day.</div>
    <button class="abtn ghost" onclick="go('club')">‹ Tilbage til klubben</button></div>`;
  const D=BAL.deadline;
  const clubName=ix=>G.teams[ix]?safeName(G.teams[ix].name):"en rival";
  const shown=Math.min(d.shown||d.events.length,d.events.length);
  const arrived=d.events.slice(0,shown);
  const clock=arrived.length?arrived[arrived.length-1].time:D.times[0];
  const openCount=arrived.filter(e=>!e.done).length;
  const moreToCome=shown<d.events.length;
  const left=d.events.length-shown;

  const card=(e,i)=>{
    const head=(kick,right)=>`<div class="rowline" style="border:none;padding-bottom:2px">
      <span class="kick" style="color:var(--comm)">${e.time} · ${kick}</span><span class="kick">${right}</span></div>`;
    const outcome=()=>`<div class="why">${e.outcome||"Forbi — du lod den her gå."}</div>`;
    if(e.kind==="heist"){
      const p=e.player;
      if(!p)return `<div class="card">${head("éndags-kup",clubName(e.fromIdx))}
        <div class="rowline"><span>${safeName(e.name||"Han")} <small>· ${e.pos||""}${e.ov?" · "+e.ov+" ovr":""}</small></span><span class="amt num">${kfmt(e.price)}</span></div>
        ${outcome()}</div>`;
      const band=potBand(p);
      const wage=Math.round(p.wage||0);
      return `<div class="card">${head("éndags-kup",clubName(e.fromIdx)+" · mangler penge")}
        <div class="rowline"><span>${safeName(p.name)} <small>· ${p.pos} · ${p.age} år · ${ovr(p)} ovr${band?" · "+potBandText(p):""}</small></span><span class="amt num">${kfmt(e.price)}</span></div>
        <div class="rowline"><span>Løn</span><span class="amt num">${kfmt(wage)}/u</span></div>
        <div class="rowline"><span>Hans værdi <small>· de sælger under den, fordi de skal have penge i dag</small></span><span class="amt num">${kfmt(Math.round(e.price/D.heistDiscount))}</span></div>
        ${e.done?outcome():`<div class="kick" style="font-size:9px;text-transform:none;letter-spacing:.2px;margin-bottom:4px">Siger du nej: han er væk ved midnat, og prisen findes ikke igen.</div>
          <button class="abtn comm" onclick="dlHeistSign(${i})">Hent ham · ${kfmt(e.price)}</button>`}</div>`;
    }
    if(e.kind==="panic"){
      const p=byId(e.pid),vs=e.bid-(p?p.value:e.bid);
      return `<div class="card">${head("panikbud",clubName(e.fromIdx)+" er desperate")}
        <div class="rowline"><span>${safeName(e.name)} <small>· ${e.pos} · ${e.ov} ovr</small></span><span class="amt num">${kfmt(e.bid)}</span></div>
        ${p?`<div class="rowline"><span>${vs>=0?"Over hans værdi":"Under hans værdi"}</span><span class="amt num" style="color:${vs>=0?"var(--acc)":"#E07A6A"}">${vs>=0?"+":"−"}${kfmt(Math.abs(vs))}</span></div>`:""}
        ${e.done?outcome():`<div class="kick" style="font-size:9px;text-transform:none;letter-spacing:.2px;margin-bottom:4px">Står du fast: han bliver, men han er urolig et par uger. Presser du: de hæver ${pct(D.pushBump-1)} — eller lægger på og er væk.</div>
          <div class="boost"><button onclick="dlPanicAccept(${i})">Tag imod · ${kfmt(e.bid)}</button><button onclick="dlPanicReject(${i})">Stå fast</button>${e.pushed?"":`<button class="iap" onclick="dlPanicPush(${i})">Pres for mere</button>`}</div>
          ${e.pushed&&e.outcome?`<div class="kick" style="text-transform:none">${e.outcome}</div>`:""}`}</div>`;
    }
    // poach — de TRE valg, og hvad hvert af dem koster
    const p=byId(e.pid);
    return `<div class="card">${head("rival kredser",clubName(e.fromIdx)+" vil have ham")}
      <div class="rowline"><span>${safeName(e.name)} <small>· ${e.pos} · ${e.ov} ovr${p?" · selvtillid "+p.conf:""}</small></span><span class="amt num">${kfmt(e.offer)}</span></div>
      ${p?`<div class="rowline"><span>Hans værdi</span><span class="amt num">${kfmt(p.value)}</span></div>`:""}
      ${e.done?outcome():`<div class="rowline"><span>Loyalitetsbonus for at holde ham <small>· ${pct(D.holdCost)} af hans værdi</small></span><span class="amt num">${kfmt(e.hold)}</span></div>
        <div class="kick" style="font-size:9px;text-transform:none;letter-spacing:.2px;margin:4px 0">
          <b>Han vil væk.</b> Betaler du bonussen, bliver han og er tilfreds med det. Lader du ham gå, får du ${kfmt(e.offer)}.
          <b>Siger du hverken ja eller nej</b>, bliver han også — men han føler sig taget for givet: selvtillid ${D.snubConf}, og han kan sende en transferanmodning bagefter. At lade uret løbe ud er også et svar.</div>
        <div class="boost"><button onclick="dlPoachHold(${i})">Hold på ham · ${kfmt(e.hold)}</button><button onclick="dlPoachLet(${i})">Lad ham gå · ${kfmt(e.offer)}</button></div>
        <button class="abtn ghost" style="margin-top:4px" onclick="dlPoachSnub(${i})">Sig ingenting — og lev med det</button>`}</div>`;
  };

  const feed=arrived.map((e,i)=>({e,i})).reverse().map(o=>card(o.e,o.i)).join("");
  return `<div class="card" style="text-align:center">
      <div class="biglabel">⚡ DEADLINE DAY ⚡</div>
      <div class="tclock" style="margin:2px auto 6px"><b class="num">${clock}</b></div>
      <div class="kick">${shown} af ${d.events.length} inde · ${openCount?openCount+" åbne":"alt afgjort"}${left?" · "+left+" mere på vej":""}</div>
      <div class="kick" style="font-size:9px;margin-top:6px;text-transform:none;letter-spacing:.2px">Bordet fyldes op mens uret går, og intet forsvinder. Lukker du vinduet, bliver alt det åbne besvaret med tavshed — og tavshed er også et svar.</div>
    </div>
    ${feed}
    ${moreToCome
      ?`<button class="glowbtn" onclick="dlAdvance()">Lad uret løbe ▸ <small style="opacity:.7">næste opkald på vej</small></button>
        <button class="abtn ghost" onclick="dlClose()">Smæk vinduet i &amp; spil kampdag ▸</button>`
      :`<button class="glowbtn" onclick="dlClose()">Vinduet er lukket — spil kampdag ▸</button>`}`;
}
function viewInbox(){
  if(!G.inbox.length)return '<div class="card"><div class="newsline">Tom. Selv Barry er stille. Nyd det, mens det varer.</div></div>';
  return '<div class="card">'+G.inbox.map(m=>{
    let act="";
    if(m.action&&!m.done){
      const btns=inboxActions(m);
      if(btns){
        const left=m.action.expires?m.action.expires-G.md:null;
        const clock=left===null?"":`<div class="kick" style="margin-top:2px">${left<=0?"De vil have svar i dag.":left===1?"Svar inden næste kampdag.":"Svar inden for "+left+" kampdage."}</div>`;
        act=`<div class="actions">${btns}</div>${clock}`;
      }
    }
    /* D1: behold-flaget. Vises kun paa de beskeder rydningen kan tage — en
       besked der venter paa svar bliver staaende under alle omstaendigheder,
       saa en stjerne paa den ville love noget den ikke afgoer. */
    const pin=msgAwaitsAnswer(m)?"":`<button class="sellb" style="padding:3px 7px;flex-shrink:0${m.keep?";color:var(--acc)":""}" onclick="keepMsg(${m.id})" title="${m.keep?"Beholdes — tryk for at lade den ryge ved næste kampdag":"Behold ved næste kampdag"}">${m.keep?"★":"☆"}</button>`;
    return `<div class="irow"><div class="iav ${m.av==='R'||m.av==='GM'||m.av==='SF'?'g':''}">${m.av}</div>
      <div class="t">${m.title}<small>${m.from} — ${m.body}</small>${act}</div>${m.unread?'<div class="unread"></div>':''}
      ${pin}<button class="sellb" style="padding:3px 9px;flex-shrink:0" onclick="delMsg(${m.id})" title="Slet">✕</button></div>`;
  }).join("")+'</div>'+
  `<div class="card"><div class="kick" style="font-size:9px;text-transform:none;letter-spacing:.2px">Ved næste kampdag ryddes den post der ikke skal besvares. Alt der venter på dit svar bliver stående — også når det er gammelt. Sæt ☆ på en besked du vil beholde.</div></div>`;
}
function actMsg(id,choice){const m=G.inbox.find(x=>x.id===id);if(m)handleAction(m,choice);}
function delMsg(id){
  releaseMsg(G.inbox.find(x=>x.id===id));   // binning a bid must not strand the player
  G.inbox=G.inbox.filter(x=>x.id!==id);render();
}
const SQUAD_GROUPS=[["GK","Målmænd"],["DF","Forsvar"],["MF","Midtbane"],["FW","Angreb"]];
function viewSquad(){
  const wages=G.squad.reduce((s,p)=>s+p.wage,0);
  const wo=windowOpen();
  let h=`<div class="card"><div class="kick" style="margin-bottom:4px">Trup · ${G.squad.length} spillere · løn <b>${kfmt(wages)}/u</b> af ${kfmt(G.wageCap)} loft</div>
    <div class="bar${wages>G.wageCap*0.9?" amber":""}"><i style="width:${clamp(Math.round(100*wages/G.wageCap),2,100)}%"></i></div>`;
  for(const [pos,label] of SQUAD_GROUPS){
    const list=G.squad.map((p,ix)=>({p,ix})).filter(x=>x.p.pos===pos).sort((a,b)=>ovr(b.p)-ovr(a.p));
    if(!list.length)continue;
    const avg=Math.round(list.reduce((s,x)=>s+ovr(x.p),0)/list.length);
    const out=list.filter(x=>x.p.inj||x.p.susp).length;
    h+=`<div class="sqhead"><span class="kick">${label}</span><span class="ln"></span>
      <span class="kick">${list.length}${out?" · "+out+" ude":""} · snit <b>${avg}</b></span></div>`;
    h+=list.map((x,i)=>squadRow(x.p,i===list.length-1)).join("");
  }
  h+=`<div class="kick" style="margin-top:12px;font-size:9.5px;text-transform:none;letter-spacing:.2px">
    Tryk på en spiller for kontrakt, samtale og salg.${wo?"":" Vinduet er lukket — salg åbner igen med det."}</div></div>`;
  return h;
}
function squadRow(p,last){
  const chips=[];
  if(p.id===G.captain)chips.push('<span class="mini a">©</span>');
  if(p.inj)chips.push(`<span class="mini r">Skadet ${p.inj}</span>`);
  if(p.susp)chips.push('<span class="mini r">Karantæne</span>');
  // a chairman hears "he looks flat", not "load 4.87" — states, never numbers
  if(!p.inj&&!p.susp){
    const b=freshBand(p);
    if(b==="used")chips.push('<span class="mini m">Brugt</span>');
    else if(b==="flat")chips.push('<span class="mini r">Flad</span>');
    else chips.push('<span class="mini a">Frisk</span>');
  }
  if(p.listed)chips.push('<span class="mini c">Til salg</span>');
  if(p.gem)chips.push('<span class="mini c">Fund</span>');
  chips.push(`<span class="mini ${p.years<=1?"c":"m"}">${p.years}år</span>`);
  return `<div class="srow${last?" last":""}" role="button" tabindex="0" aria-label="${p.name}, ${p.pos}, ${ovr(p)} overall" onclick="openPlayer(${p.id})">
    <span class="posb">${p.pos}</span>
    <span class="who"><span class="n">${p.name} <small>${p.age}</small></span>
      <span class="meta"><span class="tri">A<b>${p.att}</b> D<b>${p.def}</b> P<b>${p.phy}</b></span>${chips.join("")}</span></span>
    <span class="ov">${ovr(p)}</span><span class="chev">›</span></div>`;
}
function openPlayer(id){
  if(!byId(id))return;
  modal={type:"player",pid:id};render();
}
function openSellSheet(id){
  // the gate lives here, not in the markup — every caller gets the same rule
  if(!windowOpen()){modal={type:"info",title:"Vinduet er lukket",body:"Ingen klub kan registrere ham nu. Salg åbner igen med vinduet."};render();return;}
  if(G.squad.length<=13){modal={type:"info",title:"\"Ikke tale om.\"",body:"Gafferen blokerer døren: tretten mand er allerede en trup holdt sammen af tape og optimisme."};render();return;}
  if(!byId(id))return;

function quickRing(id){
  const p=byId(id);if(!p)return;
  const appeal=clamp((ovr(p)-42)/20+(p.age<27?0.3:p.age>31?-0.4:0)+(p.traits.includes("dreamer")?0.3:0),0,1.4);
  const n=Math.random()<appeal?(Math.random()<appeal*0.5?R(2,3):1):0;
  const buyers=[];const used=new Set();
  for(let i=0;i<n;i++){
    let club;do{club=pick(G.teams).name}while(used.has(club));used.add(club);
    buyers.push({club,bid:Math.round(p.value*0.9*(0.75+Math.random()*0.4)/1000)*1000,pushed:false,gone:false}); // haste smells: ~10% lower
  }
  modal={type:"sell",pid:id,buyers,line:n===0?"Reg rings around. Silence. \""+(p.age>31?"The age puts them off":"No takers right now")+", chairman. Patience — or goals.\"":"Reg rings around. "+(n===1?"One club":n+" clubs")+" call back before tea. They can smell the hurry — bids are on the low side."};
  render();
}
function listPlayer(id){
  const p=byId(id);if(!p)return;
  p.listed=true;p.conf=clamp(p.conf-4,10,95);
  addNews("TRANSFER",p.name+" placed on the transfer list. He found out from the noticeboard. Not ideal.");
  modal=null;render();
}
function playerRefusesSale(p){
  return (p.traits.includes("localhero")||p.conf>85)&&Math.random()<0.4;
}
function executeSale(p,club,bid){
  if(playerRefusesSale(p)){
    G.fanMood=clamp(G.fanMood+3,5,100);
    addNews("FANS",p.name.split(" ")[1]+" REFUSED the move to "+club+". \"I'm going nowhere,\" he told the Gazette. The Shed End has already made the banner.");
    modal={type:"info",title:"\"Jeg skal ingen steder.\"",body:p.name+" afviste skiftet blankt. Fansene elsker ham en anelse mere. Handlen er død."};
    p.listed=false;render();return false;
  }
  const promiseBroken=p.promiseMD!==null;
  G.balance+=bid;
  G.squad=G.squad.filter(x=>x!==p);
  G.soldTo.push({name:p.name,club,pos:p.pos,ovr:ovr(p),bitter:promiseBroken});
  if(G.soldTo.length>40)G.soldTo.shift();   // old ghosts stop haunting eventually
  const t=G.teams.find(x=>x.name===club);
  if(t){
    /* Pakke T1, konsekvens: sælger du til en oprykningsrival, bliver den klub
       målbart stærkere til foråret — GDD's "en pris, du møder i foråret". En
       almindelig køber får det gamle +1; en rival over dig i løbet får hele
       rivalSaleAtt, og du får det at vide, så salget har en synlig følge. */
    const rival=isPromotionRival(club);
    t.att=clamp(t.att+(rival?BAL.market.rivalSaleAtt:1),40,78);
    if(rival)addNews("LEAGUE",club+", right in the promotion race with you, have signed "+p.name.split(" ")[1]+". You will meet a stronger "+club+" in the spring.");
  }
  if(p.traits.includes("localhero")){G.fanMood=clamp(G.fanMood-12,5,100);bumpTrust(BAL.owners.trustFavourite);addNews("FANS","You sold a local hero. The banners are being repainted. Angrily.");}
  if(promiseBroken){
    G.fanMood=clamp(G.fanMood-3,5,100);
    for(const q of G.squad)q.conf=clamp(q.conf-3,10,95);
    msg(pick(AGENTS).n,"A","\"You PROMISED him football.\"","\"You promised "+p.name.split(" ")[1]+" playing time, then sold him. The dressing room noticed. Maureen noticed. Everyone noticed, chairman.\"",null);
    addNews("CLUB","Maureen's column: 'A promise at "+G.club.split(" ")[0]+" is apparently a currency that devalues fast.'");
  }
  if(p.id===G.captain){G.captain=null;pickCaptain();addNews("CLUB","The armband needs a new arm. "+(G.captain?nameOf(G.captain)+" gets it.":""));}
  addNews("TRANSFER",p.name+" sold to "+club+" for "+kfmt(bid)+". You'll meet again — the fixture list guarantees it.");
  return true;
}
function sellAccept2(bi){
  const p=byId(modal.pid);const b=modal.buyers[bi];
  if(!p){modal=null;render();return;}
  if(executeSale(p,b.club,b.bid))modal=null;

/* ---------- the ground ----------
   Everything below is derived from ONE pitch trapezoid: the far touchline is
   narrower than the near one, and every stand, roof and crowd dot is placed by
   interpolating along it. Change the trapezoid and the whole ground follows. */
const STAD={fy:100,ny:205,fl:134,fr:256,nl:52,nr:338};
function stadHash(n){const x=Math.sin(n*127.1+0.7)*43758.5453;return x-Math.floor(x);}
/* A fully built ground is ~32 KB of markup and ~380 circles, rebuilt on every
   single tap because render() swaps the whole app. Cache it against everything
   that can change the drawing. */
let stadCache={key:null,svg:""};
function stadiumSvg(){
  const dark=G.mode==="dark",P=STAD;
  const protest=protestLevel();
  const cap=Math.max(1,G.capacity);
  const full=clamp(attendance()/cap,0,1);          // crowd density = how full we are
  const key=[G.mode,G.hue,G.capacity,G.club,G.badge,Math.round(full*100),
    JSON.stringify(G.stands),JSON.stringify(G.fac),
    G.standBuild?G.standBuild.key+":"+G.standBuild.remain:"-",
    G.fanMood>55?2:G.fanMood>30?1:0,
    "pr"+protestLevel()].join("|");     // the rung MUST be in the key, or the ground never changes
  if(stadCache.key===key)return stadCache.svg;
  const C=dark
   ?{grass1:"#1C5533",grass2:"#22643C",line:"rgba(238,255,232,.52)",stand:"#101A12",tier:"#16241A",
     roof:"#090F0A",edge:"#26351F",crowd:"#8E9C92",hut:"#141F16",mast:"#1B241C",lamp:"#F7FBDF",scr:"#070B08",ghost:"#3A4A3C"}
   :{grass1:"#3E9159",grass2:"#48A063",line:"rgba(255,255,255,.8)",stand:"#DAE1D2",tier:"#E6EBE0",
     roof:"#C0CBB8",edge:"#B7C4AD",crowd:"#6C7A71",hut:"#D2DACA",mast:"#A9B4A1",lamp:"#FDFFF0",scr:"#2B332C",ghost:"#AFBCA6"};

  /* --- geometry --- */
  const yAt=v=>P.fy+(P.ny-P.fy)*v;
  const inL=v=>P.fl+(P.nl-P.fl)*v, inR=v=>P.fr+(P.nr-P.fr)*v;
  const depth=v=>28+10*v;                          // nearer stands read deeper
  const sideMap=(side,lvl)=>{const inn=side<0?inL:inR,k=lvl>=2?1.28:1;
    return (u,v)=>[inn(v)+side*depth(v)*k*u,yAt(v)];};
  const mapP=(u,v)=>[inL(v)+(inR(v)-inL(v))*u,yAt(v)];
  const shedMap=lvl=>{const h=lvl>=2?46:33;return (u,v)=>[132+126*v,P.fy-h*u];};
  const awayMap=lvl=>{const h=lvl>=2?25:18;return (u,v)=>[(P.nl-11*u)+((P.nr+11*u)-(P.nl-11*u))*v,P.ny+h*u];};

  const pt=([x,y])=>x.toFixed(1)+","+y.toFixed(1);
  const quad=(m,u0,u1,v0,v1,a)=>`<polygon points="${[m(u0,v0),m(u0,v1),m(u1,v1),m(u1,v0)].map(pt).join(" ")}" ${a}/>`;
  const seg=(m,u,v0,v1,a)=>{const [x1,y1]=m(u,v0),[x2,y2]=m(u,v1);
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" ${a}/>`;};

  /* --- the crowd: a stable dot field, thinned by how full the ground is --- */
  const crowd=(m,u0,u1,cols,rows,r,base)=>{
    let s="";
    for(let c=0;c<cols;c++)for(let w=0;w<rows;w++){
      const i=base+c*37+w*11;
      if(stadHash(i*3.13)>full)continue;            // empty seat
      if(protest>=3&&stadHash(i*7.9)<0.30)continue;  // boycott: sections nobody has filled
      const v=clamp((c+0.5+(stadHash(i*1.7)-0.5)*0.8)/cols,0.01,0.99);
      const u=clamp(u0+(u1-u0)*((w+0.5+(stadHash(i*2.9)-0.5)*0.5)/rows),0,1);
      const [x,y]=m(u,v);
      // rung two: the scarves come down with the singing. Rung three: whole
      // blocks simply are not there.
      const acc=protest<2&&stadHash(i*5.7)<0.13;    // a scarf in the club colour
      s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${acc?"var(--acc)":C.crowd}" opacity="${acc?".95":".68"}"/>`;
    }
    return s;
  };

  /* --- a stand, in tiers, with a roof --- */
  const building=k=>G.standBuild&&G.standBuild.key===k;
  function stand(key,m,cols,rows,r,base){
    const lvl=G.stands[key];
    if(lvl<1){
      const c=building(key)?"var(--comm)":C.ghost;
      const [lx,ly]=m(0.55,0.5);
      return quad(m,0,1,0,1,`fill="none" stroke="${c}" stroke-width="1.6" stroke-dasharray="6 5" opacity="${building(key)?".95":".55"}"`)+
        `<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="middle" font-family="BarlowCN" font-size="8" letter-spacing="2" fill="${c}" opacity="${building(key)?"1":".8"}">${building(key)?"BUILDING":"BUILD"}</text>`;
    }
    let s=quad(m,0,1,0,1,`fill="${C.stand}" stroke="${C.edge}" stroke-width="1"`);
    s+=quad(m,0.62,1,0,1,`fill="${C.roof}"`);                        // roof, seen from in front
    s+=seg(m,0.62,0,1,`stroke="${C.edge}" stroke-width="1.4"`);      // the roof lip
    s+=crowd(m,0.06,0.58,cols,rows,r,base);                          // lower tier
    if(lvl>=2){
      s+=quad(m,0.28,0.34,0,1,`fill="${C.tier}" opacity=".55"`);     // the step between tiers
      s+=crowd(m,0.36,0.58,cols,Math.max(2,rows-1),r,base+911);      // upper tier
      s+=seg(m,1,0,1,`stroke="${C.edge}" stroke-width="1.8"`);
    }
    if(building(key)){                                               // upgrade in progress
      s+=quad(m,0,1,0,1,`fill="none" stroke="var(--comm)" stroke-width="1.8" stroke-dasharray="6 5"`);
    }
    return s;
  }

  /* --- floodlights --- */
  const pylon=(x,by,h,w)=>{
    const hh=w*0.38;
    return `<rect x="${(x-1.7).toFixed(1)}" y="${(by-h+hh).toFixed(1)}" width="3.4" height="${(h-hh).toFixed(1)}" fill="${C.mast}"/>
      <rect x="${(x-w/2).toFixed(1)}" y="${(by-h).toFixed(1)}" width="${w}" height="${hh.toFixed(1)}" rx="2" fill="${C.mast}"/>
      ${[0.2,0.5,0.8].map(t=>`<circle cx="${(x-w/2+w*t).toFixed(1)}" cy="${(by-h+hh/2).toFixed(1)}" r="${(w*0.105).toFixed(1)}" fill="${C.lamp}" opacity="${dark?"1":".75"}"/>`).join("")}`;
  };
  const cone=(x,by,h,spread)=>dark?`<polygon points="${x},${(by-h+5).toFixed(1)} ${(x-spread)},${P.ny} ${(x+spread)},${P.ny}" fill="url(#stCone)"/>`:"";

  /* --- kiosks & kit --- */
  const hut=(x,y,w,hh,label)=>`<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="3" fill="${C.hut}" stroke="${C.edge}"/>
    <rect x="${x-3}" y="${y-4.5}" width="${w+6}" height="5" rx="2" fill="var(--acc)" opacity=".8"/>
    <text x="${x+w/2}" y="${y+hh-6}" text-anchor="middle" font-family="BarlowCN" font-size="7.5" letter-spacing="1.1" fill="var(--acc)">${label}</text>`;
  const crane=(x,y)=>`<g stroke="var(--comm)" stroke-width="2.1" fill="none" stroke-linecap="round" opacity=".95">
    <line x1="${x}" y1="${y}" x2="${x}" y2="${y-56}"/><line x1="${x-9}" y1="${y-47}" x2="${x+35}" y2="${y-47}"/>
    <line x1="${x}" y1="${y-56}" x2="${x+31}" y2="${y-47}"/><line x1="${x}" y1="${y-56}" x2="${x-9}" y2="${y-47}"/>
    <line x1="${x+27}" y1="${y-47}" x2="${x+27}" y2="${y-33}"/></g>
    <rect x="${x+23}" y="${y-35}" width="8" height="5" rx="1.5" fill="var(--comm)"/>`;
  const CRANE_AT={shed:[300,98],main:[26,196],family:[364,196],away:[196,240]};

  /* --- pitch --- */
  let pitch="";
  for(let i=0;i<9;i++){
    const v0=i/9,v1=(i+1)/9;
    pitch+=`<polygon points="${[[inL(v0),yAt(v0)],[inR(v0),yAt(v0)],[inR(v1),yAt(v1)],[inL(v1),yAt(v1)]].map(pt).join(" ")}" fill="${i%2?C.grass2:C.grass1}"/>`;
  }
  const mk=`stroke="${C.line}" stroke-width="1.4" fill="none"`;
  const [cx,cy]=mapP(0.5,0.5);
  pitch+=quad(mapP,0,1,0,1,mk);
  pitch+=`<line x1="${inL(0.5).toFixed(1)}" y1="${yAt(0.5).toFixed(1)}" x2="${inR(0.5).toFixed(1)}" y2="${yAt(0.5).toFixed(1)}" ${mk}/>
    <ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${((inR(0.5)-inL(0.5))*0.185).toFixed(1)}" ry="${((inR(0.5)-inL(0.5))*0.078).toFixed(1)}" ${mk}/>
    <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="1.6" fill="${C.line}"/>`
    +quad(mapP,0.26,0.74,0,0.15,mk)+quad(mapP,0.22,0.78,0.85,1,mk)
    +quad(mapP,0.42,0.58,-0.022,0,`stroke="${C.line}" stroke-width="1.8" fill="none"`)
    +quad(mapP,0.435,0.565,1,1.022,`stroke="${C.line}" stroke-width="1.8" fill="none"`);

  const shedM=shedMap(G.stands.shed),awayM=awayMap(G.stands.away);
  const bnrCol=protest>=1?"#E07A6A":"var(--acc)";
  const bnr=G.stands.shed>=1?(([bx,by])=>`<text x="${bx.toFixed(1)}" y="${by.toFixed(1)}" text-anchor="middle" font-family="BarlowC" font-style="italic" font-weight="900" font-size="10" fill="${bnrCol}" letter-spacing="2.6">${fanBanner()}</text>`)(shedM(G.stands.shed>=2?0.82:0.78,0.5)):"";
  /* Rung one: hand-painted sheets go up along the side stands. They are drawn
     as bedsheets, because that is what they are. */
  const protestSheets=protest>=1?[[-1,"main"],[1,"family"]].map(([side,k])=>{
    if(G.stands[k]<1)return "";
    const m=sideMap(side,G.stands[k]);
    return [0.30,0.58].slice(0,protest>=2?2:1).map((v,ix)=>
      quad(m,0.10,0.30,v,v+0.14,`fill="#E07A6A" opacity=".${protest>=3?"85":"7"}" stroke="${C.edge}" stroke-width=".5"`)
    ).join("");
  }).join(""):"";

  const out=`<div class="stadwrap"><svg viewBox="0 0 390 250" style="display:block;background:${dark?`linear-gradient(180deg,hsl(${G.hue},24%,11%),hsl(${G.hue},26%,5%))`:"linear-gradient(180deg,#DCE6F1,#EFF2EA)"}">
    <defs>
      <linearGradient id="stCone" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="rgba(247,251,223,.26)"/><stop offset="1" stop-color="rgba(247,251,223,0)"/></linearGradient>
    </defs>
    ${G.fac.screen?`<rect x="193.2" y="50" width="3.6" height="50" fill="${C.mast}"/>
      <rect x="161" y="24" width="68" height="31" rx="3" fill="${C.scr}" stroke="${C.edge}"/>
      <rect x="164" y="27" width="62" height="25" rx="2" fill="${dark?"#0D170F":"#1A231B"}"/>
      <text x="195" y="45" text-anchor="middle" font-family="BarlowC" font-style="italic" font-weight="900" font-size="15" fill="var(--acc)">${G.badge}</text>`:""}
    ${pylon(86,P.fy,34,19)}${pylon(304,P.fy,34,19)}
    ${stand("shed",shedM,22,G.stands.shed>=2?4:3,1.35,100)}${bnr}
    ${pitch}
    ${stand("main",sideMap(-1,G.stands.main),17,3,1.5,2200)}
    ${stand("family",sideMap(1,G.stands.family),17,3,1.5,4400)}
    ${stand("away",awayM,20,2,1.4,6600)}
    ${protestSheets}
    ${G.fac.vip&&G.stands.main>=1?[0.28,0.4,0.52,0.64].map(v=>quad(sideMap(-1,G.stands.main),0.66,0.86,v,v+0.085,`fill="var(--acc)" opacity=".5" stroke="${C.edge}" stroke-width=".6"`)).join(""):""}
    ${cone(86,P.fy,34,54)}${cone(304,P.fy,34,54)}${cone(24,P.ny,48,74)}${cone(366,P.ny,48,74)}
    ${pylon(24,P.ny,48,26)}${pylon(366,P.ny,48,26)}
    ${G.fac.pub?hut(88,74,30,22,"PIES"):""}${G.fac.shop?hut(272,74,30,22,"SHOP"):""}
    ${G.standBuild?crane(CRANE_AT[G.standBuild.key][0],CRANE_AT[G.standBuild.key][1]):""}
  </svg>
  <div class="plaque"><div class="pn">${G.club.split(" ")[0]} Ground</div>
  <div class="pc"><small>${Math.round(full*100)}% FULL · CAPACITY</small><b class="num">${G.capacity.toLocaleString("en-GB")}</b></div></div></div>`;
  stadCache={key,svg:out};
  return out;
}
function fanBanner(){
  // one ladder, one source of truth — the banner says what rung we are on
  const lvl=protestLevel();
  if(lvl>=3)return "STAY AWAY UNTIL THEY GO";
  if(lvl>=2)return "NOT A WORD. NOT A PENNY.";
  if(lvl>=1)return "SACK THE BOARD (THAT'S YOU)";
  return G.fanMood>55?"WE ARE "+G.club.split(" ")[0].toUpperCase():"IN IT TOGETHER. MOSTLY.";
}
function viewTable(){
  // M1: hele pyramiden kan læses — divisionsvælger over tabellen
  ensureWorld();
  const d=(G.tableDiv===undefined||G.tableDiv===null)?G.div:G.tableDiv;
  const bar=`<div class="modes" style="margin-bottom:10px">`+[0,1,2,3].map(x=>`<button class="${d===x?'on':''}" onclick="G.tableDiv=${x};render()">${G.divNames[x].replace("League ","L").replace("Premier Division","Prem")}</button>`).join("")+`</div>`;
  const rows=d===G.div?table()
    :G.worldRest.filter(c=>c.div===d).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||a.name.localeCompare(b.name)).map((c,i)=>({i:-1,n:c.name,pts:c.pts,gd:c.gd,pl:c.pl}));
  return bar+`<div class="card"><div class="kick" style="margin-bottom:6px">${G.divNames[d]}${d===G.div?"":" · andetsteds i pyramiden"}</div>
    <table><tr><th>#</th><th>Klub</th><th class="r">K</th><th class="r">MF</th><th class="r">P</th></tr>
    ${rows.map((r,ix)=>{
      const zone=ix<2?'style="background:var(--acc)"':ix<6?'style="background:var(--comm)"':'style="background:transparent"';
      return `<tr class="${r.i===0?'me':''}"><td class="num">${ix+1}</td><td><span class="zonebar" ${zone}></span>${r.n}</td><td class="r num">${r.pl}</td><td class="r num">${r.gd}</td><td class="r num"><b>${r.pts}</b></td></tr>`;
    }).join("")}</table>
    <div class="kick" style="margin-top:9px;font-size:9px"><span style="color:var(--acc)">▮</span> Direkte oprykning &nbsp; <span style="color:var(--comm)">▮</span> Playoffs (3–6)</div></div>
    ${G.history.length?`<div class="card"><div class="kick" style="margin-bottom:4px">Klubbens historie</div>${G.history.map(hh=>`<div class="rowline"><span>Sæson ${hh.season} <small>· ${hh.div}</small></span><span>${ord(hh.pos)}${hh.promoted?" · OPRYKKET ↑":""}</span></div>`).join("")}</div>`:""}`;
}

function renderModal(){
  if(modal.type==="prematch"){
    const M=modal.match;
    return `<div class="overlay"><div class="sheet">
      ${M.label?`<div class="biglabel">${M.label}</div>`:`<div class="kick">Kampdag ${G.md+1} · ${M.home?"Hjemme":"Ude"}</div>`}

      <p><b>${M.weather.n}</b> — ${M.weather.txt}.</p>
      ${(()=>{ // a thin squad plays short without ever saying so
        const xi=xiList(),out=G.squad.filter(p=>p.inj||p.susp);
        if(xi.length>=11){
          // He never asks you to pick the team. He asks you to give him bodies.
          const tired=xi.filter(p=>freshBand(p)==="flat").length;

        }

          <b>Du kan ikke stille elleve mand.</b> Kun ${xi.length} kampklare i bedst mulige form${out.length?" — "+out.map(p=>p.name.split(" ")[1]).join(", ")+" er ude":""}. Holdet spiller i undertal i dag, og det vil kunne ses.</div>`;
      })()}
      ${(()=>{ // the protest ladder is loudest — or quietest — at home
        if(!M.home||protestLevel()<1)return "";
        const txt=[null,
          "<b>There are banners up in the Shed End.</b> Hand-painted, one of them about you personally. They still came, though. They always come.",

        return `<div class="why" style="border-left-color:rgba(224,90,74,.6);background:rgba(224,90,74,.09)">${txt}</div>`;
      })()}

        return `<button class="abtn ${k==='win'?'comm':''}" onclick="giveOrder('${k}',false)" style="text-align:left"><b>${o.n}</b> — ${o.txt}${k==="free"?"":`<div class="kick" style="font-size:9px;margin-top:3px;opacity:.75">han retter sig efter det ${pct_}% af gangene</div>`}</button>`;
      }).join("")}
      <div class="why" style="font-size:11px">Du siger hvad eftermiddagen skal bruges til; han vælger opstillingen. At jagte sejren brænder ben og koster kort.${G.gafferPatience<35?` <b>Han er ikke i humør til at få besked.</b>`:""}</div>
      <div style="display:flex;gap:8px">
        <button class="abtn ghost" style="flex:1" onclick="giveOrder('win',true)">Insistér på sejren <small style="opacity:.7">— koster hos ham</small></button>
      </div>
      ${M.isPlayoff?"":`<button class="abtn ghost" onclick="prematchBack()">‹ Tilbage <small style="opacity:.7">— intet er fløjtet i gang endnu</small></button>`}
    </div></div>`;
  }
  if(modal.type==="ticker"){
    const M=modal.match;
    return `<div class="overlay"><div class="sheet tickwrap" id="tick">
      ${M.label?`<div class="biglabel">${M.label}</div>`:""}

      ${M.said?`<div class="dlg" style="margin:6px 12px 0"><div class="iav g">GM</div><div class="bubble" style="font-size:11.5px">${M.said}</div></div>`:""}
      <div class="tclock"><b class="num" id="tmin">0'</b></div>

      <div id="tht" style="display:none;margin-top:12px"></div>

      <button class="abtn ghost" id="tskip" onclick="skipTicker()">Spol ▸</button>

    </div></div>`;

  if(modal.type==="nego"){
    const n=nego;

      :n.stage==="fee"?`Prisforhandling · ${n.agent.n} · runde ${Math.min(n.round+1,mr)}/${mr}`:`Kontraktforhandling · ${n.agent.n} · runde ${Math.min(n.cround+1,mr)}/${mr}`;
    const regTake=n.stage==="fee"?(n.feeMin<n.p.value*1.02?"“Smells like a bargain, chairman.”":n.feeMin>n.p.value*1.12?"“They're at the high end. Just so you know.”":"“Fair price, give or take.”"):null;
    let body="";
    if(n.doneDeal){
      body=`<div class="card" style="margin-top:12px">

        <button class="glowbtn" onclick="negoFinish()">Skriv under ✍</button>`;

      body=`<button class="abtn ghost" onclick="negoFinish()">Gå din vej</button>`;

      body=`<div class="stepper">

        <div class="modes" style="margin-top:8px">${[1,2,3,4].map(y=>`<button class="${n.years===y?'on':''}" onclick="nego.years=${y};render()">${y} år${sub(wageDemandFor(y,n.role))}</button>`).join("")}</div>

        <div class="kick" style="margin-top:12px">Ugeløn</div>
        <div class="stepper">
          <button onclick="nego.wageOffer=Math.max(100,nego.wageOffer-500);render()" title="−${kfmt(500)}">‹‹</button>
          <button onclick="nego.wageOffer=Math.max(100,nego.wageOffer-50);render()" title="−${kfmt(50)}">‹</button>
          <span class="val num" style="font-size:24px">${kfmt(n.wageOffer)}/u</span>
