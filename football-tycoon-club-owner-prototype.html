function tvMoney(){const T=BAL.tv;return Math.round(T.base*(Math.pow(T.perDivision,3-G.div)-1)/10)*10;}
/* Erklaeret som funktion, ikke som arrow-const: top-niveau const bliver ikke
   globalt i et vm-script, saa harness ikke kan kalde det -- og en formel der
   ikke kan kaldes udefra kan kun verificeres ved at laese kilden. */
function divPrize(n){return Math.round(n*(1+(3-G.div)*BAL.prize.perDivision)/1000)*1000;}
/* Value = assets + earnings + brand − debt. Four legs, and two of them can be
   negative, so the curve has a direction instead of only a slope. */
function valuationParts(){
  const V=BAL.val,rounds=G.rounds||16;
  const squad=G.squad.reduce((s,p)=>s+p.value,0);
  const facs=Object.keys(FACS).reduce((n,k)=>n+facOwned(k),0);
  const assets=squad+G.capacity*V.perSeat+facs*V.perFacility+V.freehold;

  const sponsorV=sponsorDealValue(rounds)*V.sponsorWeight;
  const earnings=(G.netEwma||0)*V.earningsMultiple+sponsorV+tvMoney()*rounds*V.tvWeight;

  const promos=G.history.filter(h=>h.promoted).length;
  const brand=townDemand()*V.perFan*(0.6+G.fanMood/150)
             +(3-G.div)*V.perDivision
             +(G.titles||0)*V.perTitle
             +promos*V.perPromotion;

  let debt=loansOwed()
          +Math.max(0,-G.balance)*V.debtWeight
          +(G.admins||0)*V.adminScar;                 // a scar that stays put
  debt+=commitmentsOwed();                        // pakke 3: what you already signed away

  const total=Math.max(V.floor,Math.round((assets+earnings+brand-debt)/1000)*1000);
  return {assets:Math.round(assets),earnings:Math.round(earnings),brand:Math.round(brand),debt:Math.round(debt),total};
}
function clubValuation(){return valuationParts().total;}
/* Which way the club is heading, as seen from the boardroom: last season's
   valuation against today's. Rising, and they hold on for the upside. */
function valDirection(){
  const h=G.valHistory||[];
  if(!h.length)return 0;
  const prev=h[h.length-1].v;
  if(!prev)return 0;
  return clamp((clubValuation()-prev)/prev,-0.5,0.5);
}
function trustLevel(){return clamp(G.trust===undefined?BAL.owners.trustStart:G.trust,0,100);}
function bumpTrust(d){G.trust=clamp(trustLevel()+d,0,100);}
function initials(n){return n.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();}

/* ---------- pakke T1: en levende pris ----------
   Egen funktion, så den kan måles udefra — som loanRate(), cardRisk(), easeMood().
   ovr() er deklareret længere nede, men funktions-deklarationer hejses, og
   playerValuation kaldes først på køretid (efter hele scriptet er evalueret),
   så opslaget er trygt. */
function ageValueFactor(age){
  const A=BAL.market.ageCurve;
  if(age>=A.primeLo&&age<=A.primeHi)return A.prime;          // 25-29: peak
  if(age<A.primeLo)return A.youngAt24-(A.primeLo-1-age)*A.youngSlope; // toward peak, a touch under
  if(age<A.declineFrom)return A.shoulder;                    // 30: shoulder
  return Math.max(A.floor,A.shoulder-(age-A.declineFrom+1)*A.declineRate); // 31+ falls
}
function contractValueFactor(years){
  // one year left = Bosman-cheap; each year above one adds value
  return 1+BAL.market.contractYearsWeight*((years||2)-2);
}
function posScarcity(pos){
  const m=G&&G.market;if(!m||!m.length)return 0;
  const share=m.filter(p=>p.pos===pos).length/m.length;
  const expected=1/5;                       // a six-slot market spread over ~five position groups
  return clamp((expected-share)/expected,-1,1);   // positive when the position is short
}
function playerValuation(p){
  const M=BAL.market,o=ovr(p);
  let v=o*o*M.ovrExp;                        // the old curve, still the spine
  v*=1+M.posScarcity*posScarcity(p.pos);     // a shortage lifts the price
  v*=ageValueFactor(p.age);                  // peak 25-29, falls from 31
  v*=1+M.formWeight*((p.conf-50)/50);        // form/confidence
  v*=contractValueFactor(p.years);           // 1 year left is cheap; 4 is dear
  v*=(p.desperation||1);                     // the skint seller's discount (the heist)
  v*=(p.valNoise||1);                        // hidden spread, fixed at generation
  return Math.max(1000,Math.round(v/1000)*1000);
}
/* C3: en spiller foedes uden tid i klubben; den saettes naar han skriver under
   (negoFinish) eller, for arvetruppen, af newGame's efterbehandling nedenfor. */
function genPlayer(pos,base,wmult){
  const att=clamp(base+ (pos==="FW"?R(2,8):pos==="MF"?R(-2,4):R(-10,-2)),30,90);
  const def=clamp(base+ (pos==="GK"||pos==="DF"?R(2,8):pos==="MF"?R(-2,4):R(-10,-2)),30,90);
  const phy=clamp(base+R(-4,6),30,90);
  const ov=Math.round((att+def+phy)/3);
  const age=R(18,33);
  const traits=[];
  if(Math.random()<0.35)traits.push(pick(Object.keys(TRAITS)));
  if(Math.random()<0.08)traits.push(pick(Object.keys(TRAITS)));
  // pakke T2: the hidden ceiling. Young players get a wide spread above their
  // current ability; the older get almost none. Stored, never shown.
  const S=BAL.talent.potSpread,sp=age<BAL.talent.youngUnder?S.young:S.old;
  const pot=clamp(ov+R(sp[0],sp[1]),ov,BAL.talent.potCap);
  const p={id:PID++,name:pick(FIRST)+" "+pick(LAST),pos,att,def,phy,form:0,age,
    wage:Math.round((ov*BAL.wages.scale*wmult+R(-70,110))/10)*10,
    value:0,pot,scouted:0,agentKey:BAL.agents.list[Math.floor(Math.random()*BAL.agents.list.length)].key,
    traits:[...new Set(traits)],gem:false,inj:0,susp:0,sg:0,sapps:0,smotm:0,load:0,
    conf:R(42,60),capps:0,promiseMD:null,years:R(1,3),from:null,fromIdx:-1,
    desperation:1,heist:false,valNoise:1+(Math.random()*2-1)*BAL.market.noise,
    listed:false,reqDone:false,renewLockMD:-99,
    /* C3: hvor laenge han har vaeret HER. Saettes fra foedslen, saa feltet ikke
       foerst opstaar ved en indlaesning -- gem/indlaes skal vaere tabsfri.
       negoFinish saetter den forfra naar han skriver under hos dig. */
    since:(typeof G!=="undefined"&&G&&Number.isFinite(G.season))?G.season:0};
  p.value=playerValuation(p);
  return p;
}
/* Pakke T2: the uncertainty band. A young player never shows his ceiling — only
   a range that narrows as p.scouted rises. Returns null for anyone who does not
   carry a meaningful ceiling (the old, or a save from before T2). The RAW pot
   must never leave this function into the markup — the invariant proves it. */
/* N4: `owned` = én af DINE spillere. Så viser vi altid et loft — også for de
   ældre (hvor båndet er "at his ceiling") — og et SNÆVRERE bånd, fordi du kender
   dine egne folk. Markedet (owned falsk) er som før: kun de unge, bredere bånd. */
function potBand(p,owned){
  const T=BAL.talent,o=ovr(p);
  if(p.pot===undefined)return null;
  if(!owned&&(p.age>=T.youngUnder||p.pot<=o))return null;
  if(p.pot<=o)return {lo:o,hi:o,exact:true,atCeiling:true};   // owned & fully grown
  let hw=T.bandByScout[Math.min(p.scouted||0,T.bandByScout.length-1)];
  if(owned)hw=Math.max(1,Math.round(hw*T.ownedNarrow));       // you know your own players
  if(hw===0)return {lo:p.pot,hi:p.pot,exact:true};
  return {lo:clamp(p.pot-hw,o,99),hi:clamp(p.pot+hw,o,99),exact:false};
}
function potBandText(p,owned){
  const b=potBand(p,owned);if(!b)return "";
  if(b.atCeiling)return "at his ceiling — grown";
  return b.exact?("ceiling <b>"+b.hi+"</b>"):("potential <b>"+b.lo+"–"+b.hi+"</b>");
}
/* Every market player TILHØRER a named club in G.teams — no clubless ghosts.
   fromIdx is an index (never a reference: G must stay a tree). reseedLeague()
   mutates the team objects in place and never rebuilds the array, so an index
   stays valid across a whole career. */
function assignClub(pl,idx){
  if(!(idx>=0&&idx<G.teams.length))idx=Math.floor(Math.random()*G.teams.length);
  pl.fromIdx=idx;pl.from=G.teams[idx].name;
  return pl;
}
function marketBase(t){
  // a market man is usually a club's fringe player, rarely a standout — so a
  // strong club's spare is dear and a weak club's key man is within reach
  const core=Math.round((t.att+t.def+t.phy)/3);
  return clamp(core+R(BAL.market.baseSpreadLo,BAL.market.baseSpreadHi),34,84);
}
function genMarketPlayer(pos,lift){
  const idx=Math.floor(Math.random()*G.teams.length);
  const t=G.teams[idx];
  const pl=genPlayer(pos,clamp(marketBase(t)+(lift||0),34,88),G_DIV_WAGE(G.div));  // N6: lift = a marquee deadline steal
  assignClub(pl,idx);
  // the heist: a skint club dumps a good man cheap. Rare, and likelier at the
  // clubs that have least — a last-minute coup, not a standing discount.
  const D=BAL.market.desperation,core=Math.round((t.att+t.def+t.phy)/3);
  if(Math.random()<D.chance+(core<D.weakBelow?D.weakBias:0)){
    pl.desperation=D.discount;pl.heist=true;pl.value=playerValuation(pl);
  }
  return pl;
}
function refreshMarket(){
  G.market=["GK","DF","DF","MF","MF","FW"].map(p=>genMarketPlayer(p));
  G.freeAgents=["DF","MF","FW"].map(p=>{const pl=genMarketPlayer(p);pl.desperation=1;pl.heist=false;pl.wage=Math.round(pl.wage*BAL.wages.freeAgentMult/10)*10;pl.free=true;pl.value=playerValuation(pl);return pl;});
}
/* N3: en frisk liste navne — reklame/IAP. Beholder verserende bud og Reg's gem,
   skifter resten ud. En repeterbar "opdatér markedet nu". */
function marketReroll(){
  const kept=G.market.filter(p=>p.pendingBid||p.gem);
  const slots=["GK","DF","DF","MF","MF","FW"];
  const need=Math.max(4,6-kept.length);
  const fresh=slots.slice(0,need).map(pos=>genMarketPlayer(pos));
  G.market=[...kept,...fresh];
  addNews("MARKET","A fresh list lands on Reg's desk — new names to look at.");
}
function startMarketRefresh(){modal={type:"rewarded",reward:"market"};render();}
function marketFlow(){ // the living market: names in, names out — window days are worth checking
  if(!windowOpen())return;
  // N3: friske navne oftere — ca. hver 2.-3. kampdag i vinduet
  if(G.market.length<9&&Math.random()<0.5){
    const pl=genMarketPlayer(pick(["GK","DF","DF","MF","MF","FW"]));
    G.market.push(pl);
    addNews("MARKET",pl.from+(pl.heist?" — short of cash — quietly make "+pl.name+" available BELOW value. Reg is already reaching for his coat.":" quietly make "+pl.name+" available. Reg has already circled the name."));
  }
  if(G.market.length>3&&Math.random()<0.22){
    const ix=G.market.findIndex(p=>!p.pendingBid&&!p.gem);
    if(ix>=0){const pl=G.market[ix];const buyer=pick(G.teams);
      G.market.splice(ix,1);
      buyer.att=clamp(buyer.att+1,40,78);
      addNews("MARKET",buyer.name+" sign "+pl.name+" from "+pl.from+". One you looked at, chairman. Just saying.");}
  }
  if(G.freeAgents.length<4&&Math.random()<0.2){
    const pl=genMarketPlayer(pick(["DF","MF","FW"]));
    pl.desperation=1;pl.heist=false;pl.wage=Math.round(pl.wage*BAL.wages.freeAgentMult/10)*10;pl.free=true;pl.value=playerValuation(pl);
    G.freeAgents.push(pl);
    addNews("MARKET",pl.name+" released by "+pl.from+" — a free agent with a point to prove.");
  }
  // AI clubs trade among themselves — the table shifts under your feet
  if(Math.random()<0.18){
    const a=pick(G.teams);let b;do{b=pick(G.teams)}while(b===a);
    const fee=R(30,140);
    a.att=clamp(a.att+1.5,40,78);b.att=clamp(b.att-1,40,78);
    addNews("LEAGUE",a.name+" smash their record to sign "+b.name+"'s top scorer (£"+fee+"k). "+b.name+" fans are burning scarves.");
  }
}

/* ---------- fixtures ---------- */
function makeFixtures(){
  const rounds=[];const arr=[...Array(13).keys()].map(i=>i+1);
  for(let r=0;r<13;r++){
    const line=[0].concat(arr);const pairs=[];
    for(let i=0;i<7;i++)pairs.push([line[i],line[13-i]]);
    rounds.push(pairs.map(([a,b])=>r%2?[b,a]:[a,b]));
    arr.unshift(arr.pop());
  }
  return rounds.concat(rounds.map(rd=>rd.map(([a,b])=>[b,a])));
}

/* ---------- freshness ----------
   p.load is what is STORED; freshness is derived from it. Storing the derived
   value instead would need a second rule for how it refills, and the two would
   drift apart the moment either is tuned. */
function freshOf(p){
  const F=BAL.fresh;
  return clamp(Math.round(100-Math.max(0,(p.load||0)-F.free)*F.slope),0,100);
}
/* Age does not decide whether a man tires — it decides how fast. */
function loadCost(p){
  const F=BAL.fresh;
  let c=F.cost*(1+Math.max(0,p.age-F.ageFrom)*F.agePerYear);
  if(p.traits.includes("glass"))c+=F.glassCost;
  if(p.traits.includes("grafter"))c+=F.grafterCost;
  return Math.max(0.1,c);
}
function loadDecay(){return BAL.fresh.decay+BAL.fresh.trainingRecovery*facRate("training");}
/* Tired legs give less of themselves — most of it physical, some of it touch. */
function phyMult(p){
  const F=BAL.fresh;
  return F.phyFloor+(1-F.phyFloor)*Math.min(1,freshOf(p)/F.softFrom);
}
function skillMult(p){return 1-(1-phyMult(p))*BAL.fresh.skillShare;}
function freshBand(p){
  const f=freshOf(p);
  return f>=BAL.fresh.bandFresh?"fresh":f>=BAL.fresh.bandUsed?"used":"flat";
}
function freshCount(){return available().filter(p=>freshOf(p)>=BAL.fresh.bandUsed).length;}
function squadFreshness(){
  const a=available();
  return a.length?Math.round(a.reduce((s,p)=>s+freshOf(p),0)/a.length):100;
}
/* Applied once per matchday, to the whole squad: those who played take load on,
   everyone else — bench, injured, suspended — sheds it. */
function applyLoad(playedIds){
  const d=loadDecay(),played=new Set(playedIds);
  /* Pakke 25: en eftermiddag hvor der blev jagtet en sejr koster mere i ben end
     en hvor der blev holdt fast. Prisen ligger paa BELASTNINGEN og ikke paa et
     nyt tal, saa den gaar gennem friskhedssystemet der allerede findes. */
  const chase=1+(G.lastOrder==="win"?BAL.orders.winFresh:0);
  for(const p of G.squad){
    const l=(p.load||0)*d+(played.has(p.id)?loadCost(p)*chase:0);
    p.load=Math.round(Math.max(0,l)*1000)/1000;   // keep the save small and exact
  }
}

/* ---------- strength ---------- */
function available(){return G.squad.filter(p=>!p.inj&&!p.susp);}
/* The gaffer picks the eleven — the chairman never does. Freshness is simply
   one more thing he weighs, and a high-MAN gaffer weighs it heavier: he rests
   men in time, a low one rides his star into the ground. Rotation only happens
   if there is cover — with thirteen men and two injuries the tired play. */
function restWeight(){return BAL.fresh.restBase+G.coach.man/BAL.fresh.restManDiv;}
function bestXI(){
  const rw=restWeight();
  const by=p=>p.att+p.def+p.phy+p.form*2-(100-freshOf(p))*rw;
  const sq=[...available()].sort((a,b)=>by(b)-by(a));
  const take=(pos,n)=>sq.filter(p=>p.pos===pos).slice(0,n);
  return {gk:take("GK",1),df:take("DF",4),mf:take("MF",4),fw:take("FW",2)};
}
function xiList(){const xi=bestXI();return [...xi.gk,...xi.df,...xi.mf,...xi.fw];}
function myPhy(){const l=xiList();return l.length?l.reduce((s,p)=>s+p.phy*phyMult(p),0)/l.length:40;}
function myStrength(){
  const xi=bestXI();
  const avg=(arr,f)=>arr.length?arr.reduce((s,p)=>s+f(p),0)/arr.length:35;
  let leader=G.squad.some(p=>p.traits.includes("leader"))?1.5:0;
  const cap=byId(G.captain);
  if(cap&&cap.traits.includes("leader"))leader+=1; // the right armband amplifies
  const all=[...xi.df,...xi.mf,...xi.fw];
  const confAvg=(avg(all,p=>p.conf)-50)/22; // confidence: the slow layer
  const formAvg=avg(all,p=>p.form)+confAvg;
  // tired legs turn up, but they don't turn up all the way
  const A=p=>p.att*skillMult(p),D=p=>p.def*skillMult(p);
  const att=avg(xi.fw,A)*0.5+avg(xi.mf,A)*0.35+avg(xi.df,A)*0.15;
  const def=avg(xi.gk,D)*0.35+avg(xi.df,D)*0.45+avg(xi.mf,D)*0.2;
  const coachB=(G.coach.tac+G.coach.man)/2/16;
  return {att:att+formAvg+coachB+leader,def:def+formAvg+coachB+leader};
}
function bigGameBonus(){return G.squad.some(p=>p.traits.includes("biggame"))?2.5:0;}

/* ---------- match sim: two halves, weather, approach, atmosphere ---------- */
/* Pakke 14a. The silence used to REPLACE the whole expression with a flat
   `silentHome`, which made it a FLOOR and not a punishment: a club with a full
   ground and a Shed End sits around 0.18-0.28 normally, so anything above that
   turned a protest into a home advantage. That is why 0.20 made the suite red in
   7 of 20 runs, and why QA's tipping point of 0.16-0.17 cannot be carried over —
   it was measured on a knob with the wrong shape.
   Now the quiet is a MULTIPLIER on the crowd term alone. The silence takes the
   twelfth man, exactly as the GDD says, and never the ground itself: you can
   only lose a crowd you had, so the punishment is proportional, and the Shed
   End keeps paying on every rung. */
function homeBonus(big){ // dynamic 12th man: crowd × mood × Shed End
  const H=BAL.home,quiet=protestLevel()>=2?BAL.protest.silentCrowd:1;
  return H.base+H.crowd*(attendance(big)/G.capacity)*(G.fanMood/100)*quiet+G.stands.shed*BAL.stands.shedHome;
}
function myLambdas(t,home,big,appr,weather){
  const s=myStrength();
  const phyEdge=weather.phys*((myPhy()-(t.phy||50))/28);
  const bg=big?bigGameBonus()/24:0;
  const reunion=G.squad.some(p=>p.from===t.name)?0.1:0; // something to prove
  const lm=clamp(1.05+(s.att-t.def)/24+(home?homeBonus(big):0)+appr.own+phyEdge+bg+reunion,0.15,3.6);
  const lo=clamp(1.05+(t.att-s.def)/24+(home?0:0.28)+appr.opp-phyEdge*0.6,0.15,3.6);
  return [lm,lo];
}
/* ---------- pakke 5: which afternoons are BIG ----------
   Derived, never declared. The table exists, the fixture list exists, and the
   first half of the season is already a record of who did what to you — so no
   new competition is needed to find 3-5 matches a season that matter more than
   the rest. Returns the LABEL (which the prematch sheet and the ticker already
   know how to show) or null. `big` is then simply `!!bigMatchReason(...)`.
   Deliberately NOT a big match: anything in the first two thirds of a season
   that is not first-against-second. Early-season tables lie. */
function bigMatchReason(oppIdx){
  const B=BAL.big,t=table();
  const pos=t.findIndex(r=>r.i===0)+1, me=t[pos-1];
  const oi=t.findIndex(r=>r.i===oppIdx); if(oi<0||!me)return null;
  const oppPos=oi+1;
  /* Pakke 16/17c. The drop zone: the last `spots` places, and only where there
     IS a drop. League Three has nothing below it, so its bottom is just a bad
     season — which is exactly why relegation had to exist before the bottom
     could produce a big afternoon. */
  const dropFrom=G.div<BAL.relegation.floorDiv?t.length-BAL.relegation.spots+1:null;
  // 1. Final day with something still open — promotion, the playoff cut, or the drop
  if(G.md===G.rounds-1){
    for(const c of B.cuts){
      const row=t[c-1];
      if(row&&Math.abs(me.pts-row.pts)<=B.cutGap)
        return c===2?"FINAL DAY · PROMOTION AT STAKE":"FINAL DAY · PLAYOFF PLACE AT STAKE";
    }
    if(dropFrom){
      const row=t[dropFrom-1];
      if(row&&Math.abs(me.pts-row.pts)<=B.cutGap)return "FINAL DAY · SURVIVAL AT STAKE";
    }
  }
  /* 2. The top of the table. Was strictly 1st against 2nd, which QA measured at
     0,064 times a season — once every sixteenth season, i.e. decoration. The
     requirement was never that the two clubs be exactly first and second, but
     that the afternoon decide the top of the table: both inside `topClash` and
     level enough on points for it to matter. */
  if(G.md>=B.lateFrom&&pos<=B.topClash&&oppPos<=B.topClash&&Math.abs(me.pts-t[oi].pts)<=B.rivalPts)
    return pos<=2&&oppPos<=2?"TOP OF THE TABLE":"TOP OF THE TABLE · AND THEY CAN CATCH YOU";
  /* 3. The club just above or below you, late on and inside the race. Both
     tests have to pass: near you in the table AND near you on points. Position
     alone would make a 9-point gap a six-pointer whenever the table happened to
     be strung out; points alone would pair you with a club eleven places away
     on an even afternoon. Neither is a six-pointer.
     Pakke 17c: the race can now be at either end. `rivalTop` is the promotion
     race; `rivalBottom` is the scrap above the drop — and that one does NOT dry
     up when the club settles into mid-table at the top of the pyramid, which is
     precisely when the other three sources stop firing. */
  const inRace=pos<=B.rivalTop, inScrap=dropFrom&&pos>=dropFrom-B.rivalBottom;
  if(G.md>=B.lateFrom&&Math.abs(pos-oppPos)<=B.rivalGap&&(inRace||inScrap)
     &&Math.abs(me.pts-t[oi].pts)<=B.rivalPts)
    return inScrap&&!inRace
      ? (oppPos<pos?"RELEGATION SCRAP · THEY'RE ABOVE YOU":"RELEGATION SCRAP · AND THEY'RE COMING FOR YOU")
      : (oppPos<pos?"SIX-POINTER · THEY'RE ABOVE YOU":"SIX-POINTER · THEY'RE BREATHING DOWN YOUR NECK");
  // 4. The return leg against whoever humiliated you before Christmas
  if(G.revenge&&G.revenge.opp===oppIdx&&G.md>G.revenge.md)return "THE RETURN · THEY PUT "+G.revenge.by+" PAST YOU";
  return null;
}
function buildMatch(oppIdx,home,big,label){
  const t=G.teams[oppIdx-1];
  return {oppIdx,opp:t.name,home,big,label,weather:pick(WEATHERS),approach:null,
          h1:null,h2:null,htDone:false,events:[],scorersLog:[],used:[]};
}
function simHalf(match,mods){
  const t=G.teams[match.oppIdx-1];
  const [lm,lo]=myLambdas(t,match.home,match.big,APPROACHES[match.approach],match.weather);
  const gf=poisson(lm/2*(mods?mods.own:1)), ga=poisson(lo/2*(mods?mods.opp:1));
  return {gf,ga};
}
function halfEvents(match,half,gf,ga){
  const ev=[];const scorers=xiList().filter(p=>p.pos==="FW"||p.pos==="MF");
  const lo=half===1?2:46, hi=half===1?44:90;
  // guard the retry loop: a busy half can otherwise exhaust the minute range
  const mins=new Set();const mkMin=()=>{let m,tries=0;do{m=R(lo,hi)}while(mins.has(m)&&++tries<40);mins.add(m);return m;};
  /* Pakke 6: every line is drawn through pickLine() with the situation's tags
     and the match's own used-list, so no sentence is read twice in one
     afternoon and the tone follows the weather, the scoreline and the stakes. */
  if(!match.used)match.used=[];
  const base=matchCtx(match,half);
  const at=m=>eventCtx(base,m);
  const surname=p=>p.name.split(" ")[1];
  for(let i=0;i<gf;i++){
    const p=pick(scorers.length?scorers:xiList());
    const pen=Math.random()<0.12;
    const m=mkMin(),ctx=at(m);
    /* Pakke 20: maalscoreren gemmes paa ID, ikke som objektreference. Kampen
       ligger nu i G, og G skal forblive et TRAE -- en delt objektreference
       overlever ikke en JSON-runde, saa manden der scorede ville blive en kopi
       af sig selv efter en genindlaesning. Claude.md siger det samme om alt
       andet: spillere noegles paa id, aldrig paa objektet. */
    ev.push({m,goal:"me",scorerId:p.id,txt:(pen?"PENALTY! ":"GOAL! ")+surname(p).toUpperCase()+"!",
      sub:pen?fillName(pickLine(PENDESC,ctx,match.used),surname(p))
             :p.name+" "+pickLine(GOALDESC,ctx,match.used)+"."});
    if(Math.random()<BAL.text.momentumChance){const m2=Math.min(hi,m+R(2,5));ev.push({m:m2,txt:pickLine(MOMENTUM,at(m2),match.used)});}
  }
  const ghost=G.soldTo.find(x=>x.club===match.opp);
  for(let i=0;i<ga;i++){
    const m=mkMin();
    if(ghost&&i===0&&Math.random()<0.4){
      ev.push({m,goal:"them",txt:"Goal — "+ghost.name.split(" ")[1]+", OF COURSE",
        sub:fillName(pickLine(ghost.bitter?GHOSTBITTER:GHOSTWARM,at(m),match.used),ghost.name)});
    }else ev.push({m,goal:"them",txt:"Goal — "+match.opp,sub:pickLine(OPPGOAL,at(m),match.used)});
  }
  const nm=BAL.text.nearmissBase+(match.big?1:0);   // R4: udtyndet — før 2-3 pr. halvleg
  for(let i=0;i<nm;i++){
    const p=pick(scorers.length?scorers:G.squad),m=mkMin();
    ev.push({m,txt:fillName(pickLine(NEARMISS,at(m),match.used),surname(p))});
  }
  if(Math.random()<BAL.text.disallowed){const m=mkMin();ev.push({m,txt:pickLine(DISALLOWED,at(m),match.used)});}
  ev.sort((a,b)=>a.m-b.m);
  return ev;
}
/* Egen funktion, saa kortrisikoen kan MAALES udefra frem for at drives frem
   gennem hundrede kampe -- samme greb som loanRate og proDevBonus. Specen for
   pakke 25: at jagte en sejr haever skades- OG kortrisiko. Skaderne var koblet
   (winInjury), kortene var et fladt tal der ignorerede ordren. */
function cardRisk(order){const O=BAL.orders;return O.cardBase*(1+(order==="win"?O.winCard:0));}
/* R4: loftet paa kommentaren. Maal og keep-events (kort, skader) overlever
   ALTID — kun flavour (nearmiss/momentum/annulleret) viger, i kronologisk
   orden paa tvaers af halvlegene, til kampen er nede paa BAL.text.tickerMax. */
function trimTicker(match){
  const isCore=e=>!!(e.goal||e.keep);
  let slots=Math.max(0,BAL.text.tickerMax-[...match.events,...match.h2events].filter(isCore).length);
  const trim=list=>list.filter(e=>isCore(e)||slots-->0);
  match.events=trim(match.events);
  match.h2events=trim(match.h2events);
}
function matchIncidents(match){ // red cards & injuries with consequences
  const out=[];
  if(Math.random()<cardRisk(match.order)){
    // jagter du sejren, falder de ekstra kort mest paa DINE spillere
    const mine=Math.random()<(match.order==="win"?BAL.orders.winCardMine:0.5);
    // R4: konsekvensen staar I linjen (ingen sub uden for maal), og keep-flaget
    // holder kort/skader fri af flavour-trimmet — de aendrer truppen.
    if(mine){const p=pick(xiList());p.susp=1;out.push({m:R(20,85),keep:true,txt:"RED CARD! "+p.name.split(" ")[1]+" sees red — suspended next matchday."});}
    else out.push({m:R(20,85),keep:true,txt:"RED CARD — "+match.opp+" down to ten!"});
  }
  /* The loop that closes itself: thin squad → no rotation → tired legs → injury
     → thinner squad. It stops hurting the moment you buy depth. */
  {
    const F=BAL.fresh,p=pick(xiList());
    if(p){
      const cr=facRate("clinic");
      const scale=F.injuryScale*(cr?F.clinicScale:1);
      const risk=Math.max(F.injClinic*BAL.fac.injFloor,F.injBase+(F.injClinic-F.injBase)*cr)*(1+(100-freshOf(p))/100*scale)*(1+(match.order==="win"?BAL.orders.winInjury:0));
      if(Math.random()<risk){
        p.inj=Math.max(1,R(2,4)-(facLvl("clinic")?BAL.fresh.clinicInjDays:0));
        out.push({m:R(10,80),keep:true,txt:"Injury: "+p.name.split(" ")[1]+" pulls up — out "+p.inj+" matchday"+(p.inj===1?"":"s")+
          (freshOf(p)<F.bandUsed?" (he was running on empty)":"")+"."});
      }
    }
  }
  return out;
}

/* ---------- matchday flow ---------- */
function playMatchday(){
  if(G.phase!=="season"||G.md>=G.rounds)return;
  /* C2: staar deadline day aabent, er det DEN der skal afgoeres foerst. Uden
     denne gate kunne man trykke "spil kampdag" fra en anden skaerm og gaa forbi
     hele aftenen -- deadlineDone er allerede sat, saa den ville ikke komme igen. */
  if(G.dl){screen="deadline";keepScroll=false;render();return;}
  const dKey=G.md===5?"summer":G.md===14?"winter":null;
  if(dKey&&!G.deadlineDone[dKey]){G.deadlineDone[dKey]=true;openDeadline(dKey);return;}
  const round=G.fixtures[G.md];
  const my=round.find(([h,a])=>h===0||a===0);
  const home=my[0]===0;const oppIdx=home?my[1]:my[0];
  const reason=bigMatchReason(oppIdx);
  const match=buildMatch(oppIdx,home,!!reason,reason);
  // The weather belongs to the MATCHDAY, not to the visit: otherwise backing out
  // of the team talk and returning would re-roll it until you liked it.
  if(!G.mdWeather||G.mdWeather.md!==G.md||G.mdWeather.season!==G.season)G.mdWeather={md:G.md,season:G.season,w:{...match.weather}};
  match.weather={...G.mdWeather.w};   // a copy: state stays a tree, never a graph
  // The rest of the division is NOT played yet — that happens the moment you
  // commit to an approach (choosePrematch), so stepping back costs nothing and,
  // crucially, cannot simulate the round twice.
  modal={type:"prematch",match,round};
  // M2.5: står du HJEMME (ejer-laget), blander du dig ikke — gafferen får
  // "din afgørelse", og kampen afvikles uden teamtalk-modalen.
  if(G.layer==="owner"&&!match.isPlayoff){giveOrder("free",false);return;}
  render();
}
function clubPress(c,gf,ga){
  const W=BAL.world;
  c.press=clamp((c.press===undefined?W.pressStart:c.press)+(gf>ga?W.pressWin:gf<ga?W.pressLoss:0),0,100);
}
function simRestOfRound(round){
  for(const [h,a] of round){
    if(h===0||a===0)continue;
    const H=G.teams[h-1],A=G.teams[a-1];
    const lh=clamp(1.15+(H.att-A.def)/22+0.25,0.25,3.4), la=clamp(1.15+(A.att-H.def)/22,0.2,3.2);
    const gh=poisson(lh),ga=poisson(la);
    applyPts(h,gh,a,ga);
    clubPress(H,gh,ga);clubPress(A,ga,gh);
  }
  simWorldRound();   // M1: resten af pyramiden spiller også i eftermiddag
}
/* M1: de tre andre divisioner spiller deres runde — simpel parring, samme
   styrkeformel. Ingen fixtures-bogholderi for AI-divisioner (prototype-ærligt:
   de spiller "en runde"); tabellerne lever, og det er dem verden læses på. */
function simWorldRound(){
  if(!G.worldRest)return;
  for(let d=0;d<BAL.world.divs;d++){
    if(d===G.div)continue;
    const clubs=G.worldRest.filter(c=>c.div===d);
    const order=[...clubs].sort(()=>Math.random()-0.5);
    for(let i=0;i+1<order.length;i+=2){
      const H=order[i],A=order[i+1];
      const lh=clamp(1.15+(H.att-A.def)/22+0.25,0.25,3.4), la=clamp(1.15+(A.att-H.def)/22,0.2,3.2);
      const gh=poisson(lh),ga=poisson(la);
      H.pl++;A.pl++;H.gd+=gh-ga;A.gd+=ga-gh;
      if(gh>ga)H.pts+=3;else if(ga>gh)A.pts+=3;else{H.pts++;A.pts++;}
      clubPress(H,gh,ga);clubPress(A,ga,gh);
    }
  }
}
function prematchBack(){modal=null;render();}
function gafferRead(match){
  const t=G.teams[match.oppIdx-1];const s=myStrength();
  const bits=[];
  bits.push(t.att>s.def+4?"They're sharp up front — we'll need concentration":t.def>s.att+4?"They sit deep and defend well — patience":"Man for man, we match them");
  if(match.weather.phys>=0.5)bits.push((myPhy()>(t.phy||50)?"and this "+match.weather.n.toLowerCase()+" suits US — we're the stronger side":"and this "+match.weather.n.toLowerCase()+" worries me — they're the more physical side"));
  const ghost=G.soldTo.find(x=>x.club===match.opp);
  if(ghost)bits.push("and mind "+ghost.name.split(" ")[1]+" — "+(ghost.bitter?"he left here angry, and angry men score":"old boys always find a goal against us, it's the law"));
  const returning=G.squad.find(p=>p.from===match.opp);
  if(returning)bits.push(returning.name.split(" ")[1]+" faces his old club — he's been first to training all week");
  return "\""+bits.join(", ")+".\"";
}
/* ---------- nat 4, pakke 25: formandens ord foer kampen ----------
   Du beder om et RESULTAT. Han vaelger tilgangen. */
const ORDERS={
 win:{n:"Vi skal have tre point",txt:"Gå ud og vind den. Jeg er ligeglad med hvordan det ser ud."},
 point:{n:"Et point er nok",txt:"Tag uafgjort hvis det ligger der. Smid det ikke væk på en jagt."},
 free:{n:"Din afgørelse",txt:"Du ser dem hele ugen. Du bestemmer."}
};
/* Hans stil farver hvordan han LAESER ordren -- en forsigtig gaffer hedger
   stadig, naar han faar besked paa at jagte sejren.
   EKSPLICIT tabel og ikke en regex over stilnavnet. Foerste udgave sniffede
   ("attack|front|bold|cavalier"), og den ramte to af de otte traenere: seks
   havde ingen haeldning overhovedet, saa "tre point" og "et point" viste
   noejagtig samme accept-odds hos tre fjerdedele af alle gaffere. Det saa jeg
   foerst da jeg laeste den renderede prematch-markup. En tabel kan mangle en
   noegle, og DET kan en invariant se -- en regex der ikke matcher, ser ud som
   om alt er i orden. */
const COACH_LEAN={attacking:1, direct:1, defensive:-1, technical:-1,
                  balanced:0, "man-management":0, youth:0, academy:0};
function gafferLean(){
  const st=(G.coach||{}).style;
  return COACH_LEAN[st]||0;
}
/* Hvor sandsynligt er det at han goer som du siger? Vises FOER du beder om
   noget -- du har en stemme, ikke magten, og nu kan du se hvor staerk den er. */
function gafferAcceptOdds(order){
  const O=BAL.orders;
  if(order==="free")return 1;
  const pat=(G.gafferPatience===undefined?O.startPatience:G.gafferPatience)/100;
  const lean=gafferLean();
  const with_=order==="win"?lean:-lean;      // beder du om det han selv vil, siger han lettere ja
  /* Stilen (gafferLean) farver RETNINGEN af hvad han vil; men hans tac/man-tal
     farver hvor haardt han holder paa sit. En hoej man-manager foejer sig efter
     formanden; en taktisk purist (hoej tac, lav man) graver sig ned. Det er
     "TAC/MAN farver hvordan han laeser ordren" fra specen -- lagt paa oddsene,
     hvor tallene betyder noget, frem for paa retningen, hvor de ikke goer. */
  const c=G.coach||{};
  const manLean=(((c.man||50)-(c.tac||50))/100);
  return clamp(O.oddsBase+(pat-0.5)*2*O.oddsPatience+with_*O.oddsStyle+manLean*O.oddsMan,0.05,0.98);
}
/* Prisen for at overtrue gafferen -- lagt i egen funktion, saa den kan MAALES
   isoleret i stedet for gennem giveOrder, der kaskaderer videre ind i
   choosePrematch og selv roerer stemningen. Specen: "Tvinger du det igennem,
   koster det tillid og moral" -- oveni taalmodigheden. Bruges baade af ordren
   foer kamp og af "riv dem et nyt et" i pausen. */
function insistCost(){
  const O=BAL.orders;
  G.gafferPatience=clamp((G.gafferPatience===undefined?O.startPatience:G.gafferPatience)+O.insistPatience,0,100);
  bumpTrust(O.insistTrust);
  G.fanMood=clamp(G.fanMood+O.insistMood,5,100);
}
function gafferPicks(order,match){
  const lean=gafferLean();
  if(order==="win")return lean<0?"bal":"allout";
  if(order==="point")return lean>0?"bal":"caut";
  // "din afgoerelse": han laeser modstanderen, ikke dig
  const t=G.teams[match.oppIdx-1]||{};const s=myStrength();
  const gap=(s.att+s.def)/2-((t.att||50)+(t.def||50))/2;
  return gap>4?"allout":gap<-4?"caut":lean>0?"allout":lean<0?"caut":"bal";
}
/* Hans EGEN vurdering, naar han ikke foelger ordren. */
function gafferOwnChoice(match){return gafferPicks("free",match);}
function giveOrder(order,insist){
  const O=BAL.orders,m=modal,match=m.match;
  if(G.gafferPatience===undefined)G.gafferPatience=O.startPatience;
  const odds=gafferAcceptOdds(order);
  const obeyed=order==="free"||insist||Math.random()<odds;
  const appr=obeyed?gafferPicks(order,match):gafferOwnChoice(match);
  if(insist&&order!=="free"){
    insistCost();
    addNews("CLUB","The gaffer was told, not asked. He did it. He also said nothing on the way out.");
  }
  match.order=order;match.obeyed=obeyed;match.said=gafferSays(order,appr,obeyed,insist);
  G.lastOrder=order;
  choosePrematch(appr);
}
function gafferSays(order,appr,obeyed,insist){
  const a=APPROACHES[appr].n.toLowerCase();
  if(order==="free")return "\"Leave it with me. We go "+a+", and I will answer for it.\"";
  if(insist)return "\"You are the chairman. "+a[0].toUpperCase()+a.slice(1)+" it is.\"";
  if(obeyed)return order==="win"?"\"Right. "+a[0].toUpperCase()+a.slice(1)+", then, and we take our chances.\""
    :"\"Sensible. We keep it "+a+" and see where we are at eighty.\"";
  return "\"With respect, chairman — not today. We go "+a+". You can shout at me after.\"";
}
function choosePrematch(appr){
  const match=modal.match;
  // now the word is given, the rest of the division kicks off too (once only)
  if(modal.round&&!modal.roundPlayed){modal.roundPlayed=true;simRestOfRound(modal.round);}
  match.approach=appr;
  match.h1=simHalf(match,null);
  match.h2=simHalf(match,null); // default; may be re-rolled at HT
  // incidents carry their own minute — they must land in the half they belong to,
  // or the ticker waits at 45' for a 78th-minute red card that never comes
  const inc=matchIncidents(match);
  match.inc2=inc.filter(e=>e.m>45);
  match.events=[...halfEvents(match,1,match.h1.gf,match.h1.ga),...inc.filter(e=>e.m<=45)].sort((a,b)=>a.m-b.m);
  // kopier: samme haendelsesobjekt maa ikke ligge i baade inc2 og h2events --
  // G er et traee, og htChoice() bygger h2events op igen fra inc2
  match.h2events=[...halfEvents(match,2,match.h2.gf,match.h2.ga),...match.inc2.map(e=>({...e}))].sort((a,b)=>a.m-b.m);
  trimTicker(match);   // R4: flavour viger til loftet holder
  /* Pakke 20. Resultatet staar fast. Fra dette oejeblik ER kampen spillet --
     baade halvlege, alle haendelser og resten af divisionens runde er
     beregnet. saveGame() blev foerst kaldt i afterMatchday(), altsaa EFTER
     tickeren, saa lukkede man appen midt i den, laa den gemte tilstand stadig
     foer kampdagen, og kampen blev spillet om med et nyt udfald.
     Kampen gemmes derfor i G, ikke paa modalen: modal gemmes bevidst ikke, og
     et resultat der kun findes i en modal er ikke gemt. Det er ogsaa derfor
     playoff-grenen maatte holde op med at vaere en closure -- G er et TRAE. */
  G.pendingMatch=match;
  saveGame();
  openTicker(match,null);
}
function htChoice(c){
  const match=modal.match;
  match.htDone=true;
  if(c==="steady")match.h2=simHalf(match,{own:0.85,opp:0.72});
  // N1: "fury"/hairdryeren er fjernet — kun den roligere "steady" er tilbage.
  if(c==="steady"&&(match.h1.gf<match.h1.ga)&&Math.random()<0.5)match.h2.gf++; // trailing desperation push
  match.h2events=[...halfEvents(match,2,match.h2.gf,match.h2.ga),...(match.inc2||[]).map(e=>({...e}))].sort((a,b)=>a.m-b.m);
  trimTicker(match);   // R4: anden halvleg er rullet om — loftet skal holde igen
  // pakke 20: pausetalen ER en ny beslutning, saa den anden halvleg rulles om
  // her -- og skal derfor staa fast fra netop dette oejeblik og ikke foer.
  G.pendingMatch=match;
  saveGame();
  resumeTicker();
}
/* Pakke 24. Egen funktion, saa rollens virkning kan MAALES udefra i stedet for
   at skulle drives frem gennem en hel kampdag. Foerste udgave laa inde i
   finalizeMatch, og kontrollen kaldte postMatchMessages -- den maalte altsaa
   et sted hvor koden ikke var, og fejlede paa korrekt kode. */
/* Prisen paa ordren. At jagte en sejr braender ben og inviterer fysioterapeuten;
   at noejes med et point mod et bundhold stikker; og siger du at I SKAL vinde og
   taber, husker byen hvad du sagde. */
function orderAftermath(match,gf,ga){
  const O=BAL.orders;
  if(!match.order||match.order==="free")return;
  if(G.gafferPatience===undefined)G.gafferPatience=O.startPatience;
  if(match.order==="win"){
    if(gf>ga){G.gafferPatience=clamp(G.gafferPatience+O.keptWord,0,100);
      G.fanMood=clamp(G.fanMood+O.saidWinWon,5,100);}
    else{
      G.fanMood=clamp(G.fanMood+O.saidWinLost,5,100);
      G.gafferPatience=clamp(G.gafferPatience+O.saidWinLostPatience,0,100);
      bumpTrust(BAL.owners.trustPromise);
      addNews("FANS","\"We need three points,\" the chairman said. The Gazette has printed it next to the result.");
    }
  }else if(match.order==="point"){
    const t=G.teams[match.oppIdx-1];
    const myPosNow=myPos(),tbl=table();
    const oppPos=tbl.findIndex(r=>r.i===match.oppIdx)+1;
    if(t&&oppPos>myPosNow+O.weakBy)G.fanMood=clamp(G.fanMood+O.pointMoodVsWeak,5,100);
    if(gf>=ga)G.gafferPatience=clamp(G.gafferPatience+O.keptWord,0,100);
  }
}
function reviewRoles(){
if(G.md>BAL.role.keyGrace&&G.md%BAL.role.reviewEvery===0){
  const RO=BAL.role;
  for(const p of G.squad){
    if(p.role!=="key"||p.inj||p.susp)continue;
    const share=p.sapps/Math.max(1,G.md);
    if(share>=RO.keyShare)continue;
    p.conf=clamp(p.conf-RO.keyConfHit,10,95);
    bumpTrust(BAL.owners.trustPromise);
    if(!p.roleWarned){
      p.roleWarned=true;
      msg(pick(AGENTS).n,"A","\"Key player, you said\"",
        "\"My client signed as a KEY PLAYER. He has "+p.sapps+" starts in "+G.md+" matchdays. The word means something, chairman, or it means you can be trusted with nothing.\"",null);
    }else if(p.conf<=30&&!p.reqDone&&G.squad.length>13){
      p.reqDone=true;
      msg(pick(AGENTS).n,"A","TRANSFER REQUEST: "+p.name.split(" ")[1],
        "\"He was promised a shirt. He has a seat. List him, or explain yourself to the dressing room — they are all watching how this ends.\"",
        {kind:"transferReq",pid:p.id});
    }
  }
}
}
function finalizeMatch(match){
  G.pendingMatch=null;                 // pakke 20: kampen er bogfoert nu
  const gf=match.h1.gf+match.h2.gf, ga=match.h1.ga+match.h2.ga;
  const res={gf,ga,opp:match.opp,home:match.home,big:match.big,label:match.label,weather:{...match.weather}};
  if(!match.isPlayoff){
    applyPts(match.home?0:match.oppIdx,match.home?gf:ga,match.home?match.oppIdx:0,match.home?ga:gf);
    /* The worst hiding of the first half books its own return leg (pakke 5).
       The second half of the fixture list is the exact reverse of the first, so
       the rematch is guaranteed to exist — and only the first half can set it,
       or a late thrashing would point at a fixture already played. */
    if(G.md<G.rounds/2&&ga-gf>=BAL.big.revengeMargin&&(!G.revenge||ga-gf>G.revenge.by))
      G.revenge={opp:match.oppIdx,md:G.md,by:ga-gf};
    G.md++;
    /* D1: ugen er gaaet. Rydningen ligger HER -- i det ene udtryk der flytter
       kampdagen -- og ikke i nextWeek(), fordi tiden ogsaa flytter sig naar man
       spiller kampen inde fra klubben. Foer de nye beskeder genereres nedenfor,
       saa denne uges post aldrig rammes af sin egen rydning. */
    sweepInbox();
    settleFinances(res);
  }
  // player stats & MOTM
  const xi=xiList();
  // Who actually played is settled HERE and reused by everything downstream —
  // applying load changes freshness, which would change a second bestXI() call.
  G.lastXI=xi.map(p=>p.id);
  applyLoad(G.lastXI);
  for(const p of xi){p.sapps++;p.capps++;}
  const w=gf>ga,l=ga>gf;
  for(const p of xi)p.conf=clamp(p.conf+(w?2:l?-2:0),10,95);
  const allEv=[...match.events,...match.h2events];
  const ratings=new Map(xi.map(p=>[p,6+Math.random()*1.2+(gf>ga?0.5:gf===ga?0:-0.4)]));
  for(const e of allEv){const sc=e.scorerId?byId(e.scorerId):null;
    if(sc){sc.sg++;sc.conf=clamp(sc.conf+4,10,95);ratings.set(sc,(ratings.get(sc)||6.5)+1.1);}}
  let motm=xi[0],best=0;
  for(const [p,r] of ratings)if(r>best){best=r;motm=p;}
  if(motm){motm.smotm++;motm.conf=clamp(motm.conf+3,10,95);}
  orderAftermath(match,gf,ga);
  reviewRoles();
  // broken playing-time promises come home to roost
  for(const p of G.squad){
    if(p.promiseMD!==null&&G.md-p.promiseMD>=BAL.clock.promiseMD){
      if(p.sapps-(p.appsAtPromise||0)<3){p.conf=clamp(p.conf-10,10,95);bumpTrust(BAL.owners.trustPromise);
        msg(pick(AGENTS).n,"A","\"About that promise…\"","You promised "+p.name.split(" ")[1]+" football. He's had "+p.sapps+" games. His agent's tone has cooled considerably.",null);}
      p.promiseMD=null;
    }
  }
  res.motm=motm?{name:motm.name,rating:Math.min(9.8,best).toFixed(1)}:null;
  // stats line
  res.shots=[gf*2+R(2,7),ga*2+R(1,6)];
  res.dom=clamp(Math.round(50+(myStrength().att-(G.teams[match.oppIdx-1].att))*1.2+(gf-ga)*4),20,80);
  // analysis
  res.analysis=makeAnalysis(match,gf,ga);
  res.quote=gafferQuote(gf,ga,match);
  res.keyStats=keyStats(match,gf,ga);
  if(!match.isPlayoff){
    updateFormMood(res);
    G.lastResult=res;
    postMatchMessages();
  }
  // tick down suspensions/injuries
  for(const p of G.squad){if(p.susp)p.susp--;if(p.inj)p.inj--;}
  return res;
}
/* ---------- pakke 11: EFTER KAMPEN ----------
   GDD linje 210: "Analyse-linjen (forklarer resultatet ud fra attributter og
   valg — man lærer noget hver kamp), Man of the Match med ratings, 2-3
   kamp-nøgletal, og gafferens citat tonet efter resultat OG personlighed."

   Den gamle makeAnalysis var en kæde af ni if-sætninger der returnerede ÉN
   generisk sætning uden et eneste tal. GDD'ens eget eksempel er kvantitativt:
   "deres midtbane var 8 point bedre, og mudderet tog jeres teknikere". Uden
   tallene lærer man ingenting, og så er tilgangsvalget før kampen en gætteleg —
   hvilket er præcis den begrundelse GDD'en selv giver.

   Nu MÅLES faktorerne, sorteres efter styrke, og de to største bliver til
   sætningen. Hver faktor er noget spilleren kan gøre noget ved: købe en
   forsvarsspiller, skaffe dybde, vælge en anden tilgang, bygge Shed End. */
function matchFactors(match,gf,ga){
  const t=G.teams[match.oppIdx-1],s=myStrength(),T=BAL.text;
  const a=APPROACHES[match.approach]||{own:0,opp:0,n:"Balanced"};
  const xi=xiList(),f=[];
  const push=(w,txt)=>{if(Math.abs(w)>=T.analysisMin)f.push({w:Math.abs(w),good:w>0,txt});};

  // 1. de rene attributforskelle, i point, som GDD'en formulerer dem
  push(Math.round(s.att-(t.def||50)),
    "our attack was "+Math.abs(Math.round(s.att-(t.def||50)))+" points "+
    (s.att>(t.def||50)?"better than their defence":"short of their defence"));
  push(-Math.round((t.att||50)-s.def),
    "their attack was "+Math.abs(Math.round((t.att||50)-s.def))+" points "+
    ((t.att||50)>s.def?"better than our back line":"blunter than our back line"));

  // 2. vejret, men kun når det faktisk vippede noget: fysik gange forholdene
  const phyGap=Math.round((myPhy()-(t.phy||50))*match.weather.phys);
  push(phyGap,(phyGap>0?"the ":"that ")+match.weather.n.toLowerCase()+" "+
    (phyGap>0?"suited us — we were "+Math.abs(phyGap)+" points stronger in the legs on that pitch"
             :"took our technicians; they were "+Math.abs(phyGap)+" points stronger in it"));

  // 3. tilgangen. Den ER et valg, så den skal kunne læses som et valg.
  if(a.own||a.opp){
    const helped=(gf>=2&&a.own>0)||(ga===0&&a.opp<0);
    const hurt=(ga>=2&&a.opp>0)||(gf===0&&a.own<0);
    if(helped)f.push({w:6,good:true,txt:"“"+a.n+"” did what it says on the tin"});
    else if(hurt)f.push({w:6,good:false,txt:"“"+a.n+"” cost us — that is the trade you took"});
  }

  // 4. friske ben. Den enkeltstående vigtigste ting en formand KAN gøre noget ved.
  const flat=xi.filter(p=>freshBand(p)==="flat").length;
  if(flat>=2)f.push({w:4+flat,good:false,txt:flat+" of the eleven were running on empty"});

  // 5. den tolvte mand — eller fraværet af ham
  if(match.home){
    if(protestLevel()>=2)f.push({w:7,good:false,txt:"the ground was silent, and the players could hear it"});
    else if(G.stands.shed>=1&&attendance(match.big)/G.capacity>0.75)
      f.push({w:5,good:true,txt:"the Shed End was full and loud, and it showed"});
  }
  // 6. han vil bevise noget mod sin gamle klub
  if(G.squad.some(p=>p.from===t.name))f.push({w:4,good:gf>ga,txt:"there was a man out there with a point to prove against them"});

  /* Vægt ALENE er ikke nok. En kamp tabt 1-3 blev ellers indledt med "deres
     angreb var 10 point sløvere end vores bagkæde" — sandt, stort, og en
     forklaring på det MODSATTE af hvad der skete. GDD linje 210 vil have
     resultatet forklaret, så en faktor der peger samme vej som scoren vejer
     tungere end en der peger imod. Den modsatrettede faktor er ikke løgn og
     bliver ikke skjult — den kommer bare ikke først. */
  const res=gf>ga?1:gf<ga?-1:0;
  for(const x of f)x.w*= res===0 ? 1 : ((x.good?1:-1)===res ? 1.6 : 0.5);
  f.sort((x,y)=>y.w-x.w);
  return f;
}
function makeAnalysis(match,gf,ga){
  const f=matchFactors(match,gf,ga).slice(0,BAL.text.analysisMax);
  if(!f.length)return "Nothing separated these two. Some afternoons are decided by a bobble and nothing else.";
  /* Slutsætningen skal passe til det den lige har sagt. Vejer den ledende
     faktor MOD resultatet — "vores angreb var 47 point bedre end deres forsvar"
     efter et 1-3 — så er "det er derfor vi tabte" noget vrøvl. At sortere
     faktoren væk ville være værre: 47 point ER historien, også når man taber.
     Så sætningen erkender det i stedet. */
  const res=gf>ga?1:gf<ga?-1:0,agrees=res===0||((f[0].good?1:-1)===res);
  const verdict=res===0?"That is why it finished level."
    :agrees?(res>0?"That is why we won.":"That is why we lost.")
    :(res>0?"And we won it anyway — some afternoons you get away with one."
           :"And we lost it anyway. Football does that.");
  const body=f.length===1?f[0].txt:f[0].txt+", and "+f[1].txt;
  return body.charAt(0).toUpperCase()+body.slice(1)+". "+verdict;
}
/* 2-3 kamp-nøgletal (GDD linje 210). De gamle to var Shots og "Dominance" —
   begge opfundet ud af scoren. Disse er MÅLT på tilstand spilleren selv har
   bygget, så de peger på noget han kan gøre ved det. */
function keyStats(match,gf,ga){
  const t=G.teams[match.oppIdx-1],s=myStrength(),xi=xiList();
  const fresh=xi.filter(p=>freshBand(p)!=="flat").length;
  const out=[
    {k:"Legs still going",v:fresh+" of "+xi.length,
     hint:fresh<8?"Depth is the fix, chairman.":""},
    {k:"Attack v their defence",v:(s.att>=(t.def||50)?"+":"")+Math.round(s.att-(t.def||50)),hint:""},
    {k:"Defence v their attack",v:(s.def>=(t.att||50)?"+":"")+Math.round(s.def-(t.att||50)),hint:""}
  ];
  if(match.home)out.push({k:"Crowd",v:Math.round(100*attendance(match.big)/G.capacity)+"% full",
    hint:protestLevel()>=2?"Silent. That is worth a goal to them.":""});
  return out;
}

   gjorde ingen forskel hvem man havde ansat. Kører gennem pakke 6's egen
   pickLine, så tonen kan tagges på præcis samme måde som alt andet. */
const GAFFERTALK=[

 // og situationen, uanset hvem der står der

function gafferCtx(gf,ga,match){
  const ctx=[gf>ga?"won":gf<ga?"lost":"drew",G.coach.style];
  if(match){
    if(match.big)ctx.push("big");
    if(match.home&&protestLevel()>=2)ctx.push("silent");
    const w=match.weather?match.weather.n:"";
    if(w==="Mudbath"||w==="Heavy rain")ctx.push("mud");
    if(gf>ga&&match.h1&&match.h1.gf<match.h1.ga)ctx.push("behind");
    if(Math.abs(gf-ga)>=BAL.text.routBy)ctx.push("rout");
  }
  return ctx;
}
function gafferQuote(gf,ga,match){return pickLine(GAFFERTALK,gafferCtx(gf,ga,match),null);}
function applyPts(h,gh,a,ga){
  const rec=i=>i===0?G.me:G.teams[i-1];
  const H=rec(h),A=rec(a);
  H.pl++;A.pl++;H.gd+=gh-ga;A.gd+=ga-gh;
  if(gh>ga)H.pts+=3;else if(ga>gh)A.pts+=3;else{H.pts++;A.pts++;}
}
/* Demand comes from the TOWN, not from the stand you built. A bigger ground
   does not fill itself: the fanbase grows with the division you reach and with
   the fan-growth work (Family Stand), so a new stand is built ahead of demand
   and pays off as the town grows into it. */
/* ---------- B4: prisskalaen pr. division ----------
   Alle fire tal laeses gennem en funktion, saa der er ET sted skalaen bor.
   `divFor` gør dem kaldbare for en anden division end den man staar i -- det
   er hvad omregningen ved op- og nedrykning har brug for. */
/* D2: et aar aeldre. Trukket ud af saesonskiftets loekke i egen funktion, saa
   kurven kan maales udefra -- og saa harness'en kan TAELLE kaldene og dermed
   se om spillet stadig bruger den. (En vagt der kalder funktionen ved navn
   beviser at funktionen virker, ikke at den er koblet paa; QA's N2.) */
function agePlayer(p){
  p.age++;
  let dev;
  if(p.age<24){
    const playF=Math.min(1,p.sapps/12); // benched kids stall
    /* Pakke 24: "Prospect" koster 18 % mere end Rotation og gav indtil nu
       praecis ingenting. Nu koeber den et hurtigere aar -- men kun for en
       dreng der faktisk har spillet, saa den ikke bare er en dyrere maade at
       parkere nogen paa baenken. */
    dev=Math.round((R(1,3)+(BAL.fac.devBonus[facLvl("training")]||0)+(G.coach.dev>=60?1:0)+proDevBonus(p))*(0.35+0.65*playF));
  }else dev=(p.age<BAL.age.skillFrom?R(-1,1):-ageDecline(p.age,BAL.age.skillFrom,BAL.age.skillStep));
  p.att=clamp(p.att+dev,25,95);p.def=clamp(p.def+dev,25,95);
  /* Fysikken har sin egen, tidligere og stejlere kurve. Under phyFrom
     foelger den evnerne (en dreng bliver ogsaa staerkere). */
  p.phy=clamp(p.phy+(p.age>=BAL.age.phyFrom?-ageDecline(p.age,BAL.age.phyFrom,BAL.age.phyStep):dev),25,95);
  /* Pakke T2: growth respects the hidden ceiling. A boy grows TOWARD pot, never
     past it — so two players with identical visible stats but different pots
     develop into different men. Shave the top attribute until overall sits at
     or below the ceiling; dev is small, so this trims at most a point or two. */
  if(BAL.talent.devToCeiling&&p.pot!==undefined){
    let guard=0;
    while(ovr(p)>p.pot&&guard++<30){
      const hi=p.att>=p.def&&p.att>=p.phy?"att":p.def>=p.phy?"def":"phy";
      p[hi]=Math.max(25,p[hi]-1);
    }
  }
}
/* D2: hvor mange point en attribut mister i aar. Faldet vokser med alderen,
   saa 36 ikke er som 31 -- og fysikken faar en stejlere step, saa den falder
   FOERST og haardest. Erklaeret som funktion, ikke arrow-const, saa harness'en
   kan kalde den: en formel der ikke kan kaldes udefra kan kun verificeres ved
   at laese kilden. */
function ageDecline(age,from,step){
  if(age<from)return 0;
  const mean=step+(age-from)*BAL.age.rampPerYear;
  const lo=Math.floor(mean),hi=Math.ceil(mean+0.5);
  return clamp(R(lo,Math.max(lo,hi)),0,BAL.age.maxStep);
}
/* D2's anden halvdel: mennesker omkring dig naevner det FOER regnskabet gør.
   Saa bliver det en beslutning -- saelg nu, eller behold ham for laenge --
   frem for en overraskelse ved saesonskiftet. Gafferen taler om den han ser
   til traening; scouten om den han har set nok af andre steder. */
const AGE_WARN=[
  p=>"Han er "+p.age+". Jeg ser det paa tredjedagen -- han er der stadig, men han er der senere.",
  p=>"Han er "+p.age+" nu. To gode aar i sig, hvis du er heldig. Ét, hvis vi spiller ham hver uge.",
  p=>"Benene gaar foer hovedet, formand. "+p.name.split(" ")[1]+" laeser stadig spillet bedre end nogen anden herinde. Han naar bare ikke derhen.",
  p=>"Jeg vil ikke sige han er faerdig. Jeg siger, at hvis nogen tilbyder penge for ham i sommer, saa hoer efter."
];
function ageWarnings(){
  if(!G.squad||G.phase!=="season")return;
  const A=BAL.age;
  if(Math.random()>=A.warnChance)return;
  /* Der er praecis TO oejeblikke hvor advarslen er en oplysning og ikke stoej:
     aaret foer benene gaar, og aaret foer spillet gaar. En spiller faar derfor
     hoejst to i hele sin tid i klubben -- ikke en om aaret, resten af hans
     karriere. `ageWarned` er hvor langt vi er naaet, ikke et ja/nej, og den
     nulstilles ikke om sommeren. */
  const tier=p=>p.age+1>=A.skillFrom?2:p.age+1>=A.phyFrom?1:0;
  const due=G.squad.filter(p=>tier(p)>(p.ageWarned||0)&&p.age>=A.warnFromAge);
  if(!due.length)return;
  const p=pick(due);
  const t=tier(p);
  p.ageWarned=t;
  const gaffer=Math.random()<0.5;
  const who=gaffer?G.coach.n:"Chief scout";
  const av=gaffer?"GM":"SF";
  const soon=t>=2;
  msg(who,av,nameOf(p.id)+" · "+p.age+" aar",
    pick(AGE_WARN)(p)+" "+(soon
      ?"Til sommer falder baade benene og spillet. Det er nu, han er vaerd noget."
      :"Til sommer er det benene der gaar foerst. Spillet bliver."),null);
}
function ticketScale(field,divFor){
  const sc=BAL.ticket.scale[field];
  const d=clamp(divFor===undefined?(G?G.div:3):divFor,0,sc.length-1);
  return sc[d];
}
function ticketSweet(divFor){return ticketScale("sweet",divFor);}
function ticketMin(divFor){return ticketScale("min",divFor);}
function ticketMax(divFor){return ticketScale("max",divFor);}
function ticketMoodAbove(divFor){return ticketScale("moodAbove",divFor);}
function ticketBigMax(divFor){return ticketScale("bigMax",divFor);}
/* Elasticiteten som ANDEL af det byen synes er normalt. I League Three
   (sweet = 10) giver det praecis de gamle tal: 0,055 pr. £ = 0,55 pr. 100 %
   over. I Premier (sweet = 34) betyder de samme 55 % nu £18,70 -- byen betaler
   mere, fordi alting er stoerre deroppe, men den reagerer lige saa skarpt
   relativt set. Kurven skal stadig ramme NUL, aldrig et gulv: et gulv ville
   lade gate-indtaegten stige igen ved absurde priser. */
function ticketPriceFactor(price){
  const T=BAL.ticket,sw=ticketSweet();
  const r=(price-sw)/sw;
  const el=T.elasticity*T.sweetSpot, lift=T.bargainLift*T.sweetSpot;
  return clamp(1+(r<0?-r*lift:-r*el),0,1.18);
}
/* Ved op- og nedrykning flyttes prisen MED skalaen, saa spillerens valg
   ("billig" eller "dyr" i forhold til byen) overlever en oprykning. Uden det
   stod en nyoprykket Premier-klub til £10 -- under sit eget minimum -- og en
   nedrykket klub til £34 i League Three, hvor ingen kommer. */
function rescaleTicket(fromDiv,toDiv){
  const s0=ticketSweet(fromDiv),s1=ticketSweet(toDiv);
  if(!s0||!s1)return;
  G.ticket=clamp(Math.round(G.ticket*s1/s0),ticketMin(toDiv),ticketMax(toDiv));
  G.bigExtra=clamp(Math.round((G.bigExtra||0)*s1/s0),0,ticketBigMax(toDiv));
}
/* ---------- the protest ladder (pakke 2) ----------
   Three rungs, and the level is STORED rather than derived on the fly, so the
   stadium cache can key on it and so climbing back out can be made slower than
   falling in. Anger has steps, not just a number. */
const PROTEST_NAMES=["calm","banners","silence","boycott"];
function protestFor(mood,cur){
  const P=BAL.protest;
  let lvl=mood<P.boycott?3:mood<P.silence?2:mood<P.banners?1:0;
  if(lvl<cur){
    // to leave a rung you must climb clear of it, not merely touch the line
    const line=[0,P.banners,P.silence,P.boycott][cur];
    if(mood<line+P.hysteresis)lvl=cur;
  }
  return lvl;
}
function protestLevel(){return G.protest||0;}
function updateProtest(){
  const was=protestLevel(),now=protestFor(G.fanMood,was);
  if(now===was)return;
  G.protest=now;
  if(now>was){
    if(now===1)addNews("FANS","Protest banners in the Shed End. Hand-painted, badly spelled, entirely sincere.");
    if(now===2){addNews("FANS","The ground has gone quiet. Not angry-quiet. Just quiet.");
      msg(G.coach.n.split(" ")[0]+" (gaffer)","GM","\"You can hear the ball\"","\"Forty years I've been in grounds, chairman. Booing I can work with. This lot have stopped singing. My players can hear their own boots. That's the one that gets into their heads.\"",null);}
    if(now===3){addNews("FANS","BOYCOTT. The supporters' club has asked the town to stay away until things change.");
      msg("The co-owners","CO","\"About the empty seats\"","\"We have watched the terraces empty for weeks now. This is no longer a mood, chairman — it is a number in the accounts, and it is our number too. Fix it.\"",null);}
  }else{
    if(now===0)addNews("FANS","The singing is back. Somebody has repainted the banner. Properly, this time.");
    else addNews("FANS","The mood has lifted a rung. Nobody says so out loud, but the ground sounds different.");
  }
}
function townDemand(){
  const D=BAL.demand;
  const d=D.base*(1+(3-G.div)*D.perDivision)*(1+G.stands.family*D.familyStand)*(1+D.basics*basicsFactor("demand"));
  // a boycott is a hard ceiling on the town, not a nudge to the mood factor
  return protestLevel()>=3?d*BAL.protest.boycottCap:d;
}
/* Pakke 17. The whole price of a ticket on the day — base plus the big-match
   surcharge. It was ONLY ever read in gateReceipts(), which is why QA measured
   the surcharge as free money: +£0 and +£8 drew the identical 2.670 spectators
   and cost nothing in mood, so there was exactly one right answer (+£8, always)
   and therefore no choice at all. Now attendance() and updateFormMood() read
   the same number the turnstile charges. */
function gatePrice(big){return G.ticket+(big?G.bigExtra:0);}
function attendance(big){
  const pos=myPos();
  const posF=clamp((15-pos)/14,0.15,1);
  const moodF=clamp(0.55+G.fanMood/180,0.4,1.05);  // mood fills the town, never exceeds it
  /* A big afternoon brings people who do not come otherwise — the GDD's "extra
     spectators", capped by the concrete like every other crowd. This has to
     come BEFORE the surcharge has a price: if the surcharge is to cost you
     spectators, the crowd must first react to the match being big at all. */
  const bigF=big?BAL.big.demandBoost:1;
  // The gate price is a live lever with a knee: cheap draws a few more in,
  // dear empties the terraces faster than it earns. Gate income peaks ~£14.
  const want=townDemand()*clamp(0.35+0.55*posF,0.25,1)*moodF*ticketPriceFactor(gatePrice(big))*bigF;
  return Math.max(0,Math.min(G.capacity,Math.round(want)));
}
/* Split out of settleFinances so the big-match promises (screen, Away End,
   bigExtra) can be MEASURED before/after in a forced scenario instead of being
   verified by reading the source. Pure: it reads G and res, writes nothing. */
function gateReceipts(res){
  if(!res.home)return {att:0,gate:0,extras:0};
  const att=Math.max(attendance(res.big),G.seasonTix.sold);
  const paying=Math.max(0,att-G.seasonTix.sold);
  const bigMult=(res.big?1+BAL.matchday.bigScreenGate*facYield("screen"):1)*(res.big?1+G.stands.away*BAL.matchday.awayEndBigGate:1);
  const gate=Math.round(paying*gatePrice(res.big)*bigMult);
  const M=BAL.matchday;
  const extras=Math.round(att*(M.kiosk+facYield("shop")*M.shop+facYield("pub")*M.pub+M.basics*basicsFactor("head"))
        +att*M.merch*G.jerseyFactor*(1+facYield("shop")*M.shopMerchBoost)
        +(facLvl("vip")&&!facBlockedBy("vip")?M.vipFlat*facYield("vip"):0));
  return {att,gate,extras};
}
function settleFinances(res){
  const wages=G.squad.reduce((s,p)=>s+p.wage,0);
  let gate=0,extras=0;
  if(res.home){
    const r=gateReceipts(res);
    res.att=r.att;gate=r.gate;extras=r.extras;
  }
  let loanPay=0;
  /* Pakke 23: flere aabne laan, en faelles afregning. Var et enkelt G.loan. */
  if(Array.isArray(G.loans)&&G.loans.length){
    for(const l of G.loans){loanPay+=l.perMD;l.left--;}
    const done=G.loans.filter(l=>l.left<=0);
    G.loans=G.loans.filter(l=>l.left>0);
    if(done.length)addNews("CLUB",done.length===1?"A bank loan is paid off. The manager sends a card.":done.length+" bank loans paid off. The account can breathe.");
  }
  res.gate=gate+extras;res.wages=wages;
  /* B2: driften af faciliteterne. Fast pr. niveau, hver kampdag, hjemme som
     ude -- en fanshop koster ogsaa noget den uge holdet spiller i Grimsby.
     Lukkede faciliteter koster nul; det er noedbremsen. */
  const upkeep=facUpkeep();res.upkeep=upkeep;
  const net=sponsorIncome()+tvMoney()+gate+extras-wages-loanPay-upkeep;
  G.balance+=net;G.lastNet=net;      // "kassen + ugentligt netto altid synligt" (GDD)
  /* Rolling earnings for the valuation. G.periodNet is no good for this — it
     resets every sixth matchday, so a club's earning power would appear to
     vanish and reappear on a six-week cycle. Same exponential smoothing as
     freshness in pakke 1, so there is one technique in the codebase, not two. */
  G.netEwma=(G.netEwma||0)*(1-BAL.val.ewmaAlpha)+net*BAL.val.ewmaAlpha;
  G.periodNet+=net;G.periodMD++;
  if(G.periodMD>=BAL.clock.reportMD)bookkeeperReport();
  sponsorLifeEvents();
  sponsorSlotKnock();     // B3: de tre andre slots banker paa af sig selv
  ageWarnings();          // D2: gafferen og scouten naevner alderen FOER faldet
  // first sponsor offers arrive after MD 1 — as a decision you cannot walk past
  /* B3: det foerste sponsortilbud gaar nu gennem den SAMME generator som alle
     andre -- foer var det to haandskrevne kort med bare beloeb (£2.800/£4.200),
     som hverken kendte divisionen, slottet eller bonusstigen. */
  if(!mainSponsor()&&!G.sponsorOffered){G.sponsorOffered=true;
    G.sponsorDue={slot:"main",offers:sponsorOffersFor("main"),renewal:false};}
  // build progress
  if(G.standBuild){G.standBuild.remain--;if(G.standBuild.remain<=0)finishStand();}
  if(G.facBuild){G.facBuild.remain--;if(G.facBuild.remain<=0)finishFac();}
  // R1b: stadionfonden er væk — kontant byggeri eller banklån er vejene.
  // economy escalation
  if(G.balance<0&&!G.warnedNeg){G.warnedNeg=true;
    msg("The co-owners","CO","A politely furious letter","\"We note with interest that the club is now technically insolvent. We trust you have a plan. We would love to hear it. Any time. Really.\"",null);}
  if(G.balance>0)G.warnedNeg=false;
  if(G.balance<BAL.bank.crisisAt&&!G.bankDue)G.bankDue=true;
}
function updateFormMood(res){
  const w=res.gf>res.ga,d=res.gf===res.ga;
  /* Form follows MINUTES, not the depth chart. The old rule docked everyone
     outside the best sixteen BY OVR, so a seventeenth man rotted whether or not
     he played — depth was punished twice over. Now: you played, the result
     moves your form; you didn't, the edge dulls a little. That also gives us a
     man back from four matchdays out who is FRESH but not sharp, without
     inventing a fourth number for it. */
  const played=new Set(G.lastXI||[]);
  for(const p of G.squad){
    if(played.has(p.id))p.form=clamp(p.form+(w?R(0,2):d?R(-1,1):R(-2,0))+(p.traits.includes("grafter")?0.5:0),-6,6);
    else{p.form=clamp(p.form-BAL.fresh.benchForm,-6,6);p.conf=clamp(p.conf-BAL.fresh.benchConf,10,95);}
  }
  {const MO=BAL.mood;
   G.fanMood=clamp(G.fanMood+(w?MO.win:d?MO.draw:MO.loss)+(gatePrice(res.big)>ticketMoodAbove()?MO.dearTicket:0)
     +G.stands.family*MO.familyPerTier+MO.pubDrift*facYield("pub"),5,100);}
  easeMood(); // the way back: anger cools toward a baseline (egen funktion -> maalbar)
  updateProtest();
  if(G.talkCooldown>0)G.talkCooldown--;
  for(const t of G.teams){t.att=clamp(t.att+R(-1,1)*0.5,40,84);t.def=clamp(t.def+R(-1,1)*0.5,40,84);}  // M1: loftet hævet — Premier-klubber ligger over det gamle 75
}
/* "Vejen tilbage": vreden koeler mod en baseline, aldrig over. Trukket ud i
   egen funktion (pakke 29 / QA's N1), saa harness'en kan KALDE spillets easing
   frem for at regne sin egen kopi -- QA viste at man kunne fjerne easingen helt
   fra spillet og stadig faa REGRESSION_OK, fordi invarianten maalte sin egen
   formel. Nu er det spillets kode der maales. */
function easeMood(){
  const P=BAL.protest;
  if(G.fanMood<P.baseline)G.fanMood=clamp(G.fanMood+(P.baseline-G.fanMood)*P.easing,5,100);
}

function ovr(p){return Math.round((p.att+p.def+p.phy)/3);}
function weakestLine(){
  const avg=(pos,f)=>{const l=G.squad.filter(p=>p.pos===pos);return l.reduce((s,p)=>s+f(p),0)/Math.max(1,l.length);};
  const gk=avg("GK",p=>p.def),df=avg("DF",p=>p.def),mf=avg("MF",p=>(p.att+p.def)/2),fw=avg("FW",p=>p.att);
  const m=Math.min(gk,df,mf,fw);
  return m===gk?"goalkeeper":m===df?"defender":m===mf?"midfielder":"striker";
}
function afterMatchday(){
  if(G.bankDue){G.bankDue=false;openBankUltimatum();return;}
  if(G.fireSale)checkFireSale();     // brandudsalgets ur tikker en kampdag
  if(G.md>=G.rounds){startPostSeason();return;}
  if(G.md===13&&!G.midwayDone){openMidway();return;}
  if(G.sponsorDue){modal={type:"sponsorOffer",after:"matchday"};render();return;}
  if(G.md%4===0&&!isDeadlineDay()){G.adCount++;modal={type:"interstitial"};}  // pakke T4: deadline day er annoncefri
  if(!modal)maybeOwnerLife();   // O3: et ejer-liv-event dukker op mellem kampene
  saveGame();
  render();
}

/* ---------- post season: playoffs ---------- */
function startPostSeason(){
  const t=table();const pos=myPos();
  const seeds=t.slice(2,6); // positions 3-6
  if(pos<=2){finishSeason({promoted:true,how:pos===1?"champions":"runners-up"});return;}
  // top division: nothing to be promoted to, so no playoff either
  if(pos>=3&&pos<=6&&G.div>0){
    G.phase="playoff_semi";
    const bySeed={};t.slice(2,6).forEach((r,ix)=>bySeed[ix+3]=r);
    G.playoff={oppSemi:null,otherSemi:null,finalOpp:null};
    const mySeed=pos;const oppSeed=mySeed===3?6:mySeed===4?5:mySeed===5?4:3;
    G.playoff.oppSemi=bySeed[oppSeed];
    const rem=[3,4,5,6].filter(s=>s!==mySeed&&s!==oppSeed);
    G.playoff.otherSemi=[bySeed[rem[0]],bySeed[rem[1]]];
    msg("The FA (fictional)","FA","PLAYOFFS: semi-final draw","You face "+G.playoff.oppSemi.n+" for a place in the final at neutral Wembley Fields. The town has already started painting things.",null);
    render();return;
  }
  // not in playoffs — sim it in news
  const winner=pick(seeds.filter(r=>r.i!==0));
  addNews("LEAGUE",(winner?winner.n:"Somebody")+" win the playoff final. It should have been you. Next season.");
  finishSeason({promoted:false,how:"league",relegated:relegationSpot(pos,t.length)});
}
/* Pakke 16. The bottom `spots` of the table go down — the mirror of the two
   automatic promotion places at the top. League Three is the floor of the
   world, so nobody falls out of it. */
/* What the co-owners ask for in each division. Was an inline map inside the
   promotion branch with an ||10 fallback that never matched newGame's 8; now
   division 3 is in it, so up and down read the same table. */
const DIV_OBJECTIVE={3:8,2:10,1:9,0:7};
/* A new division means new opponents. Shared by promotion and relegation so
   the two directions cannot drift apart. */
/* M1: reseedLeague() er død — verden husker. I stedet bytter pyramiden klubber
   mellem nabodivisioner ved hvert sæsonskift: top-2 op, bund-2 ned, i ALLE par.
   Jeg optager selv en plads: er jeg rykket op, tager jeg den ene af min gamle
   divisions up-pladser (den anden går til den bedste modstander); spejlvendt ved
   nedrykning. Klubberne BEHOLDER wid/navn/omtale — kun div og styrke flytter sig
   (±moveAdj: oprykkede forstærkes af divisionens penge, nedrykkede svækkes — det
   er trappen den gamle reseed-formel indkodede, nu båret af klubberne selv). */
function ensureWorld(){
  if(G.worldRest&&G.worldRest.length)return;
  // migration: en karriere gemt før M1 har ingen verden — fød den omkring den
  // division spilleren står i, med samme trappe som newGame.
  const used=new Set([G.club,...G.teams.map(t=>t.name)]);
  let wid=1;
  for(const t of G.teams){t.wid=wid++;if(t.press===undefined)t.press=BAL.world.pressStart;if(t.div===undefined)t.div=G.div;}
  G.worldRest=[];
  for(let d=0;d<BAL.world.divs;d++){
    if(d===G.div)continue;
    for(let i=0;i<BAL.world.size;i++){
      let n;do{n=pick(TOWN1)+" "+pick(TOWN2);}while(used.has(n));used.add(n);
      const lift=divLift(d);
      G.worldRest.push({wid:wid++,name:n,div:d,att:R(49,61)+lift,def:R(49,61)+lift,phy:R(44,62),
        pts:0,gd:0,pl:0,press:BAL.world.pressStart});
    }
  }
}
function applyPyramidExchange(promoted,relegated,oldDiv){
  ensureWorld();
  const W=BAL.world;
  for(const t of G.teams)if(t.div===undefined)t.div=oldDiv;
  const standings=d=>{
    const list=d===oldDiv?[...G.teams]:G.worldRest.filter(c=>c.div===d);
    return list.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||a.name.localeCompare(b.name));
  };
  // movers computed on the FINAL tables of every division, before anything moves
  const up=[],down=[];
  for(let d=1;d<W.divs;d++){
    const lower=standings(d),upper=standings(d-1);
    let upSlots=W.upSpots,downSlots=W.downSpots;
    if(d===oldDiv&&promoted)upSlots--;        // I take one of my division's up-slots
    if(d-1===oldDiv&&relegated)downSlots--;   // ... or one of its down-slots
    for(let i=0;i<upSlots;i++)if(lower[i])up.push({c:lower[i],to:d-1});
    for(let i=0;i<downSlots;i++){const c=upper[upper.length-1-i];if(c)down.push({c,to:d});}
  }
  /* R7: styrkeskiftet er FORSKELLEN i divisionsløft — så en klub der går ind i
     div 0/1 også bærer topLift, og en der falder ud af toppen afleverer det. */
  const cap=W.topCap||84;
  for(const m of up){const d=divLift(m.to)-divLift(m.c.div);m.c.div=m.to;m.c.att=clamp(m.c.att+d,40,cap);m.c.def=clamp(m.c.def+d,40,cap);}
  for(const m of down){const d=divLift(m.to)-divLift(m.c.div);m.c.div=m.to;m.c.att=clamp(m.c.att+d,40,cap);m.c.def=clamp(m.c.def+d,40,cap);}
  // rebuild the two arrays around my (possibly new) division — a club lives in
  // exactly ONE of them, so G stays a tree
  const all=[...G.teams,...G.worldRest];
  // R7: toppen køber. Rige klubber i div 0-1 forstærkes lidt hvert sæsonskifte,
  // så Premier ikke står stille mens spillerens trup udvikler sig mod loftet.
  for(const c of all){
    const b=(W.topBuy||{})[c.div]||0;
    if(b){c.att=clamp(c.att+R(0,b),40,cap);c.def=clamp(c.def+R(0,b),40,cap);}
  }
  G.teams=all.filter(c=>c.div===G.div);
  G.worldRest=all.filter(c=>c.div!==G.div);
  for(const c of G.worldRest){c.pts=0;c.gd=0;c.pl=0;}   // their new season starts at zero too
}
function relegationSpot(pos,rows){
  const RG=BAL.relegation;
  if(G.div>=RG.floorDiv)return false;
  return pos>rows-RG.spots;
}
function playPlayoff(){
  const semi=G.phase==="playoff_semi";
  const opp=semi?G.playoff.oppSemi:G.playoff.finalOpp;
  const match=buildMatch(opp.i,semi,true,semi?"PLAYOFF SEMI-FINAL":"PLAYOFF FINAL · WEMBLEY FIELDS");
  match.isPlayoff=true;
  /* Pakke 20. Var en closure paa match-objektet. Den kunne den ikke blive ved
     med at vaere: for at et afgjort resultat kan STAA fast skal kampen kunne
     gemmes, og G skal forblive et TRAE -- ingen funktioner. Grenen vaelges nu
     paa et maerkat, og playoffPost() er en almindelig funktion. */
  match.postKind=semi?"semi":"final";
  match.noDraw=true;
  modal={type:"prematch",match};
  render();
}
function playoffPost(match,res){

  const {gf,ga}=res;
  const gate=semi?Math.min(G.capacity,G.capacity)*(G.ticket+5):Math.round(18000*(G.ticket+5)*0.4);
  G.balance+=gate;
  if(semi){
    const [o1,o2]=G.playoff.otherSemi;
    G.playoff.finalOpp=Math.random()<0.5?o1:o2;
    if(gf>ga){G.phase="playoff_final";
      msg("The FA (fictional)","FA","YOU'RE IN THE FINAL","One match against "+G.playoff.finalOpp.n+" for a place in "+G.divNames[G.div-1]+". Gate receipts alone will be biblical.",null);
    }else{addNews("LEAGUE","Playoff heartbreak against "+res.opp+". The minibus ride home lasts nine years.");finishSeason({promoted:false,how:"semis"});}
  }else{
    if(gf>ga)finishSeason({promoted:true,how:"playoffs"});
    else{addNews("LEAGUE","Beaten at Wembley Fields. The banner still says WE ARE "+G.club.split(" ")[0].toUpperCase()+". It's soggy now.");finishSeason({promoted:false,how:"final"});}
  }
  render();
}
function finishSeason(o){
  const pos=myPos();
  const crown=(G.div===0&&pos===1);        // champions of England — nothing above this
  if(crown){G.titles=(G.titles||0)+1;bumpRep(BAL.owner.repTrophy);}  // O1: a title lifts your standing
  let prize=divPrize(BAL.prize.missed),txt;
  if(o.how==="champions"){prize=divPrize(BAL.prize.champions);txt="CHAMPIONS. The town has run out of bunting.";}
  else if(o.how==="runners-up"){prize=divPrize(BAL.prize.runnersUp);txt="Promoted as runners-up. The champagne is mid-range but plentiful.";}
  else if(o.how==="playoffs"&&o.promoted){prize=divPrize(BAL.prize.playoffs);txt="PLAYOFF WINNERS! The most profitable afternoon in club history.";}
  else if(o.relegated){prize=divPrize(BAL.prize.missed);txt="RELEGATED. "+ord(pos)+" of "+(G.teams.length+1)+", and down we go. Nobody in the boardroom is looking at anybody.";}
  else if(pos<=G.objectivePos){prize=divPrize(Math.round(BAL.prize.objective*(1+Math.max(0,G.objectiveBold||0)*BAL.owners.objectivePrize)));txt="You finished "+ord(pos)+". The co-owners are satisfied and have bought a new kettle.";}
  else{prize=divPrize(BAL.prize.missed);txt="You finished "+ord(pos)+". The co-owners 'note the result with interest'. That's owner-speak for: do better.";}
  G.balance+=prize;
  sponsorSettleDemand(pos);          // the top-N clause is settled before the deal rolls over
  sponsorSettleBonus({pos,promoted:!!o.promoted});   // B3: og bonusserne DU har spillet dig til
  G.history.push({season:G.season,div:G.divNames[G.div],pos,promoted:!!o.promoted,relegated:!!o.relegated,
    objective:G.objectivePos,bold:G.objectiveBold||0,hit:pos<=G.objectivePos});
  /* Trust is time plus delivery. It is why a share costs ~1,9× fair in season 1
     and drifts toward ~1,25× for a chairman they have watched keep his word. */
  /* Pakke 19: dristigheden er indsatsen. Lovede du mere end de forventede, er
     baade belonningen og regningen stoerre -- det er dét, der goer
     forventningsmoedet til et valg og ikke et opslag. Presser du den ned, er
     der intet at vinde, og du slipper heller ikke billigere for at misse den:
     du lovede jo det lette. */
  {const O=BAL.owners,bold=Math.max(0,G.objectiveBold||0);
   const hit=pos<=G.objectivePos;
   bumpTrust(O.trustPerSeason+(hit?O.trustObjective+bold*O.objectiveStake:O.trustMissed-bold*O.objectiveStake)
     +O.trustFundKept);}   // R1b: altid — fonden (og raidet) findes ikke mere
  const promoted=o.promoted&&G.div>0;
  const relegated=!!o.relegated&&G.div<BAL.relegation.floorDiv&&!promoted;
  const oldDiv=G.div;   // M1: pyramide-udvekslingen skal kende min gamle division
  settleCommitments(promoted);   // before the summer wipes p.sg — goal bonuses need it
  if(promoted){
    const oldDiv=G.div;
    G.div--;G.wageCap=Math.round(G.wageCap*BAL.wages.capOnPromotion/100)*100;
    rescaleTicket(oldDiv,G.div);   // B4: prisen flytter med skalaen, saa dit valg overlever oprykningen
    for(const x of signedSponsors())x.d.per=Math.round(x.d.per*BAL.sponsor.onPromotion); // may be shirtless — that used to crash the run
    // the squad renegotiates too: a higher division costs more than the cap alone
    const before=G.squad.reduce((s,p)=>s+p.wage,0);
    for(const p of G.squad)p.wage=Math.round(p.wage*BAL.wages.promotionRise/10)*10;
    const after=G.squad.reduce((s,p)=>s+p.wage,0);
    msg("Ledger (bookkeeper)","L","Promotion has a price tag","Every agent rang on Monday morning. The same squad now costs "+kfmt(after)+"/w instead of "+kfmt(before)+"/w — that is what "+G.divNames[G.div]+" football pays. The cap moved to "+kfmt(G.wageCap)+".",null);
  }
  /* Pakke 16. Every consequence of going up, mirrored — and none of them
     exactly. The cap falls harder than the payroll does, so a relegated club
     walks into the new season carrying a wage bill it cannot pay: that gap IS
     the crisis, and trading out of it is the season's work. */
  else if(relegated){
    const wasDiv=G.divNames[G.div];
    const oldDiv=G.div;
    G.div++;G.wageCap=Math.round(G.wageCap*BAL.wages.capOnRelegation/100)*100;
    rescaleTicket(oldDiv,G.div);   // B4: og ned igen -- £34 i League Three fylder ingen tribune
    for(const x of signedSponsors())x.d.per=Math.round(x.d.per*BAL.sponsor.onRelegation);
    bumpTrust(BAL.owners.trustRelegation);
    const before=G.squad.reduce((s,p)=>s+p.wage,0);
    for(const p of G.squad)p.wage=Math.round(p.wage*BAL.wages.relegationDrop/10)*10;
    const after=G.squad.reduce((s,p)=>s+p.wage,0);
    msg("Ledger (bookkeeper)","L","Relegation has a price tag too","Some contracts had a clause, most did not. The squad still costs "+kfmt(after)+"/w against "+kfmt(before)+"/w in "+wasDiv+" — on "+G.divNames[G.div]+" money, and against a cap of "+kfmt(G.wageCap)+". Sell, renegotiate, or drown, chairman.",null);
    addNews("CLUB","Relegated to "+G.divNames[G.div]+". The banner outside the Shed End has been taken down for repairs it does not need.");
  }
  // M1: hele pyramiden bytter klubber — én gang, uanset om jeg selv flyttede mig
  applyPyramidExchange(promoted,relegated,oldDiv);
  settleStakes();   // M2: dine andele i andre klubber betaler deres sæsonudbytte
  /* Pakke 16/19: maalsaetningen hoerer til divisionen og forhandles paa ny hvert
     aar. EET sted saetter den -- her, lige efter divisionen kan have flyttet
     sig. Den stod ogsaa inde i baade oprykningens og nedrykningens gren, og to
     steder der haandhaever samme regel betyder at man kan slette det ene uden
     at noget fejler: sabotage-sweepet fandt netop det. Springer man
     budgetmoedet over, staar divisionens egen ramme -- ikke sidste aars aftale.
     Ligger foer sponsorRenewal(), som laeser objectivePos. */
  G.objectivePos=DIV_OBJECTIVE[G.div];G.objectiveBold=0;
  // the contract clock ticks — and Bosman waits for the careless
  const leavers=[];
  for(const p of G.squad){p.years=Math.max(0,(p.years||1)-1);}
  for(const p of [...G.squad]){
    if(p.years<=0&&G.squad.length>13){
      G.squad=G.squad.filter(x=>x!==p);
      const club=pick(G.teams).name;
      G.soldTo.push({name:p.name,club,pos:p.pos,ovr:ovr(p),bitter:true}); // leaving free always stings a little
      leavers.push(p.name.split(" ")[1]+" → "+club);
      detachPlayer(p);
    }
  }
  if(leavers.length)msg("Ledger (bookkeeper)","L","GONE FOR NOTHING","Contracts expired, no renewals signed: "+leavers.join(" · ")+". Value walked out the door with its boots under its arm.",null);
  // aging & development — matches played fuel young growth
  for(const p of G.squad){
    agePlayer(p);
    p.value=playerValuation(p);   // pakke T1: the one living valuation, squad and market alike
    p.form=0;p.sg=0;p.sapps=0;p.smotm=0;p.inj=0;p.susp=0;p.promiseMD=null;p.load=0;p.roleWarned=false; // a summer is a summer (p.ageWarned bevidst IKKE: D2's to advarsler gaelder karrieren)
    p.conf=clamp(p.conf*0.6+20,10,95); // confidence regresses toward the mean over summer
  }
  applyRetirements();
  /* Pakke 16. The dressing room reads the table too. Applied AFTER the summer's
     confidence regression (conf*0.6+20), not before — put it in the relegation
     branch above and the regression washes it straight back out, which is the
     kind of effect that measures as "built" and plays as nothing.
