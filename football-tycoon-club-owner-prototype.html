     The dreamer is the man who wants the move; the trait exists, is documented
     in the GDD as exactly this, and was used in two places. Now it is used
     where it means something. */
  if(relegated){
    for(const p of G.squad)p.conf=clamp(p.conf-BAL.relegation.confHit,10,95);
    const wantAway=G.squad.filter(p=>p.traits.includes("dreamer"));
    if(wantAway.length&&G.squad.length>13){
      const p=pick(wantAway);p.reqDone=true;
      msg(pick(AGENTS).n,"A","TRANSFER REQUEST: "+p.name.split(" ")[1],
        "\"My client signed for a "+G.divNames[G.div-1]+" club, chairman. He is very sorry about the relegation and very serious about leaving.\"",
        {kind:"transferReq",pid:p.id});
    }
  }
  G.captSuggested=false;G.talkCooldown=0;
  if(!G.captain||!byId(G.captain))pickCaptain();
  // sponsor expiry
  /* B3: hver aftale loeber sin egen tid ud. Kun hovedsponsoren udloeser et
     fornyelsestilbud med det samme -- de tre andre slots bliver bare frie, og
     den kommercielle afdeling ringer af sig selv naar der er noget at ringe om. */
  for(const x of signedSponsors()){
    x.d.seasonsLeft--;
    if(x.d.seasonsLeft<=0){
      const gone=x.d.n,slot=x.k;
      G.sponsors[slot]=null;
      if(slot==="main")sponsorRenewal();
      else addNews("CLUB",gone+" let their "+BAL.sponsor.slots[slot].n.toLowerCase()+" deal lapse. The slot is free again.");
    }
  }
  G.season++;G.md=0;G.phase="season";
  // R3 (variant B+): udbyttet er et KORT paa bordet, ikke en tvungen modal.
  if(isMajority())G.dividendTaken=false;   // kortet ligger paa bordet hele saesonen
  else settleBoardDividend();              // mindretal: bestyrelsen tager sit — automatisk, med besked
  G.me={pts:0,gd:0,pl:0};for(const t of G.teams){t.pts=0;t.gd=0;t.pl=0;}
  G.fixtures=makeFixtures();refreshMarket();
  G.scoutUsed=false;G.sponsorBoost=false;G.coachAsked=false;G.deadlineDone={};G.playoff=null;G.ownerLifeMD=0;  // O3: nyt ejer-liv-ur pr. sæson
  // pakke T3: goodwill cools a little each summer — a relationship is kept up, not banked once
  if(G.agentRel)for(const k in G.agentRel)G.agentRel[k]=Math.max(0,G.agentRel[k]-BAL.agents.relDecay);
  G.bids=[];G.callbacks=[];G.midwayDone=false;G.sponsorChecked=false;G.sponsorRiskMD=null;G.capRaiseUsed=false;G.lastXI=[];
  G.seasonTix.sold=0;G.jerseyFactor=1;
  G.revenge=null;   // last year's grudge died with last year's fixture list
  // the curve the boardroom reads: one point per season, kept for the career
  G.valHistory=(G.valHistory||[]).concat([{s:G.season-1,v:clubValuation()}]).slice(-30);
  G.netWorthHistory=(G.netWorthHistory||[]).concat([{s:G.season-1,v:netWorth()}]).slice(-30);  // O1: imperium-trend
  if(o.promoted)bumpRep(BAL.owner.repPromotion);   // O1: climbing the pyramid builds your name
  modal={type:"seasonDone",txt,promoted,pos,prize,crown};
  saveGame();
  render();
}
/* ---------- B3: tre tilbud, og de skal vaere reelt forskellige ----------
   Mads: "Tre tilbud ad gangen med reelle forskelle -- ikke tre variationer af
   samme beloeb." Og: "Lav grundbetaling, store bonusser hvis DU leverer."
   Formen er derfor en RISIKOSTIGE, ikke tre priser:
     0 SIKKER   fuld grundbetaling, tre saesoner, ingen bonus
     1 DELT     lavere grund, to saesoner, bonus for oprykning
     2 ALT PAA  lav grund, en saeson, bonus for oprykning + top 4 + mesterskab
   Bonusserne regnes af REFERENCEBELOEBET (`ref`), ikke af den nedsatte grund --
   ellers ville "lav grund" ogsaa betyde "lille bonus", og stigen ville forsvinde. */
/* B3: de tre bonusudloesere. Hver har baade sit NAVN og sin MAALING her, saa
   teksten paa kortet og pengene ved saesonslut ikke kan komme fra hinanden.
   GDD'ens "en pokalrunde" er ikke med: der er ingen pokal i spillet endnu
   (ROADMAP, ikke min ordre), saa mesterskabet er den tredje udloeser. */
const SPONSOR_TRIGGERS={
  promotion:{kort:"oprykning", txt:"Rykker klubben op",   hit:o=>!!o.promoted},
  top4:     {kort:"top 4",     txt:"Slutter i top 4",     hit:o=>o.pos<=4},
  title:    {kort:"mesterskab",txt:"Vinder divisionen",   hit:o=>o.pos===1}
};
const SPONSOR_SHAPES=[
  {id:"safe", label:"Sikker",   perMult:1.00, seasons:3, triggers:[]},
  {id:"split",label:"Delt",     perMult:0.72, seasons:2, triggers:["promotion"]},
  {id:"allin",label:"Alt på ambitionen", perMult:0.45, seasons:1, triggers:["promotion","top4","title"]}
];
/* Dristigheden fra forventningsmoedet ganger bonusserne. Lover du hoejt begge
   steder, haenger to udbetalinger paa samme saeson -- praecis koblingen planen
   beder om. */
function sponsorBoldFactor(){return 1+Math.max(0,G.objectiveBold||0)*BAL.sponsor.bonus.perBoldStep;}
function sponsorBonusAmount(d,trigger){
  return Math.round((d.ref||d.per)*G.rounds*(BAL.sponsor.bonus[trigger]||0)*(d.boldAt||1));
}
function sponsorOffersFor(slot){
  const sl=BAL.sponsor.slots[slot];
  const scale=(1+(3-G.div)*BAL.sponsor.perDivision)*sl.share;
  /* Tre FORSKELLIGE firmaer -- aldrig samme navn to gange paa samme bord. */
  const pool=SPONSORS.slice();
  const chosen=[];
  while(chosen.length<SPONSOR_SHAPES.length&&pool.length)chosen.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  const bold=sponsorBoldFactor();
  return chosen.map((c,i)=>{
    const sh=SPONSOR_SHAPES[i];
    const o=sponsorCopy(c);
    o.slot=slot;o.shape=sh.id;o.shapeLabel=sh.label;
    o.ref=Math.round(c.per*scale);
    o.per=Math.round(o.ref*sh.perMult);
    o.seasonsLeft=sh.seasons;
    o.triggers=sh.triggers.slice();
    o.boldAt=bold;                    // laases ved TILBUDDET, saa summen ikke skrider bagefter
    /* Den gamle top-N-klausul beholdes paa den mest kravstore form, og kun paa
       hovedsponsoren -- den er hovedsponsorens smaatryk, ikke drikkevarernes. */
    o.demand=(slot==="main"&&sh.id==="allin")
      ? "top "+Math.max(4,G.objectivePos-2)+" finish or "+pct(BAL.sponsor.penalty)+" penalty" : null;
    return o;
  });
}
function sponsorRenewal(){
  // shown after the budget meeting, not buried in the inbox
  G.sponsorDue={slot:"main",offers:sponsorOffersFor("main"),renewal:true};
}
/* De tre andre slots: den kommercielle afdeling ringer af sig selv, naar
   klubben er stor nok og slottet er frit. Ikke hver kampdag -- en gang i
   ny og næ, saa det er en begivenhed og ikke en stroem. */
function sponsorSlotKnock(){
  if(G.sponsorDue||G.phase!=="season")return;
  const free=sponsorSlotKeys().filter(k=>k!=="main"&&sponsorSlotFree(k));
  if(!free.length)return;
  if(Math.random()>=BAL.sponsor.knockChance)return;
  const slot=pick(free);
  G.sponsorDue={slot,offers:sponsorOffersFor(slot),renewal:false};
}
function sponsorLine(o){
  const b=(o.triggers||[]).length
    ? " · bonus: "+(o.triggers||[]).map(t=>SPONSOR_TRIGGERS[t].kort+" "+kfmt(sponsorBonusAmount(o,t))).join(" + ")
    : " · ingen bonus";
  return o.n+" · "+kfmt(o.per)+"/kampdag i "+o.seasonsLeft+" sæson"+(o.seasonsLeft===1?"":"er")+b+(o.demand?" · krav: "+o.demand:"");
}
function sponsorInbox(d){
  const slotName=BAL.sponsor.slots[d.slot].n;
  msg("Kommerciel afdeling","£",slotName+": tre tilbud venter",
    (d.renewal?"Du bad om at tænke over det. ":"")+"Der er tre kuverter på bordet om "+slotName.toLowerCase()+". "+
    d.offers.map((o,i)=>"("+"ABC"[i]+") "+sponsorLine(o)).join(" "),
    {kind:"sponsorChoice",slot:d.slot,offers:d.offers.map(sponsorCopy)});
}
/* Underskriften. ET sted, saa baade modalen og indbakkefallbacken gaar samme vej. */
function sponsorSign(o,slot){
  const d=sponsorCopy(o);
  d.slot=slot;
  G.sponsors[slot]=d;
  const sl=BAL.sponsor.slots[slot];
  /* Stadionnavne-dilemmaet (GDD, eget afsnit). Byen synes ikke navnet er til
     salg, og prisen tages med det samme -- i humoer, ikke i penge. */
  if(slot==="ground"){
    G.fanMood=clamp(G.fanMood+BAL.sponsor.groundNameMood,5,100);
    addNews("FANS","The ground is now the "+d.n+" Arena. Somebody has already crossed it out on the sign.");
  }
  addNews("CLUB",sl.n+": "+d.n+" at "+kfmt(d.per)+"/kampdag."+(d.demand?" Krav: "+d.demand+".":""));
  const bonusTxt=(d.triggers||[]).length
    ? "Grundbetalingen er lav med vilje: "+(d.triggers||[]).map(t=>SPONSOR_TRIGGERS[t].kort+" udløser "+kfmt(sponsorBonusAmount(d,t))).join(", ")+". Leverer du, er det den bedste aftale på bordet. Leverer du ikke, er det den dårligste."
    : "Ingen bonus, ingen betingelser. Den samme check hver kampdag, uanset hvad der sker på banen.";
  msg("Kommerciel afdeling","£","Underskrevet: "+d.n+" ("+sl.n.toLowerCase()+")",
    kfmt(d.per)+" lander hver kampdag i "+d.seasonsLeft+" sæson"+(d.seasonsLeft===1?"":"er")+". "+bonusTxt,null);
}
function sponsorPick(i){
  const d=G.sponsorDue;if(!d)return;
  const o=d.offers[i];if(!o)return;
  const cont=modal?modal.after:null;
  G.sponsorDue=null;
  sponsorSign(o,d.slot);
  modal=null;
  if(cont==="matchday")afterMatchday();else render();
}
function sponsorLater(){
  const d=G.sponsorDue;if(!d)return;
  const cont=modal?modal.after:null;
  sponsorInbox(d);G.sponsorDue=null;
  modal=null;
  if(cont==="matchday")afterMatchday();else render();
}

/* ---------- captain, office chats, retirement ---------- */
function pickCaptain(){
  const cands=[...G.squad].sort((a,b)=>((b.traits.includes("leader")?30:0)+b.age+ovr(b)/4)-((a.traits.includes("leader")?30:0)+a.age+ovr(a)/4));
  G.captain=cands[0]?cands[0].id:null;
  if(G.captain)addNews("CLUB",G.coach.n.split(" ")[0]+" hands the armband to "+nameOf(G.captain)+". \"My call. Always my call,\" he adds, looking at you.");
}
function suggestCaptain(id){
  if(G.captSuggested){modal={type:"info",title:"Én gang pr. sæson",body:"Du har haft dit ord om armbindet i denne sæson. Gafferens dør er lukket om emnet."};render();return;}
  const p=byId(id);if(!p)return;
  G.captSuggested=true;
  const accepts=p.traits.includes("leader")||ovr(p)>=Math.max(...G.squad.map(ovr))-2||Math.random()<0.3;
  if(accepts){
    const old=G.captain;G.captain=p.id;
    const oldP=byId(old);if(oldP)oldP.conf=clamp(oldP.conf-8,10,95);
    msg(G.coach.n.split(" ")[0]+" (gaffer)","GM","\"Fine. Your man gets the armband.\"","\""+p.name.split(" ")[1]+" it is. If this goes wrong, we both know whose idea it was.\""+(oldP?" "+oldP.name.split(" ")[1]+" took it about as well as expected.":""),null);
  }else{
    msg(G.coach.n.split(" ")[0]+" (gaffer)","GM","\"No.\"","\"I hear you on "+p.name.split(" ")[1]+". The answer is no. "+(G.captain?surnameOf(G.captain)+" keeps the armband — he's earned the dressing room, not the highlight reel.":"I'll pick my own captain.")+"\"",null);
  }
  render();
}
function openChat(id){
  if(!byId(id))return;
  if(G.talkCooldown>0){modal={type:"info",title:"Kontoret er optaget",body:"Én samtale med et par kampdages mellemrum — de her ting skal have vægt. Næste samtale om "+G.talkCooldown+" kampdage."};render();return;}
  modal={type:"chat",pid:id};render();
}
function doChat(kind){
  const p=byId(modal.pid);if(!p){modal=null;render();return;}
  G.talkCooldown=4;
  let out="";
  if(kind==="praise"){
    if(p.conf>75){out="He nodded politely. He KNOWS he's playing well — the praise bounced off. (No effect.)";}
    else{p.conf=clamp(p.conf+6,10,95);out=p.name.split(" ")[1]+" left the office a foot taller. (Confidence +6)";}
  }
  if(kind==="hairdryer"){
    if(p.traits.includes("leader")||p.traits.includes("grafter")){p.conf=clamp(p.conf+8,10,95);out="He took it on the chin and ASKED FOR MORE. That's why he is what he is. (Confidence +8)";}
    else if(p.traits.includes("whinger")||p.traits.includes("glass")){p.conf=clamp(p.conf-8,10,95);out="His lip trembled. The hairdryer was too much for him. (Confidence −8)";}
    else if(Math.random()<0.5){p.conf=clamp(p.conf+6,10,95);out="It lit a fire. He trained like a man possessed. (Confidence +6)";}
    else{p.conf=clamp(p.conf-6,10,95);out="It backfired. He sulked through training. (Confidence −6)";}
  }
  if(kind==="promise"){
    p.conf=clamp(p.conf+5,10,95);p.promiseMD=G.md;p.appsAtPromise=p.sapps;
    out="\"You'll get your football.\" He believes you. Deliver within "+BAL.clock.promiseMD+" matchdays — or his agent calls. (Confidence +5)";
  }
  modal={type:"info",title:"The office door closes",body:out};render();
}
function applyRetirements(){
  const retiring=G.squad.filter(p=>p.age>=35||(p.age>=34&&Math.random()<0.4));
  for(const p of retiring){
    if(G.squad.length<=13)break;
    G.squad=G.squad.filter(x=>x!==p);
    const legend=p.capps>=50||p.smotm>=6;
    if(legend){
      G.coach.dev=Math.min(90,G.coach.dev+4);
      msg(p.name,"L","A legend hangs up his boots","\""+p.capps+" games for this club. I'm not leaving — the gaffer's given me the youth team. I'll teach them everything. Even the bad habits.\" (Coach DEV +4)",null);
      addNews("CLUB",p.name+" retires and joins the staff. The Shed End sings his name one last time. Then every Saturday after that.");
    }else{
      addNews("CLUB",p.name+" retires at "+p.age+". A quiet testimonial, a decent watch, and a season ticket for life.");
    }
    detachPlayer(p);
  }
}
/* ---------- budget & midway meetings, owners ---------- */
/* one formula, two callers: the live estimate in the budget wizard and the
   actual sale in budgetConfirm() must never drift apart */
function homeGames(){return Math.floor(G.rounds/2);}
function seasonTixFair(){return Math.max(20,Math.round(G.ticket*homeGames()*BAL.seasonTix.discount/5)*5);}
/* The old curve bottomed out at a floor of 0.2, so above ~£180 the number of
   holders STOPPED falling while cash = sold × price kept climbing for ever —
   free money, and the "turnstile money given up" line never shrank either.
   Demand now falls all the way to zero, so cash has a real peak and then
   collapses, and both figures move together. */
function seasonTixEstimate(price){
  const S=BAL.seasonTix,fair=seasonTixFair();
  const priceF=clamp(S.demandAt0-S.slope*(price/fair),0,S.demandCap);
  const reach=Math.min(G.capacity,townDemand());
  const sold=Math.max(0,Math.round(reach*S.share*priceF*(0.5+G.fanMood/150)));
  return {sold,cash:sold*price,fair};
}
/* Pakke 19. "The objective" ligger foer opsummeringen og ikke sidst, fordi
   opsummeringen skal kunne vise hvad man gik med til. Arbejdsordren sagde
   "femte trin"; den er femte i antal og fjerde i raekken, og det er den eneste
   afvigelse. */
const BUDGET_STEPS=["Sæsonkort","Trøjen","Målsætningen","Rammen"];   // R1b: fondstrinnet er ude
/* Hvad medejerne SELV forventer. Skjult i foerste runde -- samme pokerprincip
   som kontraktforhandlingen, hvor modpartens krav ikke er synligt foer man har
   budt. Helt uden terning: aabner man moedet igen, staar det samme tal der, saa
   man ikke kan rulle om paa en mild bestyrelse. */
function ownerDemandPos(){
  const O=BAL.owners,rows=G.teams.length+1;
  let d=DIV_OBJECTIVE[G.div];
  /* Personligheden. Slagteren er ambitioes paa klubbens vegne, sagfoereren er
     forsigtig, tertemagasinet er ligeglad -- vaegtet med deres ejerandel, saa
     den stoerste aktionaer taler hoejest. */
  const tot=G.owners.reduce((s,o)=>s+o.share,0);
  if(tot>0){
    const push=G.owners.reduce((s,o)=>s+({butcher:-1,solicitor:1,"pie magnate":0}[o.role]||0)*o.share,0)/tot;
    d+=push;
  }
  // og humoeret: en glad by og en formand de stoler paa haever barren
  if(G.fanMood>=BAL.text.happyAt)d-=O.objectiveMoodStep;
  if(trustLevel()>=O.objectiveTrustAt)d-=O.objectiveTrustStep;
  if(protestLevel()>=2)d+=O.objectiveMoodStep;
  return clamp(Math.round(d),2,rows-1);
}
/* N5: ejerfinanser. Din andel af klubben afgør om DU bestemmer udbyttet.
   Flertal (> majorityAt): du vælger, op til dividendMaxFrac af kassen.
   Mindretal (≤ majorityAt): medejerne bestemmer efter deres appetit — de kan
   tømme klubben. Din andel af ethvert udbytte bliver personlig formue. */
function isMajority(){return G.myShare>BAL.owners.majorityAt;}
function boardDividend(){
  const cash=Math.max(0,G.balance),A=BAL.owners.dividendAppetite;
  let wsum=0,asum=0;
  for(const o of G.owners){const a=A[o.role]!==undefined?A[o.role]:0.3;wsum+=o.share;asum+=a*o.share;}
  const frac=wsum?asum/wsum:0.3;
  return Math.round(cash*frac/1000)*1000;
}
function dividendCap(){return Math.round(Math.max(0,G.balance)*BAL.owners.dividendMaxFrac/1000)*1000;}
function openDividend(){
  const maj=isMajority();
  const forced=maj?null:boardDividend();
  // majority's default suggestion: a modest slice of the cap
  modal={type:"dividend",majority:maj,cash:Math.max(0,G.balance),cap:dividendCap(),forced,
    amount:maj?Math.round(dividendCap()*0.35/1000)*1000:forced};
  render();
}
function dividendSet(frac){const m=modal;if(!m||!m.majority)return;m.amount=Math.round(m.cap*frac/1000)*1000;render();}
/* R3: mindretals-udbyttet sker AUTOMATISK ved sæsonskiftet — en besked på
   bordet, ikke en modal. Egen funktion, så den kan måles udefra. */
function settleBoardDividend(){
  const D=Math.max(0,Math.min(boardDividend(),Math.max(0,G.balance)));
  const mine=Math.round(D*G.myShare/100);
  if(D>0){
    G.balance-=D;
    G.personalWealth=(G.personalWealth||0)+mine;
    addNews("OWNER","The board voted itself a "+kfmt(D)+" dividend. Your "+G.myShare+"% — "+kfmt(mine)+" — landed quietly in your account.");
  }
  G.lastDividend={total:D,mine,season:G.season-1,forced:true};
  G.dividendTaken=true;
}
function dividendConfirm(){
  const m=modal;if(!m||m.type!=="dividend")return;
  const D=Math.max(0,Math.min(m.amount||0,Math.max(0,G.balance)));
  const mine=Math.round(D*G.myShare/100);
  if(D>0){
    G.balance-=D;
    G.personalWealth=(G.personalWealth||0)+mine;
    // O1: a greedy dividend (majority stripping the club) costs you standing
    if(m.majority&&m.cap>0&&D>=BAL.owner.dividendGreedyFrac*m.cap)bumpRep(BAL.owner.repDividendGreedy);
    addNews("CLUB",(m.majority?"You declared":"The board forced through")+" a "+kfmt(D)+" dividend. "+kfmt(mine)+" of it is yours.");
  }
  G.lastDividend={total:D,mine,season:G.season-1,forced:!m.majority};
  G.dividendTaken=true;modal=null;render();
}
function openBudgetMeeting(){
  modal={type:"budget",step:0,tixPrice:G.seasonTix.price,jersey:null,capAsked:false,capMsg:null,
    /* Forhandlingen starter fra DIVISIONENS ramme, ikke fra sidste saesons
       aftale. Ellers ratcher den: en dristig aftale saenker G.objectivePos,
       naeste moede starter derfra, og efter fem saesoner forhandler man om
       top 2 uden nogensinde at have besluttet det. Maalt paa foerste udgave:
       "forsigtig" forekom i NUL af 1.200 saesoner, fordi udgangspunktet altid
       allerede laa under medejernes eget tal. */
    objProposed:DIV_OBJECTIVE[G.div],objTheirs:null,objAgreed:null,objSaid:null};
  render();
}
/* Runde 1: du byder blindt. Er dit bud mindst lige saa ambitioest som deres
   (altsaa et LAVERE tal), gaar de med uden at afsloere noget. Er det mildere,
   laegger de deres eget tal paa bordet -- og saa er det dit valg om du tager
   det eller bliver staaende. */
function objectivePropose(){
  const m=modal;if(!m||m.objAgreed!==null)return;
  const theirs=ownerDemandPos();
  m.objTheirs=theirs;
  if(m.objProposed<=theirs){
    m.objAgreed=m.objProposed;
    m.objSaid=m.objProposed<theirs
      ? "\"Top "+m.objProposed+".\" Whitmore looks up from his pad. \"That is bolder than we had written down. Minuted, chairman -- and remembered.\""
      : "\"Top "+m.objProposed+". Agreed.\" Trencher nods once. He had the same figure underlined.";
  }else{
    m.objSaid="Whitmore turns his pad around. \"We had written top "+theirs+". You are asking us to expect less of you than we already do.\"";
  }
  render();
}
function objectiveSettle(takeTheirs){
  const m=modal;if(!m||m.objTheirs===null||m.objAgreed!==null)return;
  m.objAgreed=takeTheirs?m.objTheirs:m.objProposed;
  m.objSaid=takeTheirs
    ? "\"Top "+m.objTheirs+" it is.\" Trencher caps the pen for him. \"Now go and do it.\""
    : "\"Top "+m.objProposed+", then.\" Nobody says anything else. Whitmore writes it down slowly.";
  render();
}
function budgetNext(){modal.step=Math.min(BUDGET_STEPS.length-1,(modal.step||0)+1);render();}
function budgetBack(){modal.step=Math.max(0,(modal.step||0)-1);render();}
function budgetConfirm(){
  const m=modal;
  /* Pakke 19: maalsaetningen. Roerte spilleren aldrig trinnet, staar den som
     divisionen satte den, og dristigheden er nul -- ingen aftale, ingen indsats. */
  if(m.objAgreed!==null&&m.objTheirs!==null){
    G.objectivePos=m.objAgreed;
    G.objectiveBold=m.objTheirs-m.objAgreed;
    const b=G.objectiveBold;
    addNews("CLUB","Season objective agreed: top "+G.objectivePos+"."+(b>0?" The boardroom wanted less. You did not.":b<0?" The boardroom wanted more.":""));
  }else G.objectiveBold=0;
  // season tickets sell
  G.seasonTix.price=m.tixPrice;
  const est=seasonTixEstimate(m.tixPrice);
  G.seasonTix.sold=est.sold;
  const tixCash=est.cash;
  G.balance+=tixCash;
  // jersey verdict
  const j=m.jersey||"classic";
  const verdicts={classic:[1.0,"The classic. The fans nod solemnly. Correct."],modern:[Math.random()<0.6?1.2:0.9,"The modern look divides the pub, then sells."],wild:[Math.random()<0.4?1.35:0.8,"The wild one. Either iconic or a war crime. Time will tell."]};
  G.jerseyFactor=verdicts[j][0];G.jerseyName=j;
  addNews("CLUB","New "+j+" kit revealed. "+verdicts[j][1]);
  msg("Ledger (bookkeeper)","L","Season tickets: "+G.seasonTix.sold.toLocaleString("en-GB")+" sold","+"+kfmt(tixCash)+" in the bank before a ball is kicked. "+(G.seasonTix.sold>G.capacity*0.3?"The town believes.":"Room to grow, chairman."),null);
  // the shirt deal is the last item on the agenda — never buried in the inbox
  if(G.sponsorDue){modal={type:"sponsorOffer",after:"budget"};render();return;}
  modal=null;render();
}
function askCapRaise(){
  const m=modal;
  if(G.capRaiseUsed||m.capAsked)return;
  m.capAsked=true;G.capRaiseUsed=true;
  if(Math.random()<0.45+G.fanMood/400){
    G.wageCap=Math.round(G.wageCap*BAL.wages.capRaise/100)*100;
    m.capMsg="Trencher sighs, Whitmore shrugs: cap raised to "+kfmt(G.wageCap)+"/w. \"Spend it wisely. Or at all, frankly.\"";
  }else{
    m.capMsg="\"No.\" Trencher didn't even look up from his sausage roll.";
  }
  render();
}
function openMidway(){
  const pos=myPos();
  const verdict=pos<=G.objectivePos?"\"On track. We are cautiously — and I stress cautiously — pleased.\"":"\"You are "+ord(pos)+". The objective is top "+G.objectivePos+". Do something, chairman.\"";
  modal={type:"midway",verdict};
  render();
}
function midwayConfirm(){
  G.midwayDone=true;modal=null;
  if(G.md%4===0&&!isDeadlineDay()){G.adCount++;modal={type:"interstitial"};}  // pakke T4: deadline day er annoncefri
  render();
}
/* Buying the boardroom out is meant to be a long game, not a shopping trip:
   they want to see a direction first, they price a life's work well above fair
   value, only one of them leaves in any season, and a failed talk shuts the
   door for two. */
/* The season-3 wall is gone (pakke 4). What stopped an early buyout was never
   a rule they'd have stated out loud — it was that they had no reason to sell
   to a stranger. That is now a price, not a locked door. */
function ownerGate(o){
  if(G.ownerBoughtSeason===G.season)return {title:"One a season",
    body:"You already bought somebody out this season. \"The boardroom needs time to get used to the empty chair,\" says Whitmore. \"And frankly, so do our accountants.\""};
  if(o.lockedUntil&&G.season<o.lockedUntil)return {title:"\"We're still not talking.\"",
    body:o.n.split(" ")[0]+" hasn't forgotten how the last conversation ended. The door stays shut until season "+o.lockedUntil+"."};
  return null;
}
/* pris = værdi × andel% × grundpræmie(personlighed) × tillid × retning.
   No wall, a curve — and one that tells a story instead of saying no. */
function ownerPremium(o){
  const O=BAL.owners;
  const t=trustLevel()/100;
  const base=O.premiumHigh-(O.premiumHigh-O.premiumLow)*t;
  const role={butcher:O.roleButcher,solicitor:O.roleSolicitor,"pie magnate":O.rolePie}[o.role]||1;
  const dir=1+valDirection()*BAL.val.dirWeight;    // rising club = they see the upside
  const mood=G.fanMood>70?1-O.moodDiscount:1;
  /* Pakke 19. Pressede du maalsaetningen ned, noterede de det. De saelger ikke
     billigt til en formand der selv har skrevet ned at klubben ikke skal noget. */
  const timid=1+Math.max(0,-(G.objectiveBold||0))*O.objectiveTimid;
  // bounded at BOTH ends: a fast-rising club with a wary board could otherwise
  // ask 2,7x, which stops being a negotiation and becomes a wall again
  return clamp(base*role*dir*mood*timid,O.premiumFloor,O.premiumCap);
}
function ownerWhy(o,prem,dir){
  const t=trustLevel();
  const trustTxt=t<30?"They have barely met you."
    :t<60?"They are starting to believe you mean it."
    :t<85?"You have earned the benefit of the doubt in that boardroom."
    :"After all this, they'd take your word on a handshake.";
  const dirTxt=dir>0.04?"The club is worth more than it was — they can see the upside as clearly as you can, and it is in the price."
    :dir<-0.04?"The value is going the wrong way, and they know it. That is the one thing working in your favour."
    :"The value has held steady since last summer.";
  return trustTxt+" "+dirTxt+" Their asking premium: <b>"+prem.toFixed(2)+"×</b> fair value.";
}
function buyOutOwner(i){
  const o=G.owners[i];
  const gate=ownerGate(o);
  if(gate){modal={type:"info",title:gate.title,body:gate.body};render();return;}
  const fair=Math.round(clubValuation()*o.share/100/1000)*1000;
  const O=BAL.owners,prem=ownerPremium(o);
  const min=Math.max(1000,Math.round(fair*prem/1000)*1000);
  const dir=valDirection();
  modal={type:"ownerNego",i,round:0,fair,min,prem:Math.round(prem*100)/100,dir:Math.round(dir*100),
    offer:Math.max(1000,Math.round(fair*prem*O.openMult/1000)*1000),
    ask:Math.round(fair*prem*O.askMult/1000)*1000,
    line:{"butcher":"\"Twenty-four percent of this club is forty years of Saturdays, chairman. It has a price. It isn't small.\"",
          "solicitor":"\"Everything is for sale, dear boy. The question, as ever, is the consideration.\"",
          "pie magnate":"\"My share? You couldn't afford my pie recipe. But make me an offer.\""}[o.role]||"\"Make me an offer.\"",
    why:ownerWhy(o,prem,dir)};
  render();
}
function ownerNegoSubmit(){
  const m=modal;const o=G.owners[m.i];
  m.round++;
  if(m.offer>=m.min){
    if(G.balance<m.offer){modal={type:"info",title:"Aftalt — og uden dækning",body:"I gav hånd på "+kfmt(m.offer)+", og banken sagde nej. "+o.n.split(" ")[0]+" kommer til at fortælle den her historie længe."};render();return;}
    G.balance-=m.offer;G.myShare+=o.share;
    G.ownerBoughtSeason=G.season;          // one empty chair per season
    const name=o.n,role=o.role,share=o.share;
    G.owners.splice(m.i,1);
    addNews("CLUB","You bought out "+name+" for "+kfmt(m.offer)+". Your stake: "+G.myShare+"%.");
    if(G.myShare>=100){
      msg("The club","AR","THE CLUB IS YOURS. ALL OF IT.","100%. No wage cap. No co-owner letters. No one to blame. Just you, the ground, and the town. Congratulations, chairman — and good luck.",null);
      addNews("CLUB","Sole ownership. The wage cap is history. So are the excuses.");
    }else{
      msg(name,"CO","A dignified exit","\""+share+"% well sold. I'll be in the "+(role==="butcher"?"shop":"stand")+" on Saturdays regardless. Look after her.\"",null);
    }
    modal=null;render();return;
  }
  // only a genuinely insulting number kills it outright — a collapse costs two seasons
  if(m.round>=3||m.offer<m.min*BAL.owners.insultBelow){
    o.lockedUntil=G.season+BAL.owners.lockSeasons;
    modal={type:"info",title:"\"Vi er færdige her.\"",body:o.n.split(" ")[0]+" lukker mappen. \"Ikke i denne sæson, formand. Heller ikke den næste.\" Døren klikker høfligt, og forbliver lukket til sæson "+o.lockedUntil+"."};render();return;
  }
  m.ask=Math.round(((m.min*1.08+m.offer)/2)/1000)*1000;
  m.line="\"Closer. But my number starts with "+kfmt(m.ask).slice(0,3)+"…\" (wants ~"+kfmt(m.ask)+")";
  render();
}
/* ---------- economy: bank ultimatum ---------- */
function openBankUltimatum(){
  // R1b: fonden findes ikke mere — banken går direkte til tvangssalg/nødlån.
  const canSell=G.squad.length>13;
  /* Banken omlaegger EN gang. Den finansierer ikke en redning nummer to.
     Det er den gamle regel ("et laan ad gangen") udtrykt gennem den nye bank,
     og den skal staa her og ikke i loanHeadroom(): at laane for at BYGGE maa
     gerne kunne stables, at laane for at overleve maa ikke. Uden den her
     linje stablede krisen laan oven paa laan, og andelen af karrierer der
     mistede klubben gik fra 20 % til 45 % -- maalt, ikke gaettet. */
  /* Banken omlaegger EN gang ad gangen -- men et byggelaan er ikke en
     omlaegning. Foerste udgave spurgte om der var NOGET aabent laan, og saa
     aad en tribune finansieret paa kredit hele noedlinjen: klubben stod i
     krisen uden laanemulighed og fik trin 4 tilbudt 2,7 gange pr. karriere.
     Maalt. Nu er det kun et aabent KRISElaan der lukker doeren. */
  const canLoan=!(G.loans||[]).some(l=>l.kind==="crisis")&&loanHeadroom()>=BAL.bank.minLoan;
  /* Trin 4 ligger HER, mellem bankens ultimatum og administrationen: naar der
     hverken er en mand at saelge eller et laan at tage, er der stadig et sted
     at hente penge -- medejernes lommer. Prisen er klubben, en skive ad
     gangen. */
  if(!canSell&&!canLoan&&rescueOffer()){return;}
  if(!canSell&&!canLoan){administration();return;}
  const best=[...G.squad].sort((a,b)=>b.value-a.value)[0];
  modal={type:"bank",best,canSell,canLoan};
  render();
}
/* ---------- nat 4, pakke 23: banken ----------
   Laan er en LISTE, ikke et saertilfaelde. Det var hele pointen med at rive
   G.loan ned: saa laenge der kun kunne vaere et, kunne banken hverken sige nej
   fordi du allerede skylder, eller lade dig bygge paa kredit.

   AFVIGELSE fra ROADMAP'en, med vilje: den skriver "laanet laegges i
   G.commitments fra pakke 3". Det gaar ikke, og grunden er cadencen --
   settleCommitments() koerer EN gang pr. saeson, mens et laan afdrages pr.
   kampdag. Enten skulle laanet skifte takt (og saa forsvinder det drypvise
   pres der er hele dets karakter), eller ogsaa skulle settleCommitments have
   en anden afregningsvej ved siden af sin egen. Laanene har derfor deres egen
   liste med samme form -- flere aabne forpligtelser, en faelles afregning i
   settleFinances hvor de allerede blev afregnet. */
function seasonIncome(){
  // bankens maalestok for hvad klubben kan baere: det den tjener paa en saeson
  return Math.round((sponsorIncome()+tvMoney())*G.rounds
    +attendance()*(G.ticket+BAL.matchday.kiosk)*homeGames());
}
function loansOwed(){return (G.loans||[]).reduce((s,l)=>s+l.perMD*l.left,0);}
function bankExposure(){const inc=seasonIncome()||1;return loansOwed()/inc;}
function loanRate(amount){
  const B=BAL.bank,inc=seasonIncome()||1;
  /* Klubvaerdien er en faktor -- kommentaren paa bank-blokken lovede det, men
     koden gjorde det ikke: en klub med et stadion og en trup er en bank mindre
     bange for. Fortegnet er negativt (mere vaerd = billigere), og bidraget er
     clampet, saa en Premier-klub ikke laaner gratis. */
  const valDrop=clamp(clubValuation()/1000000*(-B.rateValue),0,B.rateValueCap);
  const r=B.rateBase
    +(G.admins||0)*B.rateAdmin
    +(3-G.div)*B.rateDivision
    +(G.balance<0?B.rateOverdrawn:0)
    +((loansOwed()+amount)/inc)*B.rateExposure
    -valDrop;
  return clamp(r,B.rateFloor,B.rateCap);
}
/* Hvad banken vil laane dig oveni det du allerede skylder. Nul betyder nej --
   og det er praecis dét, der goer trin 2 i trappen aegte: banken siger ikke nej
   fordi en variabel er sat, men fordi du allerede skylder for meget. */
function loanHeadroom(){
  const B=BAL.bank;
  const room=Math.floor((seasonIncome()*B.exposureCap-loansOwed())/B.loanStep)*B.loanStep;
  return clamp(room,0,B.maxLoan);
}
function loanTerms(amount,termMD){
  const B=BAL.bank;
  const term=clamp(Math.round(termMD),B.minTermMD,B.maxTermMD);
  const rate=loanRate(amount);
  const total=Math.round(amount*(1+rate*term/G.rounds));
  return {amount,term,rate,total,perMD:Math.max(1,Math.round(total/term/10)*10)};
}
function takeLoan(amount,termMD,kind){
  const t=loanTerms(amount,termMD);
  if(amount>loanHeadroom())return null;
  G.loans=G.loans||[];
  G.loans.push({perMD:t.perMD,left:t.term,took:amount,rate:Math.round(t.rate*1000)/1000,kind:kind||"build"});
  G.balance+=amount;
  addNews("CLUB","Bank loan agreed: "+kfmt(amount)+" now, "+kfmt(t.perMD)+" per matchday for "+t.term+" matchdays at "+pct(t.rate)+".");
  return t;
}
function openBank(){
  const room=loanHeadroom();
  modal={type:"loan",amount:Math.min(room,BAL.bank.loanCash),term:BAL.bank.loanTerm,room};
  render();
}
function loanConfirm(){
  const m=modal;if(!m||m.type!=="loan")return;
  if(m.amount<BAL.bank.minLoan||m.amount>m.room){modal=null;render();return;}
  takeLoan(m.amount,m.term);
  modal=null;render();
}
/* Trin 4. Medejerne har kapital, og de vil hellere eje mere af en klub der
   overlever end lidt af en der ikke goer. Skiven de forlanger vokser naar de
   stoler mindre paa dig -- det er den samme tillid der prissaetter deres
   andele, og det er derfor en daarlig formand betaler dyrere for at blive
   reddet. Returnerer true hvis tilbuddet blev lagt frem. */
function rescueOffer(){
  const L=BAL.ladder;
  const backers=G.owners.filter(o=>o.share>0);
  if(!backers.length)return false;                 // eneejer: ingen at gaa til
  if(G.myShare<=L.controlAt)return false;          // allerede uden kontrol
  const t=trustLevel();
  /* Skiven er 5 eller 10 -- den skaeres IKKE ned til lige at holde dig over
     graensen. Starter man paa 51 %, er den foerste redning derfor ogsaa den
     sidste, og modalen siger det ligeud foer man trykker. Det er meningen: paa
     51 % ejer man knap nok halvdelen, og valget er "mist klubben nu med penge
     i kassen" mod "gaa i administration og behold den". Rum til at blive
     fortyndet er noget man KOEBER, ved at koebe medejere ud. */
  const share=t>=L.rescueTrustFloor?L.rescueShare[0]:L.rescueShare[1];
  const standing=clamp(clubValuation()/1000000,0.6,3.5);
  const cash=Math.round(L.rescueCash*share/L.rescueShare[0]*standing/1000)*1000;
  const backer=backers.reduce((a,b)=>b.share>a.share?b:a);
  modal={type:"rescue",share,cash,who:backer.n,role:backer.role,fatal:G.myShare-share<=L.controlAt};
  render();return true;
}
function rescueAccept(){
  const m=modal;if(!m||m.type!=="rescue")return;
  const backer=G.owners.find(o=>o.n===m.who);
  if(!backer){modal=null;administration();return;}
  G.balance+=m.cash;G.myShare-=m.share;backer.share+=m.share;
  addNews("CLUB",m.who+" has put "+kfmt(m.cash)+" into the club for "+m.share+"% of it. Your stake: "+G.myShare+"%.");
  const nowMinority=G.myShare<=BAL.owners.majorityAt;
  msg("The co-owners","CO","Rescue capital, and what it costs",
    "\""+m.who+" has found "+kfmt(m.cash)+". "+m.share+"% moves across the table. "+(nowMinority?"You are a minority owner now, chairman — you keep your seat, but the board sets the dividend. Below "+BAL.ladder.controlAt+"% you lose the club entirely.":"You still run this club — you just own less of it.")+"\"",null);
  modal=null;
  if(G.myShare<=BAL.ladder.controlAt){loseControl(m.who);return;}
  if(G.md>=G.rounds){startPostSeason();return;}
  render();
}
function rescueDecline(){
  const m=modal;if(!m||m.type!=="rescue")return;
  addNews("CLUB","The rescue package was turned down. The administrators are on their way.");
  modal=null;administration();
}
/* Trin 5. Ikke en konkurs -- en generalforsamling. Aeraen goeres op, og det er
   den opgoerelse der er belonningen for at have spillet saa laenge. */
function loseControl(who){
  G.phase="over";G.overTo=who||null;
  addNews("CLUB","Control of "+G.club+" has passed out of your hands. Fourteen seasons of paperwork, and it fits in one envelope.");
  modal={type:"eraOver",who:who||null};
  saveGame();render();
}
function eraSummary(){
  const h=G.history||[];
  return {
    seasons:h.length,
    promotions:h.filter(x=>x.promoted).length,
    relegations:h.filter(x=>x.relegated).length,
    titles:G.titles||0,
    admins:G.admins||0,
    best:h.length?h.reduce((a,x)=>x.pos<a.pos?x:a,h[0]):null,
    peak:(G.valHistory||[]).reduce((a,x)=>Math.max(a,x.v),clubValuation()),
    div:G.divNames[G.div],
    share:G.myShare,
    wealth:G.personalWealth||0   // N5: the career score you actually walk away with
  };
}
function wageBill(){return G.squad.reduce((s,p)=>s+p.wage,0);}
function administration(){
  G.admins=(G.admins||0)+1;                 // a scar the valuation never forgets
  bumpTrust(BAL.owners.trustAdmin);
  G.me.pts=Math.max(0,G.me.pts-BAL.bank.adminPoints);
  G.fanMood=clamp(G.fanMood-10,5,100);
  G.balance+=BAL.bank.adminRelief; // creditors restructure
  for(const p of G.squad)p.wage=Math.round(p.wage*BAL.wages.adminCut/10)*10; // renegotiated down
  /* Trin 3 var FOER kun det flade lønnedslag ovenfor. Det er den vedvarende,
     tunede lettelse der holder administration paa ~1 pr. karriere, saa det
     BLIVER staaende. Oveni kommer nu GDD'ens "hvem ryger": administratoren
     tvinger ogsaa et brandudsalg -- du vaelger hvem der saelges/frigives inden
     uret loeber ud, ellers goer HAN det hen over hovedet paa dig, til skampris
     (administratorSells). Kontraktnedslaget er genforhandlingen; brandudsalget
     er aktivstripningen. To aegte konsekvenser, ikke een forklaedt som to. */
  if(!G.fireSale){
    const target=Math.round(wageBill()*BAL.ladder.fireWageFrac/10)*10;
    G.fireSale={target,done:0,left:BAL.ladder.fireClockMD};
    msg("The administrators","AD","THE CLUB IS IN ADMINISTRATION",BAL.bank.adminPoints+" points deducted. The creditors have restructured the debt — but "+kfmt(target)+"/week must come off the wage bill within "+BAL.ladder.fireClockMD+" matchdays. Sell or release whoever you choose. Miss the deadline and the administrator picks for you, at fire-sale prices. Below "+BAL.ladder.controlAt+"% ownership you are not the chairman at all.",null);
    addNews("CLUB","Administration. −"+BAL.bank.adminPoints+" points. "+kfmt(target)+"/week must come off the wage bill in "+BAL.ladder.fireClockMD+" matchdays — your call who goes, or theirs.");
  }
  if(G.md>=G.rounds){startPostSeason();return;}
  render();
}
/* Kaldes hver kampdag mens brandudsalget loeber. Naar maalet er naaet, gaar
   administratoren; naar uret loeber ud uden at det er naaet, saelger han selv. */
function checkFireSale(){
  const fs=G.fireSale;if(!fs)return;
  if(fs.done>=fs.target){endFireSale(true);return;}
  fs.left--;
  if(fs.left<=0)administratorSells();
}
/* Feature 1: administratoren saelger spillere hen over hovedet paa dig. Han
   dumper de dyreste kontrakter foerst -- det er lønsummen han er efter -- til
   skampris, og han roerer ikke en spilbar trup (fireMinSquad). */
function administratorSells(){
  const fs=G.fireSale;if(!fs)return;
  const sold=[];
  while(fs.done<fs.target&&G.squad.length>BAL.ladder.fireMinSquad){
    const p=[...G.squad].sort((a,b)=>b.wage-a.wage)[0];
    if(!p)break;
    const fee=Math.round(p.value*BAL.ladder.fireSaleFee/1000)*1000;
    G.balance+=fee;
    G.squad=G.squad.filter(x=>x!==p);detachPlayer(p); // detachPlayer krediterer fs.done
    sold.push(surnameOf(p.id)||p.name.split(" ")[1]);
  }
  if(!G.captain)pickCaptain();
  if(sold.length){
    G.fanMood=clamp(G.fanMood-8,5,100);
    addNews("CLUB","The administrator sold over your head: "+sold.join(", ")+". You were not consulted. That is what administration means.");
    msg("The administrators","AD","They sold them for you","You did not make the cut in time, so we did. "+sold.join(", ")+" are gone, for what we could get. The wage bill is where it needed to be.",null);
  }
  endFireSale(sold.length>0||fs.done>=fs.target);
}
function endFireSale(met){
  if(met)addNews("CLUB","The administrators have left the building. The wage bill is under control — for now.");
  else addNews("CLUB","The administrators leave with the job half done. There was not enough left to sell.");
  G.fireSale=null;
}
function resolveBank(sell){
  const best=modal.best;
  const resume=G.md>=G.rounds; // season ended while bank was due
  if(sell){
    G.balance+=Math.round(best.value*0.85);
    G.squad=G.squad.filter(p=>p!==best);
    detachPlayer(best);
    if(!G.captain)pickCaptain();
    if(best.traits.includes("localhero")){G.fanMood=clamp(G.fanMood-14,5,100);bumpTrust(BAL.owners.trustFavourite);addNews("FANS","Selling a local hero to pay the bank. The Shed End is composing new songs. They are not kind songs.");}
    addNews("CLUB",best.name+" sold under duress for "+kfmt(Math.round(best.value*0.85))+". The bank manager sends a fruit basket.");
  }else{
    /* Noedlaanet er ikke laengere en anden bank end den man kan gaa til i ro
       og mag -- det er den samme, paa krisens vilkaar. Renten afspejler at
       kassen er i minus, saa den ER dyrere; den er bare ikke en anden regel. */
    const room=loanHeadroom();
    const amt=Math.max(BAL.bank.minLoan,Math.min(room,BAL.bank.loanCash));
    const t=takeLoan(amt,BAL.bank.loanTerm,"crisis");
    if(t)addNews("CLUB","Emergency loan taken at "+pct(t.rate)+". The manager calls it 'sporting'. It is not.");
  }
  modal=null;
  if(resume){startPostSeason();return;}
  render();
}

/* ---------- deadline day: a rolling feed of theatre ---------- */
function isDeadlineDay(){return G.md===5||G.md===14;}
function buildDeadlineEvents(){
  const D=BAL.deadline,events=[];
  const rivalIdx=()=>Math.floor(Math.random()*G.teams.length);
  // 1) the heist — a skint club dumps a GOOD man cheap. N6: a marquee steal (baseLift).
  const heist=genMarketPlayer(pick(["DF","MF","FW","MF"]),D.heistBaseLift);
  heist.value=Math.max(1000,Math.round(heist.value*D.heistDiscount/1000)*1000);
  heist.desperation=D.heistDiscount;heist.heist=true;
  events.push({kind:"heist",time:"",fromIdx:heist.fromIdx,player:heist,price:heist.value,done:false,
    primaryFn:"dlHeistSign"});
  // 2) the panic bid — a rival throws money at one of your best
  const best=[...G.squad].sort((a,b)=>b.value-a.value)[0];
  if(best){
    const bidderP=rivalIdx();
    events.push({kind:"panic",time:"",fromIdx:bidderP,pid:best.id,name:best.name,pos:best.pos,ov:ovr(best),
      bid:Math.round(best.value*D.panicPremium/1000)*1000,pushed:false,done:false,primaryFn:"dlPanicAccept"});
  }
  // 3..) fill toward slots with poaches / a second heist — always a real club behind each
  const target=D.slots.min+Math.floor(Math.random()*(D.slots.max-D.slots.min+1));
  const pooled=[...G.squad].filter(p=>!best||p.id!==best.id).sort((a,b)=>b.value-a.value);
  let pi=0;
  while(events.length<target){
    if(Math.random()<0.55&&pi<pooled.length&&G.squad.length>13){
      const p=pooled[pi++];
      events.push({kind:"poach",time:"",fromIdx:rivalIdx(),pid:p.id,name:p.name,pos:p.pos,ov:ovr(p),
        offer:Math.round(p.value*(1+D.poachRaise)/1000)*1000,
        hold:Math.max(1000,Math.round(p.value*D.holdCost/1000)*1000),done:false,primaryFn:"dlPoachHold"});
    }else{
      const h=genMarketPlayer(pick(["GK","DF","MF","FW"]));
      h.value=Math.max(1000,Math.round(h.value*D.heistDiscount/1000)*1000);
      h.desperation=D.heistDiscount;h.heist=true;
      events.push({kind:"heist",time:"",fromIdx:h.fromIdx,player:h,price:h.value,done:false,primaryFn:"dlHeistSign"});
    }
  }
  // stamp the ticking clock, latest bids latest
  const times=[...BAL.deadline.times];
  events.forEach((e,i)=>{e.time=times[Math.min(i,times.length-1)];});
  return events;
}
/* C2: deadline day er en EGEN SIDE, ikke en modal -- "sæsonens teaterforestilling"
   fortjener mere plads end et ark, og bordet skal kunne fyldes op mens uret
   gaar UDEN at det gamle forsvinder. Tilstanden bor derfor i G.dl (og gemmes
   med karrieren), ikke i den flygtige `modal`. Siden findes KUN paa deadline
   day: er G.dl null, er der ingen vej ind. */
function openDeadline(key){
  const events=buildDeadlineEvents();
  // N6: the feed doesn't land all at once — a few have "arrived", the rest tick in.
  G.dl={key,events,shown:Math.min(BAL.deadline.revealStart,events.length),closed:false};
  modal=null;screen="deadline";keepScroll=false;saveGame();render();
}
function dlAdvance(){ // N6: the clock ticks on — the next event arrives
  if(!G.dl)return;
  G.dl.shown=Math.min(G.dl.events.length,(G.dl.shown||0)+1);
  saveGame();render();
}
function dlEvt(i){return G.dl&&G.dl.events&&G.dl.events[i];}
function dlHeistSign(i){
  const e=dlEvt(i);if(!e||e.done||e.kind!=="heist")return;
  if(G.balance<e.price){e.done=true;e.outcome="No funds — he signed elsewhere before midnight.";render();return;}
  const signed=e.player;
  G.balance-=e.price;G.squad.push(signed);e.done=true;
  /* C2: tilstanden bor nu i G og GEMMES. Samme spillerobjekt maa derfor ikke
     ligge baade i G.dl og i G.squad -- G skal vaere et TRAE, og
     assertSerialisable haandhaever det. Kortet beholder et fladt referat. */
  e.player=null;e.name=signed.name;e.pos=signed.pos;e.ov=ovr(signed);
  e.outcome="Hentet for "+kfmt(e.price)+". "+(e.fromIdx>=0&&G.teams[e.fromIdx]?G.teams[e.fromIdx].name:"De")+" havde mere brug for pengene end for manden.";
  addNews("TRANSFER",signed.name+" signs on deadline day from "+(G.teams[e.fromIdx]?G.teams[e.fromIdx].name:"a skint club")+" for "+kfmt(e.price)+". A steal, chairman.");
  render();
}
function dlPanicAccept(i){
  const e=dlEvt(i);if(!e||e.done||e.kind!=="panic")return;
  const p=byId(e.pid);
  if(!p){e.done=true;e.outcome="He's already gone.";render();return;}
  if(G.squad.length<=13){e.done=true;e.outcome="The gaffer blocked the door — thirteen men is already too thin to sell from.";render();return;}
  const club=G.teams[e.fromIdx]?G.teams[e.fromIdx].name:pick(G.teams).name;
  /* C2: feeden er en SIDE nu, saa executeSale's modal (hvis han naegter) laegger
     sig oven paa siden i stedet for at slette den. Ingen redning noedvendig. */
  const ok=executeSale(p,club,e.bid);
  e.done=true;
  e.outcome=ok?("Solgt til "+club+" for "+kfmt(e.bid)+" — langt over hans vaerdi. Checkhaeftet vandt."):"Han naegtede at flytte. Handlen er doed.";
  render();
}
function dlPanicReject(i){
  const e=dlEvt(i);if(!e||e.done||e.kind!=="panic")return;
  const p=byId(e.pid);
  if(p)p.conf=clamp(p.conf-4,10,95);   // consequence: his head was turned, briefly
  e.done=true;e.outcome="You held firm. He stays — a little unsettled ("+(p?"confidence dips":"—")+"), but he stays.";
  addNews("CLUB","You turned down deadline-day money for "+e.name.split(" ")[1]+". The Shed End approves. His agent does not.");
  render();
}
function dlPanicPush(i){
  const e=dlEvt(i);if(!e||e.done||e.kind!=="panic"||e.pushed)return;
  e.pushed=true;
  if(Math.random()<BAL.deadline.pushChance){e.bid=Math.round(e.bid*BAL.deadline.pushBump/1000)*1000;e.outcome="They blinked — the bid is now "+kfmt(e.bid)+". Accept, or hold.";}
  else{e.done=true;e.outcome="You pushed. They hung up. The offer is gone — and so is the money.";}
  render();
}
function dlPoachHold(i){
  const e=dlEvt(i);if(!e||e.done||e.kind!=="poach")return;
  const p=byId(e.pid);
  if(!p){e.done=true;e.outcome="He's already gone.";render();return;}
  if(G.balance<e.hold){e.done=true;e.outcome="You couldn't cover the loyalty bonus — he's weighing the move.";render();return;}
  G.balance-=e.hold;p.conf=clamp(p.conf+5,10,95);e.done=true;e.settled=true;
  e.outcome="Du betalte "+kfmt(e.hold)+" i loyalitetsbonus. Han skriver under paa at blive, og han er tilfreds med det.";
  addNews("CLUB",e.name.split(" ")[1]+" turns down "+(G.teams[e.fromIdx]?G.teams[e.fromIdx].name:"a rival")+" to stay. It cost you "+kfmt(e.hold)+".");
  render();
}
function dlPoachLet(i){
  const e=dlEvt(i);if(!e||e.done||e.kind!=="poach")return;
  const p=byId(e.pid);
  if(!p){e.done=true;e.outcome="He's already gone.";render();return;}
  if(G.squad.length<=13){e.done=true;e.outcome="Too thin to let anyone leave — the gaffer refuses.";render();return;}
  const club=G.teams[e.fromIdx]?G.teams[e.fromIdx].name:pick(G.teams).name;
  const ok=executeSale(p,club,e.offer);
  e.done=true;
  e.outcome=ok?("Lod ham gaa til "+club+" for "+kfmt(e.offer)+". Nogle gange er pengene rigtige."):"Han naegtede at flytte. Han bliver alligevel.";
  render();
}
/* C2: det tredje valg, og det der gjorde "hold paa ham" til et valg.
   Et bud paa deadline day betyder at han VIL vaek. Bliver han hverken solgt
   eller holdt, foeler han sig taget for givet -- og saa koster det. */
function dlPoachSnub(i,quiet){
  const e=dlEvt(i);if(!e||e.done||e.kind!=="poach")return;
  const D=BAL.deadline,p=byId(e.pid);
  e.done=true;e.snubbed=true;
  if(!p){e.outcome="Han er allerede vaek.";if(!quiet)render();return;}
  p.conf=clamp(p.conf+D.snubConf,10,95);
  const darling=[...G.squad].sort((x,y)=>ovr(y)-ovr(x)).slice(0,3).some(x=>x.id===p.id);
  if(darling)G.fanMood=clamp(G.fanMood+D.snubMood,5,100);
  let req=false;
  if(Math.random()<D.snubReqChance&&!p.reqDone&&G.squad.length>13){
    p.reqDone=true;req=true;
    msg(pick(AGENTS).n,"A","TRANSFERANMODNING: "+p.name.split(" ")[1],
      "\"Min klient fik et tilbud paa deadline day, formand. Du sagde hverken ja eller nej -- du sagde ingenting. Han vil vaek.\"",
      {kind:"transferReq",pid:p.id});
  }
  e.outcome="Du sagde hverken ja eller nej. Han blev, men han foeler sig taget for givet (selvtillid "+D.snubConf+
    (darling?", stemning "+D.snubMood:"")+")."+(req?" Hans agent har allerede sendt en transferanmodning.":"");
  addNews("CLUB",e.name.split(" ")[1]+" stayed, but nobody told him he was wanted. The dressing room noticed.");
  if(!quiet)render();
}
/* Vinduet lukkes. Alt der stod aabent bliver dermed BESVARET -- at lade tiden
   loebe ud er selv et svar, og det maa ikke vaere det gratis. */
function dlClose(){
  if(G.dl){
    G.dl.events.forEach((e,i)=>{if(!e.done&&e.kind==="poach")dlPoachSnub(i,true);});
    G.dl.closed=true;G.dl=null;
  }
  modal=null;screen="club";keepScroll=false;saveGame();
  playMatchday();
}

/* ---------- inbox & messages ---------- */
/* The three replies to a formal bid are the only messages that hold a market
   player hostage (p.pendingBid hides the Quick/Offer buttons). Every route out
   of such a message — answered, expired, deleted, pushed off the end of the
   inbox — MUST release him again, or he is unbuyable for the rest of the game. */
/* ---------- C1: interessen, og markedet man arbejder ----------
   Buddet baerer nu sin egen lille verden: hvem der ellers kigger, hvor
   interesserede de er, hvor mange gange du har ringet rundt, og en log over
   hvad det kostede. Alt er FLADE felter og tal -- G skal blive et TRAE. */
function interestLevels(){return BAL.interest.levels.length;}
/* Hvor eftertragtet er han? 0..1. Overall mod divisionens niveau, form,
   alder og kontraktlaengde -- det er de fire ting en koebende klub kigger paa. */
function desirability(p){
  if(!p)return 0.5;
  const lvl=clamp((ovr(p)-52)/26,0,1);                 // 52 er bunden af League Three, 78 er Premier-niveau
  const form=clamp((p.form+6)/12,0,1);
  const age=p.age<=23?0.9:p.age<=27?1:p.age<=30?0.7:0.35;
  const yrs=clamp((p.years||1)/3,0.25,1);              // kort kontrakt = billigere, men ogsaa mindre attraktiv at byde paa
  return clamp(lvl*0.5+form*0.2+age*0.2+yrs*0.1,0,1);
}
/* Hvor meget SKAL du saelge? 0..1. Tom kasse, gaeld og brandudsalg lugter
   klubberne, og saa falder buddene. */
function sellPressure(){
  let x=0;
  if(G.balance<BAL.interest.needCash)x+=0.35*clamp((BAL.interest.needCash-G.balance)/BAL.interest.needCash,0,1)+0.15;
  if((G.loans||[]).length)x+=0.15;
  if(G.fireSale)x+=0.4;
  if(G.balance<0)x+=0.2;
  return clamp(x,0,1);
}
/* Har du offentligt sagt at han ikke skulle saelges? Et afvist bud PAA HAM i
   denne saeson er praecis den udmelding. Det er den mindst mulige kobling til
   ROADMAP's "formandens ord" -- hele det system er ikke i min ordre, men
   loeftet skal kunne koste noget, ellers er dobbeltprisen tom tekst. */
function declaredKeep(p){return !!(p&&p.keepSaidSeason===G.season);}
/* Bygger et bud MED sin interesse. Begge steder spillet laver et bud gaar
   herigennem, saa formen findes ét sted. */
function makeSellOffer(p,bid,clubIdx){
  const I=BAL.interest;
  const others=[];
  const pool=G.teams.map((t,ix)=>ix).filter(ix=>ix!==clubIdx);
  const n=Math.min(pool.length,I.extraMin+Math.floor(Math.random()*(I.extraMax-I.extraMin+1)));
  const des=desirability(p);
  for(let i=0;i<n;i++){
    const ix=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    /* En eftertragtet spiller har flere klubber laengere fremme i koen. */
    const lvl=clamp(1+Math.floor(Math.random()*2+des*1.4),1,interestLevels()-1);
    others.push({idx:ix,lvl});
  }
  return {kind:"sellOffer",pid:p.id,bid,club:(G.teams[clubIdx]||{}).name||"En klub",clubIdx,
    others,demanded:false,calls:0,log:[],opening:bid};
}
/* Hvad de andre klubber er vaerd at vide: navn, placering, og hvad de kan baere.
   Genereres af tabellen, saa den staar der spilleren kan se den. */
function offerRivals(a){
  const rows=table();
  return (a.others||[]).map(o=>{
    const t=G.teams[o.idx];
    if(!t)return null;
    const pos=rows.findIndex(r=>r.i===o.idx+1)+1;
    return {name:t.name,pos,lvl:o.lvl,label:BAL.interest.levels[o.lvl],
      pot:Math.round((t.att+t.def)/2)};
  }).filter(Boolean);
}
/* Hvad den bydende klub kan baere. Et skoen bygget af deres styrke og
   divisionen -- spilleren skal kunne se om der er mere at hente. */
function clubPurse(t){
  if(!t)return 0;
  /* Bygget af den samme kurve som spillerpriserne (ovrExp), saa pungen og
     priserne bevaeger sig sammen: en klub kan baere ca. purseOfPlayer gange en
     spiller af sin egen standard. */
  const lvl=Math.round((t.att+t.def)/2);
  return Math.round(lvl*lvl*BAL.market.ovrExp*BAL.interest.purseOfPlayer/1000)*1000;
}
/* C1: "man skal kunne raekke ud til de andre klubber for at hoere hvor de er og
   presse paa for et bud." Prisen er TOSIDET, og den anden side er den
   interessante: markedet reagerer i BEGGE retninger.
   Et opkald er derfor en risiko, ikke en gratis handling. */
function offerCallRound(id){
  const m=G.inbox.find(x=>x.id===id);
  if(!m||m.done||!m.action||m.action.kind!=="sellOffer")return;
  const a=m.action,I=BAL.interest,p=byId(a.pid);
  if(!p){m.done=true;m.body="Han er ikke i truppen laengere.";render();return;}
  if((a.calls||0)>=I.callMax){render();return;}
  a.calls=(a.calls||0)+1;

  /* 1) DET SIVER. Han hoerer det, og byen hoerer det. Har du offentligt sagt
     at han ikke skulle saelges, koster det dobbelt. */
  const mult=declaredKeep(p)?I.declaredMult:1;
  const confHit=Math.round(I.leakConf*mult);
  p.conf=clamp(p.conf+confHit,10,95);
  /* Publikumsyndling = en af klubbens tre bedste. Saa maerker stemningen det. */
  const darling=[...G.squad].sort((x,y)=>ovr(y)-ovr(x)).slice(0,3).some(x=>x.id===p.id);
  let moodHit=0;
  if(darling){moodHit=Math.round(I.leakMood*mult);G.fanMood=clamp(G.fanMood+moodHit,5,100);}
  a.log.push("Du ringede rundt. "+nameOf(p.id)+" hørte det inden aftenen"+
    (mult>1?" — og du havde selv sagt offentligt, at han ikke var til salg, så det sved dobbelt":"")+
    " (selvtillid "+confHit+(darling?", stemning "+moodHit:"")+").");

  /* 2) MARKEDET REAGERER I BEGGE RETNINGER. */
  const des=desirability(p),need=sellPressure();
  const pUp=clamp(I.pUpBase+des-need,I.pUpMin,I.pUpMax);
  if(Math.random()<pUp){
    const was=a.bid;
    a.bid=Math.round(a.bid*I.upBump/1000)*1000;
    /* En af de andre kan traede frem -- og saa er der en auktion. */
    let stepped=null;
    if((a.others||[]).length&&Math.random()<I.rivalStepChance){
      const cand=a.others.filter(o=>o.lvl<interestLevels()-1);
      if(cand.length){const o=pick(cand);o.lvl++;stepped=(G.teams[o.idx]||{}).name;}
    }
    a.log.push("Konkurrencen gjorde arbejdet: "+a.club+" hævede til "+kfmt(a.bid)+" (var "+kfmt(was)+")."+
      (stepped?" Og "+stepped+" rykkede frem i køen.":""));
    addNews("TRANSFER",nameOf(p.id)+" is being shopped around — and the price is going UP.");
  }else{
    const was=a.bid;
    a.bid=Math.max(1000,Math.round(a.bid*I.downBump/1000)*1000);
    let dropped=null;
    if((a.others||[]).length){
      const cand=a.others.filter(o=>o.lvl>0);
      if(cand.length){const o=pick(cand);o.lvl--;dropped=(G.teams[o.idx]||{}).name;}
    }
    a.log.push("De lugtede at du gerne ville af med ham. "+a.club+" sænkede til "+kfmt(a.bid)+" (var "+kfmt(was)+")."+
      (dropped?" "+dropped+" trak sig et skridt tilbage.":""));
    addNews("TRANSFER","Word is out that "+nameOf(p.id)+" is available. The offers are getting SMALLER.");
  }
  if(a.log.length>6)a.log=a.log.slice(-6);
  saveGame();render();
}
/* C1: siden. Indbakken faar EN knap -- "Se tilbud" -- og hele beslutningen
   flytter herud, hvor informationen den kraever ogsaa er. */
function openOffer(id){
  const m=G.inbox.find(x=>x.id===id);
  if(!m||!m.action||m.action.kind!=="sellOffer"||m.done){render();return;}
  G.offerId=id;screen="offer";keepScroll=false;m.unread=false;saveGame();render();
}
function closeOffer(){G.offerId=null;screen="inbox";keepScroll=false;saveGame();render();}
/* Beslutningen selv gaar gennem handleAction, saa salgslogikken ikke findes to
   steder. Bagefter er der ikke mere at se paa siden. */
function offerDecide(choice){
  const m=G.inbox.find(x=>x.id===G.offerId);
  if(!m||!m.action){closeOffer();return;}
  const p=byId(m.action.pid);
  /* "Afvis" ER en offentlig udmelding: han er ikke til salg. Det er den, der
     gør dobbeltprisen paa at ringe rundt til noget virkeligt. */
  if(choice==="reject"&&p)p.keepSaidSeason=G.season;
  handleAction(m,choice);
  if(m.done){G.offerId=null;screen="inbox";keepScroll=false;}
  saveGame();render();
}
const BID_KINDS=["bidAccepted","bidCounter","bidWar"];
function clearPendingBid(pid){const ix=marketById(pid);if(ix>=0)G.market[ix].pendingBid=false;}
function releaseMsg(m){
  if(m&&m.action&&!m.done&&BID_KINDS.includes(m.action.kind))clearPendingBid(m.action.pid);
}
/* D1: en besked der VENTER PAA SVAR er en ubesvaret beslutning. Den maa ikke
   kunne forsvinde af sig selv -- hverken ved ugerydningen eller naar indbakken
   loeber over. Det er samme fejlklasse som pakke 0's blindgyde: spilleren
   mistede hele bud-sporet, fordi beslutningen laa et sted han ikke kunne naa. */
function msgAwaitsAnswer(m){return !!(m&&m.action&&!m.done);}
function msg(from,av,title,body,action){
  if(action&&BID_KINDS.includes(action.kind))action.expires=G.md+BAL.bids.replyMD;
  G.inbox.unshift({id:G.msgId++,from,av,title,body,action,unread:true,done:false,keep:false});
  /* Loeber den over, ryger den AELDSTE der ikke venter paa svar -- foer stod
     der bare pop(), og en gammel ubesvaret budbesked kunne skubbes ud bagfra. */
  while(G.inbox.length>BAL.inbox.cap){
    let ix=-1;
    for(let i=G.inbox.length-1;i>=0;i--)if(!msgAwaitsAnswer(G.inbox[i])){ix=i;break;}
    if(ix<0)break;   // alt venter paa svar: saa vokser indbakken frem for at spise en beslutning
    releaseMsg(G.inbox[ix]);G.inbox.splice(ix,1);
  }
}
/* D1: rydningen ved kampdagsskifte. Har beskeden ingen knap, er den laest
   faerdig. Behold-flaget er spillerens egen undtagelse; ubesvarede beslutninger
   er spillets. Kaldt fra det ENE sted hvor G.md flytter sig. */
function sweepInbox(){
  if(!Array.isArray(G.inbox))return 0;
  const before=G.inbox.length;
  G.inbox=G.inbox.filter(m=>m.keep||msgAwaitsAnswer(m));
  return before-G.inbox.length;
}
function keepMsg(id){
  const m=G.inbox.find(x=>x.id===id);
  if(m)m.keep=!m.keep;
  saveGame();render();
}
/* A bid you never answered is a bid the selling club stops waiting for. This
   both un-sticks the player and gives the bidding war the hurry it needs. */
function expireMessages(){
  for(const m of G.inbox){
    if(m.done||!m.action||!m.action.expires||G.md<m.action.expires)continue;
    releaseMsg(m);m.done=true;m.unread=false;
    m.body=m.action.kind==="bidWar"
      ? "You slept on it. He signed for them this morning — the photos are already up."
      : "No answer came, so they went with someone else. \"We did try,\" says the secretary, filing the fax.";
  }
}
/* Belt and braces: any market player still flagged after the dust settles,
   with neither a bid in flight nor a live message about him, is set free. */
function sweepPendingBids(){
  for(const p of G.market){
    if(!p.pendingBid)continue;
    if(G.bids.some(b=>b.pid===p.id))continue;
    if(G.inbox.some(m=>!m.done&&m.action&&BID_KINDS.includes(m.action.kind)&&m.action.pid===p.id))continue;
    p.pendingBid=false;
  }
}
function addNews(tag,txt){G.news.unshift({tag,txt});if(G.news.length>10)G.news.pop();}
function unreadCount(){return G.inbox.filter(m=>m.unread&&!m.done).length;}

/* ---------- negotiation: fee stage → contract stage ---------- */
let nego=null;
const ROLES={key:{n:"Nøglespiller",f:0.90},rot:{n:"Rotation",f:1.00},pro:{n:"Talent",f:1.18}};
const YEARF={1:1.12,2:1.03,3:1.00,4:0.95};
function startBuyNego(ix,freeAgent,opts){
  opts=opts||{};
  if(freeAgent&&!freeAgentSignable()){modal={type:"info",title:"Vinduet er lukket",body:"Free agents kan registreres i en kort nåde efter vinduet — den er forbi. De er her når det åbner igen."};render();return;}
  const p=freeAgent?G.freeAgents[ix]:G.market[ix];
  const agent=agentOf(p.agentKey);   // pakke T3: the player's OWN agent, with his measurable style
  const rel=agentRelOf(agent.key);
  nego={p,agent,agentKey:agent.key,ix,freeAgent,round:0,cround:0,years:2,role:"rot",finalUsed:false,
        maxRounds:3+(agent.extraRound||0),giveIn:agent.giveIn,
        wageOffer:Math.round(p.wage*0.9/100)*100};
  const warm=rel>0.3?" \"And for YOU, chairman — I'll keep this civil.\"":"";
  if(freeAgent){
    nego.stage="contract";
    nego.line=pick(agent.open)+" No fee on this one — straight to personal terms."+warm;
  }else{
    nego.stage="fee";
    const disc=opts.discount||1;
    const rush=opts.quick?1.07:1; // quick talks cost a premium
    // agent style sets the floor; chaos (Dex) wobbles it; disc/rush/relation apply on top
    const chaos=agent.chaos?(1+(Math.random()*2-1)*agent.chaos):1;
    nego.feeAsk=Math.round(p.value*(1.15+(agent.feeBias||0))*disc/1000)*1000;
    nego.feeMin=Math.round(agentFeeMin(p.value,agent.key)*disc*rush*chaos/1000)*1000;
    nego.fee=Math.round(p.value*0.9/1000)*1000;
    nego.line=(opts.discount?"\"Alright, alright. He's still available — and the price has come DOWN. Don't tell him I said that.\"":pick(agent.open))+(opts.quick?" \"And chairman — quick deals cost quick money.\"":"")+warm;
  }
  modal={type:"nego"};render();
}
function startContractTalks(p,fee){
  const agent=agentOf(p.agentKey);
  nego={p,agent,agentKey:agent.key,ix:-1,freeAgent:false,fromInbox:true,round:0,cround:0,years:2,role:"rot",finalUsed:false,
        maxRounds:3+(agent.extraRound||0),giveIn:agent.giveIn,
        wageOffer:Math.round(p.wage*0.9/100)*100,stage:"contract",agreedFee:fee,
        line:"\"The clubs have agreed "+kfmt(fee)+".\" Now the personal terms: years, wages — and what role you're promising him."};
  modal={type:"nego"};render();
}
/* ---------- formal bids (inbox track) ---------- */
function openFormalBid(ix){
  const p=G.market[ix];
  modal={type:"formalBid",p,amount:Math.round(p.value*0.95/1000)*1000};
  render();
}
function sendFormalBid(){
  const p=modal.p;
  p.pendingBid=true;
  G.bids.push({pid:p.id,amount:modal.amount,due:G.md+1});   // id, not a reference: survives a save
  msg("Club secretary","CS","Bid lodged: "+p.name.split(" ")[1],"A formal offer of "+kfmt(modal.amount)+" for "+p.name+" has been faxed. Answer expected after the next matchday. Other clubs can smell an auction, chairman.",null);
  modal=null;render();
}
function resolveBids(){
  expireMessages();
  const due=G.bids.filter(b=>b.due<=G.md);
  G.bids=G.bids.filter(b=>b.due>G.md);
  for(const b of due){
    const p=G.market[marketById(b.pid)];
    if(!p){continue;}
    const fmin=Math.round(p.value*(0.98+Math.random()*0.12)/1000)*1000;
    if(b.amount>=fmin){
      if(Math.random()<0.35){
        const club=pick(G.teams).name;const rbid=Math.round(b.amount*1.15/1000)*1000;
        msg(pick(AGENTS).n,"A","BIDDING WAR: "+p.name.split(" ")[1],club+" have matched you and bid "+kfmt(rbid)+". Beat it at "+kfmt(Math.round(rbid*1.05/1000)*1000)+" — or walk away and watch him go.",{kind:"bidWar",pid:p.id,raise:Math.round(rbid*1.05/1000)*1000,club});
      }else{
        msg("Club secretary","CS","Bid ACCEPTED: "+p.name.split(" ")[1],"They've accepted "+kfmt(b.amount)+". All that remains: personal terms with the player.",{kind:"bidAccepted",pid:p.id,fee:b.amount});
      }
    }else if(b.amount>=fmin*0.85){
      const ask=Math.round(fmin*1.06/1000)*1000;
      msg("Club secretary","CS","Counter-offer: "+p.name.split(" ")[1],"They rejected "+kfmt(b.amount)+" but will do "+kfmt(ask)+". Take it, or let it die.",{kind:"bidCounter",pid:p.id,ask});
    }else{
      p.pendingBid=false;
      msg("Club secretary","CS","Bid rejected: "+p.name.split(" ")[1],"\"Not even close,\" they said. There was laughter in the background.",null);
    }
  }
  // collapsed-deal callbacks
  const cbDue=G.callbacks.filter(c=>c.due<=G.md);
  G.callbacks=G.callbacks.filter(c=>c.due>G.md);
  for(const c of cbDue){
    if(Math.random()<0.6&&windowOpen()){
      c.p.pendingBid=false;
      if(!G.market.includes(c.p))G.market.unshift(c.p);
      msg(c.agentName,"A","He's back on the table: "+c.p.name.split(" ")[1],"\"Chairman. That deal that died? It can un-die. The club needs the money now — the price has dropped.\"",{kind:"callback",pid:c.p.id});
    }
  }
  sweepPendingBids();
}
/* Prices a hypothetical set of terms — lets the sheet show what each contract
   length and each promised role would cost, without a second formula to drift. */
/* C3: hvor mange saesoner han har vaeret her. Sat naar han skriver under;
   for en karriere fra foer C3 anslaas den af hans kampe for klubben. */
function tenureOf(p){
  if(!p)return 0;
  if(!Number.isFinite(p.since))return Math.min(6,Math.floor((p.capps||0)/20));
  return Math.max(0,G.season-p.since);
}
/* C3: de fem ting Mads naevnte, hver som en navngiven multiplikator med BEGGE
   fortegn. Egen funktion, saa hver del kan MAALES udefra frem for at blive
   regnet efter i en test -- og saa arket kan vise praecis de samme ord. */
function contractContext(p,role){
  const C=BAL.contract,parts=[];
  const add=(label,mult)=>{if(mult!==1)parts.push({label,mult});};
  // trivsel
  if(p.conf>=C.happyAt)add("Han har det godt her",C.happyMult);
  else if(p.conf<=C.unhappyAt)add("Han er ikke glad",C.unhappyMult);
  // spilletid: hvad han FIK sidste saeson
  const share=G.rounds?(p.sapps||0)/G.rounds:0;
  if(share>=C.playedShare)add("Du har spillet ham",C.playedMult);
  else if(share<=C.benchShare)add("Han har siddet paa baenken",C.benchMult);
  // rollen du lovede sidst
  if(p.role==="key"){
    if(share>=BAL.role.keyShare)add("Du holdt noeglespiller-loeftet",C.keptKeyMult);
    else add("Du lovede noeglespiller og spillede ham ikke",C.brokeKeyMult);
  }
  // klubbens retning
  const last=(G.history||[])[G.history.length-1];
  if(last&&last.promoted)add("Klubben rykkede op",C.promotedMult);
  else if(last&&last.relegated)add("Klubben rykkede ned",C.relegatedMult);
  // hvor laenge han har vaeret her
  const yrs=tenureOf(p);
  if(yrs>=C.longAt)add(yrs+" aar i klubben",C.longMult);
  const total=clamp(parts.reduce((m,x)=>m*x.mult,1),C.minMult,C.maxMult);
  return {parts,total,tenure:yrs,share};
}
function wageDemandFor(years,role){
  const n=nego;
  let power=1.05;
  if(!n.renewal&&playerAmbitious(n.p))power*=1.12; // stepping DOWN a level costs extra
  if(n.renewal){
    power=n.p.years<=1?1.25:1.08;                       // short contract = his leverage
    if(n.p.sg>=10||n.p.smotm>=4)power*=1.2;             // big season = bigger number
    if(n.p.age>=31)power*=0.85;                          // he knows the legs are going
  }
  /* C3: og saa de fem menneskelige forhold. Kun paa en FORLAENGELSE -- en
     spiller du ikke har haft endnu, har hverken trivsel, spilletid eller aar
     hos DIG at forhandle med. */
  const ctx=n.renewal?contractContext(n.p,role).total:1;
  return Math.round(n.p.wage*ROLES[role].f*YEARF[years]*power*ctx/100)*100;
}
function wageDemand(){return wageDemandFor(nego.years,nego.role);}
/* The poker rule (GDD): round one is blind. His number only becomes visible
   once he has countered — or immediately on a renewal, where he already knows
   exactly what he is worth to you. */
/* C3 laaser poker-princippet fast for BEGGE slags forhandling. Foer var en
   forlaengelse en undtagelse ("han ved allerede praecis hvad han er vaerd for
   dig"), men C3 kraever at han aabner med en HOLDNING og ikke et tal -- og saa
   kan tallet ikke staa i arket ved siden af holdningen. Foerste runde er blind. */
/* C4: for en FRI AGENT vises tallet aldrig. Mads valgte "retningen, ikke
   tallet": man ved HVAD der er galt og i hvilken retning, men ikke hvor meget
   der mangler. Det bevarer poker-princippet og gør andet bud til en informeret
   gamble frem for et gaet. For alle andre er reglen som foer: blind i runde 1. */
function demandVisible(){
  if(nego.freeAgent&&!nego.renewal)return false;
  return nego.cround>=1;
}
/* C4: hvad han siger i stedet for tallet. HVAD der er galt, og i hvilken
   retning -- aldrig hvor meget. Bygget af de samme tre skruer spilleren har. */
function freeAgentDirection(n,demand){
  const bits=[];
  const short=demand-n.wageOffer;
  if(short>0)bits.push(short>demand*0.2?"Det er ikke i naerheden af nok":"Det er for lidt");
  /* Aar: ville en LAENGERE aftale bringe kravet under buddet? Saa er det aar
     han mangler, ikke penge -- og det er den oplysning der er vaerd at have. */
  let yearsHelp=false;
  for(let y=n.years+1;y<=4;y++)if(wageDemandFor(y,n.role)<=n.wageOffer){yearsHelp=true;break;}
  if(yearsHelp)bits.push("og jeg vil have mere end "+n.years+" aar");
  else if(short>0&&n.years<4&&wageDemandFor(n.years+1,n.role)<demand)bits.push("og et aar mere ville hjaelpe");
  /* Rolle: ville et andet loefte gøre det? */
  let roleHelp=null;
  for(const k of Object.keys(ROLES))
    if(k!==n.role&&wageDemandFor(n.years,k)<=n.wageOffer){roleHelp=ROLES[k].n;break;}
  if(roleHelp)bits.push("eller sig hvad han skal vaere: "+roleHelp.toLowerCase()+" ville gøre det");
  if(!bits.length)return "\"Vi er ikke uenige om noget vaesentligt. Laeg det paa bordet igen.\"";
  return "\""+bits.join(" — ")+".\"";
}
/* ---------- C3: han laegger ud med en HOLDNING, ikke et tal ----------
   Mads' eksempel: "Jeg har spillet her i fem aar. Jeg vil ikke vaere den
   daarligst betalte i omklaedningsrummet." Linjen vaelges af den staerkeste ting
   i HANS situation, saa aabningen fortaeller hvad forhandlingen handler om --
   uden at afsloere prisen. Poker-princippet er intakt: der staar ikke et tal. */
function contractOpening(p){
  const ctx=contractContext(p,p.role||"rot");
  const last=p.name.split(" ")[1];
  const wageRank=[...G.squad].sort((a,b)=>b.wage-a.wage).findIndex(x=>x.id===p.id)+1;
  const lowPaid=wageRank>Math.ceil(G.squad.length*0.6);
  /* Raekkefoelgen ER prioriteringen: det der praeger ham mest, siger han foerst. */
  if(p.years<=1&&p.age<=30)
    return "\"Lad os vaere praktiske, formand. Han kan gaa gratis til sommer. Det er ikke en trussel, det er en kalender.\"";
  if(ctx.tenure>=BAL.contract.longAt&&lowPaid)
    return "\"Han har spillet her i "+ctx.tenure+" aar. Han vil ikke vaere den daarligst betalte i omklaedningsrummet -- det er hele hans aerinde, og han har ikke sagt et tal.\"";
  if(p.role==="key"&&ctx.share<BAL.role.keyShare)
    return "\""+last+" blev lovet at vaere noeglespiller. Han har set kampene fra baenken. Vi taler ikke om penge foerst -- vi taler om, hvad du mener med det ord.\"";
  if(p.conf<=BAL.contract.unhappyAt)
    return "\"Jeg skal vaere aerlig: han er ikke glad. Han vil vide om der er en plan, eller om han skal finde en et andet sted.\"";
  if(p.sg>=10||p.smotm>=4)
    return "\""+p.sg+" maal i saesonen, formand. Vi behoever ikke tale om, hvad det er vaerd -- du saa kampene.\"";
  if(p.conf>=BAL.contract.happyAt)
    return "\"Han er glad her. Det betyder noget for ham, og det betyder noget for tallet -- hvis du behandler ham ordentligt.\"";
  if(p.age>=31)
    return "\"Han ved godt hvor han er i sin karriere. Han vil bare ikke behandles som om han er faerdig, for det er han ikke.\"";
  if(ctx.tenure>=BAL.contract.longAt)
    return "\""+ctx.tenure+" aar herinde. Han vil blive. Det gør ikke samtalen gratis, men det gør den kortere.\"";
  return "\"Han vil gerne blive. Lad os finde ud af paa hvilke vilkaar -- du laegger ud.\"";
}
/* C3: hvert modbud faar en replik der flytter sig med hans humoer. Afstanden
   afgoer indholdet; trivslen afgoer tonen. Og den PEGER paa en vej videre --
   "giv mig et aar mere" -- frem for kun at gentage tallet. */
function contractReply(n,demand){
  const gap=(demand-n.wageOffer)/Math.max(1,demand);
  const warm=n.p.conf>=BAL.contract.happyAt;
  const cold=n.p.conf<=BAL.contract.unhappyAt;
  /* Hvilken skrue ville lukke hullet billigst? Det er den han beder om. */
  let lever=null;
  if(gap>0){
    const now=wageDemandFor(n.years,n.role);
    const longer=n.years<4?wageDemandFor(n.years+1,n.role):null;
    const rot=n.role!=="rot"?wageDemandFor(n.years,"rot"):null;
    const key=n.role!=="key"?wageDemandFor(n.years,"key"):null;
    if(longer!==null&&longer<now&&longer<=n.wageOffer*1.04)lever="Giv mig et aar mere, saa skriver jeg.";
    else if(key!==null&&key<now&&key<=n.wageOffer*1.04)lever="Kald ham noeglespiller, og tallet falder af sig selv.";
    else if(longer!==null&&longer<now)lever="Bind ham et aar laengere, og vi er taettere paa.";
    else if(rot!==null&&rot<now)lever="Eller lov ham mindre -- rotation er billigere, hvis du kan leve med det.";
  }
  /* Baandene foelger MEKANIKKEN, ikke maven: negoSubmit accepterer ved 97 % af
     kravet (91 % paa et sidste bud) og gaar fra bordet under 75 %. Den
     spilbare afstand er derfor ca. 3-25 %, og baandene deler den op. Foerste
     udgave satte "det er taet" ved 3 %, hvor handlen allerede ER accepteret --
     saa Mads' egen eksempelreplik kunne aldrig vises. Vagten fandt det. */
  if(gap<=0.08)
    return (warm?"\"Det er taet, og han vil gerne blive. ":"\"Det er taet. ")+(lever||"Et lille skub, og han skriver.")+"\"";
  if(gap<=0.16)
    return (cold?"\"Vi er ikke langt fra hinanden, men han er ikke i humoer til at gøre dig en tjeneste. "
      :warm?"\"Vi er ikke langt fra hinanden, og han vil helst blive. ":"\"Vi er ikke langt fra hinanden. ")+(lever||"Find de sidste par hundrede.")+"\"";
  if(gap<=0.26)
    return (cold?"\"Det er ikke i naerheden, og han begynder at se sig omkring. "
      :"\"Det er ikke i naerheden endnu. ")+(lever||"Der skal mere paa bordet.")+"\"";
  return (cold?"\"Nu er det ikke laengere en forhandling, formand. Nu er det en fornaermelse.\""
    :"\"Det er ikke i naerheden af noget. Kom tilbage naar du er alvorlig.\"");
}
function startRenewal(id){
  const p=byId(id);if(!p)return;
  if(G.md<p.renewLockMD){modal={type:"info",title:"\"Ikke endnu.\"",body:"Forhandlingerne med "+p.name.split(" ")[1]+" brød sammen for nylig. Begge sider blev enige om at vende tilbage — om "+(p.renewLockMD-G.md)+" kampdage."};render();return;}
  {const agent=agentOf(p.agentKey);
  nego={p,agent,agentKey:agent.key,ix:-1,freeAgent:true,renewal:true,round:0,cround:0,years:2,role:p.role||"rot",finalUsed:false,
        maxRounds:3+(agent.extraRound||0),giveIn:agent.giveIn,
        wageOffer:Math.round(p.wage/100)*100,stage:"contract",
        /* C3: han aabner med en HOLDNING, ikke et tal. */
        line:pick(agent.open).split(".")[0]+". "+contractOpening(p)};}
  modal={type:"nego"};render();
}
function roleRefused(){
  const n=nego;
  /* Afvisningen brugte et hardkodet 26, men udviklingsbonussen giver kun noget
     under proAgeMax (24) -- saa en 24-25-aarig kunne signes som PROSPECT, betale
     de 18 % ekstra og aldrig udvikle sig. Nu er graensen samme tal, bygget af
     BAL, saa doedzonen er lukket og UI-teksten ("kun for en dreng under X")
     passer med hvad koden faktisk goer. */
  if(n.role==="pro"&&n.p.age>=BAL.role.proAgeMax)return "\""+n.p.name.split(" ")[1]+" is "+n.p.age+". Calling him a PROSPECT — that's only for a boy under "+BAL.role.proAgeMax+". Try again.\"";
  if(n.role==="key"&&ovr(n.p)<48)return "\"Even HE knows he's not a key player. He blushed. Pick something honest.\"";
  return null;
}
/* Pakke 24. Egen funktion, saa den kan MAALES udefra frem for at blive
   efterlignet i en test. Foerste udgave af kontrollen regnede formlen efter i
   harness'en og bestod derfor mod enhver kode overhovedet -- den maalte sin
   egen kopi. "Prospect" koster 18 % mere end Rotation; det her er hvad de
   penge koeber, og kun for en dreng der faktisk kommer paa banen. */
function proDevBonus(p){
  const RO=BAL.role;
  if(!p||p.role!=="pro")return 0;
  if(p.age>=RO.proAgeMax)return 0;
  return p.sapps>=G.rounds*RO.proShare?RO.proDev:0;
}
function playerAmbitious(p){ // clearly above the club's level — and not a dreamer chasing the move
  if(p.traits.includes("dreamer"))return false;
  const top3=[...G.squad].sort((a,b)=>ovr(b)-ovr(a)).slice(0,3);
  const bar=top3.length?top3.reduce((s,x)=>s+ovr(x),0)/top3.length:50;
  return ovr(p)>=bar+4;
}
function negoSubmit(finalOffer){
  const n=nego;
  if(finalOffer)n.finalUsed=true;
  if(n.stage==="fee"){
    n.round++;
    // pakke T3: giveIn (how close to his floor he shakes on a final push) and
    // maxRounds (Trevor/Nev cost an extra round) are the agent's, not constants.
    const threshold=finalOffer?n.feeMin*(n.giveIn||0.94):n.feeMin;
    if(n.fee>=threshold){
      n.stage="contract";n.agreedFee=n.fee;
      n.line="\"The clubs have shaken hands at "+kfmt(n.fee)+".\" Now the personal terms: years, wages — and what role you're promising him.";
    }else if(finalOffer||n.round>=(n.maxRounds||3)||n.fee<n.feeMin*0.82){
      n.line=finalOffer?"\"Final offer? Then the answer is final too: no.\" *click*":pick(n.agent.walk);
      n.dead=true;
      negoCollapse();
    }else{
      n.feeAsk=Math.round(((n.feeMin*1.06+n.fee)/2)/1000)*1000;
      n.line=pick(n.agent.counter)+" (The club wants ~"+kfmt(n.feeAsk)+")";
    }
  }else{
    const refusal=roleRefused();
    if(refusal){n.line=refusal;render();return;}
    // the player can say no to YOU: above-level players demand to be THE man
    if(!n.renewal&&playerAmbitious(n.p)&&n.role!=="key"){
      n.line="\"Let's be honest, chairman: he'd be your best player. He knows it, you know it. It's KEY PLAYER and top wages — or he stays where the football is better.\"";
      render();return;
    }
    // wage cap check (co-owners) — does not consume a round.
    // On a RENEWAL he is already on the payroll: count the raise, not the whole wage twice.
    const wagesNow=G.squad.reduce((s,p)=>s+p.wage,0)-(n.renewal?n.p.wage:0);
    if(G.myShare<100&&wagesNow+n.wageOffer>G.wageCap){
      n.line="The co-owners clear their throats before the agent can speak: \"That contract busts the wage cap — "+kfmt(G.wageCap)+"/w for the whole squad. Sell, or aim lower.\"";
      render();return;
    }
    n.cround++;
    const demand=wageDemand();
    const threshold=finalOffer?Math.round(demand*0.91/100)*100:Math.round(demand*0.97/100)*100;
    if(n.wageOffer>=threshold){
      n.line=pick(n.agent.accept);n.doneDeal=true;
    }else if(finalOffer||n.cround>=(n.maxRounds||3)||n.wageOffer<demand*0.75){
      n.line=finalOffer?"\"Take it or leave it? He leaves it. Good day.\""
        :n.renewal?"\"We'll talk again another time, chairman. The door stays open. Barely.\""
        /* C4: en fri agent gaar ikke sin vej -- han gaar hjem og venter. */
        :n.freeAgent?"\"Saadan bliver det ikke i dag. Men han er stadig fri, og du ved nu hvad der skal aendres. Ring naar du har regnet paa det.\""
