#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;
  background:radial-gradient(120% 55% at 50% -12%, var(--heroTint), transparent 60%),
             linear-gradient(180deg,var(--bg0) 0%, var(--bg1) 55%);}
.disp{font-family:'BarlowC';font-style:italic;font-weight:900;text-transform:uppercase;}
.cn{font-family:'BarlowCN';font-weight:700;text-transform:uppercase;}
.num{font-variant-numeric:tabular-nums;}
button{font-family:inherit;cursor:pointer;}

.kick{font-family:'BarlowCN';text-transform:uppercase;letter-spacing:2.2px;font-size:10.5px;color:var(--muted);}
.kick b{color:var(--acc);}
body.light .kick b{color:var(--accDeep);}
.panel{background:var(--panel);border:1px solid var(--stroke);border-radius:16px;box-shadow:var(--shadow);}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:11px;padding:20px 16px 0;}
.top h1{font-family:'BarlowC';font-style:italic;font-weight:900;font-size:22px;text-transform:uppercase;line-height:.95;}
.top .sub{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;margin-top:4px;}
.top .right{margin-left:auto;text-align:right;}
.top .right small{display:block;font-size:8.5px;letter-spacing:1.4px;color:var(--muted);font-weight:800;text-transform:uppercase;}
.top .right b{font-size:15px;font-weight:800;color:var(--acc);}
body.light .top .right b{color:var(--accDeep);}
.modebtn{background:var(--panel);border:1px solid var(--stroke);color:var(--muted);border-radius:9px;padding:5px 9px;font-size:11px;margin-left:10px;}

/* ---------- content & nav ---------- */
.content{padding:6px 13px 110px;min-height:calc(100vh - 60px);}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;padding:8px 8px 18px;background:linear-gradient(180deg,transparent,var(--navbg) 40%);z-index:20;}
nav button{flex:1;text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;padding:8px 0;background:none;border:none;position:relative;}
nav button.on{color:var(--acc);}
body.light nav button.on{color:var(--accDeep);}
nav button.on::after{content:"";display:block;width:14px;height:3px;border-radius:2px;background:var(--acc);margin:4px auto 0;box-shadow:0 0 8px var(--glow);}
body.light nav button.on::after{background:var(--accDeep);box-shadow:none;}
nav .badge{position:absolute;top:2px;right:calc(50% - 18px);background:var(--acc);color:var(--accInk);font-size:8.5px;font-weight:800;border-radius:8px;min-width:15px;padding:1.5px 4px;}

/* ---------- hero ---------- */
.hero{margin:14px 0 0;position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--strokeAcc);
  background:radial-gradient(140% 90% at 50% -25%, var(--heroTint), transparent 55%), var(--panelSolid);box-shadow:var(--shadow);}
.hero .inner{position:relative;padding:16px 16px 18px;}
.matchup{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
.matchup .club{text-align:center;width:125px;}
.matchup .cname{font-family:'BarlowC';font-style:italic;font-weight:900;text-transform:uppercase;font-size:16px;line-height:1;margin-top:8px;}
.matchup .csub{font-size:9px;color:var(--muted);letter-spacing:1.1px;text-transform:uppercase;margin-top:3px;font-weight:600;}
.matchup .vs{font-family:'BarlowC';font-style:italic;font-weight:900;font-size:26px;color:var(--muted);opacity:.4;}
.venue{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:14px 0 12px;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1.4px;text-transform:uppercase;}
.venue b{color:var(--comm);}
.glowbtn{display:block;width:100%;border:none;border-radius:13px;padding:16px;
  font-family:'BarlowC';font-style:italic;font-weight:900;text-transform:uppercase;font-size:20px;letter-spacing:1px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--accInk);
  box-shadow:0 0 30px var(--glow), 0 10px 20px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.5);}
.glowbtn:disabled{opacity:.5;box-shadow:none;}

/* ---------- cards ---------- */
.duo{display:flex;gap:9px;margin-top:11px;}
.duo>div{flex:1;border-radius:15px;padding:12px 13px;background:var(--panel);border:1px solid var(--stroke);box-shadow:var(--shadow);}
.duo .star{border-color:var(--commSoftBorder,rgba(243,179,60,.35));position:relative;overflow:hidden;}
.duo .star::after{content:attr(data-num);position:absolute;right:-4px;bottom:-24px;font-family:'BarlowC';font-style:italic;font-weight:900;font-size:82px;color:var(--commSoft);}
.duo .pname{font-family:'BarlowC';font-style:italic;font-weight:900;font-size:21px;text-transform:uppercase;margin-top:5px;line-height:.95;}
.duo .prole{font-size:9.5px;color:var(--muted);letter-spacing:1.2px;font-weight:700;margin-top:3px;text-transform:uppercase;}
.formdots{display:flex;gap:5px;margin-top:9px;}
.fd{width:21px;height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;font-family:'BarlowCN';}
.fd.w{background:var(--wBg,rgba(201,247,58,.16));color:var(--acc);box-shadow:inset 0 0 0 1px var(--strokeAcc);}
body.light .fd.w{color:var(--accDeep);}
.fd.d{background:var(--panel);color:var(--muted);border:1px solid var(--stroke);}
.fd.l{background:rgba(224,90,74,.13);color:#E07A6A;box-shadow:inset 0 0 0 1px rgba(224,90,74,.3);}
.bar{height:5px;border-radius:3px;background:var(--stroke);overflow:hidden;margin-top:7px;}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);}
.bar.amber i{background:linear-gradient(90deg,#B97F1E,var(--comm));box-shadow:none;}

.card{margin-top:11px;padding:13px 15px;background:var(--panel);border:1px solid var(--stroke);border-radius:16px;box-shadow:var(--shadow);}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--stroke);font-size:12.5px;font-weight:600;}
.rowline:last-child{border-bottom:none;}
.rowline small{color:var(--muted);font-weight:500;font-size:11px;}
.rowline .amt{font-family:'BarlowCN';color:var(--acc);letter-spacing:.4px;}
body.light .rowline .amt{color:var(--accDeep);}
.newsline{font-size:12.5px;line-height:1.5;padding:7px 0;color:var(--muted);font-weight:500;border-bottom:1px solid var(--stroke);}
.newsline:last-child{border-bottom:none;}
.newsline b{color:var(--ink);font-weight:700;}
.newsline .tag{font-family:'BarlowCN';font-size:8.5px;letter-spacing:1.2px;color:var(--comm);margin-right:6px;text-transform:uppercase;}

/* ---------- inbox ---------- */
.irow{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--stroke);}
.irow:last-child{border-bottom:none;}
.iav{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'BarlowCN';font-weight:700;font-size:12px;flex-shrink:0;background:var(--commSoft);color:var(--comm);}
.iav.g{background:var(--wBg,rgba(201,247,58,.14));color:var(--acc);}
body.light .iav.g{color:var(--accDeep);}
.irow .t{flex:1;font-size:12.5px;font-weight:600;line-height:1.35;}
.irow .t small{display:block;font-weight:500;font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.45;}
.irow .actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.abtn{border-radius:8px;padding:7px 12px;font-size:11px;font-weight:800;border:1px solid var(--strokeAcc);background:var(--wBg,rgba(201,247,58,.12));color:var(--acc);}
body.light .abtn{color:var(--accDeep);}
.abtn.ghost{background:none;border-color:var(--stroke);color:var(--muted);}
.abtn.comm{background:var(--commSoft);border-color:rgba(243,179,60,.4);color:var(--comm);}
.unread{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 7px var(--glow);margin-top:5px;flex-shrink:0;}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12px;}
th{font-family:'BarlowCN';font-size:9px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);text-align:left;padding:4px 3px;border-bottom:1px solid var(--stroke);font-weight:700;}
td{padding:6.5px 3px;border-bottom:1px solid var(--stroke);font-weight:500;}
tr:last-child td{border-bottom:none;}
tr.me td{color:var(--acc);font-weight:800;}
body.light tr.me td{color:var(--accDeep);}
td.r,th.r{text-align:right;}
.zonebar{width:3px;height:14px;border-radius:2px;display:inline-block;vertical-align:-2px;margin-right:6px;}

/* ---------- squad ---------- */
.prow2{padding:10px 0;border-bottom:1px solid var(--stroke);}
.prow2:last-child{border-bottom:none;}
.prow2 .l1{display:flex;align-items:center;gap:8px;}
.posb{font-family:'BarlowCN';font-size:9px;background:var(--panel);border:1px solid var(--stroke);color:var(--muted);border-radius:5px;padding:2px 6px;min-width:30px;text-align:center;}
.prow2 .nm{font-weight:700;font-size:13px;flex:1;}
.prow2 .nm small{color:var(--muted);font-weight:500;}
.statchips{display:flex;gap:5px;margin-top:6px;align-items:center;flex-wrap:wrap;}
.sc{font-family:'BarlowCN';font-size:10px;border-radius:5px;padding:2.5px 7px;background:var(--panel);border:1px solid var(--stroke);color:var(--ink);}
.sc b{color:var(--acc);}
body.light .sc b{color:var(--accDeep);}
.trait{font-size:9px;font-weight:700;letter-spacing:.4px;border-radius:5px;padding:2.5px 7px;background:var(--commSoft);color:var(--comm);text-transform:uppercase;}
.sellb{margin-left:auto;font-size:10.5px;font-weight:800;background:none;border:1px solid var(--stroke);color:var(--muted);border-radius:7px;padding:5px 10px;}
/* grouped squad list — one tap per player, everything else lives in the sheet */
.sqhead{display:flex;align-items:center;gap:9px;margin:14px 0 1px;}
.sqhead .ln{flex:1;height:1px;background:var(--stroke);}
.srow{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--stroke);cursor:pointer;-webkit-tap-highlight-color:var(--wBg);}
.srow.last{border-bottom:none;}
.srow:active{background:var(--wBg,rgba(201,247,58,.07));}
.srow .who{flex:1;min-width:0;}
.srow .who .n{font-weight:700;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.srow .who .n small{color:var(--muted);font-weight:500;font-size:11px;}
.srow .meta{display:flex;gap:4px;align-items:center;margin-top:4px;flex-wrap:wrap;}
.srow .tri{font-family:'BarlowCN';font-size:10px;color:var(--muted);letter-spacing:.7px;}
.srow .tri b{color:var(--ink);font-weight:700;}
.srow .ov{font-family:'BarlowC';font-style:italic;font-weight:900;font-size:21px;line-height:1;color:var(--acc);min-width:26px;text-align:right;}
body.light .srow .ov{color:var(--accDeep);}
.srow .chev{color:var(--muted);font-size:15px;line-height:1;}
.mini{font-family:'BarlowCN';font-size:9px;letter-spacing:.6px;border-radius:4px;padding:2.5px 5px;text-transform:uppercase;border:1px solid transparent;}
.mini.m{background:var(--panel);border-color:var(--stroke);color:var(--muted);}
.mini.a{background:var(--wBg,rgba(201,247,58,.12));border-color:var(--strokeAcc);color:var(--acc);}
body.light .mini.a{color:var(--accDeep);}
.mini.c{background:var(--commSoft);color:var(--comm);}
.mini.r{background:rgba(224,90,74,.14);color:#E07A6A;}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,8,6,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.overlay .sheet{width:100%;max-width:430px;max-height:88vh;overflow-y:auto;background:var(--bg0);border-radius:22px 22px 0 0;border-top:1px solid var(--strokeAcc);padding:20px 18px 26px;}
.sheet h2{font-family:'BarlowC';font-style:italic;font-weight:900;font-size:26px;text-transform:uppercase;line-height:.95;margin-top:8px;}
.sheet p{font-size:13px;line-height:1.55;color:var(--muted);font-weight:500;margin-top:8px;}
.sheet p b{color:var(--ink);}
.sheet .glowbtn{margin-top:14px;}
.sheet .abtn{margin-top:10px;width:100%;padding:13px;font-size:13px;border-radius:11px;}
.dlg{display:flex;gap:11px;margin-top:14px;align-items:flex-start;}
.dlg .bubble{flex:1;background:var(--panel);border:1px solid var(--stroke);border-radius:4px 14px 14px 14px;padding:11px 13px;font-size:13px;line-height:1.5;font-weight:500;}
.stepper{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:16px;}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--strokeAcc);background:var(--panel);color:var(--acc);font-size:22px;font-weight:800;}
body.light .stepper button{color:var(--accDeep);}
.stepper .val{font-family:'BarlowC';font-style:italic;font-weight:900;font-size:30px;min-width:120px;text-align:center;}
.adbox{background:#1A1A1A;border:1px solid #333;color:#888;border-radius:11px;text-align:center;padding:26px 10px;font-size:11px;letter-spacing:1px;margin-top:12px;}
.adbox b{display:block;color:var(--comm);font-size:13px;letter-spacing:2px;margin-bottom:5px;font-family:'BarlowCN';}

/* ---------- ticker ---------- */
.tickwrap{padding:10px 4px;}
.tclock{text-align:center;margin-top:4px;}
.tclock b{font-family:'BarlowC';font-style:italic;font-weight:900;font-size:46px;color:var(--acc);text-shadow:0 0 24px var(--glow);}
body.light .tclock b{color:var(--accDeep);text-shadow:none;}
.tscore{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:2px;}
.tscore .s{font-family:'BarlowC';font-style:italic;font-weight:900;font-size:44px;}
.tscore .tn{font-family:'BarlowCN';font-size:11px;letter-spacing:1.4px;color:var(--muted);max-width:110px;text-align:center;line-height:1.3;}
.tev{margin-top:12px;max-height:280px;overflow-y:auto;display:flex;flex-direction:column-reverse;}
.tev .e{display:flex;gap:10px;padding:8px 4px;font-size:12.5px;line-height:1.45;font-weight:500;color:var(--muted);animation:pop .3s;}
.tev .e .m{font-family:'BarlowCN';color:var(--acc);min-width:30px;font-size:11.5px;}
body.light .tev .e .m{color:var(--accDeep);}
.tev .e.goal{background:linear-gradient(90deg,var(--heroTint),transparent);border-radius:10px;color:var(--ink);font-weight:700;}
.tev .e.goal .txt{font-family:'BarlowC';font-style:italic;font-weight:900;text-transform:uppercase;font-size:15px;}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.biglabel{font-family:'BarlowC';font-style:italic;font-weight:900;text-transform:uppercase;font-size:13px;color:var(--comm);text-align:center;letter-spacing:2px;margin-top:6px;}

/* ---------- stadium ---------- */
.stadwrap{margin-top:14px;border-radius:18px;overflow:hidden;border:1px solid var(--stroke);position:relative;box-shadow:var(--shadow);}
.plaque{display:flex;justify-content:space-between;align-items:flex-end;padding:12px 16px;position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,transparent,var(--plaqueFade,rgba(0,0,0,.55)));}
.plaque .pn{font-family:'BarlowC';font-style:italic;font-weight:900;font-size:19px;text-transform:uppercase;line-height:.95;}
.plaque .pc{text-align:right;}
.plaque .pc small{display:block;font-size:8.5px;letter-spacing:1.4px;color:var(--muted);font-weight:800;}
.plaque .pc b{font-family:'BarlowC';font-style:italic;font-weight:900;font-size:24px;color:var(--acc);}
body.light .plaque .pc b{color:var(--accDeep);}
.boost{display:flex;gap:8px;margin-top:11px;}
.boost button{flex:1;border-radius:10px;padding:10px;font-size:10.5px;font-weight:800;letter-spacing:.3px;border:1px solid rgba(243,179,60,.4);background:var(--commSoft);color:var(--comm);}
.boost button.iap{border-color:var(--stroke);background:var(--panel);color:var(--ink);}
.tifo{background:repeating-linear-gradient(135deg,var(--panelSolid) 0 20px,var(--bg1) 20px 40px);padding:14px 16px;border-radius:14px;margin-top:11px;border:1px solid var(--stroke);}
.tifo .q{font-family:'BarlowC';font-style:italic;font-weight:900;font-size:17px;text-transform:uppercase;line-height:1.1;}
.tifo .who{font-size:9px;color:var(--muted);letter-spacing:1.4px;font-weight:700;margin-top:6px;text-transform:uppercase;}

/* ---------- onboarding ---------- */
.ob{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 55% at 50% -12%, var(--heroTint), transparent 60%),linear-gradient(180deg,var(--bg0),var(--bg1));}
.ob .box{width:100%;max-width:400px;padding:26px 22px;}
.ob .letter{background:var(--panelSolid);border:1px solid var(--stroke);border-radius:4px;padding:20px 18px;font-size:13.5px;line-height:1.65;color:var(--ink);font-weight:500;box-shadow:var(--shadow);}
.ob .letter .lh{font-family:'BarlowCN';font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:12px;}
.ob input{width:100%;padding:14px;border:1.5px solid var(--strokeAcc);border-radius:11px;font-size:16px;background:var(--panel);color:var(--ink);margin-top:14px;font-weight:700;outline:none;}
.swatches{display:flex;flex-wrap:wrap;gap:11px;margin-top:16px;justify-content:center;}
.sw{width:52px;height:52px;border-radius:16px;border:2px solid transparent;cursor:pointer;}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--glow);transform:scale(1.08);}
.modes{display:flex;gap:9px;margin-top:14px;}
.modes button{flex:1;padding:12px;border-radius:11px;border:1px solid var(--stroke);background:var(--panel);color:var(--muted);font-weight:800;font-size:12px;}
.modes button.on{border-color:var(--strokeAcc);color:var(--acc);background:var(--wBg,rgba(201,247,58,.1));}
body.light .modes button.on{color:var(--accDeep);}
.truth{display:flex;gap:10px;margin-top:11px;font-size:13px;line-height:1.5;font-weight:500;color:var(--muted);}
.truth b{color:var(--ink);}
.truth .n{font-family:'BarlowC';font-style:italic;font-weight:900;color:var(--acc);font-size:17px;}
body.light .truth .n{color:var(--accDeep);}
/* one-line consequence note — onboarding steps & the budget wizard */
.obwhy,.why{margin-top:13px;padding:11px 13px;border-left:2px solid var(--strokeAcc);background:var(--wBg,rgba(201,247,58,.07));border-radius:0 10px 10px 0;font-size:12px;line-height:1.55;font-weight:500;color:var(--muted);}
.obwhy b,.why b{color:var(--acc);}
body.light .obwhy b,body.light .why b{color:var(--accDeep);}
.bsteps{display:flex;gap:5px;justify-content:center;margin:4px 0 2px;}
.bsteps i{height:6px;width:7px;border-radius:4px;background:var(--stroke);}
.bsteps i.done{background:var(--accDeep);}
.bsteps i.on{width:20px;background:var(--acc);}
.protonote{text-align:center;font-size:9.5px;color:var(--muted);padding:10px 14px 0;letter-spacing:.4px;}
.winbanner{margin-top:12px;padding:10px 14px;border-radius:12px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;display:flex;justify-content:space-between;border:1px solid var(--strokeAcc);background:var(--wBg,rgba(201,247,58,.08));color:var(--acc);}
body.light .winbanner{color:var(--accDeep);}
.winbanner.closed{border-color:var(--stroke);background:var(--panel);color:var(--muted);}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* =========================================================
   GRASSROOTS prototype v2 — full core loop
   Theme engine · Onboarding · Inbox · Negotiation · Ticker
   Windows · Deadline day · Playoffs · Economy escalation
========================================================= */

/* ---------- utils ---------- */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const gbp=n=>"£"+Math.round(n).toLocaleString("en-GB");
const kfmt=n=>Math.abs(n)>=1000?"£"+(n/1000).toFixed(n%1000===0?0:1)+"k":gbp(n);
function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
function ord(n){return n+(n===1?"st":n===2?"nd":n===3?"rd":"th");}
/* user input goes into innerHTML in ~20 places — strip anything that could
   break markup rather than escaping at every call site */
function safeName(s){return String(s||"").replace(/[<>&"'`]/g,"").replace(/\s+/g," ").trim();}

/* =========================================================
   BAL — every tunable number in the game, in one place.
   Nothing below this object should contain a bare balance
   constant: tune here, and the Godot port becomes a data port.
========================================================= */
const BAL={
  matchday:{                 // £ per spectator, every home game
    kiosk:2.4, shop:1.2, pub:0.8, basics:0.4,
    merch:0.45, shopMerchBoost:0.5, vipFlat:3000,
    bigScreenGate:0.10, awayEndBigGate:0.06
  },
  seasonTix:{
    share:0.25,              // of the crowd you can actually draw
    discount:0.8,            // "fair" price = ticket × home games × this
    demandAt0:1.55,          // linear demand: d = demandAt0 − slope × (price/fair)
    slope:0.62,              // → sells out at ~2.5× fair, cash peaks at ~1.25×
    demandCap:1.4
  },
  ticket:{
    sweetSpot:10,            // the price the town considers normal
    elasticity:0.055,        // demand lost per £ above the sweet spot
    bargainLift:0.030,       // demand gained per £ below it (weaker — cheap ≠ free crowd)
    moodPenaltyAbove:16      // dearer than this and the terraces grumble
  },
  demand:{                   // the town, not the concrete
    base:1400, perDivision:0.85, familyStand:0.22, basics:0.05
  },
  wages:{

       a squad of 13, because 13 was all depth was worth. Pakke 1 makes ~16 the
       intended squad, so the same payroll now has to stretch over three more
       men: 13.5 × 13/16 ≈ 11.5. The whole scale moves together with the cap, so
       every ratio in the wage system is preserved — as when the scale was last
       rescaled (ov×30 → ov×13,5). Without it, depth would simply cost £1.7k a
       matchday and push the club into administration for doing the right thing. */
    scale:11.5,              // player wage = ovr × scale × division multiplier
    cap:10500, capOnPromotion:1.5, capRaise:1.2,
    freeAgentMult:1.5, promotionRise:1.35, adminCut:0.8,
    /* Pakke 16, the mirrors of the two rungs above. Deliberately NOT the exact
       inverses. Going up multiplies the cap by 1.5 and the payroll by 1.35;
       coming down divides the cap by ~1.5 but the payroll only by ~1.22. The
       gap is the crisis: relegation leaves you carrying a wage bill the new
       division cannot pay, and it is yours to trade, renegotiate or drown in.
       An exact inverse would make going down a free reset, which is the one
       thing it must not be. */
    capOnRelegation:0.68, relegationDrop:0.82

     different mechanic. Keeping the two falls apart is what makes them two
     stories instead of one double punishment. */
  relegation:{spots:2, floorDiv:3, confHit:12},

     could only grow — squad, capacity, division. A monotonically rising value

  val:{
    perSeat:40, perFacility:22000, freehold:180000,
    earningsMultiple:60,     // netEwma × this — NEGATIVE when you lose money
    ewmaAlpha:0.15,          // same smoothing technique as freshness, for consistency
    sponsorWeight:0.55, tvWeight:0.6,
    perFan:55,               // the town, via townDemand()
    perDivision:110000,      // standing — the one brand term that falls as well as rises

    debtWeight:1.5, adminScar:120000,

    dirWeight:0.6            // how hard the value TREND moves the asking price

    premiumHigh:1.95, premiumLow:1.22, premiumFloor:1.05, premiumCap:2.3,

    trustMainStand:4,
    /* Pakke 16. Bigger than trustMissed (−4) and smaller than trustAdmin (−30):
       relegation is worse than a bad season and not as bad as losing the club. */
    trustRelegation:-14,
    /* Pakke 19. Forventningsmoedet. `objectiveStake` er hvor meget hver plads'
       dristighed flytter bestyrelsens dom BEGGE veje -- lover du mere, faar du
       mere for at levere og mere tilbage i hovedet hvis du ikke goer.
       `objectiveTimid` er prisen paa at presse maalsaetningen ned: en formand
       der ikke tror paa klubben faar ikke lov at koebe den billigt.
       `objectivePrize` er praemiepengenes andel af det samme. */
    objectiveStake:2.5, objectiveTimid:0.05, objectivePrize:0.18,
    objectiveMoodStep:1, objectiveTrustAt:60, objectiveTrustStep:1
  },
  fund:{bonusPerMD:0.015, bonusCap:0.15},
  /* Pakke 21b. Stemningens smaa tal. De var alle sammen korrekte i teksten --
     og alle sammen SKREVET AF frem for bygget, hvilket er den fejlklasse
     Claude.md siger vi ikke laver mere. En lovning der er rigtig i dag, og som
     ingen invariant holder oeje med, er sponsorklausulens 20 % der venter paa
     at blive forkert. */
  mood:{win:3, draw:0, loss:-4, dearTicket:-1,
        familyPerTier:0.5, pubDrift:0.2,
        standOpens:6, basicsOpens:4, pubOpens:4, vipOpens:-3},
  /* Freshness. The game's unit of time is the MATCHDAY — there are no rest
     days — so a battery that empties and refills does not work. Instead a
     rolling load with exponential decay, which converges on a plateau:
        load  = load*decay + (played ? cost*ageFactor : 0)
        fresh = 100 - max(0, load-free) * slope,  clamped 0-100
     Nobody plays every game for free: at equilibrium a 20-year-old sits on
     ~49 and a 34-year-old on ~36. Age decides how many games IN A ROW a man
     holds up, not whether he can. One game off lifts a 20-year-old 49 → 69. */
  fresh:{
    decay:0.78, cost:1.0, ageFrom:22, agePerYear:0.018,
    free:2.0, slope:20,
    trainingRecovery:0.03,   // training ground: 0.78 → 0.81 decay
    glassCost:0.12,          // glass body: pricier per game
    grafterCost:-0.06,       // grafter: cheaper
    phyFloor:0.72,           // phyMult = phyFloor + (1-phyFloor)*min(1, fresh/softFrom)
    softFrom:80,             // above 80 nothing is felt
    skillShare:0.5,          // att/def suffer half as much as phy
    injBase:0.07, injClinic:0.05, clinicInjDays:1,
    injuryScale:1.3,         // risk × (1 + (100-fresh)/100 × this)
    clinicScale:0.6,         // the medical room blunts that multiplier too
    /* Gaffer's rotation weight: restBase + MAN/restManDiv, applied to the
       freshness deficit. Measured, not guessed: at the first values the term
       was worth ~1 OVR against real starter-to-backup gaps of 3-5, so he never
       rotated and the whole squad simply plateaued at 49. These make a rested
       man worth ~3-4 OVR, which is what it takes for cover to get used — and
       leaves MAN as the difference between a gaffer who rests men in time and
       one who rides his star into the ground. */
    restBase:0.06, restManDiv:400,
    benchForm:0.35, benchConf:0.6,   // missing a game dulls the edge, gently
    bandFresh:75, bandUsed:45,       // chip thresholds: Fresh / Used / Flat
    gafferMoans:60                   // he speaks up below this squad average
  },
  // A fax nobody answers used to hang forever, and the player stayed flagged
  // BID PENDING for the rest of the career. Bids now have a shelf life.
  bids:{replyMD:2},
  /* Pakke 21c. Tre kampdagstal der stod i teksten og i logikken hver for sig.
     De var rigtige; de var bare skrevet af to steder, og det er den fejlklasse
     talscanneren findes for. */
  clock:{promiseMD:5, scoutMD:2, reportMD:6},
  // A season's honest work should pay for roughly one stand — matchdays are
  // near break-even by design, so the building money comes from here.
  /* Pakke 18. The figures below are LEAGUE THREE money and are scaled up by
     division. Before this, champions of League Three and champions of England
     were paid the same £150.000, which is the single most obviously unscaled
     number in the game: the prize is where the building money comes from, so a
     flat prize means the top division has nothing to build with. */
  prize:{champions:150000, runnersUp:100000, playoffs:120000, objective:48000, missed:16000,
         perDivision:0.55},
  /* Pakke 18. TV money was two hardcoded steps -- £0, £0, £8.000, £25.000 -- so
     it JUMPED rather than scaled, and League Two had none at all. It matters
     more than its size suggests, because it is the only income that pays on
     EVERY matchday, home or away, and the only one not capped by townDemand().
     The measured asymmetry is in the away column: away days have no gate, so
     they are pure wages, and they got steadily worse across a career
     (-£7.135 in season 1 to -£20.210 in season 20) because wages tripled while
     away income did not move. Geometric, so the ladder has no gap and no jump:
        tv = base x (perDivision^(3-div) - 1)
     League Three is deliberately zero. Nobody televises League Three. */
  tv:{base:2600, perDivision:2.35},
  bank:{crisisAt:-60000, loanCash:50000, loanPerMD:5500, loanTerm:10, adminRelief:40000, adminPoints:6},
  /* penalty: of a season's income if the clause is missed. onPromotion /
     onRelegation: what the shirt is worth in the new division — both were bare
     constants (1.6 up, nothing down) inside finishSeason. */
  sponsor:{penalty:0.2, stuntFee:6000, perDivision:0.6, onPromotion:1.6, onRelegation:0.66,
    // pakke 21a: the window the collapse day is drawn from, once a season
    riskFrom:8, riskTo:20, stuntMD:11, boost:8000},
  /* The protest ladder (GDD): "først bannere, så tavshed (uhyggeligst), så
     boykot med økonomisk konsekvens. Vrede har trin, ikke bare et tal."
     `hysteresis` is what makes the way back possible but slow: you slip down a
     rung the moment mood crosses it, and have to climb well clear to get off. */
  protest:{
    banners:38, silence:26, boycott:12, hysteresis:5,
    /* Anger cools. Without this the bottom rung is an absorbing state: a
       boycott caps the gate, a capped gate means no players, no players means
       more defeats, and −4 a defeat outruns +3 a win forever. Measured: 17% of
       all matchdays sat in boycott against 1.6% in silence — a cliff, not a
       ladder. The town drifts back toward `baseline` when you are below it, at
       `easing` of the gap per matchday: ~+1,4 at the very bottom, ~+0,2 near
       the top of the band. Slow enough to hurt, fast enough to be a way out. */
    /* Pakke 14b. `baseline` was 37 against `banners` 38. Leaving rung one needs
       banners + hysteresis = 43, and easing only ever pulls mood UP TOWARD
       baseline — so 37 < 43 meant no amount of time could lift a club off the
       protest banners. Only wins could. Measured by QA: 100 % of careers reach
       rung one, and 7 % of all matchdays sit there. The town's RESTING STATE was
       protest, which is also the floor under the monotone mood decline through
       every career. The comment right here promised easing was "fast enough to
       be a way out"; it was, for two rungs of three. Now baseline clears
       banners + hysteresis, so every rung has a way out that is slow but real.
       The invariant checkProtestLadder() proves it by easing a club up from
       mood 5 with no results at all. */
    easing:0.08, baseline:44,
    /* How much of the CROWD term survives the silence. Not a floor under home
       advantage — a multiplier on the twelfth man, so the ground, the beds and
       the Shed End keep paying. 0 = the silence takes the crowd entirely, which
       is what the GDD's "tavshed (uhyggeligst)" describes. */
    silentCrowd:0,
    boycottCap:0.68          // hard ceiling on townDemand() — empty seats you can see
  },
  /* Home advantage, in the open. `base` is simply being at home — the pitch, the
     beds, no coach trip — and `crowd` is the twelfth man the silence can take.
     Both were bare constants inside homeBonus(), which is exactly what BAL
     exists to prevent: the silent rung could not be tuned without reading the
     match engine. */
  home:{base:0.13, crowd:0.27},
  /* The Shed End's contribution to home advantage. It was a bare 0.05 inside
     homeBonus(), which is exactly the thing BAL exists to prevent: the stand's
     own description promises "feeds the 12th man" and there was no way to see
     how much without reading the match engine. */
  stands:{shedHome:0.05},
  /* Deal structures (GDD): "Ratebetaling (køb over 2-4 rater — køb større end
     kassen, bind fremtiden) og bonusklausuler (+£ ved oprykning / pr. mål —
     flyt risikoen til fremtiden). Rå pris er altid muligt; strukturer er
     værktøjer, ikke krav." You pay for the liquidity either way. */
  deal:{
    instFrom:0.08, instStep:0.02,   // 2 seasons +8%, 3 +10%, 4 +12% (GDD's band)
    promoDiscount:0.30, promoBonus:0.55, promoSeasons:2,
    goalsDiscount:0.22, goalsPer:0.06, goalsSeasons:2
  },
  /* Which league matches are BIG. `buildMatch` was called with big=false for
     all 26 matchdays, so five things were dead at once: the big screen
     (+10% gate), the Away End (+6%/tier), the `bigExtra` price knob, the
     `biggame` trait, and the GDD's rule that a big match is always played out
     in full (quick mode tests `!M.big`). No new competitions are needed — the
     TABLE already knows which afternoons matter. Four derived sources, and the
     thresholds live here so the frequency can be tuned without touching logic.
     Target: 3-5 a season out of 26. If every other match is big, none is. */
  big:{
    lateFrom:14,        // the return half: before that the table has not settled
    cuts:[2,6],         // automatic promotion, and the playoff cut
    cutGap:4,           // within a win-and-a-draw of a cut = still undecided
    rivalTop:8,         // a six-pointer only counts if you are in the race
    /* Pakke 17c. The mirror of rivalTop at the other end: how many places above
       the drop zone still count as being in the scrap. This is the source that
       does NOT dry up -- QA measured that three of the four old sources need a
       promotion race, so a club that settles mid-table in the top division ran
       out of big afternoons entirely from season 9. */
    rivalBottom:4,
    /* How far down the table a clash can still be "top of the table". Strictly
       1st-v-2nd fired 0,064 times a season -- once every sixteenth season. */
    topClash:3,
    rivalGap:3,         // places between you: "the club just above or below"
    rivalPts:6,         // and points between you: two wins is still catchable
    revengeMargin:2,    // beaten by this many = a debt the return leg collects
    /* Pakke 17a. A big afternoon draws people who do not come otherwise. The
       GDD promises "ekstra tilskuere" and "udsolgt uanset form"; before this
       not one extra soul turned up for a six-pointer. Capped by the concrete
       like every other crowd. */
    demandBoost:1.1
  },
  /* The text library's own thresholds (pakke 6). They decide which CONTEXT a
     line is written for, so they belong here and not inside matchCtx(). */
  text:{
    lateFrom:75,        // a ticker line counts as late from this minute
    routBy:3,           // goal difference that makes it a hiding
    happyAt:70,         // fan mood above which the town is in a good mood
    bigGroundAt:4000,   // capacity at which empty rows are conspicuous
    flavourMemory:26,   // club news remembered: one season of matchdays
    /* Pakke 11: hvor stor en forskel skal der til, før den er værd at NÆVNE i
       analysen? GDD linje 210 vil have "deres midtbane var 8 point bedre" —
       altså tal, ikke stemninger. Under dette er forskellen støj. */
    analysisMin:3,      // points of attribute gap worth naming
    analysisMax:2,      // how many factors the gaffer bothers to mention
    disallowed:0.03     // chance per half of a goal being chalked off
  }
};

/* =========================================================
   Persistence. Safari drops background tabs, and a career is
   26 matchdays a season — without this you can only ever test
   the first twenty minutes of the game.

   Only G is stored. Transient state (the open modal, an
   in-flight negotiation, the current screen) is deliberately
   NOT persisted: it holds live object references and half-
   finished deals, and resuming into a half-open sheet is worse
   than resuming on the home screen.
========================================================= */
const SAVE_KEY="ftco.save.v1";
let saveBroken=false;
function saveGame(){
  if(!G||saveBroken)return;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,club:G.club,season:G.season,div:G.div,G}));}
  catch(e){saveBroken=true;}   // private mode / quota — play on, just don't nag
}
function readSave(){
  try{const raw=localStorage.getItem(SAVE_KEY);return raw?JSON.parse(raw):null;}catch(e){return null;}
}
function loadGame(){
  const d=readSave();
  if(!d||!d.G)return false;
  G=d.G;
  // a career saved before freshness existed has no load on anyone; start them rested
  if(!Array.isArray(G.lastXI))G.lastXI=[];
  if(!Array.isArray(G.commitments))G.commitments=[];
  if(!Array.isArray(G.valHistory))G.valHistory=[];
  if(!Number.isFinite(G.netEwma))G.netEwma=0;
  if(!Number.isFinite(G.trust))G.trust=BAL.owners.trustStart;
  if(!Number.isFinite(G.admins))G.admins=0;
  if(!Number.isFinite(G.protest))G.protest=protestFor(G.fanMood,0);
  for(const p of [...G.squad,...G.market,...G.freeAgents])if(!Number.isFinite(p.load))p.load=0;
  // the id counter lives outside G — restore it above every id in play
  PID=1+[...G.squad,...G.market,...G.freeAgents].reduce((m,p)=>Math.max(m,p.id||0),0);
  modal=null;nego=null;screen="home";
  applyTheme(G.hue,G.mode);
  return true;
}
function deleteSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}

/* ---------- theme engine ---------- */
function applyTheme(hue,mode){
  const r=document.documentElement.style, dark=mode!=="light";
  const commHue=(hue>=10&&hue<=66)?200:38;
  const H=s=>`hsl(${hue},${s})`;
  if(dark){
    r.setProperty('--acc',H('88%,62%')); r.setProperty('--acc2',H('75%,48%'));
    r.setProperty('--accInk',`hsl(${hue},60%,7%)`); r.setProperty('--accDeep',H('70%,40%'));
    r.setProperty('--bg0',`hsl(${hue},26%,7%)`); r.setProperty('--bg1',`hsl(${hue},24%,4%)`);
    r.setProperty('--panel','rgba(255,255,255,.04)'); r.setProperty('--panelSolid',`hsl(${hue},22%,9%)`);
    r.setProperty('--stroke','rgba(255,255,255,.09)'); r.setProperty('--strokeAcc',`hsla(${hue},80%,60%,.28)`);
    r.setProperty('--ink','#F2F5EF'); r.setProperty('--muted',`hsl(${hue},9%,55%)`);
    r.setProperty('--comm',`hsl(${commHue},85%,60%)`); r.setProperty('--commSoft',`hsla(${commHue},85%,60%,.12)`);
    r.setProperty('--glow',`hsla(${hue},90%,60%,.3)`); r.setProperty('--navbg','rgba(0,0,0,.78)');
    r.setProperty('--shadow','none'); r.setProperty('--heroTint',`hsla(${hue},90%,60%,.13)`);
    r.setProperty('--wBg',`hsla(${hue},85%,60%,.15)`); r.setProperty('--plaqueFade','rgba(0,0,0,.55)');
    document.body.classList.remove('light');
  }else{
    r.setProperty('--acc',H('85%,55%')); r.setProperty('--acc2',H('70%,45%'));
    r.setProperty('--accInk',`hsl(${hue},60%,10%)`); r.setProperty('--accDeep',`hsl(${hue},75%,30%)`);
    r.setProperty('--bg0',`hsl(${hue},30%,96%)`); r.setProperty('--bg1',`hsl(${hue},20%,92%)`);
    r.setProperty('--panel','#FFFFFF'); r.setProperty('--panelSolid','#FFFFFF');
    r.setProperty('--stroke',`hsl(${hue},15%,88%)`); r.setProperty('--strokeAcc',`hsla(${hue},60%,40%,.35)`);
    r.setProperty('--ink',`hsl(${hue},25%,12%)`); r.setProperty('--muted',`hsl(${hue},8%,48%)`);
    r.setProperty('--comm',`hsl(${commHue},75%,38%)`); r.setProperty('--commSoft',`hsla(${commHue},75%,45%,.12)`);
    r.setProperty('--glow',`hsla(${hue},80%,50%,.25)`); r.setProperty('--navbg',`hsla(${hue},30%,96%,.94)`);
    r.setProperty('--shadow','0 8px 22px rgba(20,30,20,.08)'); r.setProperty('--heroTint',`hsla(${hue},85%,55%,.2)`);
    r.setProperty('--wBg',`hsla(${hue},80%,45%,.14)`); r.setProperty('--plaqueFade','rgba(255,255,255,.75)');
    document.body.classList.add('light');
  }
}

/* ================= pakke 6: TEKSTBIBLIOTEKET =================
   GDD linje 214: "Stort tekstbibliotek (300-500 event-linjer), tonet efter
   kontekst — derby, bundkamp, regn, rival — så selv 0-0 har karakter."
   Der var otte målbeskrivelser. En sæson giver 35-40 mål, så hver linje blev
   læst fem gange pr. sæson og hundredvis af gange over en karriere.

   En pulje-post er ENTEN en bar streng (altid mulig) ELLER T("tag tag","tekst"),
   hvor ALLE tags skal være til stede i situationen. De bare strenge er
   sikkerhedsnettet: fælden ved kontekst-filtrering er en TOM pulje efter
   filtrering, og der er altid utaggede linjer tilbage at falde tilbage på.

   Tonegrænsen er GDD linje 180: "kunne det stå i en ægte lokalavis?" Jordnær
   skævhed, aldrig magi, aldrig fjerde væg. */
const T=(c,s)=>({c:c.split(" "),s});
const lineText=e=>typeof e==="string"?e:e.s;
const lineOk=(e,ctx)=>typeof e==="string"||e.c.every(t=>ctx.indexOf(t)>=0);
/* Hele tag-ordforrådet, samlet ét sted. Harness'en krydstjekker begge veje: en
   stavefejl i et tag på en linje gør linjen uopnåelig (død tekst), og et tag
   som INGEN situation nogensinde producerer gør det samme. Begge er den samme
   fejlklasse som pakke 5 rettede — kode der er skrevet men aldrig kaldt. */
const LINE_TAGS=["mud","rain","frost","wind","clear","big","home","away","low","high",
  "late","lead","level","behind","rout","silent","won","lost","drew","happy","angry",
  "toptwo","bigground","window",
  // pakke 11: gafferens stil. Citatet skal tones efter resultat OG personlighed
  // (GDD linje 210), og det er billigst at genbruge pakke 6's egen maskine.
  "attacking","defensive","youth","man-management","technical","direct","balanced","academy"];
/* Vælg en linje: filtrér på kontekst, undgå det der allerede er brugt, og
   returnér ALDRIG undefined. `used` er en liste af rå strenge — den ligger på
   match-objektet (som ikke gemmes) eller i G som en kappet liste af primitiver,
   så G bliver ved med at være et træ. */
function pickLine(pool,ctx,used){
  const ok=pool.filter(e=>lineOk(e,ctx));
  const from=ok.length?ok:pool;                 // kan ikke ske, men aldrig undefined
  const fresh=used?from.filter(e=>used.indexOf(lineText(e))<0):from;
  const s=lineText(pick(fresh.length?fresh:from));
  if(used&&used.indexOf(s)<0)used.push(s);
  return s;
}
/* Global udskiftning. .replace("{P}",x) tager kun den FØRSTE — en linje med to
   pladsholdere efterlod den anden i den renderede HTML. Harness'en fejler nu på
   enhver {X} der overlever. */
const fillName=(s,surname)=>s.split("{P}").join(surname);
/* Situationens tags. Kampens, ikke spillerens: vejr, division, stor kamp,
   hjemme/ude, stillingen ved halvlegens start, og tavshed på tribunen. */
function matchCtx(match,half){
  const c=[],w=match.weather?match.weather.n:"";
  if(w==="Mudbath")c.push("mud","rain");
  else if(w==="Heavy rain")c.push("rain","mud");
  else if(w==="Drizzle")c.push("rain");
  else if(w==="Frost")c.push("frost");
  else if(w==="Howling wind")c.push("wind");
  else c.push("clear");
  if(match.big)c.push("big");
  c.push(match.home?"home":"away");
  c.push(G.div>=2?"low":"high");
  const a=match.h1?match.h1.gf:0,b=match.h1?match.h1.ga:0;
  if(half===2){
    c.push(a>b?"lead":a<b?"behind":"level");
    if(Math.abs(a-b)>=BAL.text.routBy)c.push("rout");
  }else c.push("level");
  if(match.home&&protestLevel()>=2)c.push("silent");
  return c;
}
/* Minuttet er ikke kampens, men begivenhedens: "late" hoerer til den enkelte
   chance, ikke til hele anden halvleg. Egen funktion, saa harness'ens
   tag-instrumentering kan se den -- foerste udgave lagde 'late' paa inde i
   halfEvents, og rapporten meldte helt korrekt tagget som aldrig produceret. */
function eventCtx(base,minute){return minute>=BAL.text.lateFrom?base.concat("late"):base;}
/* Klubnyhedernes kontekst: sidste resultat, stemning, tabellen, vinduet. */
function flavourCtx(){
  const c=[G.div>=2?"low":"high"],r=G.lastResult;
  if(r){
    c.push(r.gf>r.ga?"won":r.gf<r.ga?"lost":"drew");
    const w=r.weather?r.weather.n:"";
    if(w==="Mudbath"||w==="Heavy rain")c.push("mud","rain");
    else if(w==="Drizzle")c.push("rain");
    else if(w==="Frost")c.push("frost");
    else if(w==="Howling wind")c.push("wind");
    else c.push("clear");
    if(r.big)c.push("big");
  }
  if(G.fanMood>=BAL.text.happyAt)c.push("happy");
  if(protestLevel()>=1)c.push("angry");
  if(myPos()<=2)c.push("toptwo");
  if(G.capacity>=BAL.text.bigGroundAt)c.push("bigground");
  if(windowOpen())c.push("window");
  return c;
}
/* En klubnyhed må ikke gentages inden for en sæson, så den huskes i G — en
   kappet liste af strenge, ikke referencer. */
function flavourLine(){
  if(!G.flavourSeen)G.flavourSeen=[];
  const s=pickLine(FLAVOR,flavourCtx(),G.flavourSeen);
  if(G.flavourSeen.length>BAL.text.flavourMemory)G.flavourSeen.shift();
  return s;
}

/* Value = assets + earnings + brand − debt. Four legs, and two of them can be
   negative, so the curve has a direction instead of only a slope. */
function valuationParts(){
  const V=BAL.val,rounds=G.rounds||16;
  const squad=G.squad.reduce((s,p)=>s+p.value,0);
  const facs=Object.keys(FACS).filter(k=>G.fac[k]).length;
  const assets=squad+G.capacity*V.perSeat+facs*V.perFacility+V.freehold;

  const sponsorV=G.sponsor?G.sponsor.per*rounds*Math.max(0,G.sponsor.seasonsLeft||0)*V.sponsorWeight:0;
  const earnings=(G.netEwma||0)*V.earningsMultiple+sponsorV+tvMoney()*rounds*V.tvWeight;

  const promos=G.history.filter(h=>h.promoted).length;
  const brand=townDemand()*V.perFan*(0.6+G.fanMood/150)
             +(3-G.div)*V.perDivision
             +(G.titles||0)*V.perTitle
             +promos*V.perPromotion;

  let debt=(G.loan?G.loan.perMD*G.loan.left:0)
          +Math.max(0,-G.balance)*V.debtWeight
          +(G.admins||0)*V.adminScar;                 // a scar that stays put
  debt+=commitmentsOwed();                        // pakke 3: what you already signed away

  const total=Math.max(V.floor,Math.round((assets+earnings+brand-debt)/1000)*1000);
  return {assets:Math.round(assets),earnings:Math.round(earnings),brand:Math.round(brand),debt:Math.round(debt),total};
}

function makeFixtures(){

    for(let i=0;i<7;i++)pairs.push([line[i],line[13-i]]);
    rounds.push(pairs.map(([a,b])=>r%2?[b,a]:[a,b]));

  }

}

/* ---------- freshness ----------
   p.load is what is STORED; freshness is derived from it. Storing the derived
   value instead would need a second rule for how it refills, and the two would
   drift apart the moment either is tuned. */
function freshOf(p){
  const F=BAL.fresh;
  return clamp(Math.round(100-Math.max(0,(p.load||0)-F.free)*F.slope),0,100);
}
/* Age does not decide whether a man tires — it decides how fast. */
function loadCost(p){
  const F=BAL.fresh;
  let c=F.cost*(1+Math.max(0,p.age-F.ageFrom)*F.agePerYear);
  if(p.traits.includes("glass"))c+=F.glassCost;
  if(p.traits.includes("grafter"))c+=F.grafterCost;
  return Math.max(0.1,c);
}
function loadDecay(){return BAL.fresh.decay+(G.fac.training?BAL.fresh.trainingRecovery:0);}
/* Tired legs give less of themselves — most of it physical, some of it touch. */
function phyMult(p){
  const F=BAL.fresh;
  return F.phyFloor+(1-F.phyFloor)*Math.min(1,freshOf(p)/F.softFrom);
}
function skillMult(p){return 1-(1-phyMult(p))*BAL.fresh.skillShare;}
function freshBand(p){
  const f=freshOf(p);
  return f>=BAL.fresh.bandFresh?"fresh":f>=BAL.fresh.bandUsed?"used":"flat";
}
function freshCount(){return available().filter(p=>freshOf(p)>=BAL.fresh.bandUsed).length;}
function squadFreshness(){
  const a=available();
  return a.length?Math.round(a.reduce((s,p)=>s+freshOf(p),0)/a.length):100;
}
/* Applied once per matchday, to the whole squad: those who played take load on,
   everyone else — bench, injured, suspended — sheds it. */
function applyLoad(playedIds){
  const d=loadDecay(),played=new Set(playedIds);
  for(const p of G.squad){
    const l=(p.load||0)*d+(played.has(p.id)?loadCost(p):0);
    p.load=Math.round(Math.max(0,l)*1000)/1000;   // keep the save small and exact
  }
}

/* ---------- strength ---------- */
function available(){return G.squad.filter(p=>!p.inj&&!p.susp);}
/* The gaffer picks the eleven — the chairman never does. Freshness is simply
   one more thing he weighs, and a high-MAN gaffer weighs it heavier: he rests
   men in time, a low one rides his star into the ground. Rotation only happens
   if there is cover — with thirteen men and two injuries the tired play. */
function restWeight(){return BAL.fresh.restBase+G.coach.man/BAL.fresh.restManDiv;}
function bestXI(){
  const rw=restWeight();
  const by=p=>p.att+p.def+p.phy+p.form*2-(100-freshOf(p))*rw;
  const sq=[...available()].sort((a,b)=>by(b)-by(a));
  const take=(pos,n)=>sq.filter(p=>p.pos===pos).slice(0,n);
  return {gk:take("GK",1),df:take("DF",4),mf:take("MF",4),fw:take("FW",2)};
}
function xiList(){const xi=bestXI();return [...xi.gk,...xi.df,...xi.mf,...xi.fw];}
function myPhy(){const l=xiList();return l.length?l.reduce((s,p)=>s+p.phy*phyMult(p),0)/l.length:40;}
function myStrength(){
  const xi=bestXI();
  const avg=(arr,f)=>arr.length?arr.reduce((s,p)=>s+f(p),0)/arr.length:35;
  let leader=G.squad.some(p=>p.traits.includes("leader"))?1.5:0;
  const cap=byId(G.captain);
  if(cap&&cap.traits.includes("leader"))leader+=1; // the right armband amplifies
  const all=[...xi.df,...xi.mf,...xi.fw];
  const confAvg=(avg(all,p=>p.conf)-50)/22; // confidence: the slow layer
  const formAvg=avg(all,p=>p.form)+confAvg;
  // tired legs turn up, but they don't turn up all the way
  const A=p=>p.att*skillMult(p),D=p=>p.def*skillMult(p);
  const att=avg(xi.fw,A)*0.5+avg(xi.mf,A)*0.35+avg(xi.df,A)*0.15;
  const def=avg(xi.gk,D)*0.35+avg(xi.df,D)*0.45+avg(xi.mf,D)*0.2;
  const coachB=(G.coach.tac+G.coach.man)/2/16;
  return {att:att+formAvg+coachB+leader,def:def+formAvg+coachB+leader};
}
function bigGameBonus(){return G.squad.some(p=>p.traits.includes("biggame"))?2.5:0;}

/* ---------- match sim: two halves, weather, approach, atmosphere ---------- */
/* Pakke 14a. The silence used to REPLACE the whole expression with a flat
   `silentHome`, which made it a FLOOR and not a punishment: a club with a full
   ground and a Shed End sits around 0.18-0.28 normally, so anything above that
   turned a protest into a home advantage. That is why 0.20 made the suite red in
   7 of 20 runs, and why QA's tipping point of 0.16-0.17 cannot be carried over —
   it was measured on a knob with the wrong shape.
   Now the quiet is a MULTIPLIER on the crowd term alone. The silence takes the
   twelfth man, exactly as the GDD says, and never the ground itself: you can
   only lose a crowd you had, so the punishment is proportional, and the Shed
   End keeps paying on every rung. */
function homeBonus(big){ // dynamic 12th man: crowd × mood × Shed End
  const H=BAL.home,quiet=protestLevel()>=2?BAL.protest.silentCrowd:1;
  return H.base+H.crowd*(attendance(big)/G.capacity)*(G.fanMood/100)*quiet+G.stands.shed*BAL.stands.shedHome;
}
function myLambdas(t,home,big,appr,weather){
  const s=myStrength();
  const phyEdge=weather.phys*((myPhy()-(t.phy||50))/28);
  const bg=big?bigGameBonus()/24:0;
  const reunion=G.squad.some(p=>p.from===t.name)?0.1:0; // something to prove
  const lm=clamp(1.05+(s.att-t.def)/24+(home?homeBonus(big):0)+appr.own+phyEdge+bg+reunion,0.15,3.6);
  const lo=clamp(1.05+(t.att-s.def)/24+(home?0:0.28)+appr.opp-phyEdge*0.6,0.15,3.6);
  return [lm,lo];
}
/* ---------- pakke 5: which afternoons are BIG ----------
   Derived, never declared. The table exists, the fixture list exists, and the
   first half of the season is already a record of who did what to you — so no
   new competition is needed to find 3-5 matches a season that matter more than
   the rest. Returns the LABEL (which the prematch sheet and the ticker already
   know how to show) or null. `big` is then simply `!!bigMatchReason(...)`.
   Deliberately NOT a big match: anything in the first two thirds of a season
   that is not first-against-second. Early-season tables lie. */
function bigMatchReason(oppIdx){
  const B=BAL.big,t=table();
  const pos=t.findIndex(r=>r.i===0)+1, me=t[pos-1];
  const oi=t.findIndex(r=>r.i===oppIdx); if(oi<0||!me)return null;
  const oppPos=oi+1;
  /* Pakke 16/17c. The drop zone: the last `spots` places, and only where there
     IS a drop. League Three has nothing below it, so its bottom is just a bad
     season — which is exactly why relegation had to exist before the bottom
     could produce a big afternoon. */
  const dropFrom=G.div<BAL.relegation.floorDiv?t.length-BAL.relegation.spots+1:null;
  // 1. Final day with something still open — promotion, the playoff cut, or the drop
  if(G.md===G.rounds-1){
    for(const c of B.cuts){
      const row=t[c-1];
      if(row&&Math.abs(me.pts-row.pts)<=B.cutGap)
        return c===2?"FINAL DAY · PROMOTION AT STAKE":"FINAL DAY · PLAYOFF PLACE AT STAKE";
    }
    if(dropFrom){
      const row=t[dropFrom-1];
      if(row&&Math.abs(me.pts-row.pts)<=B.cutGap)return "FINAL DAY · SURVIVAL AT STAKE";
    }
  }
  /* 2. The top of the table. Was strictly 1st against 2nd, which QA measured at
     0,064 times a season — once every sixteenth season, i.e. decoration. The
     requirement was never that the two clubs be exactly first and second, but
     that the afternoon decide the top of the table: both inside `topClash` and
     level enough on points for it to matter. */
  if(G.md>=B.lateFrom&&pos<=B.topClash&&oppPos<=B.topClash&&Math.abs(me.pts-t[oi].pts)<=B.rivalPts)
    return pos<=2&&oppPos<=2?"TOP OF THE TABLE":"TOP OF THE TABLE · AND THEY CAN CATCH YOU";
  /* 3. The club just above or below you, late on and inside the race. Both
     tests have to pass: near you in the table AND near you on points. Position
     alone would make a 9-point gap a six-pointer whenever the table happened to
     be strung out; points alone would pair you with a club eleven places away
     on an even afternoon. Neither is a six-pointer.
     Pakke 17c: the race can now be at either end. `rivalTop` is the promotion
     race; `rivalBottom` is the scrap above the drop — and that one does NOT dry
     up when the club settles into mid-table at the top of the pyramid, which is
     precisely when the other three sources stop firing. */
  const inRace=pos<=B.rivalTop, inScrap=dropFrom&&pos>=dropFrom-B.rivalBottom;
  if(G.md>=B.lateFrom&&Math.abs(pos-oppPos)<=B.rivalGap&&(inRace||inScrap)
     &&Math.abs(me.pts-t[oi].pts)<=B.rivalPts)
    return inScrap&&!inRace
      ? (oppPos<pos?"RELEGATION SCRAP · THEY'RE ABOVE YOU":"RELEGATION SCRAP · AND THEY'RE COMING FOR YOU")
      : (oppPos<pos?"SIX-POINTER · THEY'RE ABOVE YOU":"SIX-POINTER · THEY'RE BREATHING DOWN YOUR NECK");
  // 4. The return leg against whoever humiliated you before Christmas
  if(G.revenge&&G.revenge.opp===oppIdx&&G.md>G.revenge.md)return "THE RETURN · THEY PUT "+G.revenge.by+" PAST YOU";
  return null;
}
function buildMatch(oppIdx,home,big,label){
  const t=G.teams[oppIdx-1];
  return {oppIdx,opp:t.name,home,big,label,weather:pick(WEATHERS),approach:null,
          h1:null,h2:null,htDone:false,events:[],scorersLog:[],used:[]};
}
function simHalf(match,mods){
  const t=G.teams[match.oppIdx-1];
  const [lm,lo]=myLambdas(t,match.home,match.big,APPROACHES[match.approach],match.weather);
  const gf=poisson(lm/2*(mods?mods.own:1)), ga=poisson(lo/2*(mods?mods.opp:1));
  return {gf,ga};
}
function halfEvents(match,half,gf,ga){
  const ev=[];const scorers=xiList().filter(p=>p.pos==="FW"||p.pos==="MF");
  const lo=half===1?2:46, hi=half===1?44:90;
  // guard the retry loop: a busy half can otherwise exhaust the minute range
  const mins=new Set();const mkMin=()=>{let m,tries=0;do{m=R(lo,hi)}while(mins.has(m)&&++tries<40);mins.add(m);return m;};
  /* Pakke 6: every line is drawn through pickLine() with the situation's tags
     and the match's own used-list, so no sentence is read twice in one
     afternoon and the tone follows the weather, the scoreline and the stakes. */
  if(!match.used)match.used=[];
  const base=matchCtx(match,half);
  const at=m=>eventCtx(base,m);
  const surname=p=>p.name.split(" ")[1];
  for(let i=0;i<gf;i++){
    const p=pick(scorers.length?scorers:xiList());
    const pen=Math.random()<0.12;
    const m=mkMin(),ctx=at(m);
    /* Pakke 20: maalscoreren gemmes paa ID, ikke som objektreference. Kampen
       ligger nu i G, og G skal forblive et TRAE -- en delt objektreference
       overlever ikke en JSON-runde, saa manden der scorede ville blive en kopi
       af sig selv efter en genindlaesning. Claude.md siger det samme om alt
       andet: spillere noegles paa id, aldrig paa objektet. */
    ev.push({m,goal:"me",scorerId:p.id,txt:(pen?"PENALTY! ":"GOAL! ")+surname(p).toUpperCase()+"!",
      sub:pen?fillName(pickLine(PENDESC,ctx,match.used),surname(p))
             :p.name+" "+pickLine(GOALDESC,ctx,match.used)+"."});
    if(Math.random()<0.4){const m2=Math.min(hi,m+R(2,5));ev.push({m:m2,txt:pickLine(MOMENTUM,at(m2),match.used)});}
  }
  const ghost=G.soldTo.find(x=>x.club===match.opp);
  for(let i=0;i<ga;i++){
    const m=mkMin();
    if(ghost&&i===0&&Math.random()<0.4){
      ev.push({m,goal:"them",txt:"Goal — "+ghost.name.split(" ")[1]+", OF COURSE",
        sub:fillName(pickLine(ghost.bitter?GHOSTBITTER:GHOSTWARM,at(m),match.used),ghost.name)});
    }else ev.push({m,goal:"them",txt:"Goal — "+match.opp,sub:pickLine(OPPGOAL,at(m),match.used)});
  }
  const nm=match.big?2:1;
  for(let i=0;i<nm+1;i++){
    const p=pick(scorers.length?scorers:G.squad),m=mkMin();
    ev.push({m,txt:fillName(pickLine(NEARMISS,at(m),match.used),surname(p))});
  }
  if(Math.random()<BAL.text.disallowed){const m=mkMin();ev.push({m,txt:pickLine(DISALLOWED,at(m),match.used)});}
  ev.sort((a,b)=>a.m-b.m);
  return ev;
}
function matchIncidents(match){ // red cards & injuries with consequences
  const out=[];
  if(Math.random()<0.08){
    const mine=Math.random()<0.5;
    if(mine){const p=pick(xiList());p.susp=1;out.push({m:R(20,85),txt:"RED CARD! "+p.name.split(" ")[1]+" sees red. The referee's notebook has a new enemy.",sub:"Suspended next matchday."});}
    else out.push({m:R(20,85),txt:"RED CARD — "+match.opp+" down to ten! Their bench is furious. Lovely stuff."});
  }
  /* The loop that closes itself: thin squad → no rotation → tired legs → injury
     → thinner squad. It stops hurting the moment you buy depth. */
  {
    const F=BAL.fresh,p=pick(xiList());
    if(p){
      const scale=F.injuryScale*(G.fac.clinic?F.clinicScale:1);
      const risk=(G.fac.clinic?F.injClinic:F.injBase)*(1+(100-freshOf(p))/100*scale);
      if(Math.random()<risk){
        p.inj=Math.max(1,R(2,4)-(G.fac.clinic?BAL.fresh.clinicInjDays:0));
        out.push({m:R(10,80),txt:"Injury: "+p.name.split(" ")[1]+" pulls up. The physio's sponge is out.",
          sub:"Out for "+p.inj+" matchdays."+(freshOf(p)<F.bandUsed?" He was running on empty.":"")});
      }
    }
  }
  return out;
}

/* ---------- matchday flow ---------- */
function playMatchday(){
  if(G.phase!=="season"||G.md>=G.rounds)return;
  const dKey=G.md===5?"summer":G.md===14?"winter":null;
  if(dKey&&!G.deadlineDone[dKey]){G.deadlineDone[dKey]=true;openDeadline(dKey);return;}
  const round=G.fixtures[G.md];
  const my=round.find(([h,a])=>h===0||a===0);
  const home=my[0]===0;const oppIdx=home?my[1]:my[0];
  const reason=bigMatchReason(oppIdx);
  const match=buildMatch(oppIdx,home,!!reason,reason);
  // The weather belongs to the MATCHDAY, not to the visit: otherwise backing out
  // of the team talk and returning would re-roll it until you liked it.
  if(!G.mdWeather||G.mdWeather.md!==G.md||G.mdWeather.season!==G.season)G.mdWeather={md:G.md,season:G.season,w:{...match.weather}};
  match.weather={...G.mdWeather.w};   // a copy: state stays a tree, never a graph
  // The rest of the division is NOT played yet — that happens the moment you
  // commit to an approach (choosePrematch), so stepping back costs nothing and,
  // crucially, cannot simulate the round twice.
  modal={type:"prematch",match,round};
  render();
}
function simRestOfRound(round){
  for(const [h,a] of round){
    if(h===0||a===0)continue;
    const H=G.teams[h-1],A=G.teams[a-1];
    const lh=clamp(1.15+(H.att-A.def)/22+0.25,0.25,3.4), la=clamp(1.15+(A.att-H.def)/22,0.2,3.2);
    applyPts(h,poisson(lh),a,poisson(la));
  }
}
function prematchBack(){modal=null;render();}
function gafferRead(match){
  const t=G.teams[match.oppIdx-1];const s=myStrength();
  const bits=[];
  bits.push(t.att>s.def+4?"They're sharp up front — we'll need concentration":t.def>s.att+4?"They sit deep and defend well — patience":"Man for man, we match them");
  if(match.weather.phys>=0.5)bits.push((myPhy()>(t.phy||50)?"and this "+match.weather.n.toLowerCase()+" suits US — we're the stronger side":"and this "+match.weather.n.toLowerCase()+" worries me — they're the more physical side"));
  const ghost=G.soldTo.find(x=>x.club===match.opp);
  if(ghost)bits.push("and mind "+ghost.name.split(" ")[1]+" — "+(ghost.bitter?"he left here angry, and angry men score":"old boys always find a goal against us, it's the law"));
  const returning=G.squad.find(p=>p.from===match.opp);
  if(returning)bits.push(returning.name.split(" ")[1]+" faces his old club — he's been first to training all week");
  return "\""+bits.join(", ")+".\"";
}
function choosePrematch(appr){
  const match=modal.match;
  // now the word is given, the rest of the division kicks off too (once only)
  if(modal.round&&!modal.roundPlayed){modal.roundPlayed=true;simRestOfRound(modal.round);}
  match.approach=appr;
  match.h1=simHalf(match,null);
  match.h2=simHalf(match,null); // default; may be re-rolled at HT
  // incidents carry their own minute — they must land in the half they belong to,
  // or the ticker waits at 45' for a 78th-minute red card that never comes
  const inc=matchIncidents(match);
  match.inc2=inc.filter(e=>e.m>45);
  match.events=[...halfEvents(match,1,match.h1.gf,match.h1.ga),...inc.filter(e=>e.m<=45)].sort((a,b)=>a.m-b.m);
  // kopier: samme haendelsesobjekt maa ikke ligge i baade inc2 og h2events --
  // G er et traee, og htChoice() bygger h2events op igen fra inc2
  match.h2events=[...halfEvents(match,2,match.h2.gf,match.h2.ga),...match.inc2.map(e=>({...e}))].sort((a,b)=>a.m-b.m);
  /* Pakke 20. Resultatet staar fast. Fra dette oejeblik ER kampen spillet --
     baade halvlege, alle haendelser og resten af divisionens runde er
     beregnet. saveGame() blev foerst kaldt i afterMatchday(), altsaa EFTER
     tickeren, saa lukkede man appen midt i den, laa den gemte tilstand stadig
     foer kampdagen, og kampen blev spillet om med et nyt udfald.
     Kampen gemmes derfor i G, ikke paa modalen: modal gemmes bevidst ikke, og
     et resultat der kun findes i en modal er ikke gemt. Det er ogsaa derfor
     playoff-grenen maatte holde op med at vaere en closure -- G er et TRAE. */
  G.pendingMatch=match;
  saveGame();
  openTicker(match,null);
}
function htChoice(c){
  const match=modal.match;
  match.htDone=true;
  if(c==="steady")match.h2=simHalf(match,{own:0.85,opp:0.72});
  if(c==="fury")match.h2=simHalf(match,{own:1.35,opp:1.25});
  if(c&&(match.h1.gf<match.h1.ga)&&Math.random()<0.5)match.h2.gf++; // trailing desperation push
  match.h2events=[...halfEvents(match,2,match.h2.gf,match.h2.ga),...(match.inc2||[]).map(e=>({...e}))].sort((a,b)=>a.m-b.m);
  // pakke 20: pausetalen ER en ny beslutning, saa den anden halvleg rulles om
  // her -- og skal derfor staa fast fra netop dette oejeblik og ikke foer.
  G.pendingMatch=match;
  saveGame();
  resumeTicker();
}
function finalizeMatch(match){
  G.pendingMatch=null;                 // pakke 20: kampen er bogfoert nu
  const gf=match.h1.gf+match.h2.gf, ga=match.h1.ga+match.h2.ga;
  const res={gf,ga,opp:match.opp,home:match.home,big:match.big,label:match.label,weather:{...match.weather}};
  if(!match.isPlayoff){
    applyPts(match.home?0:match.oppIdx,match.home?gf:ga,match.home?match.oppIdx:0,match.home?ga:gf);
    /* The worst hiding of the first half books its own return leg (pakke 5).
       The second half of the fixture list is the exact reverse of the first, so
       the rematch is guaranteed to exist — and only the first half can set it,
       or a late thrashing would point at a fixture already played. */
    if(G.md<G.rounds/2&&ga-gf>=BAL.big.revengeMargin&&(!G.revenge||ga-gf>G.revenge.by))
      G.revenge={opp:match.oppIdx,md:G.md,by:ga-gf};
    G.md++;
    settleFinances(res);
  }
  // player stats & MOTM
  const xi=xiList();
  // Who actually played is settled HERE and reused by everything downstream —
  // applying load changes freshness, which would change a second bestXI() call.
  G.lastXI=xi.map(p=>p.id);
  applyLoad(G.lastXI);
  for(const p of xi){p.sapps++;p.capps++;}
  const w=gf>ga,l=ga>gf;
  for(const p of xi)p.conf=clamp(p.conf+(w?2:l?-2:0),10,95);
  const allEv=[...match.events,...match.h2events];
  const ratings=new Map(xi.map(p=>[p,6+Math.random()*1.2+(gf>ga?0.5:gf===ga?0:-0.4)]));
  for(const e of allEv){const sc=e.scorerId?byId(e.scorerId):null;
    if(sc){sc.sg++;sc.conf=clamp(sc.conf+4,10,95);ratings.set(sc,(ratings.get(sc)||6.5)+1.1);}}
  let motm=xi[0],best=0;
  for(const [p,r] of ratings)if(r>best){best=r;motm=p;}
  if(motm){motm.smotm++;motm.conf=clamp(motm.conf+3,10,95);}
  // broken playing-time promises come home to roost
  for(const p of G.squad){
    if(p.promiseMD!==null&&G.md-p.promiseMD>=BAL.clock.promiseMD){
      if(p.sapps-(p.appsAtPromise||0)<3){p.conf=clamp(p.conf-10,10,95);bumpTrust(BAL.owners.trustPromise);
        msg(pick(AGENTS).n,"A","\"About that promise…\"","You promised "+p.name.split(" ")[1]+" football. He's had "+p.sapps+" games. His agent's tone has cooled considerably.",null);}
      p.promiseMD=null;
    }
  }
  res.motm=motm?{name:motm.name,rating:Math.min(9.8,best).toFixed(1)}:null;
  // stats line
  res.shots=[gf*2+R(2,7),ga*2+R(1,6)];
  res.dom=clamp(Math.round(50+(myStrength().att-(G.teams[match.oppIdx-1].att))*1.2+(gf-ga)*4),20,80);
  // analysis
  res.analysis=makeAnalysis(match,gf,ga);
  res.quote=gafferQuote(gf,ga,match);
  res.keyStats=keyStats(match,gf,ga);
  if(!match.isPlayoff){
    updateFormMood(res);
    G.lastResult=res;
    postMatchMessages();
  }
  // tick down suspensions/injuries
  for(const p of G.squad){if(p.susp)p.susp--;if(p.inj)p.inj--;}
  return res;
}
/* ---------- pakke 11: EFTER KAMPEN ----------
   GDD linje 210: "Analyse-linjen (forklarer resultatet ud fra attributter og
   valg — man lærer noget hver kamp), Man of the Match med ratings, 2-3
   kamp-nøgletal, og gafferens citat tonet efter resultat OG personlighed."

   Den gamle makeAnalysis var en kæde af ni if-sætninger der returnerede ÉN
   generisk sætning uden et eneste tal. GDD'ens eget eksempel er kvantitativt:
   "deres midtbane var 8 point bedre, og mudderet tog jeres teknikere". Uden
   tallene lærer man ingenting, og så er tilgangsvalget før kampen en gætteleg —
   hvilket er præcis den begrundelse GDD'en selv giver.

   Nu MÅLES faktorerne, sorteres efter styrke, og de to største bliver til
   sætningen. Hver faktor er noget spilleren kan gøre noget ved: købe en
   forsvarsspiller, skaffe dybde, vælge en anden tilgang, bygge Shed End. */
function matchFactors(match,gf,ga){
  const t=G.teams[match.oppIdx-1],s=myStrength(),T=BAL.text;
  const a=APPROACHES[match.approach]||{own:0,opp:0,n:"Balanced"};
  const xi=xiList(),f=[];
  const push=(w,txt)=>{if(Math.abs(w)>=T.analysisMin)f.push({w:Math.abs(w),good:w>0,txt});};

  // 1. de rene attributforskelle, i point, som GDD'en formulerer dem
  push(Math.round(s.att-(t.def||50)),
    "our attack was "+Math.abs(Math.round(s.att-(t.def||50)))+" points "+
    (s.att>(t.def||50)?"better than their defence":"short of their defence"));
  push(-Math.round((t.att||50)-s.def),
    "their attack was "+Math.abs(Math.round((t.att||50)-s.def))+" points "+
    ((t.att||50)>s.def?"better than our back line":"blunter than our back line"));

  // 2. vejret, men kun når det faktisk vippede noget: fysik gange forholdene
  const phyGap=Math.round((myPhy()-(t.phy||50))*match.weather.phys);
  push(phyGap,(phyGap>0?"the ":"that ")+match.weather.n.toLowerCase()+" "+
    (phyGap>0?"suited us — we were "+Math.abs(phyGap)+" points stronger in the legs on that pitch"
             :"took our technicians; they were "+Math.abs(phyGap)+" points stronger in it"));

  // 3. tilgangen. Den ER et valg, så den skal kunne læses som et valg.
  if(a.own||a.opp){
    const helped=(gf>=2&&a.own>0)||(ga===0&&a.opp<0);
    const hurt=(ga>=2&&a.opp>0)||(gf===0&&a.own<0);
    if(helped)f.push({w:6,good:true,txt:"“"+a.n+"” did what it says on the tin"});
    else if(hurt)f.push({w:6,good:false,txt:"“"+a.n+"” cost us — that is the trade you took"});
  }

  // 4. friske ben. Den enkeltstående vigtigste ting en formand KAN gøre noget ved.
  const flat=xi.filter(p=>freshBand(p)==="flat").length;
  if(flat>=2)f.push({w:4+flat,good:false,txt:flat+" of the eleven were running on empty"});

  // 5. den tolvte mand — eller fraværet af ham
  if(match.home){
    if(protestLevel()>=2)f.push({w:7,good:false,txt:"the ground was silent, and the players could hear it"});
    else if(G.stands.shed>=1&&attendance(match.big)/G.capacity>0.75)
      f.push({w:5,good:true,txt:"the Shed End was full and loud, and it showed"});
  }
  // 6. han vil bevise noget mod sin gamle klub
  if(G.squad.some(p=>p.from===t.name))f.push({w:4,good:gf>ga,txt:"there was a man out there with a point to prove against them"});

  /* Vægt ALENE er ikke nok. En kamp tabt 1-3 blev ellers indledt med "deres
     angreb var 10 point sløvere end vores bagkæde" — sandt, stort, og en
     forklaring på det MODSATTE af hvad der skete. GDD linje 210 vil have
     resultatet forklaret, så en faktor der peger samme vej som scoren vejer
     tungere end en der peger imod. Den modsatrettede faktor er ikke løgn og
     bliver ikke skjult — den kommer bare ikke først. */
  const res=gf>ga?1:gf<ga?-1:0;
  for(const x of f)x.w*= res===0 ? 1 : ((x.good?1:-1)===res ? 1.6 : 0.5);
  f.sort((x,y)=>y.w-x.w);
  return f;
}
function makeAnalysis(match,gf,ga){
  const f=matchFactors(match,gf,ga).slice(0,BAL.text.analysisMax);
  if(!f.length)return "Nothing separated these two. Some afternoons are decided by a bobble and nothing else.";
  /* Slutsætningen skal passe til det den lige har sagt. Vejer den ledende
     faktor MOD resultatet — "vores angreb var 47 point bedre end deres forsvar"
     efter et 1-3 — så er "det er derfor vi tabte" noget vrøvl. At sortere
     faktoren væk ville være værre: 47 point ER historien, også når man taber.
     Så sætningen erkender det i stedet. */
  const res=gf>ga?1:gf<ga?-1:0,agrees=res===0||((f[0].good?1:-1)===res);
  const verdict=res===0?"That is why it finished level."
    :agrees?(res>0?"That is why we won.":"That is why we lost.")
    :(res>0?"And we won it anyway — some afternoons you get away with one."
           :"And we lost it anyway. Football does that.");
  const body=f.length===1?f[0].txt:f[0].txt+", and "+f[1].txt;
  return body.charAt(0).toUpperCase()+body.slice(1)+". "+verdict;
}
/* 2-3 kamp-nøgletal (GDD linje 210). De gamle to var Shots og "Dominance" —
   begge opfundet ud af scoren. Disse er MÅLT på tilstand spilleren selv har
   bygget, så de peger på noget han kan gøre ved det. */
function keyStats(match,gf,ga){
  const t=G.teams[match.oppIdx-1],s=myStrength(),xi=xiList();
  const fresh=xi.filter(p=>freshBand(p)!=="flat").length;
  const out=[
    {k:"Legs still going",v:fresh+" of "+xi.length,
     hint:fresh<8?"Depth is the fix, chairman.":""},
    {k:"Attack v their defence",v:(s.att>=(t.def||50)?"+":"")+Math.round(s.att-(t.def||50)),hint:""},
    {k:"Defence v their attack",v:(s.def>=(t.att||50)?"+":"")+Math.round(s.def-(t.att||50)),hint:""}
  ];
  if(match.home)out.push({k:"Crowd",v:Math.round(100*attendance(match.big)/G.capacity)+"% full",
    hint:protestLevel()>=2?"Silent. That is worth a goal to them.":""});
  return out;
}
/* Gafferens citat, tonet efter resultat OG personlighed. Den gamle udgave
   kendte kun resultatet: otte trænere delte de samme otte replikker, så det
   gjorde ingen forskel hvem man havde ansat. Kører gennem pakke 6's egen
   pickLine, så tonen kan tagges på præcis samme måde som alt andet. */
const GAFFERTALK=[
 T("won","“I'm not smiling. This is my impressed face.”"),
 T("won","“Good day at the office. Don't get used to it.”"),
 T("won","“They did what I asked. Suspicious, but pleasing.”"),

 T("drew","“A point is a foundation. I say that every week and I mean it every week.”"),
 T("drew","“We move on. Ideally forwards.”"),
 T("drew","“A point away from home is a point. A point at home is a conversation.”"),
 T("lost","“I've seen worse. I can't currently remember when.”"),
 T("lost","“We go again. After I've had a long sit-down.”"),
 T("lost","“The lads know. The bus will be quiet.”"),

 // attacking — Don Mallory: goals are the argument

function gafferCtx(gf,ga,match){
  const ctx=[gf>ga?"won":gf<ga?"lost":"drew",G.coach.style];
  if(match){
    if(match.big)ctx.push("big");
    if(match.home&&protestLevel()>=2)ctx.push("silent");
    const w=match.weather?match.weather.n:"";
    if(w==="Mudbath"||w==="Heavy rain")ctx.push("mud");
    if(gf>ga&&match.h1&&match.h1.gf<match.h1.ga)ctx.push("behind");
    if(Math.abs(gf-ga)>=BAL.text.routBy)ctx.push("rout");

}
function gafferQuote(gf,ga,match){return pickLine(GAFFERTALK,gafferCtx(gf,ga,match),null);}
function applyPts(h,gh,a,ga){
  const rec=i=>i===0?G.me:G.teams[i-1];

  H.pl++;A.pl++;H.gd+=gh-ga;A.gd+=ga-gh;

/* Demand comes from the TOWN, not from the stand you built. A bigger ground
   does not fill itself: the fanbase grows with the division you reach and with
   the fan-growth work (Family Stand), so a new stand is built ahead of demand
   and pays off as the town grows into it. */
function ticketPriceFactor(price){
  // Must reach ZERO, never a floor: a floor would make gate income start rising
  // again at absurd prices — the same trap the season-ticket curve had.
  const T=BAL.ticket,d=price-T.sweetSpot;
  return clamp(1+(d<0?-d*T.bargainLift:-d*T.elasticity),0,1.18);

/* ---------- the protest ladder (pakke 2) ----------

const PROTEST_NAMES=["calm","banners","silence","boycott"];
function protestFor(mood,cur){
  const P=BAL.protest;
  let lvl=mood<P.boycott?3:mood<P.silence?2:mood<P.banners?1:0;
  if(lvl<cur){
    // to leave a rung you must climb clear of it, not merely touch the line
    const line=[0,P.banners,P.silence,P.boycott][cur];

function protestLevel(){return G.protest||0;}
function updateProtest(){

    if(now===2){addNews("FANS","The ground has gone quiet. Not angry-quiet. Just quiet.");

function townDemand(){

/* Pakke 17. The whole price of a ticket on the day — base plus the big-match
   surcharge. It was ONLY ever read in gateReceipts(), which is why QA measured
   the surcharge as free money: +£0 and +£8 drew the identical 2.670 spectators
   and cost nothing in mood, so there was exactly one right answer (+£8, always)

function gatePrice(big){return G.ticket+(big?G.bigExtra:0);}
function attendance(big){
  const pos=myPos();

  const moodF=clamp(0.55+G.fanMood/180,0.4,1.05);  // mood fills the town, never exceeds it

/* Split out of settleFinances so the big-match promises (screen, Away End,

function gateReceipts(res){

function updateFormMood(res){

     inventing a fourth number for it. */
